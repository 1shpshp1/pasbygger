/* ===================== Login for the "Øvelser" tab (valid for 30 minutes) ===================== */
const AUTH = { token: "", until: 0 };
let GRP = null;                  // the open "Grupper" screen (see Training groups below)
let GRP_CACHE = null, GRP_FETCH = null;   // the players and saved groups (also stored on the phone), and a fetch under way
let AUTH_TIMER = null;
const isAuthed = () => !!AUTH.token && Date.now() < AUTH.until;

/* The login is kept in localStorage, so it survives closing the app (sessionStorage is wiped by phones
   when the app is closed or put to sleep). It still ends after 30 minutes. */
function saveAuth() {
  setTimeout(updateServerNote);                        // logged in or out: the note is for coaches
  try {
    if (AUTH.token) localStorage.setItem("oevAuth", JSON.stringify(AUTH));
    else localStorage.removeItem("oevAuth");
    sessionStorage.removeItem("oevAuth");     // from older versions of the app
  } catch (e) { /* storage not available: the login then lasts until the page is reloaded */ }
}

function scheduleExpiry() {
  clearTimeout(AUTH_TIMER);
  if (AUTH.token) AUTH_TIMER = setTimeout(expire, Math.max(0, AUTH.until - Date.now()) + 50);
}

/* libCall only carries calls that need the login: an answer means the server has just renewed it for another
   30 minutes, so the phone renews it too (a minute short, to stay on the safe side) */
function keepLoggedIn(res) {
  if (AUTH.token) {
    AUTH.until = Math.max(AUTH.until, Date.now() + (AUTH.span || 30 * 60 * 1000) - 60 * 1000);
    saveAuth(); scheduleExpiry();
  }
  return res;
}

/* Remove the login and every drill from the page */
function wipeLibrary() {
  clearTimeout(AUTH_TIMER);
  AUTH.token = ""; AUTH.until = 0;
  if (useSupabase()) storeSupaSession(Object.assign(supaSession() || {}, { refresh: "" }));   // log in again (the team is remembered)
  GRP_CACHE = null;                                       // the players belong to the login. An open group screen stays
                                                          // usable: ticking and making groups need no server; saving asks for the code
  saveAuth();
  LIB = null; LIB_LIST = []; LIB_LOADING = false;
  ["drill-grid", "lib-filters", "lib-status", "lib-sync"].forEach(id => { document.getElementById(id).innerHTML = ""; });
  setLibNote("");
}

/* 30 minutes are over: drills are removed, and the Øvelser tab asks for the code again */
function expire() {
  wipeLibrary();
  if (!document.getElementById("library").classList.contains("view-hidden")) {
    requireLogin(function () { loadLibrary(); }, function () { showView("sessions"); });
  }
}

(function restoreAuth() {                     // opening the app again within the 30 minutes keeps the login
  try {
    const a = JSON.parse(localStorage.getItem("oevAuth") || sessionStorage.getItem("oevAuth") || "null");
    if (a && a.token && Date.now() < a.until) { AUTH.token = a.token; AUTH.until = a.until; scheduleExpiry(); }
    else localStorage.removeItem("oevAuth");   // expired: tidy up
  } catch (e) { /* ignore */ }
})();

document.addEventListener("visibilitychange", function () {   // phones pause timers while the page is in the background
  if (document.visibilityState === "visible" && AUTH.token && !isAuthed()) expire();
});

const LOGIN_LAYERS = ["nav-bar", "sessions", "library", "groups", "viewer"];
let LOGIN_CB = null, LOGIN_PREV = [];

/* Runs onOk straight away if logged in; otherwise asks for the code first */
function requireLogin(onOk, onCancel) {
  if (AUTH.token && !isAuthed()) wipeLibrary();
  if (isAuthed()) { onOk(); return; }
  LOGIN_CB = { ok: onOk, cancel: onCancel || null };
  LOGIN_PREV = LOGIN_LAYERS.map(id => document.getElementById(id).hasAttribute("inert"));
  LOGIN_LAYERS.forEach(id => document.getElementById(id).setAttribute("inert", ""));
  document.getElementById("login-err").textContent = "";
  document.getElementById("login-pw").value = "";
  document.getElementById("login").classList.remove("view-hidden");
  if (useSupabase()) supaLoginShow("email");
  else document.getElementById("login-pw").focus();
}

function closeLogin() {
  LOGIN_LAYERS.forEach(function (id, i) { if (!LOGIN_PREV[i]) document.getElementById(id).removeAttribute("inert"); });
  document.getElementById("login").classList.add("view-hidden");
}

/* Logged in: fetch ahead, send what was waiting, and go on with what the login was for */
function loginDone() {
  if (useSupabase() && SHOWN) {                    // the coach's own team's plan, with "Ny træning" and "Ret"
    fetchPlan().then(function () { if (!viewerOpen()) renderSessions(LATEST); }).catch(function () { /* the list stays */ });
  }
  prefetchGroups();
  sendQueue();                       // saves that were waiting for a login
  const cb = LOGIN_CB; LOGIN_CB = null;
  closeLogin();
  if (cb && cb.ok) cb.ok();
}

/* With the database: log in with your own e-mail and then your password (or the code Supabase sends to the e-mail,
   SUPABASE.login "code"), then (on more than one team) choose the team. LOGIN_SUPA.step: "email", "password", "code"
   or "team". */
const LOGIN_SUPA = { step: "email", email: "", teams: [] };
function supaLoginShow(step) {
  LOGIN_SUPA.step = step;
  const pw = document.getElementById("login-pw"), go = document.getElementById("login-go");
  const pick = document.getElementById("login-team");
  if (pick) pick.remove();
  pw.hidden = step === "team";
  pw.value = "";
  if (step === "email") {
    document.getElementById("login-title").textContent = "Log ind med din e-mail";
    pw.type = "email"; pw.setAttribute("aria-label", "E-mail"); pw.setAttribute("autocomplete", "username"); pw.removeAttribute("inputmode");
    go.textContent = supaLoginKind() === "code" ? "Send kode" : "Næste";
  } else if (step === "password") {
    document.getElementById("login-title").textContent = "Indtast din adgangskode";
    pw.type = "password"; pw.setAttribute("aria-label", "Adgangskode"); pw.setAttribute("autocomplete", "current-password"); pw.removeAttribute("inputmode");
    go.textContent = "Log ind";
  } else if (step === "code") {
    document.getElementById("login-title").textContent = "Indtast koden fra e-mailen";
    pw.type = "text"; pw.setAttribute("aria-label", "Kode fra e-mailen"); pw.setAttribute("autocomplete", "one-time-code"); pw.setAttribute("inputmode", "numeric");
    go.textContent = "Åbn";
  } else {
    document.getElementById("login-title").textContent = "Vælg hold";
    pw.insertAdjacentHTML("afterend", `<select id="login-team" aria-label="Hold">${LOGIN_SUPA.teams.map(t =>
      `<option value="${esc(t.id)}">${esc(t.name)}${t.club ? " · " + esc(t.club) : ""}</option>`).join("")}</select>`);
    go.textContent = "Åbn";
  }
  (step === "team" ? document.getElementById("login-team") : pw).focus();
}
function supaChooseTeam(team) {
  const s = supaSession() || {};
  if (s.team !== team) { GRP_CACHE = null; GRP_FETCH = null; }   // another team: not this one's players
  storeSupaSession(Object.assign(s, { team: team, teams: LOGIN_SUPA.teams }));
  loginDone();
}
function supaLoginSubmit() {
  const pw = document.getElementById("login-pw"), go = document.getElementById("login-go"), err = document.getElementById("login-err");
  const value = pw.value.trim(), step = LOGIN_SUPA.step;
  if (step === "team") { supaChooseTeam(document.getElementById("login-team").value); return; }
  if (!value) return;
  if (step === "email" && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(value)) { err.textContent = "Skriv en gyldig e-mailadresse."; return; }
  if (step === "email" && supaLoginKind() === "password") { LOGIN_SUPA.email = value; err.textContent = ""; supaLoginShow("password"); return; }
  const label = go.textContent;
  go.disabled = true; go.textContent = step === "email" ? "Sender…" : "Tjekker…"; err.textContent = "";
  const done = function () { go.disabled = false; go.textContent = label; };
  if (step === "email") {
    supaFetch("/auth/v1/otp", { email: value, create_user: false }).then(function () {
      done(); LOGIN_SUPA.email = value; supaLoginShow("code");
      err.textContent = "Vi har sendt en kode til " + value + ". Den kan tage et minut om at komme.";
    }, function (e) {
      done();
      err.textContent = !e.server ? "Ingen forbindelse. Prøv igen om lidt."
        : /signup|not allowed|not found/i.test(e.message) ? "Den e-mail har ikke adgang. Spørg holdlederen om at blive tilføjet."
        : /rate|seconds/i.test(e.message) ? "Vent et øjeblik, før du beder om en ny kode." : "Kunne ikke sende koden: " + e.message;
    });
    return;
  }
  const signIn = step === "password"
    ? supaFetch("/auth/v1/token?grant_type=password", { email: LOGIN_SUPA.email, password: pw.value })
    : supaFetch("/auth/v1/verify", { type: "email", email: LOGIN_SUPA.email, token: value });
  signIn.then(function (res) {
    gotSupaSession(res);
    return supaRpc("my_teams", {});
  }).then(function (teams) {
    done();
    LOGIN_SUPA.teams = Array.isArray(teams) ? teams : [];
    const s = supaSession() || {};
    if (!LOGIN_SUPA.teams.length) {
      AUTH.token = ""; AUTH.until = 0; saveAuth(); storeSupaSession(null); supaLoginShow("email");
      err.textContent = "Du er ikke tilknyttet et hold endnu. Spørg holdlederen.";
    } else if (LOGIN_SUPA.teams.length === 1 || LOGIN_SUPA.teams.some(t => t.id === s.team)) {
      supaChooseTeam(LOGIN_SUPA.teams.some(t => t.id === s.team) ? s.team : LOGIN_SUPA.teams[0].id);
    } else supaLoginShow("team");
  }, function (e) {
    done();
    err.textContent = !e.server ? "Ingen forbindelse. Prøv igen om lidt."
      : step === "password" ? (/not confirmed/i.test(e.message) ? "Brugeren er ikke bekræftet endnu. Holdlederen skal oprette den med \u201cAuto Confirm User\u201d."
        : /LOGIN|invalid/i.test(e.message) ? "Forkert e-mail eller adgangskode. Prøv igen, eller spørg holdlederen." : "Kunne ikke logge ind: " + e.message)
      : "Forkert eller udløbet kode. Prøv igen, eller bed om en ny.";
    pw.select();
  });
}

document.getElementById("login-form").addEventListener("submit", function (e) {
  e.preventDefault();
  if (useSupabase()) { supaLoginSubmit(); return; }
  const pw = document.getElementById("login-pw").value;
  if (!pw.trim()) return;
  const go = document.getElementById("login-go"), err = document.getElementById("login-err");
  go.disabled = true; go.textContent = "Tjekker…"; err.textContent = "";
  const done = function () { go.disabled = false; go.textContent = "Åbn"; };
  api("login", [pw]).then(function (res) {
      done();
      if (!res || !res.ok) {
        err.textContent =
          res && res.locked ? "For mange forkerte forsøg. Prøv igen om 10 minutter." :
          res && res.setup  ? "Koden er ikke sat op endnu. Kontakt den, der står for appen." :
                              "Forkert kode. Prøv igen.";
        document.getElementById("login-pw").select();
        return;
      }
      AUTH.token = res.token;
      AUTH.until = Date.now() + res.seconds * 1000;
      AUTH.span = res.seconds * 1000;
      saveAuth(); scheduleExpiry();
      loginDone();
    }, function () {
      done();
      err.textContent = "Kunne ikke kontrollere koden. Prøv igen om lidt.";
    });
});

function cancelLogin() {
  const cb = LOGIN_CB; LOGIN_CB = null;
  closeLogin();
  if (cb && cb.cancel) cb.cancel();
}
document.getElementById("login-cancel").addEventListener("click", cancelLogin);
document.getElementById("login-form").addEventListener("keydown", function (e) {
  if (e.key === "Escape") { e.stopPropagation(); cancelLogin(); }
});

function showView(name) {
  if (name === "library" && !isAuthed()) { requireLogin(function () { showView("library"); }); return; }
  if ((name === "groups" || name === "fixtures" || name === "overview") && !canGroup()) { requireLogin(function () { if (canGroup()) showView(name); }); return; }
  ["sessions", "library", "groups", "fixtures", "overview"].forEach(function (v) {

    document.getElementById("nav-" + v).setAttribute("aria-current", v === name ? "page" : "false");
  });

/* Cleans a cell value. Invisible and "blank-looking" characters are removed, and a value
   without a single letter or digit (for example "-", "•" or "·") counts as empty. */
function cleanVal(v) {
  const t = String(v == null ? "" : v)
    .replace(/[\p{Cc}\p{Cf}\p{Z}ㅤᅟᅠ⠀͏]/gu, " ")
    .trim();
  return /[\p{L}\p{N}]/u.test(t) ? t : "";
}

/* Values of a cell, split on semicolons (as written in the sheet) */
function rawVals(d, col) {
  return String(d[col] || "").split(/[;\n]+/).map(cleanVal).filter(Boolean);
}
const stripQuotes = v => String(v).replace(/["“”„‟«»]/g, "").replace(/\s+/g, " ").trim();
/* Key used to recognise the same tag written slightly differently */
const tagKey = v => stripQuotes(v).toLowerCase().replace(/['’‘`]/g, "").replace(/[?!.:,]+/g, " ").replace(/\s+/g, " ").trim();

/* A tag after the renames from the "Omdøb" tab have been applied */
function aliasOf(col, v) {
  const m = ALIASES[col] && ALIASES[col].get(tagKey(v));
  return m || v;
}

/* Values of a cell with spelling variants merged into one tag */
function splitVals(d, col) {
  const vals = rawVals(d, col);
  if (TAG_COLS.indexOf(col) === -1 || !CANON[col]) return vals;
  const out = [];
  vals.forEach(function (v) {
    const r = aliasOf(col, v);
    const c = CANON[col].get(tagKey(r)) || stripQuotes(r);
    if (c && out.indexOf(c) === -1) out.push(c);
  });
  return out;
}

function buildCanon(drills) {
  TAG_COLS.forEach(function (col) {
    const tally = new Map();                  // key -> Map(variant -> count)
    drills.forEach(d => rawVals(d, col).forEach(function (v) {
      const r = aliasOf(col, v), variant = stripQuotes(r), k = tagKey(r);
      if (!k) return;
      if (!tally.has(k)) tally.set(k, new Map());
      tally.get(k).set(variant, (tally.get(k).get(variant) || 0) + 1);
    }));
    CANON[col] = new Map();
    tally.forEach(function (variants, k) {    // the most used spelling wins
      const best = Array.from(variants.entries()).sort((x, y) =>
        y[1] - x[1] || (/^\p{Lu}/u.test(y[0]) ? 1 : 0) - (/^\p{Lu}/u.test(x[0]) ? 1 : 0) || y[0].length - x[0].length)[0][0];
      CANON[col].set(k, best);
    });
  });
}

/* "U11 - U13" becomes U11, U12, U13, so the filter works on single ages */
function ageVals(d) {
  const out = [];
  rawVals(d, "Aldersgruppe").forEach(function (v) {
    const m = v.match(/U\s*(\d{1,2})\s*[-–—]\s*U?\s*(\d{1,2})/i);
    if (m) {
      let lo = +m[1], hi = +m[2];
      if (lo > hi) { const t = lo; lo = hi; hi = t; }
      for (let i = lo; i <= hi; i++) out.push("U" + i);
    } else {
      const one = v.match(/^U\s*(\d{1,2})$/i);
      out.push(one ? "U" + one[1] : v);
    }
  });
  return Array.from(new Set(out));
}

const filterVals = (d, col) => d.__f[col] || [];

/* Focus tags for a drill, most used first (by how often they occur in "Sessioner") */
function focusTags(d) {
  const tags = splitVals(d, "Fokus");
  if (tags.length < 2 || !CANON.Fokus) return tags;
  const freq = new Map();
  rawVals(d, "Sessioner").forEach(function (v) {
    const c = CANON.Fokus.get(tagKey(aliasOf("Fokus", v)));
    if (c) freq.set(c, (freq.get(c) || 0) + 1);
  });
  return tags.map((t, i) => ({ t: t, i: i, f: freq.get(t) || 0 }))
    .sort((a, b) => b.f - a.f || a.i - b.i).map(x => x.t);
}

/* Sections of an opened drill: the ones listed above plus every extra column in the sheet (as text) */
function sectionsFor(headers) {
  const known = new Set([].concat(
    LIB_SECTIONS.map(x => x.col), LIB_FILTERS.map(x => x.col), LIB_RESERVED));
  const extra = headers.filter(h => h && !known.has(h) && !/ \(DA\)$/.test(h)).map(h => ({ col: h, title: h, type: "text" }));
  return LIB_SECTIONS.concat(extra);
}
let MINI = { sections: LIB_SECTIONS };            // used when a single drill is opened without the library
const libSections = () => (LIB || MINI).sections;

let LIB_LOADING = false;
const LIB_WAIT = [];            // things to do when the library has loaded (or failed to load)
function libDone() { LIB_LOADING = false; LIB_WAIT.splice(0).forEach(f => f()); }

/* Spinning ball in the Øvelser tab while the drills are on their way */
function showLibLoading() {
  document.getElementById("lib-filters").innerHTML = "";
  document.getElementById("lib-status").innerHTML = "";
  document.getElementById("drill-grid").innerHTML =
    '<div class="lib-loading" role="status"><div class="spinner" aria-hidden="true"></div><span>Indlæser øvelser…</span></div>';
}

/* The last library the server sent is kept on this phone, so the Øvelser tab can show it at once
   after login, while the app asks the server in the background whether anything has changed. It is only
   shown with a valid login. It is kept in IndexedDB (the browser's database), which has room for the whole
   library; localStorage, used before, is too small for it on many phones. The Danish texts are kept next
   to it ('libda'), so they also show at once. */
const LIB_DB = "pasbygger", LIB_STORE = "saved";
let IDB = null;
try { localStorage.removeItem("oevLib"); } catch (e) { /* the old copy (too big for localStorage): space for the rest */ }

function idb() {
  if (!IDB) {
    IDB = new Promise(function (ok, fail) {
      if (!window.indexedDB) { fail(new Error("no IndexedDB")); return; }
      const req = indexedDB.open(LIB_DB, 1);
      req.onupgradeneeded = function () { req.result.createObjectStore(LIB_STORE); };
      req.onsuccess = function () { ok(req.result); };
      req.onerror = req.onblocked = function () { fail(req.error || new Error("blocked")); };
    });
    IDB.catch(function () { /* no database: the app works without the saved copy */ });
  }
  return IDB;
}

/* Read a saved value (null if there is none, or the phone takes more than 3 seconds to answer) */
function idbGet(key) {
  const read = idb().then(db => new Promise(function (ok) {
    const r = db.transaction(LIB_STORE).objectStore(LIB_STORE).get(key);
    r.onsuccess = function () { ok(r.result == null ? null : r.result); };
    r.onerror = function () { ok(null); };
  })).catch(() => null);
  return Promise.race([read, new Promise(ok => setTimeout(() => ok(null), 3000))]);
}

function idbSet(key, value) {
  return idb().then(db => new Promise(function (ok) {
    const tx = db.transaction(LIB_STORE, "readwrite");
    tx.objectStore(LIB_STORE).put(value, key);
    tx.oncomplete = function () { ok(true); };
    tx.onerror = tx.onabort = function () { ok(false); };
  })).catch(() => false);
}

/* Saved as text, made at once: the drills are changed on the page afterwards (language, filters) */
function readSaved(key, check) {
  return idbGet(key).then(function (text) {
    try { const s = JSON.parse(text || "null"); return s && check(s) ? s : null; } catch (e) { return null; }
  });
}
const readSavedLibrary = () => readSaved("lib", s => s.version && s.res && Array.isArray(s.res.drills));
const readSavedDanish = () => readSaved("libda", s => s.version && s.da);
function saveLibrary(res) { idbSet("lib", JSON.stringify({ version: res.version, res: res })); }
function saveDanish(d) { idbSet("libda", JSON.stringify(d)); }

/* The Danish texts ({ version, da: { drill ID: { "Navn (DA)": ... } } }), fetched after the drills */
let LIB_DA = null;
const daKey = d => String(d["ID"] || d["Navn"] || "").trim();

/* Puts the Danish texts into the drills and shows them where Danish is chosen */
function mergeDanish(drills) {
  if (!LIB_DA || !drills) return;
  drills.forEach(function (d) {
    const t = LIB_DA.da[daKey(d)];
    if (!t) return;
    Object.assign(d, t);
    applyLang(d);                             // also makes the search text again (it covers both languages)
  });
}

/* Turns the server's answer into LIB and shows it (filters and search the coach has chosen stay) */
function useLibrary(res) {
  const drills = res.drills;              // the server already shows each drill only once
  drills.forEach(applyLang);
  setAliases(res.aliases);

  buildCanon(drills);
  drills.forEach(function (d) {
    d.__f = {};
    LIB_FILTERS.forEach(f => { d.__f[f.col] = f.col === "Aldersgruppe" ? ageVals(d) : splitVals(d, f.col); });
  });

  const total = {}, tree = {};
  LIB_FILTERS.forEach(function (f) {
    total[f.col] = new Map();
    drills.forEach(d => d.__f[f.col].forEach(v => total[f.col].set(v, (total[f.col].get(v) || 0) + 1)));
    if (f.parent) {
      tree[f.col] = new Map();
      drills.forEach(d => d.__f[f.parent].forEach(function (p) {
        if (!tree[f.col].has(p)) tree[f.col].set(p, new Set());
        d.__f[f.col].forEach(c => tree[f.col].get(p).add(c));
      }));
    }
  });

  LIB = { drills: drills, headers: res.headers, sections: sectionsFor(res.headers), total: total, tree: tree,
          groups: tagGroups(res.groups), version: res.version || "" };
  if (PRESET != null) applyPreset(); else renderLibrary();
}

function libCall(action, args) { return api(action, args).then(keepLoggedIn); }   // the server, as a promise

/* Shown above the drills while the server is slow: the saved copy stays usable meanwhile */
let SYNC_TIMER = null, SYNC_SLOW_TIMER = null;
function setSyncNote(text, spin) {
  const el = document.getElementById("lib-sync");
  el.innerHTML = text ? (spin ? '<div class="spinner" aria-hidden="true"></div>' : "") + `<span>${esc(text)}</span>` : "";
}
function syncStarted() {
  clearTimeout(SYNC_TIMER); clearTimeout(SYNC_SLOW_TIMER);
  SYNC_TIMER = setTimeout(function () {                         // after 4 seconds: say what is going on
    if (LIB) setSyncNote("Henter nyeste øvelser … Du kan bruge den gemte udgave imens.", true);
  }, 4000);
  SYNC_SLOW_TIMER = setTimeout(function () {                    // nothing saved yet and still waiting
    const wait = document.querySelector("#drill-grid .lib-loading span");
    if (!LIB && wait) wait.textContent = "Serveren svarer langsomt i dag. Øvelserne kommer, så snart den svarer …";
  }, 8000);
}
function syncEnded(failed, err) {
  clearTimeout(SYNC_TIMER); clearTimeout(SYNC_SLOW_TIMER);
  if (failed && LIB) {
    setSyncNote(err && err.server ? failText(err) + ". Du ser den gemte udgave." : "Kunne ikke hente nyeste øvelser lige nu. Du ser den gemte udgave.");
    SYNC_TIMER = setTimeout(() => setSyncNote(""), 8000);
  } else setSyncNote("");
}

function loadLibrary(cb, silent) {
  if (cb) LIB_WAIT.push(cb);
  if (LIB_LOADING) return;
  LIB_LOADING = true;
  if (LIB) { fetchLibrary(LIB.version, silent); return; }
  showLibLoading();
  Promise.all([readSavedLibrary(), readSavedDanish()]).then(function (saved) {
    if (!LIB && saved[0] && isAuthed()) {             // show the saved copy now; waiting callers can go on
      useLibrary(saved[0].res);
      if (saved[1]) { LIB_DA = saved[1]; mergeDanish(LIB.drills); if (LANG === "da") renderLibrary(); }
      LIB_WAIT.splice(0).forEach(f => f());
    }
    fetchLibrary(LIB ? LIB.version : "", silent);
  });
}

function fetchLibrary(version, silent) {
  syncStarted();

  function gotLibrary(res) {
    syncEnded(false);
    if (!res.unchanged) {                              // something changed (or nothing was saved): show the new one
      saveLibrary(res);
      useLibrary(res);
      mergeDanish(LIB.drills);                         // the Danish texts we have (updated just below if they changed)
      if (LANG === "da" && LIB_DA) renderLibrary();
    }
    libDone();
    fetchDanish(res.daVersion);
  }

  function failedLibrary(err) {
    syncEnded(true, err);
    if (/LOGIN/.test(String(err && err.message))) {      // the login is no longer valid on the server
      const waiting = LIB_WAIT.splice(0);
      setSyncNote("");
      wipeLibrary();
      if (silent && !waiting.length) return;
      requireLogin(function () { loadLibrary(function () { waiting.forEach(f => f()); }); },
                   function () { if (!document.getElementById("library").classList.contains("view-hidden")) showView("sessions"); });
      return;
    }
    if (!LIB) document.getElementById("drill-grid").innerHTML =       // a saved copy stays on screen
      "<p>Kunne ikke hente øvelser. " + (err && err.server ? esc(failText(err)) : "Prøv igen om lidt.") + "</p>";
    libDone();
  }

  libCall("getDrills", [AUTH.token, version]).then(gotLibrary, failedLibrary);
}

/* The Danish texts, only when they have changed since the copy on this phone */
function fetchDanish(daVersion) {
  if (!daVersion || (LIB_DA && LIB_DA.version === daVersion) || !AUTH.token) return;
  libCall("getDrillsDa", [AUTH.token, LIB_DA ? LIB_DA.version : ""]).then(function (res) {
    if (!res || res.unchanged || !res.da) return;
    LIB_DA = { version: res.version, da: res.da };
    saveDanish(LIB_DA);
    if (!LIB) return;
    mergeDanish(LIB.drills);
    if (LANG === "da") renderLibrary();
  }, function () { /* no Danish texts this time: the drills show in the original language */ });
}

/* Does a drill match the search and the selected tags (ignoring one filter group, for counting)? */
function libMatches(d, skipCol) {
  if (FAV_ONLY && !isFav(d)) return false;
  if (LIB_QUERY) {
    if (d.__text == null)                     // the drill's text for the search, made once per drill
      d.__text = Object.keys(d).filter(k => k.indexOf("__") !== 0 && k !== "Sessioner").map(k => d[k])
        .concat(d.__en ? Object.values(d.__en) : []).join(" ").toLowerCase();
    if (!d.__text.includes(LIB_QUERY)) return false;
  }
  return LIB_FILTERS.every(function (f) {
    return f.col === skipCol || SEL[f.col].size === 0 || filterVals(d, f.col).some(v => SEL[f.col].has(v));
  });
}

const byAlpha = (a, b) => a.localeCompare(b, "da", { numeric: true });

function chipHtml(f, v) {
  const on = SEL[f.col].has(v);
  const n = LIB.drills.filter(d => libMatches(d, f.col) && filterVals(d, f.col).includes(v)).length;
  return `<button type="button" class="tagbtn" aria-pressed="${on}" ${(!on && n === 0) ? "disabled" : ""}
            data-col="${esc(f.col)}" data-val="${esc(v)}">${esc(v)}<span class="n">${n}</span></button>`;
}

/* Groups from the "Tags" tab, per column: { order: [group names], of: tag key -> group, rank: tag key -> position } */
function tagGroups(list) {
  const out = {};
  (list || []).forEach(function (g, i) {
    const G = out[g.col] = out[g.col] || { order: [], of: new Map(), rank: new Map() };
    const k = tagKey(aliasOf(g.col, g.tag));
    if (G.order.indexOf(g.group) === -1) G.order.push(g.group);
    if (!G.of.has(k)) { G.of.set(k, g.group); G.rank.set(k, i); }
  });
  return out;
}

/* A format like "5v3" or "2+1v3" is a number of players. Such a format goes under "Antal spillere" even when
   the "Tags" tab doesn't list it yet (e.g. after an import), sorted by how many players it takes. */
const PLAYER_FORMAT = /^\d+(\+\d+)*v\d+(\+\d+)*$/i;
const PLAYERS_GROUP = "Antal spillere";
function byPlayers(a, b) {
  const total = v => v.split(/[v+]/i).reduce((n, x) => n + (+x || 0), 0);
  return total(a) - total(b) || (a.indexOf("+") !== -1) - (b.indexOf("+") !== -1) || byAlpha(a, b);
}

/* The buttons of one filter group */
function groupBodyHtml(f) {
  const mk = v => chipHtml(f, v);

  const G = f.grouped && LIB.groups && LIB.groups[f.col];
  if (G) {                                    // tags under their group headings; tags without a group under "Andet"
    const byGroup = new Map(G.order.map(g => [g, []]));
    const rest = [];
    LIB.total[f.col].forEach(function (n, v) {
      const g = G.of.get(tagKey(v)) || (f.col === "Format" && PLAYER_FORMAT.test(v) ? PLAYERS_GROUP : "");
      if (g && !byGroup.has(g)) byGroup.set(g, []);
      (g ? byGroup.get(g) : rest).push(v);
    });
    const rank = v => { const r = G.rank.get(tagKey(v)); return r == null ? 1e9 : r; };
    // a group whose tags all give 0 drills with the other choices (and none chosen) is left out
    const fits = vals => vals.some(v => SEL[f.col].has(v) ||
      LIB.drills.some(d => libMatches(d, f.col) && filterVals(d, f.col).includes(v)));
    const blocks = [];
    byGroup.forEach(function (vals, g) {
      if (!vals.length || !fits(vals)) return;
      blocks.push([g, vals.sort(f.col === "Format" && g === PLAYERS_GROUP ? byPlayers : (a, b) => rank(a) - rank(b))]);
    });
    if (rest.length && fits(rest)) blocks.push(["Andet", rest.sort(byAlpha)]);
    return blocks.map(b => `<div class="fsub"><span class="fsub-label">${esc(b[0])}</span>${b[1].map(mk).join("")}</div>`).join("")
      || '<span class="fnone">Ingen match</span>';
  }

  if (f.parent) {                             // subthemes, grouped under their theme
    const tree = LIB.tree[f.col], sel = SEL[f.parent];
    const fitsAny = p => Array.from(tree.get(p)).some(v => SEL[f.col].has(v) ||   // hide themes with no matching drills
      LIB.drills.some(d => libMatches(d, f.col) && filterVals(d, f.col).includes(v)));
    return Array.from(tree.keys()).filter(p => (!sel.size || sel.has(p)) && fitsAny(p)).sort(byAlpha).map(p =>
      `<div class="fsub"><span class="fsub-label">${esc(p)}</span>${Array.from(tree.get(p)).sort(byAlpha).map(mk).join("")}</div>`
    ).join("");
  }

  const tot = LIB.total[f.col];
  let values = Array.from(tot.keys());
  values.sort(f.byCount ? (a, b) => tot.get(b) - tot.get(a) || byAlpha(a, b) : byAlpha);

  if (f.limit && values.length > f.limit && !GROUP_OPEN[f.col]) {
    const top = values.slice(0, f.limit);
    SEL[f.col].forEach(v => { if (top.indexOf(v) === -1) top.push(v); });   // selected ones always stay visible
    values = top;
  } else if (GROUP_QUERY[f.col]) {
    const q = tagKey(GROUP_QUERY[f.col]);
    values = values.filter(v => tagKey(v).includes(q));
  }
  return values.map(mk).join("") || '<span class="fnone">Ingen match</span>';
}

function renderLibrary() {
  document.getElementById("lib-filters").innerHTML = LIB_FILTERS.map(function (f) {
    const total = LIB.total[f.col].size;
    if (!total) return "";
    const more = !(f.grouped && LIB.groups && LIB.groups[f.col]) && f.limit && total > f.limit;
    const open = !!GROUP_OPEN[f.col];
    return `<div class="fgroup"><div class="fgroup-label">${esc(f.label)}</div>` +
      (more && open ? `<input type="search" class="fsearch" data-col="${esc(f.col)}" value="${esc(GROUP_QUERY[f.col] || "")}"
                        placeholder="Søg i ${esc(f.label.toLowerCase())}" aria-label="Søg i ${esc(f.label.toLowerCase())}">` : "") +
      `<div class="fbody" data-col="${esc(f.col)}">${groupBodyHtml(f)}</div>` +
      (more ? `<button type="button" class="moretoggle" data-col="${esc(f.col)}">${open ? "Vis færre" : "Vis alle (" + total + ")"}</button>` : "") +
      "</div>";
  }).join("");

  const list = LIB.drills.filter(d => libMatches(d, null));
  LIB_LIST = list;
  const anyFilter = LIB_QUERY || FAV_ONLY || LIB_FILTERS.some(f => SEL[f.col].size);

  const nSel = LIB_FILTERS.reduce((n, f) => n + SEL[f.col].size, 0);
  document.getElementById("lib-panel-sum").textContent = nSel ? `Filtre (${nSel} valgt)` : "Filtre";
  if (!LIB_PANEL_INIT) {                      // filters start open on wide screens, closed on phones
    LIB_PANEL_INIT = true;
    document.getElementById("lib-panel").open = window.innerWidth > 700;
  }

  renderLibStatus(list.length, anyFilter);

  const nFav = LIB.drills.filter(isFav).length;
  CARDS_SHOWN = 0;
  document.getElementById("drill-grid").innerHTML = list.length
    ? ""
    : FAV_ONLY && !nFav
      ? "<p>Du har ingen favoritter endnu. Tryk på stjernen på en øvelse for at gemme den her.</p>"
      : "<p>Ingen øvelser matcher. Fjern et filter eller prøv en anden søgning.</p>";
  if (list.length) showMoreCards();
}

/* The cards are drawn 40 at a time: drawing all of them at once takes seconds on a phone.
   More are added when the button at the bottom comes near the screen (or is tapped). */
const CARD_PAGE = 40;
let CARDS_SHOWN = 0;
const MORE_OBSERVER = "IntersectionObserver" in window
  ? new IntersectionObserver(function (entries) {
      if (entries.some(e => e.isIntersecting)) showMoreCards();
    }, { rootMargin: "800px 0px" })
  : null;

function showMoreCards() {
  const grid = document.getElementById("drill-grid");
  const old = grid.querySelector(".grid-more");
  if (old) { if (MORE_OBSERVER) MORE_OBSERVER.unobserve(old); old.remove(); }
  const start = CARDS_SHOWN;
  const next = LIB_LIST.slice(start, start + (MORE_OBSERVER ? CARD_PAGE : LIB_LIST.length));
  grid.insertAdjacentHTML("beforeend", next.map((d, k) => drillCard(d, start + k)).join(""));
  CARDS_SHOWN = start + next.length;
  const left = LIB_LIST.length - CARDS_SHOWN;
  if (left > 0) {
    grid.insertAdjacentHTML("beforeend",
      `<button type="button" class="clearbtn grid-more">Vis flere øvelser (${left} tilbage)</button>`);
    if (MORE_OBSERVER) MORE_OBSERVER.observe(grid.querySelector(".grid-more"));
  }
}

document.getElementById("drill-grid").addEventListener("click", function (e) {
  if (e.target.closest(".grid-more")) showMoreCards();
});

/* Count, the "Favoritter" switch and "Ryd filtre" above the list */
function renderLibStatus(n, anyFilter) {
  const nFav = LIB.drills.filter(isFav).length;
  document.getElementById("lib-status").innerHTML =
    `<span>${n} ${n === 1 ? "øvelse" : "øvelser"}</span>` +

    (anyFilter ? '<button type="button" class="clearbtn" id="lib-clear">Ryd filtre</button>' : "");
}

/* If a theme is dropped, subthemes that no longer belong to the chosen themes are dropped too */
function pruneChildren(parentCol) {
  LIB_FILTERS.filter(f => f.parent === parentCol).forEach(function (f) {
    if (!SEL[parentCol].size) return;
    const allowed = new Set();
    SEL[parentCol].forEach(p => (LIB.tree[f.col].get(p) || []).forEach(c => allowed.add(c)));
    Array.from(SEL[f.col]).forEach(v => { if (!allowed.has(v)) SEL[f.col].delete(v); });
  });
}

document.getElementById("lib-filters").addEventListener("click", function (e) {
  const more = e.target.closest(".moretoggle");
  if (more) { GROUP_OPEN[more.dataset.col] = !GROUP_OPEN[more.dataset.col]; renderLibrary(); return; }
  const b = e.target.closest(".tagbtn");
  if (!b || b.disabled) return;
  setLibNote("");
  const set = SEL[b.dataset.col];
  if (set.has(b.dataset.val)) set.delete(b.dataset.val); else set.add(b.dataset.val);
  pruneChildren(b.dataset.col);
  renderLibrary();
});

document.getElementById("lib-filters").addEventListener("input", function (e) {   // search inside a group

let SEARCH_TIMER = null;
document.getElementById("lib-search").addEventListener("input", function (e) {   // waits for a short pause in the typing
  clearTimeout(SEARCH_TIMER);
  const q = e.target.value.toLowerCase().trim();

/* From a training session: open the library filtered on the session's theme, subtheme and focus */
function findDrillsForFocus(index) {
  const s = SESSIONS[index];
  if (!s) return;
  PRESET = { tema: s.theme || "", undertema: s.subtheme || "", fokus: s.focus || "",
             label: danishDate(s.iso, s.date) };
  closeDrill();
  showView("library");
  if (LIB) applyPreset();
}

/* Tags in the library that match the text of a session cell (renames and spelling variants are handled) */
function matchTags(col, text) {
  const out = [];
  rawVals({ t: text }, "t").forEach(function (v) {
    const c = CANON[col] && CANON[col].get(tagKey(aliasOf(col, v)));
    if (c && LIB.total[col].has(c) && out.indexOf(c) === -1) out.push(c);
  });
  return out;
}

/* Last resort for the focus: tags that share a longer word with the session's focus text */
function similarFokus(text) {
  const skip = ["fokus", "øvelse", "øvelser", "træning", "træningen"];   // too general to match on
  const words = tagKey(text).split(" ").filter(w => w.length >= 5 && skip.indexOf(w) === -1);
  if (!words.length) return [];
  return Array.from(LIB.total.Fokus.keys()).filter(tag => words.some(w => tagKey(tag).includes(w)));
}

function setLibNote(text) {
  document.getElementById("lib-note").textContent = text || "";
}

function applyPreset() {
  const p = PRESET;
  PRESET = null;
  LIB_QUERY = "";
  clearTimeout(SEARCH_TIMER);
  document.getElementById("lib-search").value = "";
  LIB_FILTERS.forEach(f => { GROUP_QUERY[f.col] = ""; });

  const tema = matchTags("Temaer", p.tema);
  const under = matchTags("Undertemaer", p.undertema);
  const underFokus = matchTags("Fokus", p.undertema);       // the plan's Undertema can be a Fokus tag on the drills
  let fokus = matchTags("Fokus", p.fokus), similar = false;
  if (!fokus.length) { fokus = similarFokus(p.fokus); similar = fokus.length > 0; }
  const both = fokus.concat(underFokus.filter(v => fokus.indexOf(v) === -1));

  // Try the most specific combination first; loosen it step by step until there are drills to show
  const tries = [[tema, under, both], [tema, under, underFokus], [tema, under, []], [tema, [], []], [[], [], both]];
  let used = null;
  for (let i = 0; i < tries.length && !used; i++) {
    const t = tries[i];
    if (!t[0].length && !t[1].length && !t[2].length) continue;
    LIB_FILTERS.forEach(f => SEL[f.col].clear());
    t[0].forEach(v => SEL.Temaer.add(v));
    t[1].forEach(v => SEL.Undertemaer.add(v));
    t[2].forEach(v => SEL.Fokus.add(v));
    if (LIB.drills.some(d => libMatches(d, null))) used = t;
  }
  if (!used) LIB_FILTERS.forEach(f => SEL[f.col].clear());

  const parts = [];
  if (used && used[0].length) parts.push("Tema: " + used[0].join(", "));
  if (used && used[1].length) parts.push("Undertema: " + used[1].join(", "));
  if (used && used[2].length) parts.push((similar ? "Lignende fokus: " : "Fokus: ") + used[2].join(", "));
  let note = parts.length
    ? "Øvelser til træningen " + p.label + " – " + parts.join(" · ")
    : "Træningen har ingen tags der matcher øvelserne, så alle øvelser vises.";
  if (used && fokus.length && !used[2].length) {
    note += " (fokus «" + p.fokus + "» er udeladt, fordi ingen øvelser matcher det sammen med resten)";
  }
  setLibNote(note);

  LIB_PANEL_INIT = true;
  document.getElementById("lib-panel").open = true;
  renderLibrary();
  window.scrollTo(0, 0);
}

/* ---- drill card ---- */
function driveId(u) {
  const m = String(u).match(/\/d\/([\w-]{15,})/) || String(u).match(/[?&]id=([\w-]{15,})/);
  return m ? m[1] : "";
}

function libMedia(type, raw) {
  const u = safeUrl(raw);
  if (!u) return "";
  if (type === "image") {
    const id = driveId(u);
    const src = id ? "https://drive.google.com/thumbnail?id=" + id + "&sz=w1400" : u;
    return `<img class="media" src="${esc(src)}" alt="Diagram" loading="lazy" onerror="brokenDiagram(this)">`;
  }
  let m;
  if ((m = u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{11})/)))
    return `<iframe class="media" src="https://www.youtube-nocookie.com/embed/${m[1]}" allowfullscreen loading="lazy" title="Video"></iframe>`;
  if ((m = u.match(/vimeo\.com\/(\d+)/)))
    return `<iframe class="media" src="https://player.vimeo.com/video/${m[1]}" allowfullscreen loading="lazy" title="Video"></iframe>`;
  if (driveId(u))
    return `<iframe class="media" src="https://drive.google.com/file/d/${driveId(u)}/preview" allowfullscreen loading="lazy" title="Video"></iframe>`;
  if (/\.(mp4|webm)(\?|$)/i.test(u)) return `<video class="media" src="${esc(u)}" controls></video>`;
  return `<a href="${esc(u)}" target="_blank" rel="noopener">Åbn video</a>`;
}

/* The Diagram cell can hold several pictures, one link per line (FA sessions). They are shown one at a time
   with arrows, like on the FA site, each with its line from "Billedtekster". The arrows are buttons, so a swipe
   on the picture still turns the viewer's page. */
function diagramHtml(raw, d) {
  const urls = String(raw || "").split(/\s*\n\s*/).map(safeUrl).filter(Boolean);
  if (!urls.length) return "";
  const caps = String((d && d["Billedtekster"]) || "").split("\n");
  const cap = i => cleanVal(caps[i]) ? `<figcaption>${esc(caps[i].trim())}</figcaption>` : "";
  if (urls.length === 1) return cap(0) ? `<figure class="g-single">${libMedia("image", urls[0])}${cap(0)}</figure>` : libMedia("image", urls[0]);
  return `<div class="gallery">` +
    urls.map((u, i) => `<figure class="g-slide${i ? "" : " on"}">${libMedia("image", u)}${cap(i)}</figure>`).join("") +
    `<div class="g-nav"><button type="button" class="g-btn g-prev" aria-label="Forrige billede">‹</button>` +
    `<span class="g-count">1 / ${urls.length}</span>` +
    `<button type="button" class="g-btn g-next" aria-label="Næste billede">›</button></div></div>`;
}

/* The Video cell can hold several videos, one link per line (an FA session in parts): shown one after another */
function videoHtml(raw) {
  const urls = String(raw || "").split(/\s*\n\s*/).filter(Boolean);
  if (urls.length < 2) return libMedia("video", urls[0] || "");
  return urls.map((u, i) => `<div class="video-part"><div class="video-part-label">Del ${i + 1} af ${urls.length}</div>` +
    libMedia("video", u) + `</div>`).join("");
}

function galleryStep(g, step) {
  const slides = Array.from(g.querySelectorAll(".g-slide"));
  if (!slides.length) return;
  const i = (Math.max(0, slides.findIndex(s => s.classList.contains("on"))) + step + slides.length) % slides.length;
  slides.forEach((s, j) => s.classList.toggle("on", j === i));
  g.querySelector(".g-count").textContent = (i + 1) + " / " + slides.length;
  g.querySelector(".g-nav").hidden = slides.length < 2;
}

document.addEventListener("click", function (e) {
  const b = e.target.closest(".g-btn");
  if (b) galleryStep(b.closest(".gallery"), b.classList.contains("g-next") ? 1 : -1);
});

function libLink(url, text) {
  const u = safeUrl(url);
  return u ? `<a href="${esc(u)}" target="_blank" rel="noopener">${escLines(text || u)}</a>` : "";
}

function libBody(def, d) {
  const val = def.type === "link" ? exerciseLink(d) : d[def.col];
  if (!val) return "";
  if (def.type === "focuspoints") {           // "Boldholder: text" -> role in bold
    const lines = String(val).split(/\n+/).map(x => x.trim()).filter(Boolean);
    return "<ul>" + lines.map(function (l) {
      const m = l.match(/^([^:]{1,30}):\s*(.*)$/);
      return m ? `<li><strong>${esc(m[1])}:</strong> ${esc(m[2])}</li>` : `<li>${esc(l)}</li>`;
    }).join("") + "</ul>";
  }
  if (def.type === "variations") {
    /* A line gets a plus/minus badge when it starts with + or - (Sheets sometimes turns "+" into "=+";
       that is understood too), or when it comes under a heading "Progression" or "Regression".
       A short line ending in ":" is a small heading; if it says harder/easier (also in Norwegian),
       the lines under it get plus/minus. Every other line gets the neutral badge. */
    const lines = String(val).split(/\n+/).map(x => x.trim()).filter(Boolean);
    const items = [];
    let mode = "";
    lines.forEach(function (l) {
      l = l.replace(/^['=]+\s*(?=[-–−+])/, "");               // "=+ text" or "'+ text" -> "+ text"
      const h = l.match(/^(pro\w*ion\w*|regre\w*)\s*:?\s*(.*)$/i);
      if (h && !/\s/.test(h[1])) {                             // a heading, maybe with text after it
        mode = /^pro/i.test(h[1]) ? "plus" : "minus";
        if (!h[2]) return;
        l = h[2];
      }
      const m = l.match(/^(\+\/[-–−]|[-–−]\/\+|\+|[-–−])\s*(.*)$/);
      if (m) {
        const cls = m[1].length > 1 ? "pm" : m[1] === "+" ? "plus" : "minus";
        items.push([cls, m[2] || l]);
      } else if (/:$/.test(l) && l.length <= 160) {            // small heading
        mode = /sværere|svær|vanskelig|udfordrend|utfordrend|krævende|krevende|progres/i.test(l) ? "plus"
             : /lettere|nemmere|enklere|regres/i.test(l) ? "minus" : "";
        items.push(["head", l]);
      } else items.push([mode || "neutral", l]);
    });
    const SIGN = { plus: "+", minus: "−", pm: "±", neutral: "•" };
    return '<ul class="var-list">' + items.map(it => it[0] === "head"
      ? `<li class="var-head">${esc(it[1])}</li>`
      : `<li><span class="sign ${it[0]}">${SIGN[it[0]]}</span><span>${esc(it[1])}</span></li>`).join("") + "</ul>";
  }
  if (def.type === "list") {
    const items = String(val).split(/[;\n]+/).map(x => x.replace(/^[-•*]\s*/, "").trim()).filter(Boolean);
    return items.length > 1 ? "<ul>" + items.map(i => `<li>${esc(i)}</li>`).join("") + "</ul>" : `<p>${esc(items[0] || "")}</p>`;
  }
  if (def.type === "image") return diagramHtml(val, d);
  if (def.type === "video") return videoHtml(val);
  if (def.type === "link") {
    let note = "", host = "";
    try { host = new URL(val).hostname; note = LINK_NOTES[host] || ""; } catch (e) { note = ""; }
    const label = (val === d["Link"] && d["__linktext"] && d["__linktext"] !== val) ? d["__linktext"] : LINK_LABELS[host] || "Åbn link til øvelsen hos DBU";
    if (isFckLink(val)) {                     // FCK has no page per drill: the link opens their drill bank
      return libLink(val, "Find øvelsen i FCK's øvelsesbank") +
        `<p class="link-note">Linket åbner forsiden af øvelsesbanken. Søg efter »${esc(cleanVal(d["Navn"]))}«. ${esc(note)}</p>`;
    }
    return libLink(val, label) + (note ? `<p class="link-note">${esc(note)}</p>` : "");
  }
  if (def.type === "notes") {
    const parts = d["__noter"] || [{ text: String(val), url: "" }];   // a note without links comes as plain text only
    return parts.map(p => libLink(p.url, p.text) || `<span>${escLines(p.text)}</span>`).join(" ");
  }
  return `<p>${escLines(val)}</p>`;
}

/* Tags: a red row (category, focus) above a grey row (age, facts, themes).
   On the card (full = false) only the first 3 focus tags are shown, followed by "+n". */
function drillChips(d, full) {
  const chip = (cls, t) => `<span class="dchip ${cls}">${esc(t)}</span>`;
  const bane = cleanVal(d["Banestørrelse"]);

  const fokus = focusTags(d);
  const shown = full ? fokus.length : Math.min(fokus.length, 3);   // on the card: 3 focus tags, the rest behind "+n"
  const hidden = fokus.length - shown;

  const red = [].concat(
    splitVals(d, "Format").map(v => chip("cat", v)),
    fokus.slice(0, shown).map(v => chip("focus", v)));
  if (hidden) {
    red.push(`<button type="button" class="dchip more" aria-label="Vis ${hidden} flere tags"
                onclick="event.stopPropagation(); showMoreChips(this)" onkeydown="event.stopPropagation()">+${hidden}</button>`);
    fokus.slice(shown).forEach(v => red.push(chip("focus", v).replace("<span ", "<span hidden ")));
  }

  const grey = [].concat(
    rawVals(d, "Aldersgruppe").map(v => chip("", v)),
    [
      rangeText(d["Antal spillere min"], d["Antal spillere max"], "spillere"),
      rangeText(d["Varighed min"], d["Varighed max"], "min"),
      bane ? "Bane: " + bane : ""
    ].filter(Boolean).map(t => chip("", t)));
  const kamp = cleanVal(d["Kampnærhed"]), lv = (kamp.match(/^[1-5]/) || [""])[0];
  if (lv) grey.push(`<span class="dchip kamp" title="Kampnærhed: ${esc(kamp)}">Kampnærhed ${lv}/5</span>`);

  if (full) {
    splitVals(d, "Temaer").concat(splitVals(d, "Undertemaer"))
      .forEach(v => grey.push(chip("sub", v)));
  }
  return (red.length  ? `<div class="dchips">${red.join("")}</div>`  : "") +
         (grey.length ? `<div class="dchips">${grey.join("")}</div>` : "");
}

/* "+n" on a card: show the hidden tags (without opening the drill) */
function showMoreChips(btn) {
  btn.parentElement.querySelectorAll(".dchip[hidden]").forEach(el => { el.hidden = false; });
  btn.remove();
}

/* The drill's source (Kilde), e.g. "DBU" or "FCK", in the card's bottom right corner */
function sourceBadge(d) {
  const src = cleanVal(String(d["Kilde"] || "").split(/[;,]/)[0]).toUpperCase();
  return src ? '<span class="src-badge" title="Kilde: ' + esc(src) + '">' + esc(src) + '</span>' : "";

/* Card in the list: tap to open the full-screen drill */
function drillCard(d, i) {
  return `
    <div class="card">
      <div class="header" id="dheader-${i}" role="button" tabindex="0"
           aria-label="Åbn ${esc(d["Navn"])}"

/* ===================== Copy the link of a drill (for the session sheet) ===================== */
/* Copies the link both as plain text and as a named link (pasting into a Sheets cell can then
   give the drill's name as a link). Falls back to the browser's clipboard API if needed. */
function copyRich(url, name) {
  const html = '<a href="' + esc(url) + '">' + esc(name) + '</a>';
  let wrote = false;
  const onCopy = function (e) {
    e.clipboardData.setData("text/plain", url);
    e.clipboardData.setData("text/html", html);
    e.preventDefault();
    wrote = true;
  };
  document.addEventListener("copy", onCopy);
  const ta = document.createElement("textarea");
  ta.value = url;
  ta.setAttribute("readonly", "");
  ta.style.cssText = "position:fixed;left:-9999px;top:0;opacity:0";
  document.body.appendChild(ta);
  ta.select();
  ta.setSelectionRange(0, ta.value.length);            // iPhone needs this
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (err) { ok = false; }
  document.removeEventListener("copy", onCopy);
  ta.remove();
  if (ok && wrote) return Promise.resolve(true);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(url).then(() => true, () => false);
  }
  return Promise.resolve(ok);
}

let TOAST_TIMER = null;
function showToast(msg, url) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  if (url) {                                           // copying was blocked: show the link so it can be copied by hand
    const inp = document.createElement("input");
    inp.readOnly = true;
    inp.value = url;
    inp.setAttribute("aria-label", "Link til øvelsen");
    inp.addEventListener("focus", () => inp.select());
    t.appendChild(inp);
    setTimeout(() => inp.focus(), 0);
  }
  t.classList.remove("view-hidden");
  clearTimeout(TOAST_TIMER);
  TOAST_TIMER = setTimeout(() => t.classList.add("view-hidden"), url ? 12000 : 2500);
}

function hideToast() {
  clearTimeout(TOAST_TIMER);
  document.getElementById("toast").classList.add("view-hidden");
}

/* "Kopieret ✓" on the button for a moment, plus a message at the bottom */
function markCopied(btn, msg) {
  const lbl = btn.querySelector(".lbl");
  if (lbl) { lbl.textContent = "Kopieret ✓"; setTimeout(() => { lbl.textContent = "Kopiér link"; }, 1600); }
  showToast(msg);
}

function copyDrillLink(d, btn) {
  const url = safeUrl(isFckLink(exerciseLink(d)) ? appDrillLink(d) : exerciseLink(d));
  if (!url) { showToast("Øvelsen har intet ID at lave et link af."); return; }
  copyRich(url, d["Navn"]).then(function (ok) {
    if (!ok) { showToast("Kunne ikke kopiere automatisk. Markér og kopiér linket:", url); return; }
    markCopied(btn, "Link kopieret: " + d["Navn"]);
  });
}

/* Star on a card or in the viewer: save or remove a favourite */
document.addEventListener("click", function (e) {
  const b = e.target.closest(".favbtn");
  if (!b) return;
  const d = b.id === "v-fav" ? V.drill : LIB_LIST[+b.dataset.i];
  if (!d) return;
  const on = toggleFav(d);
  setFavButton(b, on, d["Navn"]);
  showToast(on ? "Gemt som favorit: " + d["Navn"] : "Fjernet fra favoritter: " + d["Navn"]);
  if (!LIB) return;
  if (FAV_ONLY) { renderLibrary(); return; }                          // the list of favourites changed
  const i = LIB_LIST.indexOf(d);                                     // keep the card and the viewer in step
  const card = i === -1 ? null : document.querySelector('#drill-grid .favbtn[data-i="' + i + '"]');
  if (card && card !== b) setFavButton(card, on, d["Navn"]);
  renderLibStatus(LIB_LIST.length, LIB_QUERY || FAV_ONLY || LIB_FILTERS.some(f => SEL[f.col].size));
});

/* ===================== Full-screen drill viewer (swipe between pages) ===================== */
const V = { n: 0, idx: 0, opener: null, drill: null, session: -1 };
const reduceMotion = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const INERT_IDS = ["nav-bar", "sessions", "library", "groups", "fixtures", "overview"];

/* Drill pages: related elements are grouped on one scrolling page, so there is little swiping.
   1. Øvelsen: diagram, practical facts and all the red tags (the first thing you need on the pitch)
   2. Sådan gør du: video, description, field
   3. Fokus og variation: focus points, variations, competition
   4. Mere: all tags, notes and the link. Columns not listed here (extra columns in the sheet) end up here too. */
const LIB_GROUPS = [
  { title: "Sådan gør du",         cols: ["Video", "Beskrivelse", "Materialer", "Felt"] },
  { title: "Fokus og variation",   cols: ["Læringsmål", "Fokuspunkter", "Variationer", "Konkurrence"] },
  { title: "Mere",                 cols: ["Noter", "Link"], takesRest: true, tags: true }
];

/* Practical facts as grey chips: age, players, duration, field size */
function factChips(d) {
  const bane = cleanVal(d["Banestørrelse"]);
  const facts = [].concat(
    rawVals(d, "Aldersgruppe"),
    [
      rangeText(d["Antal spillere min"], d["Antal spillere max"], "spillere"),
      rangeText(d["Varighed min"], d["Varighed max"], "min"),
      bane ? "Bane: " + bane : ""
    ].filter(Boolean));
  const chips = facts.map(t => `<span class="dchip">${esc(t)}</span>`);
  const kamp = cleanVal(d["Kampnærhed"]), lv = (kamp.match(/^[1-5]/) || [""])[0];
  if (lv) chips.push(`<span class="dchip kamp" title="Kampnærhed: ${esc(kamp)}">Kampnærhed ${lv}/5</span>`);
  return chips.length ? `<div class="dchips">${chips.join("")}</div>` : "";
}

/* First page: diagram on top, then the facts, then the main focus tags */
/* Shown instead of the diagram when a drill has no picture (or its picture can't be loaded).
   A faded, generic pitch – clearly labelled, so nobody takes it for the drill itself. */
const PITCH_SVG = '<svg viewBox="0 0 300 200" preserveAspectRatio="xMidYMid meet" aria-hidden="true" fill="none" stroke="#d2d2d2" stroke-width="2">' +
  '<rect x="10" y="10" width="280" height="180" rx="2"/><line x1="150" y1="10" x2="150" y2="190"/><circle cx="150" cy="100" r="26"/>' +
  '<rect x="10" y="55" width="40" height="90"/><rect x="250" y="55" width="40" height="90"/>' +
  '<rect x="10" y="80" width="14" height="40"/><rect x="276" y="80" width="14" height="40"/></svg>';

function diagramPlaceholder(d) {
  const hasVideo = !!(d && cleanVal(d["Video"]));
  return `<div class="ph-diagram" role="img" aria-label="Pladsholder: der er intet billede af denne øvelse">${PITCH_SVG}` +
    `<div class="ph-label"><strong>Pladsholder</strong>Der er intet billede af denne øvelse. Tegningen viser ikke øvelsen.` +
    (hasVideo ? "<br>Se videoen under »Sådan gør du«." : "") + `</div></div>`;
}

/* Shown where the video would be, when a drill has no video. Same look as the picture placeholder. */
const PLAY_SVG = '<svg viewBox="0 0 48 48" aria-hidden="true">' +
  '<circle cx="24" cy="24" r="21" fill="none" stroke="#c9c9c9" stroke-width="3"/><path d="M19 14 L35 24 L19 34 Z" fill="#c9c9c9"/></svg>';

function videoPlaceholder(d) {
  const hasPicture = !!(d && cleanVal(d["Diagram"]));
  return `<div class="ph-diagram ph-video" role="img" aria-label="Pladsholder: der er ingen video af denne øvelse">${PLAY_SVG}` +
    `<div class="ph-label"><strong>Pladsholder</strong>Der er ingen video af denne øvelse.` +
    (hasPicture ? "<br>Se tegningen under »Øvelsen«." : "") + `</div></div>`;
}

/* An image that can't be loaded is swapped for the placeholder */
function brokenDiagram(img) {
  const slide = img.closest(".g-slide");       // one picture of several: only that one goes
  if (slide && slide.parentNode.querySelectorAll(".g-slide").length > 1) {
    const g = slide.parentNode;
    slide.remove();
    galleryStep(g, 0);
    return;
  }
  const box = img.closest(".v-diagram");
  if (box) box.innerHTML = diagramPlaceholder(V.drill);
}

function firstPage(d) {
  const diagramDef = libSections().find(x => x.col === "Diagram");
  const diagram = diagramDef ? libBody(diagramDef, d) : "";

  // all red tags: category and every focus tag
  const red = splitVals(d, "Format").map(v => `<span class="dchip cat">${esc(v)}</span>`)
    .concat(focusTags(d).map(v => `<span class="dchip focus">${esc(v)}</span>`));

  return `<div class="v-diagram">${diagram || diagramPlaceholder(d)}</div>` +
         factChips(d) +
         (red.length ? `<div class="dchips">${red.join("")}</div>` : "");
}

/* Last page: every tag of the drill, grouped */
function tagsSection(d) {
  const row = (label, cls, vals) => vals.length
    ? `<div class="tag-row"><div class="tag-label">${esc(label)}</div><div class="dchips">${vals.map(v => `<span class="dchip ${cls}">${esc(v)}</span>`).join("")}</div></div>`
    : "";
  const html = row("Tema", "sub", splitVals(d, "Temaer")) +
               row("Undertema", "sub", splitVals(d, "Undertemaer")) +
               row("Fokus", "focus", focusTags(d)) +
               row("Format", "cat", splitVals(d, "Format")) +
               row("Kampnærhed", "sub", rawVals(d, "Kampnærhed")) +
               row("Kilde", "sub", splitVals(d, "Kilde"));
  return html ? `<section class="v-sec"><h3>Tags</h3>${html}</section>` : "";
}

function drillPages(d) {
  const grouped = new Set([].concat.apply([], LIB_GROUPS.map(g => g.cols)).concat(["Diagram"]));
  const pages = [];

  const first = firstPage(d);
  if (first) pages.push({ title: "Øvelsen", html: first });

  LIB_GROUPS.forEach(function (g) {
    let defs = g.cols.map(col => libSections().find(x => x.col === col)).filter(Boolean);
    if (g.takesRest) defs = defs.concat(libSections().filter(x => !grouped.has(x.col)));

    let html = (g.tags ? tagsSection(d) : "") + defs.map(function (def) {
      const body = libBody(def, d) || (def.col === "Video" ? videoPlaceholder(d) : "");
      return body ? `<section class="v-sec"><h3>${esc(def.title)}</h3>${body}</section>` : "";
    }).join("");

    if (html) pages.push({ title: g.title, html: html });
  });
  return pages;
}

function openDrill(i) {
  const d = LIB_LIST[i];
  if (!d) return;
  openViewer(d["Navn"], drillPages(d), document.getElementById("dheader-" + i), null, d);
}

/* ---- training sessions in the same viewer ---- */
/* The exercise ID in a link: from both the old and the new DBU address, and from a Træningsparat link (?d=ID) */
function exerciseIdFromUrl(u) {
  const m = String(u || "").match(/[?&](?:exerciseId|id)=(\d+)/i);
  if (m) return m[1];
  const p = String(u || "").match(/[?&]d=([^&#]+)/);
  try { return p ? decodeURIComponent(p[1]) : ""; } catch (e) { return ""; }
}

/* The drill behind a station: first by the ID in its link, then by its name */
function findDrillFor(item) {
  if (!LIB || !item) return null;
  const id = exerciseIdFromUrl(item.url);
  if (id) {
    const d = LIB.drills.find(x => cleanVal(x["ID"]) === id);
    if (d) return d;
  }
  const key = tagKey(item.text || "");
  return key ? (LIB.drills.find(x => tagKey(x["Navn"]) === key) || null) : null;
}

/* Fetches one drill that a session station uses. No login needed: the server only hands out drills
   that are used in the session plan, never the whole library. */
const SESSION_DRILLS = {};      // id -> drill
const SESSION_PENDING = {};    // id -> callbacks waiting for the answer
function loadSessionDrills(ids, cb) {
  ids = ids.filter((id, i) => id && ids.indexOf(id) === i && !SESSION_DRILLS[id] && !SESSION_PENDING[id]);
  if (!ids.length) return;
  ids.forEach(id => { SESSION_PENDING[id] = []; });
  const finish = function (res) {
    ids.forEach(function (id) {
      const cbs = SESSION_PENDING[id] || [];
      delete SESSION_PENDING[id];
      const d = res && res.drills.find(x => cleanVal(x["ID"]) === id);
      if (d) SESSION_DRILLS[id] = applyLang(d);
      cbs.forEach(f => f(d || null));
    });
  };
  api("getSessionDrills", [ids]).then(function (res) {
      if (!res || !Array.isArray(res.drills)) res = null;  // nothing found (or an answer without drills)
      if (res && !LIB) {                                  // the same tidy-up of tags as in the library
        setAliases(res.aliases);
        res.drills.forEach(d => { SESSION_DRILLS[cleanVal(d["ID"])] = applyLang(d); });
        buildCanon(Object.values(SESSION_DRILLS));
        MINI = { sections: sectionsFor(res.headers) };
      }
      finish(res);
    }, function () { finish(null); });
}

/* Opens one drill; if it is already fetched it is instant, otherwise it waits for the fetch */
function fetchSessionDrill(drillId, cb) {
  if (SESSION_DRILLS[drillId]) { cb(SESSION_DRILLS[drillId]); return; }
  showToast("Åbner øvelsen…");
  const done = function (d) { hideToast(); cb(d); };
  if (SESSION_PENDING[drillId]) SESSION_PENDING[drillId].push(done);
  else { loadSessionDrills([drillId]); SESSION_PENDING[drillId].push(done); }
}

/* Fetch a session's drills in the background (one call), so the tap is instant */
function prefetchSession(s) {
  if (LIB || !s) return;
  loadSessionDrills(SESSION_ITEMS.map(it => s[it[1]] && s[it[1]].drillId).filter(Boolean));
}

/* Tap on a station: open the swipeable drill; "Tilbage" returns to the session */
function openSessionItem(index, key) {
  const item = SESSIONS[index] && SESSIONS[index][key];
  if (!item) return;
  const open = function (d) {
    if (d) openViewer(d["Navn"], drillPages(d), V.opener, function () { openSession(index); }, d);
    else if (safeUrl(item.url)) window.open(safeUrl(item.url), "_blank", "noopener");
  };
  const fromLibrary = LIB ? findDrillFor(item) : null;       // logged in: the library is already loaded
  if (fromLibrary) open(fromLibrary);
  else if (item.drillId) fetchSessionDrill(item.drillId, open);
  else open(null);
}

/* The parts of a training, in order: label shown in the app + key (the same keys as STATION_KEYS in Code.gs) */
const SESSION_ITEMS = [
  ["Fælles opstart", "startup"], ["Station 1", "station1"], ["Station 2", "station2"],
  ["Station 3", "station3"], ["Station 4", "station4"], ["Fælles afslutning", "finish"]
];

function sessionPages(s, index) {
  const items = SESSION_ITEMS
    .map(it => ({ label: it[0], key: it[1], v: s[it[1]] }))
    .filter(it => it.v && (it.v.text || safeUrl(it.v.url)));

  // A station that belongs to a drill in the library opens that drill (swipeable).
  // Other links open in a new tab, and a row without a link is plain text.
  const rows = items.map(function (it) {
    const url = safeUrl(it.v.url);
    const isDrill = !!it.v.drillId || !!findDrillFor(it.v);
    const coachTxt = (it.v.coaches && it.v.coaches.length) ? ` <span class="v-coach">(${it.v.coaches.map(esc).join(", ")})</span>` : "";
    const text = `<span class="v-plan-text"><small class="v-lab">${esc(it.label)}${coachTxt}</small>${it.v.text ? `<strong class="v-name">${esc(it.v.text)}</strong>` : ""}</span>`;
    if (isDrill) {
      return `<button type="button" class="v-planrow" onclick="openSessionItem(${index}, '${it.key}')">${text}<span class="chevron go" aria-hidden="true"></span></button>`;
    }
    return url
      ? `<a class="v-planrow" href="${esc(url)}" target="_blank" rel="noopener">${text}<span class="v-go" aria-hidden="true">↗</span></a>`
      : `<div class="v-planrow plain">${text}</div>`;
  }).join("");

  let html = sessionChips(s);
  if (s.notes && s.notes.length) {      // notes first, directly under the session name
    html += `<section class="v-sec v-notes"><h3>Noter</h3>` +
      s.notes.map(p => libLink(p.url, p.text) || `<span>${escLines(p.text)}</span>`).join(" ") + `</section>`;
  }
  html += items.length ? `<div class="v-plan">${rows}</div>` : "<p>Intet planlagt.</p>";
  if (sessionKey(s)) html += `<button type="button" class="v-findbtn" onclick="openGroups(${index})">Grupper/kampe til denne træning</button>`;
  if (canPlan() && s.id) html += `<div class="plan-edit"><button type="button" class="v-findbtn" onclick="openPlanner(${index})">Ret træningen</button>` +
    `<button type="button" class="v-findbtn" onclick="openPlanner(${index}, true)">Kopiér til ny træning</button></div>`;
  return [{ title: s.focus || danishDate(s.iso, s.date), html: html }];
}

function openSession(index) {
  const s = SESSIONS[index];
  if (!s) return;
  prefetchSession(s);
  prefetchGroups();                // so "Grupper" opens at once
  openViewer(danishDate(s.iso, s.date), sessionPages(s, index), document.getElementById("sheader-" + index));
  V.session = index;
  const short = shortDate(s.iso);
  if (short) {                    // the long date becomes a small rounded badge; the full date stays for screen readers
    document.getElementById("v-title").innerHTML =
      `<span class="v-datebadge" aria-hidden="true">${esc(short)}</span><span class="v-sr">${esc(danishDate(s.iso, s.date))}</span>`;
  }
  document.getElementById("v-share").classList.toggle("view-hidden", !s.iso);   // a link needs a date
}

/* ===================== The planner (with the database): coaches write their team's plan in the app =====================
   "+ Ny træning" above the list, and "Ret træningen" / "Kopiér til ny træning" in an open training. Each part
   (opstart, stations, afslutning) is a drill from the library (search by typing its name) or any text, with an
   optional link and the coaches. Saved straight in the database (save_training); needs a connection. */
function canPlan() {
  if (!useSupabase() || !isAuthed() || !supaTeam() || (PLAN_TEAM && PLAN_TEAM !== supaTeam())) return false;
  const t = ((supaSession() || {}).teams || []).find(x => x.id === supaTeam());
  return !!t && (t.role === "admin" || t.role === "coach");
}
let PLANNER = null;                                  // { index, base, copy, drills: [{ id, name }] }
const plannerDrills = () => (LIB ? Promise.resolve(LIB.drills) : libCall("getDrills", [AUTH.token, ""]).then(r => r.drills || []))
  .then(list => list.map(d => ({ id: cleanVal(d["ID"]), name: cleanVal(d["Navn"]) })).filter(d => d.id && d.name));

function openPlanner(index, copy) {
  const base = index >= 0 ? SESSIONS[index] : null;
  PLANNER = { index: index, base: base, copy: !!copy, drills: [] };
  const v = base || {};
  const notes = (v.notes || []).map(p => [p.text, p.url].filter(Boolean).join(" ")).join("\n");
  const field = (name, label, value, attrs) =>
    `<label>${label}<input name="${name}" value="${esc(value || "")}" ${attrs || ""}></label>`;
  const parts = SESSION_ITEMS.map(function (it) {
    const p = v[it[1]] || {};
    return `<fieldset><legend>${esc(it[0])}</legend>
      <input name="${it[1]}.text" list="planner-drills" value="${esc(p.text || "")}" placeholder="Søg øvelse eller skriv tekst" aria-label="${esc(it[0])}: øvelse eller tekst" autocomplete="off">
      <input name="${it[1]}.url" type="url" value="${esc(p.url || "")}" placeholder="Link (valgfrit)" aria-label="${esc(it[0])}: link">
      <input name="${it[1]}.coaches" value="${esc((p.coaches || []).join(", "))}" placeholder="Trænere, adskilt med komma" aria-label="${esc(it[0])}: trænere"></fieldset>`;
  }).join("");
  const html = `<form id="planner" class="planner" onsubmit="event.preventDefault(); plannerSave();" novalidate>
    ${field("iso", "Dato", copy ? "" : v.iso, 'type="date"')}
    ${field("focus", "Overskrift (fokus)", v.focus, 'placeholder="Fx Afslutte, drible eller aflevere?"')}
    ${field("theme", "Tema", v.theme, 'placeholder="Flere adskilles med ;"')}
    ${field("subtheme", "Undertema", v.subtheme)}
    <label>Noter<textarea name="notes" rows="3" placeholder="Et link på en linje bliver til et link">${esc(notes)}</textarea></label>
    ${parts}
    <datalist id="planner-drills"></datalist>
    <p class="planner-msg" role="status"></p>
    <div class="planner-actions">
      <button type="submit" class="login-go">Gem træningen</button>
      ${base && !copy ? '<button type="button" class="clearbtn planner-del" onclick="plannerDelete()">Slet</button>' : ""}
      <button type="button" class="clearbtn" onclick="closeDrill()">Annuller</button>
    </div></form>`;
  openViewer(base && !copy ? "Ret træning" : "Ny træning", [{ title: base && !copy ? "Ret træning" : copy ? "Kopi af træning" : "Ny træning", html: html }],
             document.activeElement);
  const want = PLANNER;
  plannerDrills().then(function (drills) {
    if (PLANNER !== want) return;
    PLANNER.drills = drills;
    const dl = document.getElementById("planner-drills");
    if (dl) dl.innerHTML = drills.map(d => `<option value="${esc(d.name)}"></option>`).join("");
  }, function () { plannerMsg("Kunne ikke hente øvelserne. Du kan stadig skrive tekst."); });
}
function plannerMsg(text, bad) {
  const el = document.querySelector("#planner .planner-msg");
  if (el) { el.textContent = text; el.classList.toggle("bad", bad !== false); }
}
/* The form as a training for the database */
function plannerTraining() {
  const f = document.getElementById("planner"), get = n => (f.elements[n] ? f.elements[n].value : "").trim();
  const base = PLANNER.copy ? null : PLANNER.base;
  const byName = {};
  PLANNER.drills.forEach(d => { byName[d.name.toLowerCase()] = d.id; });
  const t = { id: base ? base.id : "", iso: get("iso"), theme: get("theme"), subtheme: get("subtheme"), focus: get("focus"),
              date: base && base.iso === get("iso") && base.date !== base.iso ? base.date || "" : "" };
  t.notes = get("notes").split("\n").map(l => l.trim()).filter(Boolean).map(function (line) {
    const m = line.match(/https?:\/\/\S+/);
    return { text: m ? line.replace(m[0], "").trim() || m[0] : line, url: m ? m[0] : "" };
  });
  SESSION_ITEMS.forEach(function (it) {
    const k = it[1], text = get(k + ".text"), old = (PLANNER.base || {})[k] || {};
    t[k] = { text: text, url: get(k + ".url"),
             drillId: byName[text.toLowerCase()] || (text && text === old.text ? old.drillId || "" : ""),
             coaches: get(k + ".coaches").split(/[,;]/).map(c => c.trim()).filter(Boolean) };
  });
  return t;
}
function plannerSave() {
  if (!PLANNER) return;
  const t = plannerTraining();
  if (!t.iso && !t.focus) { plannerMsg("Skriv mindst en dato eller en overskrift."); return; }
  if (!navigator.onLine) { plannerMsg("Planen kan kun gemmes med forbindelse. Prøv igen, når der er net."); return; }
  const btn = document.querySelector("#planner .login-go");
  btn.disabled = true; plannerMsg("Gemmer …", false);
  libCall("saveTraining", [AUTH.token, t]).then(function () {
    PLANNER = null;
    closeDrill();
    showToast("Træningen er gemt.");
    fetchPlan().catch(function () { /* shown in the bar under the list */ });
  }, function (err) {
    btn.disabled = false;
    plannerMsg("Kunne ikke gemme: " + (/LOGIN/.test(String(err && err.message)) ? "log ind igen." : failText(err)));
  });
}
function plannerDelete() {
  if (!PLANNER || !PLANNER.base || !PLANNER.base.id) return;
  if (!confirm("Slet træningen " + danishDate(PLANNER.base.iso, PLANNER.base.date) + "? Det kan ikke fortrydes.")) return;
  libCall("deleteTraining", [AUTH.token, PLANNER.base.id]).then(function () {
    PLANNER = null;
    closeDrill();
    showToast("Træningen er slettet.");
    fetchPlan().catch(function () { /* shown in the bar under the list */ });
  }, function (err) { plannerMsg("Kunne ikke slette: " + failText(err)); });
}

/* ---- The grouping itself (no screen code here) ----
   Players: { name, lo, hi } – the level band (a player without a level has lo = -Infinity, hi = Infinity).
   Two players may share a group only if their bands overlap. If every pair in a group overlaps, all the
   bands in it share a level, so a group simply "has" a level: from the highest Fra to the lowest Til.
   The groups are found by trying many small changes (move one player, or swap two) and keeping the
   better ones, scored on: no band breaks (by far the most important), even sizes, few pairs who played
   together lately, and about as many players changing group since last time as the slider asks for.
   Who moves: those who have stayed in the same group the most trainings in a row, so everyone takes a turn. */
const GROUP_WEIGHTS = { band: 1e6, size: 6000, pair: 4, change: 4000, stay: 36, mix: 2000, even: 1e5 };   // band: far above everything else, so the level rule always wins
/* change: one move more or less than the slider asks for – high, so the slider is kept; the next two only decide WHO moves.
   stay: staying put after a run of r trainings costs stay × (1 − 0.75^r): more for every training.
   mix: how far a player's skill mix is from 25 % more / 50 % equally / 25 % less experienced teammates (an ambition, see skillMix).
   even: "Lige hold" – how far each group's average level is from the average of everyone (only with opts.strength). */
const GROUP_HISTORY = 12;          // saved trainings looked back at
const GROUP_FADE = 0.75;           // a pairing counts less for every training since

function seededRandom(seed) {      // the same seed gives the same groups, so "Lav grupper" is repeatable
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hashText(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619);
  return h >>> 0;
}

const bandsMeet = (a, b) => a.lo <= b.hi && b.lo <= a.hi;
const pairKey = (a, b) => a < b ? a + "\n" + b : b + "\n" + a;

/* The level a group shares ({ lo, hi }); lo > hi means some bands in it don't meet */
function groupLevel(players) {
  let lo = -Infinity, hi = Infinity;
  players.forEach(p => { lo = Math.max(lo, p.lo); hi = Math.min(hi, p.hi); });
  return { lo: lo, hi: hi };
}

/* The skill mix each player has had: { name: [better, same, weaker, trainings] }. Per training, a player's
   teammates count as shares (e.g. 1 better and 2 the same of 3 = 0.33 and 0.67), so a big group doesn't weigh
   more. skill: { name: number } – a lower number is more skilled (Fra, with 1 as the best level). */
const MIX_GOAL = [0.25, 0.5, 0.25];   // the ambition over time: 25 % better, 50 % the same, 25 % weaker

/* 25-50-25: players are only together (a group or a match) if their bands overlap – the less experienced one's Til is
   higher than the other's Fra; bands that only touch (3–5 and 1–3) don't. A band with one number, "3", fits any band
   that holds 3. No band: fits all. (Little overlap is already rare: it counts mostly as up or down, and overlap draws
   players together.) bandShort: 0 when they fit, else how far apart the bands are (touching: just over 0). */
const bandOverlap = (a, b) => Math.min(a.hi, b.hi) - Math.max(a.lo, b.lo);
function bandShort(a, b) {
  if (![a.lo, a.hi, b.lo, b.hi].every(Number.isFinite)) return 0;
  const have = bandOverlap(a, b);
  if (have > 1e-9) return 0;
  if ((a.hi - a.lo < 1e-9 || b.hi - b.lo < 1e-9) && have >= -1e-9) return 0;   // one number inside the other band
  return Math.max(-have, 0) + 1e-3;
}
const bandsFit = (a, b) => bandShort(a, b) === 0;

/* Each player's own aim: 25/50/25 when there are players both more and less experienced, but the most experienced
   can't play with more experienced players (nor the least experienced with less experienced), so the share they
   can't get goes to "samme niveau", with the closest players: the most experienced 0/75/25, the least experienced
   25/75/0. Gradually: how much "more experienced" is possible is how much the most experienced other player counts
   as more experienced (levelWeights: a whole level above or more: fully; 0,75 above: half). me: the player's Niveau,
   others: the other players' Niveau (those present, or the whole squad). Returns [more, same, less], adding up to 1. */
function playerAim(me, others) {
  if (!hasLevel(me)) return MIX_GOAL.slice();
  let up = 0, down = 0;
  others.forEach(o => { if (hasLevel(o)) { const w = levelWeights(me, o); up = Math.max(up, w[0]); down = Math.max(down, w[2]); } });
  return [MIX_GOAL[0] * up, 1 - MIX_GOAL[0] * up - MIX_GOAL[2] * down, MIX_GOAL[2] * down];
}
/* The aims of a list of levels, each against the others */
const aimsFor = (levels, fits) => levels.map((v, i) => playerAim(v, levels.filter((o, j) => j !== i && (!fits || fits(i, j)))));
/* Another player's level (or the others' average in a match) seen from a player, for the 25/50/25 mix:
   [more experienced, the same level, less experienced], adding up to 1. A soft transition around half a level:
   up to half a level apart counts fully as the same level, a whole level or more fully as more/less experienced, and in between
   gradually (0,75 apart: half and half). The levels are averages of several coaches' assessments, so a few
   hundredths either way hardly change anything: 0,74 and 0,76 apart count almost the same. */
const SAME_FULL = 0.5, SAME_NONE = 1.0;   // (was 0,25 / 0,75: then groups close to a sort by level already met the
                                          // aim; with these the groups mix more – see the simulation in the tests)
/* A level is a number (Niveau) or a player's band { lo: Fra, hi: Til }. With two bands, "samme niveau" is the share of
   the player's band that the other's band covers (B covers 80 % of A's band: 80 % the same level for A), and the
   rest counts as more experienced if B is the more experienced by Fra (Til a little), else less experienced
   (bandWeights). So the more two bands overlap, the more they count as the same level, and the more often 25-50-25
   puts them together for the "samme niveau" half; less overlap fills the quarters up and down. */
const LEVEL_TIL = 0.02;                                     // Fra + 0,02 × Til (the coaches' rules: Fra first, Til a little)
const isBand = v => v != null && typeof v === "object" && Number.isFinite(v.lo) && Number.isFinite(v.hi);
const hasLevel = v => isBand(v) || (typeof v === "number" && isFinite(v));
const levelNum = v => isBand(v) ? v.lo + LEVEL_TIL * v.hi : v;
function bandWeights(a, b) {
  const width = a.hi - a.lo, have = Math.min(a.hi, b.hi) - Math.max(a.lo, b.lo);
  const same = width > 1e-9 ? Math.max(0, Math.min(1, have / width)) : (a.lo >= b.lo - 1e-9 && a.lo <= b.hi + 1e-9 ? 1 : 0);
  const d = levelNum(b) - levelNum(a);
  if (Math.abs(d) < 1e-9) return [0, 1, 0];
  return d < 0 ? [1 - same, same, 0] : [0, same, 1 - same];
}
function levelWeights(me, other) {
  if (isBand(me) && isBand(other)) return bandWeights(me, other);
  me = levelNum(me); other = levelNum(other);
  const d = other - me, a = Math.abs(d);
  const same = a <= SAME_FULL + 1e-9 ? 1 : a >= SAME_NONE - 1e-9 ? 0 : 1 - (a - SAME_FULL) / (SAME_NONE - SAME_FULL);
  return d < 0 ? [1 - same, same, 0] : [0, same, 1 - same];
}

function skillMix(earlier, skill) {
  const mix = {};
  earlier.slice(0, GROUP_HISTORY).forEach(groups => groups.forEach(function (g) {
    g.forEach(function (name) {
      const me = skill[name];
      if (!hasLevel(me)) return;
      const others = g.filter(o => o !== name && hasLevel(skill[o]));
      if (!others.length) return;
      const m = mix[name] = mix[name] || [0, 0, 0, 0];
      others.forEach(o => { const w = levelWeights(me, skill[o]); for (let r = 0; r < 3; r++) m[r] += w[r] / others.length; });
      m[3]++;
    });
  }));
  return mix;
}

/* How often each pair played together lately: { pairKey: weight }, newest training weighs 1 */
function pairHistory(earlier) {
  const w = {};
  earlier.slice(0, GROUP_HISTORY).forEach(function (groups, age) {
    const f = Math.pow(GROUP_FADE, age);
    groups.forEach(g => g.forEach((a, i) => g.slice(i + 1).forEach(b => {
      const k = pairKey(a, b); w[k] = (w[k] || 0) + f;
    })));
  });
  return w;
}

/* How many trainings in a row each player has been in the same group as last time ({ name: count }).
   A training a player missed is skipped; a different group ends the run. */
function stayRuns(earlier) {
  const runs = {};
  if (!earlier.length) return runs;
  const groupIn = groups => { const of = {}; groups.forEach((g, gi) => g.forEach(n => { of[n] = gi; })); return of; };
  const last = groupIn(earlier[0]);
