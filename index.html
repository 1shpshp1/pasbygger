  const maps = earlier.slice(0, GROUP_HISTORY).map(groupIn);
  Object.keys(last).forEach(function (name) {
    let n = 0;
    for (const of of maps) {
      if (of[name] == null) continue;
      if (of[name] !== last[name]) break;
      n++;
    }
    runs[name] = n;
  });
  return runs;
}

/* opts: { players, k, prev: [[names]] or null, history: pairHistory(...), stay: stayRuns(...), change: 0..1, seed,
           skill: { name: number } and mix: skillMix(...) – both left out for no skill-mix ambition (Kaos),
           strength: { name: number } – for "Lige hold": groups with as equal an average level as possible }
   Returns { groups: [[player]], moved, target, conflicts } */
function makeGroups(opts) {
  const P = opts.players, n = P.length, k = Math.max(1, Math.min(opts.k, n || 1));
  const rand = seededRandom(opts.seed || 1);
  const W = GROUP_WEIGHTS;

  // Pair scores, worked out once: band break and recent pairings
  const pair = [];
  for (let i = 0; i < n; i++) {
    pair.push(new Float64Array(n));
    for (let j = 0; j < n; j++) if (i !== j)
      pair[i][j] = (bandsMeet(P[i], P[j]) ? 0 : W.band) + W.pair * (opts.history[pairKey(P[i].name, P[j].name)] || 0);
  }

  // Last time's group of each player (only groups that still exist with this number of groups)
  const prevOf = new Int32Array(n).fill(-1);
  if (opts.prev) opts.prev.forEach((g, gi) => g.forEach(name => {
    const i = P.findIndex(p => p.name === name);
    if (i !== -1 && gi < k) prevOf[i] = gi;
  }));
  const placedBefore = prevOf.filter(x => x >= 0).length;
  const useChange = placedBefore > 0 && opts.change < 1;
  const target = Math.round((opts.change || 0) * placedBefore);
  // The skill-mix ambition: how far each player's mix (earlier trainings + this one) is from their aim (25/50/25,
  // or less of what the most and least experienced can't get: playerAim)
  const useMix = !!opts.skill;
  const skill = P.map(p => useMix && hasLevel((opts.skill || {})[p.name]) ? opts.skill[p.name] : NaN);
  const had = P.map(p => (opts.mix || {})[p.name] || [0, 0, 0, 0]);
  const aim = aimsFor(skill);                                  // each player's own aim (playerAim), against those present
  const cnt = [new Float64Array(n), new Float64Array(n), new Float64Array(n)];   // more, equally, less experienced now
  // "Lige hold": each player's level (a player without one counts as the average of everyone)
  const useEven = !!opts.strength;
  const known = useEven ? P.map(p => opts.strength[p.name]).filter(v => typeof v === "number" && isFinite(v)) : [];
  const meanLevel = known.length ? known.reduce((x, y) => x + y, 0) / known.length : 0;
  const level = P.map(p => { const v = useEven ? opts.strength[p.name] : NaN; return typeof v === "number" && isFinite(v) ? v : meanLevel; });
  const sum = new Float64Array(k);
  const stay = new Float64Array(n);            // the cost of staying put, for the players who have stayed longest
  if (useChange && target > 0) P.forEach((p, i) => { stay[i] = W.stay * (1 - Math.pow(0.75, (opts.stay || {})[p.name] || 0)); });

  // Two kinds of start: last time's groups (with everyone else by level into the group that fits them best),
  // and a random mix that keeps the level rule (the narrowest bands placed first, in random order)
  const mid = p => isFinite(p.lo + p.hi) ? (p.lo + p.hi) / 2 : isFinite(p.lo) ? p.lo : isFinite(p.hi) ? p.hi : 1e9;
  let a, size;
  function startFromLast() {
    for (let i = 0; i < n; i++) if (prevOf[i] >= 0) { a[i] = prevOf[i]; size[a[i]]++; }
    const rest = [...Array(n).keys()].filter(i => a[i] < 0).sort((x, y) => mid(P[x]) - mid(P[y]));
    rest.forEach(function (i) {
      let best = 0, bestCost = Infinity;
      for (let g = 0; g < k; g++) {
        let c = size[g] * W.size;
        for (let j = 0; j < n; j++) if (a[j] === g) c += pair[i][j];
        if (c < bestCost) { bestCost = c; best = g; }
      }
      a[i] = best; size[best]++;
    });
  }
  function startRandom() {
    const width = p => isFinite(p.hi - p.lo) ? p.hi - p.lo : 1e9;
    const key = P.map(p => width(p) + rand() * 2);
    const cap = Math.ceil(n / k);
    const lev = Array.from({ length: k }, () => ({ lo: -Infinity, hi: Infinity }));
    [...Array(n).keys()].sort((x, y) => key[x] - key[y]).forEach(function (i) {
      let best = 0, bestScore = Infinity;
      for (let g = 0; g < k; g++) {
        const fits = Math.max(lev[g].lo, P[i].lo) <= Math.min(lev[g].hi, P[i].hi);
        const score = (fits ? 0 : 1000) + (size[g] >= cap ? 100 : 0) + size[g] + rand();
        if (score < bestScore) { bestScore = score; best = g; }
      }
      a[i] = best; size[best]++;
      lev[best] = { lo: Math.max(lev[best].lo, P[i].lo), hi: Math.min(lev[best].hi, P[i].hi) };
    });
  }

  const even = n / k;
  function cost() {
    let c = 0, moved = 0;
    for (let i = 0; i < n; i++) {
      for (let j = i + 1; j < n; j++) if (a[i] === a[j]) {
        c += pair[i][j];
        if (useMix && skill[i] === skill[i] && skill[j] === skill[j]) {   // (x === x: not NaN)
          const w = levelWeights(skill[i], skill[j]);            // j seen from i; i seen from j is the mirror
          for (let r = 0; r < 3; r++) { cnt[r][i] += w[r]; cnt[2 - r][j] += w[r]; }
        }
      }
      if (prevOf[i] >= 0) { if (a[i] !== prevOf[i]) moved++; else c += stay[i]; }
    }
    for (let g = 0; g < k; g++) c += W.size * (size[g] - even) * (size[g] - even);
    if (useEven) {
      sum.fill(0);
      for (let i = 0; i < n; i++) sum[a[i]] += level[i];
      for (let g = 0; g < k; g++) if (size[g]) { const d = sum[g] / size[g] - meanLevel; c += W.even * size[g] * d * d; }
    }
    if (useChange) c += W.change * (moved - target) * (moved - target);
    if (useMix) for (let i = 0; i < n; i++) {
      const tot = cnt[0][i] + cnt[1][i] + cnt[2][i];
      if (tot) {
        const h = had[i], t = h[3] + 1;
        for (let r = 0; r < 3; r++) { const d = (h[r] + cnt[r][i] / tot) / t - aim[i][r]; c += W.mix * d * d; }
      }
      cnt[0][i] = cnt[1][i] = cnt[2][i] = 0;
    }
    return c;
  }

  // Many small changes; a worse one is sometimes kept early on, so the search doesn't get stuck.
  // keepEven: a player may only move to a group with fewer players, so the sizes can't drift apart.
  function search(keepEven) {
    let now = cost(), best = now, bestA = a.slice();
    const steps = n < 2 || k < 2 ? 0 : 4000 + 800 * n;
    let temp = 3000;                           // in the same units as the weights above
    const cool = Math.pow(0.05 / temp, 1 / Math.max(1, steps));
    for (let s = 0; s < steps; s++, temp *= cool) {
      const i = Math.floor(rand() * n);
      const from = a[i];
      let j = -1, to;
      if (rand() < 0.5) {                        // swap with a player in another group
        j = Math.floor(rand() * n);
        if (a[j] === from) continue;
        to = a[j]; a[i] = to; a[j] = from;
      } else {                                   // move to another group
        to = Math.floor(rand() * (k - 1)); if (to >= from) to++;
        if (keepEven && size[to] >= size[from]) continue;
        a[i] = to; size[from]--; size[to]++;
      }
      const next = cost();
      if (next <= now || rand() < Math.exp((now - next) / temp)) {
        now = next;
        if (now < best) { best = now; bestA = a.slice(); }
      } else if (j >= 0) { a[j] = to; a[i] = from; }
      else { a[i] = from; size[from]++; size[to]--; }
    }
    return { cost: best, a: bestA };
  }

  // Search from both starts, freely and with even sizes kept, and choose in this order: fewest level-rule
  // breaks, then even sizes, then the best score (slider, new pairs, skill mix). Last time's groups usually
  // win; when they can't become groups that keep the rules, one of the others finds a way.
  function judge(r) {
    const sz = new Int32Array(k); let breaks = 0;
    for (let i = 0; i < n; i++) {
      sz[r.a[i]]++;
      for (let j = i + 1; j < n; j++) if (r.a[i] === r.a[j] && pair[i][j] >= W.band) breaks++;
    }
    r.breaks = breaks; r.spread = Math.max(0, Math.max.apply(null, sz) - Math.min.apply(null, sz) - 1);
    return r;
  }
  const better = (x, y) => x.breaks !== y.breaks ? x.breaks < y.breaks : x.spread !== y.spread ? x.spread < y.spread : x.cost < y.cost;
  const starts = placedBefore ? [startFromLast, startRandom] : [startRandom, startRandom];
  let found = null;
  [false, true].forEach(keepEven => starts.forEach(function (start) {
    a = new Int32Array(n).fill(-1); size = new Int32Array(k);
    start();
    const r = judge(search(keepEven));
    if (!found || better(r, found)) found = r;
  }));
  const bestA = found.a;

  const groups = Array.from({ length: k }, () => []);
  P.forEach((p, i) => groups[bestA[i]].push(p));
  groups.forEach(g => g.sort((x, y) => x.name.localeCompare(y.name, "da")));   // by name, so a group doesn't look sorted by level
  let moved = 0;
  for (let i = 0; i < n; i++) if (prevOf[i] >= 0 && bestA[i] !== prevOf[i]) moved++;
  return { groups: groups, moved: moved, target: useChange ? target : null, conflicts: groups.filter(g => groupLevel(g).lo > groupLevel(g).hi).length };
}

/* ---- "Kampe": matches at the end of a training ----
   The groups are ranked by their average level (a lower number is more experienced). With an even number of
   groups they are paired: the two most experienced groups make one match, the next two the next match.
   With an odd number of groups (3, 5, …) all players are lined up group by group (each group by level) and
   cut into (groups + 1) / 2 matches, so 3 groups give 2 matches: the middle group's more experienced players
   join the top match and the rest the bottom one. Each match should have an even number of players where
   possible, so everyone gets an opposite number.
   count: the number of matches, if chosen ("Antal kampe"); otherwise half the groups, rounded up. When it is
   not half the groups, all players are lined up as above and cut into that many matches.
   sizes: the number of players in each match, if chosen ("Størrelse: Vælg selv"; they must add up to all the
   players): the line is cut into those sizes, match 1 the most experienced.
   Each match is split into two teams player for player (see pairedSplit).
   level(p): a player's level, or null (counted as the average of everyone). Returns
   [{ groups: [group numbers], teams: [[players], [players]], avg: [a, b] }], most experienced match first;
   team A's player i is matched with team B's player i. */
/* The number of matches: the one chosen, or half the groups (rounded up); at least 1, at most one per 2 players */
function matchCount(groups, count) {
  const used = groups.filter(g => g.length), players = used.reduce((n, g) => n + g.length, 0);
  const auto = Math.max(1, Math.ceil(used.length / 2));
  return Math.max(1, Math.min(count || auto, Math.floor(players / 2) || 1));
}

/* Chosen match sizes, if they fit: one per match and adding up to the players; otherwise null (even sizes) */
function sizesFor(groups, count, sizes) {
  const players = groups.reduce((n, g) => n + g.length, 0);
  return Array.isArray(sizes) && sizes.length === matchCount(groups, count) && sizes.every(x => x >= 2) &&
         sizes.reduce((x, y) => x + y, 0) === players ? sizes.slice() : null;
}

function makeMatches(groups, level, seed, count, sizes, teams, spares) {
  const rand = seededRandom(seed || 1);
  const known = [].concat.apply([], groups).map(level).filter(v => v != null && isFinite(v));
  const mean = known.length ? known.reduce((x, y) => x + y, 0) / known.length : 0;
  const lv = p => { const v = level(p); return v != null && isFinite(v) ? v : mean; };
  const avg = g => g.length ? g.reduce((x, p) => x + lv(p), 0) / g.length : mean;
  const ranked = groups.map((g, i) => ({ g: g, i: i, a: avg(g) })).filter(o => o.g.length)
    .sort((x, y) => x.a - y.a || x.i - y.i);
  const home = new Map();
  ranked.forEach(o => o.g.forEach(p => home.set(p, o.i + 1)));

  const m = matchCount(groups, count), chosen = sizesFor(groups, count, sizes);
  let pools = [];
  if (!chosen && ranked.length % 2 === 0 && m === ranked.length / 2) {
    for (let r = 0; r < ranked.length; r += 2) pools.push([].concat(ranked[r].g, ranked[r + 1].g));
  } else if (m === 1 && !chosen) {
    pools = [[].concat.apply([], ranked.map(o => o.g))];
  } else {
    const line = [].concat.apply([], ranked.map(o => byLevel(o.g, lv, rand)));
    let at = 0;
    (chosen || poolSizes(line.length, m)).forEach(n => { pools.push(line.slice(at, at + n)); at += n; });
  }
  return poolsToMatches(pools, lv, home, rand, known, teams, spares);
}

/* Each match's players into two teams (player for player, see pairedSplit / unevenSplit), or three with
   teams = 3 (threeSplit; for "vinderen bliver på") */
function poolsToMatches(pools, lv, home, rand, known, teamCount, spares) {
  const top = known.length ? Math.max.apply(null, known) : 1;           // experience points: top + 1 − level
  const avg = g => g.reduce((x, p) => x + lv(p), 0) / g.length;
  const spareOf = p => (spares && spares[p.name]) || 0;                // times without an opposite number lately
  return pools.map(function (players) {
    const teams = teamCount === 3 && players.length >= 3 ? threeSplit(players, lv, rand, p => top + 1 - lv(p), spareOf)
                : players.length % 2 && players.length <= 15 ? unevenSplit(players, lv, home, rand, p => top + 1 - lv(p), spareOf)
                                                             : pairedSplit(players, lv, home, rand, spareOf);
    const from = [];
    players.forEach(p => { if (from.indexOf(home.get(p)) === -1) from.push(home.get(p)); });
    return teams && { groups: from, teams: teams, avg: teams.map(avg) };
  }).filter(Boolean);
}

/* ---- "Kampe" by 25-50-25 ----
   Instead of the more experienced against each other and the less experienced against each other, the players
   are placed in the matches so that, over time, each one plays about 25 % of the matches in a harder match,
   50 % at their own level and 25 % in an easier one. A match is judged against each of the other players in it
   (teammates and opponents), as the groups are: each counts as more experienced, the same level or less
   experienced (levelWeights, a soft transition around half a level), and the match is the average of those
   (matchShare). So the most experienced player's match with the next best counts partly as their own level, and
   a match with two much stronger and two much weaker players counts half harder, half easier – not "own level".
   Players are only together if their bands overlap by at least half a level (bandsFit); a player without a band:
   not with others averaging more than MATCH_MAX_GAP from their own level. The matches may differ in average level; each match is then split into two teams player for player.
   The number of matches is the same as for "Niveau": the one chosen, or half the groups (rounded up). */
const MATCH_MAX_GAP = 1.5;
const MATCH_WEIGHTS = { mix: 1000, gap: 1e5 };

/* The match for a player: [harder, own level, easier], the average over the other players' levels (each by
   levelWeights). Without a level (or nobody else with one): own level. */
function matchShare(own, others) {
  const w = [0, 0, 0];
  let k = 0;
  if (hasLevel(own)) others.forEach(o => { if (hasLevel(o)) { const x = levelWeights(own, o); w[0] += x[0]; w[1] += x[1]; w[2] += x[2]; k++; } });
  return k ? w.map(x => x / k) : [0, 1, 0];
}
/* Mostly: 0 harder, 1 own level, 2 easier (for the ↑ ↓ on the screen; as much harder as easier: own level) */
const shareCategory = w => w[1] > 0.5 + 1e-9 || Math.abs(w[0] - w[2]) < 1e-9 ? 1 : w[0] > w[2] ? 0 : 2;
/* (others: one level or a list of the others' levels) */
const matchCategory = (own, others) => shareCategory(matchShare(own, Array.isArray(others) ? others : [others]));

/* What each player has had in earlier matches: { name: [harder, own level, easier, matches] }, from saved
   trainings (newest first; each a list of matches, each [[team A names], [team B names]]), the last 12 */
function matchMix(earlier, level) {
  const mix = {};
  earlier.slice(0, GROUP_HISTORY).forEach(ms => ms.forEach(function (teams) {
    const names = [].concat(...teams);
    const lv = names.map(level);
    names.forEach(function (name, i) {
      if (!hasLevel(lv[i])) return;
      const others = lv.filter((v, j) => j !== i && hasLevel(v));
      if (!others.length) return;
      const m = mix[name] = mix[name] || [0, 0, 0, 0];
      const w = matchShare(lv[i], others);
      for (let r = 0; r < 3; r++) m[r] += w[r];
      m[3]++;
    });
  }));
  return mix;
}

/* 25-50-25 placement: the players into matches of the given sizes, so that each comes closest to 25 % harder,
   50 % own level and 25 % easier over time (see above). lv(p): the level, unknown counted as the average.
   Returns { pools: [[players]] in the order of sizes, cat: { name: 0 | 1 | 2 } for this time }.
   social (optional, for the groups): { pairs: pairHistory(...), weight, even } – pairs who were together lately cost;
   even: how much it costs when the groups' average levels differ (so there is no clear top, middle and bottom group). */
/* How strongly overlap draws players together (see near[] in mixPools). With the coaches' 51 real bands over 40
   trainings (the social mix at 25 %), pairs overlapping 1–24 / 25–49 / 50–74 / 75–100 % of a band are together
   7 / 13 / 24 / 36 % of the times both are there, and bands that don't overlap never; it hardly changes the level mix. */
const OVERLAP_PULL = 10;
function mixPools(all, sizes, level, lv, mix, rand, social) {
  const own = all.map(p => { const v = level(p); return v != null && isFinite(v) ? v : NaN; });
  const had = all.map(p => mix[p.name] || [0, 0, 0, 0]);
  const n = all.length, m = sizes.length;
  const fit = new Uint8Array(n * n);                           // may i and j be together? (their bands overlap enough)
  const short = new Float64Array(n * n);                       // if not: how much overlap is missing (the more, the worse)
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    fit[i * n + j] = i === j || bandsFit(all[i], all[j]) ? 1 : 0;
    if (!fit[i * n + j]) short[i * n + j] = bandShort(all[i], all[j]);
  }
  const hasBand = all.map(p => Number.isFinite(p.lo) && Number.isFinite(p.hi));
  const bands = all.map((p, i) => isBand(p) ? p : own[i]);     // compared by band where there is one
  // social mix (groups): together lately costs, the newest training most (social: { pairs: pairHistory(...), weight })
  const met = new Float64Array(n * n), socialW = social && social.weight > 0 ? social.weight : 0;
  const evenW = social && social.even > 0 ? social.even : 0;   // level mix (groups): uneven group averages cost
  if (socialW) for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) if (i !== j) met[i * n + j] = social.pairs[pairKey(all[i].name, all[j].name)] || 0;
  // overlap pull: two players whose bands overlap more are drawn together a little more often (the "same" share of each
  // for the other, both ways), so A and C who overlap a lot meet more often than A and B who overlap less
  const near = new Float64Array(n * n), nearW = OVERLAP_PULL;
  if (nearW) for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) if (isBand(bands[i]) && isBand(bands[j]))
    near[i * n + j] = (bandWeights(bands[i], bands[j])[1] + bandWeights(bands[j], bands[i])[1]) / 2;
  const aim = aimsFor(bands, (i, j) => fit[i * n + j]);        // each player's own aim, against those they may be with
  const pw = new Float64Array(n * n * 3);                      // levelWeights for every pair, worked out once
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) if (i !== j && own[i] === own[i] && own[j] === own[j]) {
    const x = levelWeights(bands[i], bands[j]);
    pw[(i * n + j) * 3] = x[0]; pw[(i * n + j) * 3 + 1] = x[1]; pw[(i * n + j) * 3 + 2] = x[2];
  }
  function shareOf(i) {                                        // matchShare for player i where they are now
    let s0 = 0, s1 = 0, s2 = 0, k = 0;
    for (let j = 0; j < n; j++) if (j !== i && a[j] === a[i] && own[j] === own[j]) { const b = (i * n + j) * 3; s0 += pw[b]; s1 += pw[b + 1]; s2 += pw[b + 2]; k++; }
    return k ? [s0 / k, s1 / k, s2 / k] : [0, 1, 0];
  }

  let a;
  const sum = new Float64Array(m), cnt = new Float64Array(m);
  function cost() {
    sum.fill(0); cnt.fill(0);
    for (let i = 0; i < n; i++) if (own[i] === own[i]) { sum[a[i]] += own[i]; cnt[a[i]]++; }
    let c = 0;
    if (evenW) {                                               // each group's average away from everyone's, per player
      let tot = 0, k = 0;
      for (let g = 0; g < m; g++) { tot += sum[g]; k += cnt[g]; }
      for (let g = 0; g < m; g++) if (cnt[g]) { const d = sum[g] / cnt[g] - tot / k; c += evenW * cnt[g] * d * d; }
    }
    for (let i = 0; i < n; i++) {
      if (own[i] !== own[i] || cnt[a[i]] < 2) continue;
      const others = (sum[a[i]] - own[i]) / (cnt[a[i]] - 1), w = shareOf(i), h = had[i];
      for (let r = 0; r < 3; r++) { const d = (h[r] + w[r]) / (h[3] + 1) - aim[i][r]; c += MATCH_WEIGHTS.mix * d * d; }
      if (socialW) for (let j = i + 1; j < n; j++) if (a[j] === a[i]) c += socialW * met[i * n + j];
      if (nearW) for (let j = i + 1; j < n; j++) if (a[j] === a[i]) c -= nearW * near[i * n + j];
      for (let j = 0; j < n; j++) if (j !== i && a[j] === a[i] && !fit[i * n + j]) {   // bands too far apart: never worth a
        const d = short[i * n + j];                                                       // better mix; if it can't be helped
        c += MATCH_WEIGHTS.gap * (10 + d * d);                                            // (too few who fit), the nearest
      }
      const over = hasBand[i] ? 0 : Math.abs(others - own[i]) - MATCH_MAX_GAP;     // (no band: the old limit on the average)
      if (over > 1e-9) c += MATCH_WEIGHTS.gap * (10 + over * over);   // a fixed step: never worth a better mix
    }
    return c;
  }
  // Start sorted by level (the most experienced in match 1), then swap players between matches while it helps;
  // a few starts, the best kept (equally good ones at random)
  const sorted = byLevel(all, lv, rand).map(p => all.indexOf(p));
  let best = null, bestCost = Infinity, ties = 0;
  for (let start = 0; start < 3; start++) {
    a = new Int32Array(n);
    let at = 0;
    sizes.forEach((s, mi) => { for (let j = 0; j < s; j++) a[sorted[at++]] = mi; });
    let now = cost(), temp = start ? 300 : 0;
    const steps = 2000 + 200 * n, cool = Math.pow(0.01 / 300, 1 / steps);
    for (let s = 0; s < steps; s++, temp *= cool) {
      const i = Math.floor(rand() * n), j = Math.floor(rand() * n);
      if (a[i] === a[j]) continue;
      const x = a[i]; a[i] = a[j]; a[j] = x;
      const next = cost();
      if (next <= now || (temp > 0 && rand() < Math.exp((now - next) / temp))) now = next;
      else { a[j] = a[i]; a[i] = x; }
    }
    if (now < bestCost - 1e-9) { bestCost = now; best = a.slice(); ties = 1; }
    else if (Math.abs(now - bestCost) <= 1e-9 && rand() < 1 / ++ties) best = a.slice();
  }
  a = best;
  cost();                                                // (fills sum and cnt for the final placement)
  const cat = {};
  all.forEach(function (p, i) {
    if (own[i] === own[i] && cnt[a[i]] > 1) cat[p.name] = shareCategory(shareOf(i));
  });
  return { pools: Array.from({ length: m }, (_, mi) => all.filter((p, i) => a[i] === mi)), cat: cat };
}

/* mix: matchMix(...). Returns what makeMatches returns, plus cat: { name: 0 | 1 | 2 } for this time */
function makeMixMatches(groups, level, mix, seed, count, chosenSizes, teams, spares) {
  const used = groups.filter(g => g.length);
  const m = matchCount(groups, count), chosen = sizesFor(groups, count, chosenSizes);
  if (m < 2) return makeMatches(groups, level, seed, 1, null, teams, spares);   // one match: nothing to place players between
  const rand = seededRandom(seed || 1);
  const all = [].concat.apply([], used);
  const known = all.map(level).filter(v => v != null && isFinite(v));
  const mean = known.length ? known.reduce((x, y) => x + y, 0) / known.length : 0;
  const lv = p => { const v = level(p); return v != null && isFinite(v) ? v : mean; };
  const home = new Map();
  groups.forEach((g, i) => g.forEach(p => home.set(p, i + 1)));
  const placed = mixPools(all, chosen || poolSizes(all.length, m, teams), level, lv, mix, rand), cat = placed.cat;
  let pools = placed.pools;
  if (!chosen) pools = pools.map(ps => ({ ps: ps, avg: ps.reduce((x, p) => x + lv(p), 0) / ps.length }))   // chosen sizes stay
    .sort((x, y) => x.avg - y.avg).map(o => o.ps);                                                     // with their match
  const out = poolsToMatches(pools, lv, home, rand, known, teams, spares);
  out.cat = cat;
  return out;
}

/* ---- "Ingen modspiller" in turn ----
   With an odd number of players one plays without an opposite number (and in a match with three teams, the one or
   two players left over). The best pairs alone would often pick the same player week after week, so each earlier
   time (saved matches, the last 12 trainings) counts as SPARE_WEIGHT levels against being picked again. */
const SPARE_WEIGHT = 0.5;
/* { name: times without an opposite number } in saved matches (newest first, each [[team A names], [team B names], …]):
   the teams keep the order of opposite numbers, so anyone further down than the shortest team had none */
function spareCounts(earlier) {
  const n = {};
  earlier.slice(0, GROUP_HISTORY).forEach(ms => ms.forEach(function (teams) {
    const full = Math.min(...teams.map(t => t.length));
    teams.forEach(t => t.slice(full).forEach(name => { n[name] = (n[name] || 0) + 1; }));
  }));
  return n;
}

/* One team has a player fewer (odd number of players): the pairs may be a little less close if that makes
   the teams' total experience clearly more equal, since the team with one player fewer needs a little more
   experience to make up for it. Every split into m + 1 and m players is tried (up to 15 players), scored
   pairs + ODD_TOTAL_WEIGHT × total gap, where pairs is the sum of level differences between opposite numbers
   (both teams by level; the extra player is the one that leaves the closest pairs) and the total gap is the
   difference in experience points. Then mixing of the groups, then at random among equals. */
const ODD_TOTAL_WEIGHT = 0.75;
function unevenSplit(players, lv, home, rand, points, spareOf) {
  spareOf = spareOf || (() => 0);
  const n = players.length, big = (n + 1) / 2, firstGroup = home.get(players[0]);
  let best = null, bestCost = Infinity, ties = 0;
  for (let mask = 0; mask < (1 << n); mask++) {
    let c = 0;
    for (let i = 0; i < n; i++) if (mask >> i & 1) c++;
    if (c !== big) continue;
    const A = [], B = [];
    players.forEach((p, i) => (mask >> i & 1 ? A : B).push(p));
    const a = byLevel(A, lv, rand), b = byLevel(B, lv, rand);
    let pairs = Infinity, skip = 0;
    for (let k = 0; k < a.length; k++) {
      let g = 0;
      a.filter((p, j) => j !== k).forEach((p, j) => { g += Math.abs(lv(p) - lv(b[j])); });
      g += SPARE_WEIGHT * spareOf(a[k]);                  // (had no opposite number lately: rather someone else)
      if (g < pairs) { pairs = g; skip = k; }
    }
    const total = Math.abs(a.reduce((x, p) => x + points(p), 0) - b.reduce((x, p) => x + points(p), 0));
    const share = [a, b].reduce((x, t) => x + Math.abs(t.filter(p => home.get(p) === firstGroup).length - t.length / 2), 0);
    const cost = pairs + ODD_TOTAL_WEIGHT * total + 0.001 * share;
    const teams = [a.filter((p, j) => j !== skip).concat([a[skip]]), b];   // opposite numbers in line, the extra player last
    if (cost < bestCost - 1e-9) { bestCost = cost; best = teams; ties = 1; }
    else if (Math.abs(cost - bestCost) <= 1e-9 && rand() < 1 / ++ties) best = teams;
  }
  return best;
}

/* Players by level (most experienced first); equal levels in random order */
function byLevel(players, lv, rand) {
  return players.map(p => ({ p: p, v: lv(p), r: rand() })).sort((x, y) => x.v - y.v || x.r - y.r).map(o => o.p);
}

/* n players into m matches of t teams (2 unless given): sizes divisible by t first (everyone gets an
   opposite number), the rest in the last */
function poolSizes(n, m, t) {
  t = t || 2;
  const sizes = new Array(m).fill(t * Math.floor(n / (t * m)));
  let rest = n - sizes.reduce((x, y) => x + y, 0);
  for (let i = 0; rest >= t; i = (i + 1) % m) { sizes[i] += t; rest -= t; }
  if (rest) sizes[m - 1] += rest;
  return sizes;
}

/* Three teams from one match's players (for "vinderen bliver på"), player for player: ranked by level, the
   players are taken three at a time and each three is split over the three teams, so the players on the same
   line are each other's opposite numbers. When the players don't divide by three, the last ones are spread over
   two or one of the teams. The splits are turned (all 6 ways per three) while the teams' average levels get
   closer; with uneven teams, the teams with a player fewer also get a little more experience (points), as for two
   teams. A few random starts, the best kept (equally good ones at random). */
function threeSplit(players, lv, rand, points, spareOf) {
  spareOf = spareOf || (() => 0);
  const all = byLevel(players, lv, rand), r = all.length % 3, units = [];
  // who is left over (r players, no full line of three): the choice leaving the closest threes, and not the same
  // players as last time (SPARE_WEIGHT); equally good choices at random
  let out = [];
  if (r) {
    const spread = rest => { let c = 0; for (let i = 0; i < rest.length; i += 3) c += lv(rest[i + 2]) - lv(rest[i]); return c; };
    let best = Infinity, picks = [];
    const tryOut = idx => {
      const rest = all.filter((p, i) => idx.indexOf(i) === -1);
      const c = spread(rest) + SPARE_WEIGHT * idx.reduce((x, i) => x + spareOf(all[i]), 0);
      if (c < best - 1e-9) { best = c; picks = [idx]; } else if (Math.abs(c - best) <= 1e-9) picks.push(idx);
    };
    for (let i = 0; i < all.length; i++) {
      if (r === 1) tryOut([i]);
      else for (let j = i + 1; j < all.length; j++) tryOut([i, j]);
    }
    out = picks[Math.floor(rand() * picks.length)];
  }
  const line = all.filter((p, i) => out.indexOf(i) === -1);
  for (let i = 0; i < line.length; i += 3) units.push(line.slice(i, i + 3));
  if (out.length) units.push(out.map(i => all[i]));
  const PERMS = [[0, 1, 2], [0, 2, 1], [1, 0, 2], [1, 2, 0], [2, 0, 1], [2, 1, 0]];
  function build(pick) {
    const t = [[], [], []];
    units.forEach((u, j) => u.forEach((p, k) => t[PERMS[pick[j]][k]].push(p)));
    return t;
  }
  function cost(t) {
    const means = t.map(team => team.reduce((x, p) => x + lv(p), 0) / team.length);
    let c = 1000 * Math.pow(Math.max(...means) - Math.min(...means), 2);
    const sizes = t.map(team => team.length);
    if (Math.max(...sizes) !== Math.min(...sizes)) {
      const tot = t.map(team => team.reduce((x, p) => x + points(p), 0) / Math.max(...sizes));
      c += 300 * Math.pow(Math.max(...tot) - Math.min(...tot), 2);
    }
    return c;
  }
  let best = null, bestCost = Infinity, ties = 0;
  for (let start = 0; start < 8; start++) {
    const pick = units.map(() => Math.floor(rand() * 6));
    let now = cost(build(pick)), better = true;
    while (better) {
      better = false;
      for (let j = 0; j < units.length; j++) {
        const was = pick[j];
        for (let q = 0; q < 6; q++) {
          if (q === was) continue;
          pick[j] = q;
          const c = cost(build(pick));
          if (c < now - 1e-9) { now = c; better = true; break; }
          pick[j] = was;
        }
        if (better) break;
      }
    }
    const t = build(pick);
    if (now < bestCost - 1e-9) { bestCost = now; best = t; ties = 1; }
    else if (Math.abs(now - bestCost) <= 1e-9 && rand() < 1 / ++ties) best = t;
  }
  return best;
}

/* Two teams from one match's players, in this order of importance:
   1. player for player: ranked by level, the players are paired with their nearest equal and each pair is
      split between the teams (with an odd number, the player whose absence leaves the closest pairs plays
      without an opposite number);
   2. the teams' average levels as equal as possible;
   3. both teams with players from each group;
   4. among splits that are equally good, one at random (so "Lav nye kampe" gives another). */
function pairedSplit(players, lv, home, rand, spareOf) {
  spareOf = spareOf || (() => 0);
  if (players.length < 2) return null;
  let line = byLevel(players, lv, rand), spare = null;
  if (line.length % 2) {                                 // who plays without an opposite number
    let best = Infinity, picks = [];
    for (let i = 0; i < line.length; i += 2) {
      const rest = line.filter((p, j) => j !== i);
      let gap = 0;
      for (let j = 0; j < rest.length; j += 2) gap += Math.abs(lv(rest[j]) - lv(rest[j + 1]));
      gap += SPARE_WEIGHT * spareOf(line[i]);
      if (gap < best - 1e-9) { best = gap; picks = [i]; } else if (Math.abs(gap - best) <= 1e-9) picks.push(i);
    }
    const i = picks[Math.floor(rand() * picks.length)];
    spare = line[i]; line = line.filter((p, j) => j !== i);
  }
  const pairs = [];
  for (let j = 0; j < line.length; j += 2) pairs.push([line[j], line[j + 1]]);

  const firstGroup = home.get(players[0]);
  function build(bits, spareSide) {
    const t = [[], []];
    pairs.forEach((pr, j) => { const b = (bits >> j) & 1; t[0].push(pr[b]); t[1].push(pr[1 - b]); });
    if (spare) t[spareSide].push(spare);
    return t;
  }
  function cost(t) {
    const mean = team => team.reduce((x, p) => x + lv(p), 0) / team.length;
    const gap = mean(t[0]) - mean(t[1]);
    // mixing: how far each team is from holding half of the first group's players
    const share = t.reduce((x, team) => { const n = team.filter(p => home.get(p) === firstGroup).length; return x + Math.abs(n - team.length / 2); }, 0);
    return 1000 * gap * gap + 0.01 * share;
  }
  // every way to turn the pairs (up to 2^12), or one at a time for very big matches
  let best = null, bestCost = Infinity, ties = 0;
  const consider = t => {
    const c = cost(t);
    if (c < bestCost - 1e-9) { bestCost = c; best = t; ties = 1; }
    else if (Math.abs(c - bestCost) <= 1e-9 && rand() < 1 / ++ties) best = t;
  };
  if (pairs.length <= 12) {
    for (let bits = 0; bits < (1 << pairs.length); bits++) for (let side = 0; side < (spare ? 2 : 1); side++) consider(build(bits, side));
  } else {
    let bits = 0;
    for (let j = 0; j < pairs.length; j++) {
      const a = build(bits, 0), b = build(bits | (1 << j), 0);
      if (cost(b) < cost(a) || (cost(b) === cost(a) && rand() < 0.5)) bits |= 1 << j;
    }
    for (let side = 0; side < (spare ? 2 : 1); side++) consider(build(bits, side));
  }
  return best;
}

/* ---- Kampe: "Først i puljer" – 1 to 4 pools, then matches within each ----
   splitPools puts all players into pools of the given sizes by one of the rules (as for the matches below):
   "max" by best level (pool 1 the most experienced), "band" bands that meet, "even" equal averages, "chaos" at
   random, "mix" 25-50-25 (opts.mix: matchMix(...)). Returns [[players]]: in the order of sizes with
   opts.keepOrder, otherwise the most experienced pool first. opts: { level(p), meet(a, b), mix, keepOrder } */
function splitPools(players, sizes, kind, seed, opts) {
  const rand = seededRandom(seed || 1);
  const known = players.map(opts.level).filter(v => v != null && isFinite(v));
  const mean = known.length ? known.reduce((x, y) => x + y, 0) / known.length : 0;
  const lv = p => { const v = opts.level(p); return v != null && isFinite(v) ? v : mean; };
  return assignPools(players, sizes, kind, rand, lv, mean, opts);
}
function assignPools(players, sizes, kind, rand, lv, mean, opts) {
  let pools;
  if (kind === "pools") pools = opts.pools.map(p => p.slice());
  else if (kind === "mix") pools = sizes.length < 2 ? [players.slice()] : mixPools(players, sizes, opts.level, lv, opts.mix || {}, rand).pools;
  else {
    const order = kind === "max" || kind === "band" ? byLevel(players, lv, rand)          // start sorted by level
                : players.map(p => ({ p: p, r: rand() })).sort((x, y) => x.r - y.r).map(o => o.p);   // at random
    let at = [];
    let i = 0;
    sizes.forEach((s, m) => { for (let j = 0; j < s; j++) at[i++] = m; });
    const cost = kind === "band" ? function (a) {                    // pairs in a pool whose bands don't meet
      let c = 0;
      for (let x = 0; x < order.length; x++) for (let y = x + 1; y < order.length; y++) if (a[x] === a[y] && !opts.meet(order[x], order[y])) c++;
      return c;
    } : kind === "even" ? function (a) {                             // how far each pool's average is from everyone's
      const sum = new Float64Array(sizes.length), cnt = new Float64Array(sizes.length);
      order.forEach((p, x) => { sum[a[x]] += lv(p); cnt[a[x]]++; });
      let c = 0;
      for (let m = 0; m < sizes.length; m++) if (cnt[m]) { const d = sum[m] / cnt[m] - mean; c += cnt[m] * d * d; }
      return c;
    } : null;
    if (cost) {                                          // swap players between pools while it helps (sizes stay);
      const first = at.slice();                          // a few starts (the first as above, then shuffled), best kept
      let best = null, bestCost = Infinity;
      for (let start = 0; start < 5 && bestCost > 1e-12; start++) {
        const a = start ? first.map(m => ({ m: m, r: rand() })).sort((x, y) => x.r - y.r).map(o => o.m) : first.slice();
        let now = cost(a), low = now, lowA = a.slice();
        const steps = 3000 + 100 * order.length;
        let temp = kind === "band" ? 1.5 : 0;            // early on, a slightly worse swap is sometimes kept
        const cool = Math.pow(0.02 / 1.5, 1 / steps);
        for (let s = 0; s < steps && low > 1e-12; s++, temp *= cool) {
          const x = Math.floor(rand() * order.length), y = Math.floor(rand() * order.length);
          if (a[x] === a[y]) continue;
          const t = a[x]; a[x] = a[y]; a[y] = t;
          const next = cost(a);
          if (next <= now || (temp > 0 && rand() < Math.exp((now - next) / temp))) {
            now = next;
            if (now < low) { low = now; lowA = a.slice(); }
          } else { a[y] = a[x]; a[x] = t; }
        }
        if (low < bestCost) { bestCost = low; best = lowA; }
      }
      at = best;
    }
    pools = sizes.map((s, m) => order.filter((p, x) => at[x] === m));
  }
  if (!opts.keepOrder) pools = pools.map(ps => ({ ps: ps, avg: ps.reduce((x, p) => x + lv(p), 0) / (ps.length || 1) }))
    .sort((x, y) => x.avg - y.avg).map(o => o.ps);
  return pools;
}

/* ---- "Del kampene efter" Bånd, Niveau, Kaos and Lige hold (who plays where: assignPools) ----
   Decides who plays in which match (sizes: players per match, adding up to everyone), then splits each match
   into two teams:
     "max"   – by level (the app passes Niveau): match 1 the most experienced;
     "band"  – players in a match must have bands that meet (opts.meet), as for groups;
     "even"  – the matches' average levels as equal as possible;
     "chaos" – completely at random: matches AND teams (for card games, quizzes and other social games);
     "pools" – the matches given (opts.pools).
   Except in Kaos, each match is split into two equally strong teams player for player (pairedSplit /
   unevenSplit). Without chosen sizes the matches are listed most experienced first.
   opts: { level(p), meet(a, b), home: Map player → group number, pools, keepOrder, teams: 2 or 3 per match,
           spares: spareCounts(...), who had no opposite number lately } */
/* Kaos: shuffled players dealt into t teams of near-equal size (the first teams one more) */
function chaosTeams(mixed, t) {
  const teams = Array.from({ length: t }, () => []);
  let at = 0;
  teams.forEach((team, i) => { const n = Math.floor(mixed.length / t) + (i < mixed.length % t ? 1 : 0); team.push(...mixed.slice(at, at + n)); at += n; });
  return teams;
}
function makePoolMatches(players, sizes, kind, seed, opts) {
  const rand = seededRandom(seed || 1);
  const known = players.map(opts.level).filter(v => v != null && isFinite(v));
  const mean = known.length ? known.reduce((x, y) => x + y, 0) / known.length : 0;
  const lv = p => { const v = opts.level(p); return v != null && isFinite(v) ? v : mean; };
  const pools = assignPools(players, sizes, kind, rand, lv, mean, opts);
  if (kind === "chaos") {                                // teams at random too
    return pools.filter(ps => ps.length).map(function (ps) {
      const mixed = ps.map(p => ({ p: p, r: rand() })).sort((x, y) => x.r - y.r).map(o => o.p);
      const teams = chaosTeams(mixed, opts.teams === 3 && mixed.length >= 3 ? 3 : 2);
      return { groups: [], teams: teams, avg: teams.map(t => t.length ? t.reduce((x, p) => x + lv(p), 0) / t.length : mean) };
    });
  }
  return poolsToMatches(pools.filter(ps => ps.length >= 2), lv, opts.home || new Map(), rand, known, opts.teams, opts.spares);
}

/* ---- "Niveau": sorted by level (the app passes Niveau, the middle of the band) ----
   The players ranked by their best level (Fra: the lowest number in the band, the most experienced first)
   and cut into k groups of even size, so group 1 holds the most experienced. Players with the same level come
   in random order (seed), so pressing again gives a new mix within each level without breaking the order.
   A player without a level is put in at a random place. level(p): a number, or null. */
function sortedGroups(players, k, level, seed) {
  const rand = seededRandom(seed || 1);
  const order = players.filter(p => level(p) != null).map(p => ({ p: p, key: level(p), r: rand() }))
    .sort((x, y) => x.key - y.key || x.r - y.r).map(o => o.p);
  players.filter(p => level(p) == null).forEach(p => order.splice(Math.floor(rand() * (order.length + 1)), 0, p));
  k = Math.max(1, Math.min(k, order.length || 1));
  const groups = Array.from({ length: k }, () => []);
  order.forEach((p, r) => groups[Math.floor(r * k / order.length)].push(p));
  return groups;
}

/* ---- Kampe: players drafted to real matches with a level 1–4 (the Kampe tab) ----
   A player's ideal match level is Fra + a third of the band (1–3: 1,67; 1–4: 2). A match with a level a whole level
   or more better than that (a lower number) is playing up, as much worse playing down, and within half a level the
   same level (levelWeights, the soft transition in between). Over time each player aims at 25 % up, 50 % same and
   25 % down – less of what they can't get (fixtureAim). A player is only put on a match whose level is at most half
   a level outside their band. One match per player per date; with more players than places, the rest are reserves,
   in turn (fewer reserve turns and fewer matches lately: more likely to play). */
const FIX_SLACK = 0.5;
const idealLevel = p => isBand(p) ? p.lo + (p.hi - p.lo) / 3 : null;
const fixtureFits = (p, level) => !isBand(p) || (level >= p.lo - FIX_SLACK - 1e-9 && level <= p.hi + FIX_SLACK + 1e-9);
const fixtureWeights = (p, level) => idealLevel(p) == null ? [0, 1, 0] : levelWeights(idealLevel(p), level);
/* The player's aim over the season: what the levels 1–4 they may play allow (playerAim) */
const fixtureAim = p => idealLevel(p) == null ? MIX_GOAL.slice() : playerAim(idealLevel(p), [1, 2, 3, 4].filter(l => fixtureFits(p, l)));

/* From saved sets (newest first, each { games: [{ level, avail, players }] }), the last 12: per player { mix: [up, same,
   down, matches], reserves: sets where they could play but played none }. byName(name): the player or null. */
function fixtureHistory(earlier, byName) {
  const out = {};
  const of = name => out[name] = out[name] || { mix: [0, 0, 0, 0], reserves: 0 };
  earlier.slice(0, GROUP_HISTORY).forEach(function (set) {
    const could = new Set(), played = new Set();
    (set.games || []).forEach(function (g) {
      (g.avail || []).forEach(n => could.add(n));
      g.players.forEach(function (name) {
        played.add(name);
        const p = byName(name), w = fixtureWeights(p, g.level), m = of(name).mix;
        if (idealLevel(p) != null) for (let r = 0; r < 3; r++) m[r] += w[r];
        m[3]++;
      });
    });
    could.forEach(n => { if (!played.has(n)) of(n).reserves++; });
  });
  return out;
}

/* Keeper-interested: "Favoritpladser" in the Spillere tab mentions keeper or målmand */
const isKeeper = p => !!p && /keeper|målmand|maalmand|mål/i.test(String(p.pos || ""));

/* A set of matches (e.g. a weekend): who plays which. players: everyone who can play at least one ({ name, lo, hi, pos });
   games: [{ level, size, avail: [names who can play it], locked: [names the coach picked] }]; history: fixtureHistory(...).
   Returns { games: [[players]], reserves: [players] } (reserves: could play, but play none).
   Solved exactly as a minimum-cost flow, in this order of importance:
     1. a player the coach picked ("Udtaget") stays on that match;
     2. every place that can be filled is filled, and a player only on matches they can play;
     3. a level more than half a level outside the band costs a lot (more, the farther);
     4. everyone gets one match before anyone gets two (a further match costs more than a keeper or the mix);
     5. each match gets a keeper-interested player if one is free (one place per match counts a keeper extra);
     6. of several matches, each player gets the one that brings them closest to their 25-50-25 aim; a first match is
        sooner for those with more reserve turns. */
const KEEPER_BONUS = 2000;
function draftFixtureSet(players, games, history, seed) {
  const rand = seededRandom(seed || 1), n = players.length, G = games.length;
  let nodes = 2;
  const S = 0, T = 1, gT = games.map(() => nodes++), gK = games.map(() => nodes++), gR = games.map(() => nodes++), pN = players.map(() => nodes++);
  const to = [], cap = [], cost = [], next = [], head = [];
  const edge = (u, v, c, w) => {
    to.push(v); cap.push(c); cost.push(w); next.push(head[u] === undefined ? -1 : head[u]); head[u] = to.length - 1;
    to.push(u); cap.push(0); cost.push(-w); next.push(head[v] === undefined ? -1 : head[v]); head[v] = to.length - 1;
  };
  const FILL = 1e7, LOCK = 1e9, h = name => (history || {})[name] || { mix: [0, 0, 0, 0], reserves: 0 };
  const placeEdges = games.map(() => []);                   // (edge, player) for each match
  games.forEach(function (g, gi) {
    edge(S, gT[gi], Math.max(0, g.size | 0, (g.locked || []).length), 0);
    edge(gT[gi], gK[gi], 1, -KEEPER_BONUS);                 // the keeper place
    edge(gT[gi], gR[gi], Math.max(0, g.size | 0, (g.locked || []).length), 0);
  });
  players.forEach(function (p, i) {
    const hist = h(p.name), aim = fixtureAim(p), keeper = isKeeper(p);
    games.forEach(function (g, gi) {
      const locked = (g.locked || []).indexOf(p.name) !== -1;
      if (!locked && (g.avail || []).indexOf(p.name) === -1) return;   // can't play this one
      let c = rand() * 1e-3;
      if (idealLevel(p) != null) {
        const w = fixtureWeights(p, g.level);
        for (let r = 0; r < 3; r++) { const d = (hist.mix[r] + w[r]) / (hist.mix[3] + 1) - aim[r]; c += 1000 * d * d; }
      }
      if (!fixtureFits(p, g.level)) { const far = Math.max(p.lo - FIX_SLACK - g.level, g.level - p.hi - FIX_SLACK); c += 2e5 + 4e5 * far * far; }
      const gp = nodes++;                                    // this player on this match: at most once
      if (keeper) edge(gK[gi], gp, 1, 0);
      edge(gR[gi], gp, 1, 0);
      edge(gp, pN[i], 1, c - FILL - (locked ? LOCK : 0));
      placeEdges[gi].push([to.length - 2, i]);
    });
    const first = -2000 * hist.reserves + 200 * hist.mix[3];  // reserve turns: sooner a match; many matches lately: a little later
    for (let k = 1; k <= G; k++) edge(pN[i], T, 1, first + 3000 * (k - 1));
  });
  for (;;) {                                                 // successive shortest paths while one lowers the cost
    const dist = new Array(nodes).fill(Infinity), inQ = new Array(nodes).fill(false), prev = new Array(nodes).fill(-1), q = [S];
    dist[S] = 0;
    while (q.length) {
      const u = q.shift(); inQ[u] = false;
      for (let e = head[u] === undefined ? -1 : head[u]; e !== -1; e = next[e]) if (cap[e] > 0 && dist[u] + cost[e] < dist[to[e]] - 1e-9) {
        dist[to[e]] = dist[u] + cost[e]; prev[to[e]] = e;
        if (!inQ[to[e]]) { inQ[to[e]] = true; q.push(to[e]); }
      }
    }
    if (!(dist[T] < -1e-9)) break;
    for (let v = T; v !== S; v = to[prev[v] ^ 1]) { cap[prev[v]]--; cap[prev[v] ^ 1]++; }
  }
  const plays = new Array(n).fill(false);
  const out = placeEdges.map(list => list.filter(([e]) => cap[e] === 0).map(([, i]) => { plays[i] = true; return players[i]; }));
  return { games: out, reserves: players.filter((p, i) => !plays[i]) };
}

/* ===================== Training groups (for everyone logged in) =====================
   The "Grupper" button in a training, and the Grupper tab, open this screen: tick who is there, choose the
   number of groups (or players per group) and how much should change since last time, then "Lav grupper".
   A player can be moved by tapping them and then "Flyt hertil" (or another player, to swap). "Gem grupper"
   saves them in the tab "Grupper", and the next trainings use them to vary the groups.
   Speed: the players and saved groups are stored on the phone (like the drills, key "grp"), so the screen
   shows at once – also right after the app is opened. The copy is only read and shown when someone is logged in,
   and a newer one is fetched quietly each time (usually the server only answers "unchanged"). */
function canGroup() { return isAuthed(); }

/* Fetches the players and saved groups; the server only sends them again if they have changed.
   Several callers at once share one request. */
function fetchGroupData() {
  if (GRP_FETCH) return GRP_FETCH;
  let asked = null;                                     // the copy the server is asked about
  GRP_FETCH = readStoredGroups().then(function () {     // the stored copy's version: then "unchanged" is enough
    asked = GRP_CACHE;
    return libCall("getGroupData", [AUTH.token, asked ? asked.version : ""]);
  }).then(function (res) {
    GRP_FETCH = null;
    if (SERVER_HAS.grupper !== (res.server || 0)) { SERVER_HAS.grupper = res.server || 0; setTimeout(showServerNote); }
    // "unchanged" refers to the copy that was asked about, which a login running out meanwhile may have cleared
    if (res.unchanged && asked) { if (!GRP_CACHE || GRP_CACHE.version === asked.version) GRP_CACHE = asked; }
    else if (!res.unchanged || !GRP_CACHE) {
      GRP_CACHE = { version: res.version, data: applyQueue({ players: res.players, history: res.history, signups: res.signups || {}, matches: res.matches || {}, fixtures: res.fixtures || {} }) };
      storeGroups();
    }
    GRP_CACHE.at = Date.now();
    return GRP_CACHE;
  }, function (err) { GRP_FETCH = null; throw err; });
  return GRP_FETCH;
}

/* The copy stored on the phone, into memory (once; only when logged in). at: 0 = not checked with the server yet */
let GRP_STORED = null;
function readStoredGroups() {
  if (GRP_CACHE || !isAuthed()) return Promise.resolve(GRP_CACHE);
  if (!GRP_STORED) GRP_STORED = readSaved(grpStoreKey(), s => s.version && s.data && Array.isArray(s.data.players)).then(function (s) {
    GRP_STORED = null;
    if (s && !GRP_CACHE && isAuthed()) GRP_CACHE = { version: s.version, data: s.data, at: 0 };
    return GRP_CACHE;
  });
  return GRP_STORED;
}
function storeGroups() {
  if (GRP_CACHE) idbSet(grpStoreKey(), JSON.stringify({ version: GRP_CACHE.version, data: GRP_CACHE.data }));
}

/* The phone's copy is kept per team with the database (two teams never mix), as "grp" with the sheet */
const grpStoreKey = () => useSupabase() ? "grp-" + supaTeam() : "grp";

/* Fetch ahead (when a training is opened, after a login, when the app opens), unless it was just done */
function prefetchGroups() {
  try {
    if (isAuthed() && !GRP_FETCH && !(GRP_CACHE && Date.now() - GRP_CACHE.at < 30000))
      fetchGroupData().catch(function () { /* tried again when Grupper is opened */ });
  } catch (e) { /* not important */ }
}
const GRP_SETTINGS_KEY = "oevGrpSettings";      // only the settings (number of groups, slider) are remembered

function grpSettings() {
  let s = null;
  try { s = JSON.parse(localStorage.getItem(GRP_SETTINGS_KEY) || "null"); } catch (e) { /* ignore */ }
  return Object.assign({ mode: "count", count: 4, size: 5, change: 25, rule: "mix", maxDiff: 1, matchMode: "mix", matchCount: 0,
                        matchPools: 1, poolMode: "max", poolSizeMode: "even", matchSub: [2, 2, 2, 2], matchTeams: [2, 2, 2, 2], social: 25, even: 25 }, s || {},
                       s && (s.matchMode === "level" || s.matchMode === "tiers") ? { matchMode: "max" } : {},
                       s && s.rule === "even" ? { rule: "mix" } : {},                     // Lige hold is for the matches only now
                       s && !(s.v >= 2) ? { rule: "mix", matchMode: "mix" } : {});         // 25-50-25 became the default (once)
}
function saveGrpSettings() {
  try {
    localStorage.setItem(GRP_SETTINGS_KEY, JSON.stringify({ v: 2, mode: GRP.mode, count: GRP.count, size: GRP.size, change: GRP.change,
                                                      rule: GRP.rule, maxDiff: GRP.maxDiff, matchMode: GRP.matchMode,
                                                      matchCount: GRP.matchCount, matchPools: GRP.matchPools, poolMode: GRP.poolMode,
                                                      poolSizeMode: GRP.poolSizeMode, matchSub: GRP.matchSub, matchTeams: GRP.matchTeams, social: GRP.social,
                                                      even: GRP.even }));
  } catch (e) { /* ignore */ }
}

const sessionKey = s => String((s && (s.iso || s.date)) || "").trim();

/* "2", "2–3" or "?" (no level) */
/* "Niveau": a player's level as the coaches' rules say: Fra decides (a band that is wider on both sides, 1–4 against
   1,5–3,5, is the more experienced, by its Fra), and with the same Fra a lower Til counts as a little more
   experienced (1–4,5 a little more than 1–5): Fra + 0,02 × Til. Null without a level. Used everywhere a level is
   compared or averaged (statistics, 25-50-25, Lige hold, the Niveau rule, matches); only "Bånd" uses the whole band. */
const TIL_WEIGHT = LEVEL_TIL;
const nivOf = p => p && Number.isFinite(p.lo) ? p.lo + TIL_WEIGHT * (Number.isFinite(p.hi) ? p.hi : p.lo) : null;   // (null is no level)
const nivText = x => String(Math.round(x * 10) / 10).replace(".", ",");
let FIX = null;                                            // the Kampe tab (see "Kampe: players drafted to real matches")

/* "Niveauer: Vis / Skjul": whether levels are shown next to the players, for the whole app (remembered on the
   phone; shown unless hidden). Hidden: no bands on the players, no group or team levels ("gns. niveau"), no
   "mere/mindre øvede" on matches and no ↑ ↓ – e.g. when the screen is shown to the players. */
const LEVELS_KEY = "oevShowLevels";
function showLevels() { try { return localStorage.getItem(LEVELS_KEY) !== "0"; } catch (e) { return true; } }
function levelsToggleHtml() {
  const on = showLevels();
  return `<div class="grp-row lvl-toggle"><span class="grp-hint grp-label">Niveauer</span>
    <div class="grp-mode" role="group" aria-label="Vis niveauer ved spillerne">
      <button type="button" data-levels="1" aria-pressed="${on}">Vis</button>
      <button type="button" data-levels="0" aria-pressed="${!on}">Skjul</button></div></div>`;
}
document.addEventListener("click", function (e) {
  const b = e.target.closest("[data-levels]");
  if (!b) return;
  try { localStorage.setItem(LEVELS_KEY, b.dataset.levels); } catch (err) { /* not remembered */ }
  if (typeof GRP !== "undefined" && GRP && GRP.box && GRP.box.isConnected && GRP.data) renderGroups();
  if (document.getElementById("ov")) renderOverview();
  if (FIX) renderFixtures();
  if (HIST && document.getElementById("hist")) renderPlayerHistory();
});

function bandText(lo, hi) {
  const f = x => String(x).replace(".", ",");
  if (!isFinite(lo) && !isFinite(hi)) return "?";
  if (!isFinite(lo)) return "–" + f(hi);
  if (!isFinite(hi)) return f(lo) + "–";
  return lo === hi ? f(lo) : f(lo) + "–" + f(hi);
}

/* Two ways to decide who may share a group (switched on the screen; the bands in the sheet stay as they are):
   "band" – the bands must overlap, and touching is not enough (2–3 and 3–4 may not mix, 2–3 and 1–3 may);
   "max" – sorted by the players' best level (Fra: 1 is the best), group 1 the most experienced (see sortedGroups);
           a group whose levels differ by more than GRP.maxDiff is shown red;
   "chaos" – anyone may be with anyone (every player is sent to the search without a level).
   For "band" the search gets each band made a hair smaller, so bands that only touch no longer meet; a player
   with a single level (e.g. 3) counts as half a level to each side, so 3 still meets 3, 2–3, 3–4 and 2–4.
   For "max" the search gets the band [top, top + difference]: two of those overlap exactly when the top
   levels are close enough, so the same search works for both. */
const byMax = () => GRP.rule === "max";
const byChaos = () => GRP.rule === "chaos";     // "Kaos": a random split, level and earlier groups don't count
const byEven = () => GRP.rule === "even";       // "Lige hold": only for the matches now (an old setting becomes 25-50-25)
const groupsByMix = () => GRP.rule === "mix";   // "25-50-25": over time 25 % with more experienced, 50 % same level, 25 % less
const freeRule = () => byChaos() || byEven();   // anyone may be with anyone
const noSlider = () => freeRule() || byMax() || groupsByMix();   // these place by their own aim: the slider doesn't apply
const NO_LEVEL = name => ({ name: name, lo: -Infinity, hi: Infinity });
const HAIR = 1e-6;
function strictBand(p) {
  if (!isFinite(p.lo) || !isFinite(p.hi)) return p;      // no level: fits everywhere
  return p.lo === p.hi ? { name: p.name, lo: p.lo - 0.5 + HAIR, hi: p.hi + 0.5 - HAIR }
                       : { name: p.name, lo: p.lo + HAIR, hi: p.hi - HAIR };
}
function grpMeet(a, b) {
  if (groupsByMix()) return bandsFit(a, b);
  if (freeRule()) return true;
  if (!byMax()) return bandsMeet(strictBand(a), strictBand(b));
  return nivOf(a) == null || nivOf(b) == null || Math.abs(nivOf(a) - nivOf(b)) <= GRP.maxDiff + 1e-9;
}
function searchBand(p) {
  if (freeRule()) return NO_LEVEL(p.name);
  if (!byMax()) return strictBand(p);
  return nivOf(p) != null ? { name: p.name, lo: nivOf(p), hi: nivOf(p) + GRP.maxDiff } : { name: p.name, lo: -Infinity, hi: Infinity };
}
const ruleNote = (a) => bandText(a.lo, a.hi);
/* The text after the size on a group card: the shared level, or the range of max levels */
function groupLevelText(g) {
  if (!g.length || byChaos()) return "";
  if (byEven() || groupsByMix()) { const a = groupAverage(g); return a == null ? "" : "gns. niveau " + a.toFixed(2).replace(".", ","); }
  if (byMax()) {
    const m = g.map(p => p.lo).filter(Number.isFinite), lo = Math.min.apply(null, m), hi = Math.max.apply(null, m);
    return m.length ? "Fra " + (lo === hi ? nivText(lo) : nivText(lo) + "–" + nivText(hi)) : "alle niveauer";
  }
  const lev = groupLevel(g);
  return "niveau " + bandText(lev.lo, lev.hi);
}

/* The same screen is used in two places: under a training (key = its date) and in the Grupper tab
   (key = the chosen date + " fri"). box: where it is drawn; reopen: how to open it again after a new login. */
function startGroups(key, box, reopen) {
  GRP = Object.assign(grpSettings(), { key: key, box: box, reopen: reopen, data: null, byName: {}, present: new Set(),
                                       groups: null, saved: "", dirty: false, sel: null, nonce: 0, msg: "", bad: false });
  if (!box.dataset.wired) {                             // the tab's box stays on the page: listen only once
    box.addEventListener("click", grpClick);
    box.addEventListener("input", grpInput);
    box.dataset.wired = "1";
  }
  box.innerHTML = "<p>Henter spillere …</p>";
  loadGroupData();
}

function openGroups(index) {
  const s = SESSIONS[index];
  if (!s) return;
  if (!canGroup()) { requireLogin(function () { openGroups(index); }); return; }
  if (GRP && GRP.box && GRP.box.id === "grp-tab" && unsavedText()) { leaveGroups(function () { openGroups(index); }); return; }   // the tab's unsaved work
  openViewer(danishDate(s.iso, s.date), [{ title: "Grupper", html: '<div id="grp-v" class="grp"></div>' }],
             document.getElementById("sheader-" + index), function () { openSession(index); });
  startGroups(sessionKey(s), document.getElementById("grp-v"), function () { openGroups(index); });
}

/* The Grupper tab: groups for a date without a training (today, unless another date is chosen) */
function openGroupsTab() {
  const date = document.getElementById("grp-date");
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date.value)) date.value = todayIso();
  const key = date.value + " fri", box = document.getElementById("grp-tab");
  if (GRP && GRP.box === box && GRP.key === key && GRP.data) { renderGroups(); return; }   // back to the tab: keep what is there
  startGroups(key, box, function () { showView("groups"); });
}
document.getElementById("grp-date").addEventListener("change", function () {
  if (GRP && GRP.box === document.getElementById("grp-tab") && GRP.dirty &&
      !confirm("Grupperne er ikke gemt. Skift dato alligevel?")) { this.value = GRP.key.slice(0, 10); return; }
  openGroupsTab();
});

/* ---- Unsaved groups or matches: asked before they are lost ----
   Leaving a training's Grupper ("Tilbage", Escape), opening another training's Grupper over unsaved work in the
   Grupper tab, and closing or reloading the app. 25-50-25 and Spilleroversigt only learn from what is saved. */
function unsavedText() {
  if (!GRP || !GRP.data || !GRP.box || !GRP.box.isConnected) return "";
  const groups = GRP.dirty && GRP.groups && GRP.groups.some(g => g.length);
  const matches = GRP.matchesDirty && GRP.matches && GRP.matches.length && GRP.matchesFor === groupsSignature();
  return groups && matches ? "Grupperne og kampene" : groups ? "Grupperne" : matches ? "Kampene" : "";
}
function leaveGroups(proceed) {
  const what = unsavedText();
  if (!what) { proceed(); return; }
  if (document.querySelector(".leave-ask")) return;       // already asking
  const want = GRP, back = document.activeElement;
  const box = document.createElement("div");
  box.className = "login leave-ask";
  box.setAttribute("role", "dialog"); box.setAttribute("aria-modal", "true"); box.setAttribute("aria-labelledby", "leave-title");
  box.innerHTML = `<div class="login-box"><h2 id="leave-title">${what} er ikke gemt</h2>
    <p>Gemte grupper og kampe bruges til at variere de næste grupper og kampe og til Spilleroversigt.</p>
    <div class="login-actions" style="flex-wrap:wrap">
      <button type="button" class="clearbtn" data-leave="stay">Bliv</button>
      <button type="button" class="clearbtn" data-leave="drop">Luk uden at gemme</button>
      <button type="button" class="login-go" data-leave="save">Gem og luk</button></div></div>`;
  document.body.appendChild(box);
  const close = function () { box.remove(); };
  box.addEventListener("keydown", function (e) { if (e.key === "Escape") { e.stopPropagation(); close(); if (back) back.focus(); } });
  box.addEventListener("click", function (e) {
    const b = e.target.closest("[data-leave]");
    if (!b) return;
    close();
    if (b.dataset.leave === "stay") { if (back && back.isConnected) back.focus(); return; }
    if (b.dataset.leave === "save" && GRP === want) {    // on the phone at once, sent in the background (see saveNow)
      if (want.dirty && want.groups.some(g => g.length)) keepForLater(want, "groups", want.groups.filter(g => g.length).map(g => g.map(p => p.name)));
      if (want.matchesDirty && want.matches && want.matches.length) keepForLater(want, "matches", want.matches.map(m => m.teams.map(t => t.map(p => p.name))));
      sendQueue();
    }
    if (GRP === want) { want.dirty = false; want.matchesDirty = false; }   // (dropped: not asked again for these)
    proceed();
  });
  box.querySelector('[data-leave="save"]').focus();
}
window.addEventListener("beforeunload", function (e) {   // closing or reloading the app: the browser asks
  if (unsavedText() || (FIX && FIX.dirty && FIX.touched)) { e.preventDefault(); e.returnValue = ""; }
});

/* "Tirsdag den 3. november 2026", with "(uden træning)" for groups made in the Grupper tab */
function keyLabel(key) {
  const m = /^(\d{4}-\d{2}-\d{2})( fri)?$/.exec(key || "");
  return m ? danishDate(m[1], key) + (m[2] ? " (uden træning)" : "") : key;
}

/* ---- Spilleroversigt: per player, from the saved groups ----
   Attendance: in how many of the saved trainings (and groups made in the tab) the player was in a group.
   Level mix: over the last 12 of those, the share of teammates who were more experienced, at the same level
   and less experienced (by Niveau, the middle of the band, less than half a level apart counting as the same level, like the 25/50/25
   ambition: levelWeights, a soft transition around half a level). Most frequent teammates: over all of them. */
let OV_SORT = "name";

function openPlayerOverview() {
  if (!canGroup()) { requireLogin(function () { showView("overview"); }); return; }
  readStoredGroups().then(function (c) { if (c) renderOverview(); });   // at once from the phone's copy, then the newest
  fetchGroupData().then(renderOverview, function (err) {
    if (GRP_CACHE) return;                              // the phone's copy is shown
    if (/LOGIN/.test(String(err && err.message))) requireLogin(function () { showView("overview"); });
    else document.getElementById("ov").innerHTML = `<p>Kunne ikke hente spillerne: ${esc(String(err && err.message || err))}</p>`;
  });
}
document.getElementById("ov").addEventListener("click", function (e) {
  const b = e.target.closest("[data-sort]");
  if (b) { OV_SORT = b.dataset.sort; renderOverview(); }
  const h = e.target.closest("[data-hist]");
  if (h) openPlayerHistory(h.dataset.hist, h);
});

/* ---- One player's history: training groups, training matches and real matches (the Kampe tab) ----
   From the saved data on the phone, newest first. With each teammate, opponent or match: ↑ (more experienced / harder),
   = (the same level) or ↓, by the same rules as Spilleroversigt (today's bands; hidden with "Niveauer: Skjul"). */
let HIST = null;
function openPlayerHistory(name, opener) {
  if (!GRP_CACHE) return;
  HIST = { name: name, kind: "all" };
  openViewer(name, [{ title: "Historik for " + name, html: '<div id="hist" class="grp"></div>' }], opener || null, null);
  document.getElementById("hist").addEventListener("click", function (e) {
    const b = e.target.closest("[data-hk]");
    if (b) { HIST.kind = b.dataset.hk; renderPlayerHistory(); }
  });
  renderPlayerHistory();
}
const dominant = w => w[1] > 0.5 + 1e-9 || Math.abs(w[0] - w[2]) < 1e-9 ? "=" : w[0] > w[2] ? "↑" : "↓";
const mixText = w => `↑ ${Math.round(100 * w[0])} · = ${Math.round(100 * w[1])} · ↓ ${Math.round(100 * w[2])} %`;

/* Every saved thing the player took part in: [{ date, kind: "groups" | "tmatches" | "fixtures", title, lines: [html] }] */
function playerHistory(name, data) {
  const by = {}; data.players.forEach(p => { by[p.name] = p; });
  const me = by[name], lvl = p => p && isBand(p) ? p : p && nivOf(p) != null ? nivOf(p) : NaN, shown = showLevels();
  const tag = (other, w) => esc(other) + (shown && w ? ` <span class="hist-c">${dominant(w)}</span>` : "");
  const out = [];
  Object.keys(data.history || {}).forEach(function (key) {
    const groups = data.history[key].groups, gi = groups.findIndex(g => g.indexOf(name) !== -1);
    if (gi === -1) return;
    const mates = groups[gi].filter(n => n !== name);
    const ws = mates.map(n => hasLevel(lvl(me)) && hasLevel(lvl(by[n])) ? levelWeights(lvl(me), lvl(by[n])) : null);
    const known = ws.filter(Boolean), avg = known.length ? [0, 1, 2].map(r => known.reduce((x, w) => x + w[r], 0) / known.length) : null;
    out.push({ date: key.slice(0, 10), kind: "groups", title: keyLabel(key), what: "Træningsgruppe",
      lines: [`Gruppe ${gi + 1} med ${mates.map((n, i) => tag(n, ws[i])).join(", ") || "ingen andre"}`].concat(shown && avg ? [`<span class="hist-mix">${mixText(avg)}</span>`] : []) });
  });
  Object.keys(data.matches || {}).forEach(function (key) {
    data.matches[key].matches.forEach(function (teams, mi) {
      const ti = teams.findIndex(t => t.indexOf(name) !== -1);
      if (ti === -1) return;
      const mates = teams[ti].filter(n => n !== name), opp = [].concat(...teams.filter((t, j) => j !== ti));
      const w = hasLevel(lvl(me)) ? matchShare(lvl(me), mates.concat(opp).map(n => lvl(by[n])).filter(hasLevel)) : null;
      const one = n => hasLevel(lvl(me)) && hasLevel(lvl(by[n])) ? levelWeights(lvl(me), lvl(by[n])) : null;
      out.push({ date: key.slice(0, 10), kind: "tmatches", title: keyLabel(key), what: "Kamp til træning",
        lines: [`Kamp ${mi + 1}, hold ${"ABC".charAt(ti)}${shown && w ? ` <span class="hist-c">${dominant(w)}</span>` : ""}`,
          `Med ${mates.map(n => tag(n, one(n))).join(", ") || "ingen andre"}`, `Mod ${opp.map(n => tag(n, one(n))).join(", ")}`] });
    });
  });
  setsInOrder(data).forEach(function ([id, set]) {
    const mine = set.games.filter(g => g.players.indexOf(name) !== -1), could = set.games.some(g => (g.avail || []).indexOf(name) !== -1);
    mine.forEach(function (g) {
      const w = me ? fixtureWeights(me, g.level) : null, locked = (g.locked || []).indexOf(name) !== -1;
      out.push({ date: g.date || setFirstDate(set), kind: "fixtures", title: g.date ? keyLabel(g.date) : esc(set.name), what: "Kamp",
        lines: [`${esc(g.name)} · niveau ${g.level}${shown && w && idealLevel(me) != null ? ` <span class="hist-c">${dominant(w)}</span>` : ""}${locked ? " · 📌 udtaget af træneren" : ""}`,
          `<span class="hist-set">${esc(set.name)}</span>`] });
    });
    if (!mine.length && could) out.push({ date: setFirstDate(set), kind: "fixtures", title: setFirstDate(set) ? keyLabel(setFirstDate(set)) : esc(set.name), what: "Kamp",
      lines: [`Reserve (til rådighed, men ikke på en kamp)`, `<span class="hist-set">${esc(set.name)}</span>`], reserve: true });
  });
  const rank = { fixtures: 0, tmatches: 1, groups: 2 };     // the same day: the matches at the end of a training come after its groups
  return out.sort((a, b) => b.date.localeCompare(a.date) || rank[a.kind] - rank[b.kind]);
}

function renderPlayerHistory() {
  const box = document.getElementById("hist");
  if (!box || !HIST || !GRP_CACHE) return;
  const all = playerHistory(HIST.name, GRP_CACHE.data), p = GRP_CACHE.data.players.find(x => x.name === HIST.name);
  const n = k => all.filter(e => e.kind === k && !e.reserve).length, res = all.filter(e => e.reserve).length;
  const list = HIST.kind === "all" ? all : all.filter(e => e.kind === HIST.kind);
  const chip = (k, label) => `<button type="button" data-hk="${k}" aria-pressed="${HIST.kind === k}">${label}</button>`;
  box.innerHTML = `<p class="grp-hint">${p && showLevels() && Number.isFinite(p.lo) ? "Bånd " + bandText(p.lo, p.hi) + " · " : ""}${n("groups")} ${n("groups") === 1 ? "træning" : "træninger"} · ${n("tmatches")} ${n("tmatches") === 1 ? "kamp" : "kampe"} til træning · ${n("fixtures")} ${n("fixtures") === 1 ? "kamp" : "kampe"}${res ? ` (${res}× reserve)` : ""}</p>
    <div class="grp-mode grp-wrap" role="group" aria-label="Vis">${chip("all", "Alt")}${chip("groups", "Træningsgrupper")}${chip("tmatches", "Kampe til træning")}${chip("fixtures", "Kampe")}</div>
    ${showLevels() ? `<p class="grp-hint" style="margin-top:10px">↑ = mere øvet / sværere · = samme niveau · ↓ = mindre øvet / lettere (ud fra spillernes bånd i dag).</p>` : ""}
    <div class="hist-list">${list.map(e => `<div class="hist-e${e.reserve ? " hist-res" : ""}"><div class="hist-h"><b>${e.title}</b><span class="hist-k">${e.what}</span></div>${e.lines.map(l => `<p>${l}</p>`).join("")}</div>`).join("")
      || `<p class="grp-hint">Intet gemt endnu.</p>`}</div>`;
}

function renderOverview() {
  const box = document.getElementById("ov");
  if (!box || !GRP_CACHE) return;
  const data = GRP_CACHE.data;
  const keys = Object.keys(data.history).sort().reverse();          // newest first
  const sessions = keys.map(k => data.history[k].groups);
  const skill = {};
  data.players.forEach(p => { if (nivOf(p) != null) skill[p.name] = isBand(p) ? p : nivOf(p); });   // the band, compared by overlap
  const mix = skillMix(sessions, skill);                             // over the last 12, as the groups use it
  const mKeys = Object.keys(data.matches || {}).sort().reverse();
  const mMix = matchMix(mKeys.map(k => data.matches[k].matches), name => skill[name] == null ? NaN : skill[name]);
  const spared = spareCounts(mKeys.map(k => data.matches[k].matches));
  const byNameOv = {}; data.players.forEach(p => { byNameOv[p.name] = p; });
  const fixHist = fixtureHistory(setsInOrder(data).map(e => e[1]), name => byNameOv[name] || null);
  const leveled = data.players.filter(p => nivOf(p) != null);   // each player's aim against those in the squad they may be with
  const stats = data.players.map(function (p) {
    let times = 0, last = "";
    const mates = {};
    keys.forEach(function (k) {
      const g = data.history[k].groups.find(x => x.indexOf(p.name) !== -1);
      if (!g) return;
      times++; if (!last) last = k;
      g.forEach(o => { if (o !== p.name) mates[o] = (mates[o] || 0) + 1; });
    });
    const top = Object.keys(mates).sort((a, b) => mates[b] - mates[a] || a.localeCompare(b, "da")).slice(0, 3);
    return { p: p, times: times, last: last, mix: mix[p.name], mmix: mMix[p.name], top: top.map(n => n + " (" + mates[n] + ")") };
  });
  stats.sort(OV_SORT === "times" ? (a, b) => b.times - a.times || a.p.name.localeCompare(b.p.name, "da")
                                 : (a, b) => a.p.name.localeCompare(b.p.name, "da"));
  const pct = (m, r) => Math.round(100 * m[r] / m[3]);
  const segs = shares => `<span class="ov-more" style="width:${100 * shares[0]}%"></span><span class="ov-same" style="width:${100 * shares[1]}%"></span>` +
    `<span class="ov-less" style="width:${100 * shares[2]}%"></span>`;
  /* One section (Grupper or Kampe): the actual mix as a bar, the player's aim as a thinner bar right under it with
     the same colours (so the edges can be compared), and the numbers */
  /* The three numbers with what they mean: "↑ 0 · = 39 · ↓ 61 %" (the arrows in the colours of the bar) */
  const arrows = v => `<i class="ov-up">↑</i>&#8239;${v[0]} · <i class="ov-eq">=</i>&#8239;${v[1]} · <i class="ov-dn">↓</i>&#8239;${v[2]} %`;
  const names = ["spiller op", "samme niveau", "spiller ned"];
  function section(title, count, m, aim, empty, extra) {
    const has = m && m[3];
    const shares = has ? [0, 1, 2].map(r => m[r] / m[3]) : null;
    const label = has ? `${title}: ${[0, 1, 2].map(r => pct(m, r) + " % " + names[r]).join(", ")}.` : `${title}: ${empty}.`;
    const goal = aim ? ` Mål: ${[0, 1, 2].map(r => Math.round(100 * aim[r]) + " % " + names[r]).join(", ")}.` : "";
    return `<div class="ov-sec"><div class="ov-sechead"><span class="ov-title">${title}</span><small>${has ? count : empty}${extra || ""}</small></div>
      <div class="ov-bars" role="img" aria-label="${esc(label + goal)}">
        <span class="ov-lab">Faktisk</span><div class="ov-bar${has ? "" : " ov-empty"}">${has ? segs(shares) : ""}</div>
        <span class="ov-val">${has ? arrows([0, 1, 2].map(r => pct(m, r))) : "–"}</span>
        ${aim ? `<span class="ov-lab ov-goal">Mål</span><div class="ov-bar ov-aim">${segs(aim)}</div><span class="ov-val ov-goal">${arrows(aim.map(x => Math.round(100 * x)))}</span>` : ""}</div></div>`;
  }
  const rows = stats.map(function (s) {
    const band = s.p.lo == null || !showLevels() ? "" : `<span class="grp-band">${bandText(s.p.lo, s.p.hi)}</span>`;
    const seen = s.times ? `${s.times} af ${keys.length} · sidst ${esc(shortDate(s.last.slice(0, 10)))}` : "Ikke med i gemte grupper endnu";
    const me = nivOf(s.p), others = leveled.filter(o => o !== s.p && bandsFit(s.p, o)).map(o => isBand(o) ? o : nivOf(o));
    const aim = me == null ? null : playerAim(isBand(s.p) ? s.p : me, others);
    const why = !aim || Math.abs(aim[1] - 0.5) <= 0.005 ? ""
      : aim[0] < 0.005 && aim[2] < 0.005 ? "Alle, hvis bånd overlapper spillerens, er på samme niveau, så målet er samme niveau."
      : aim[0] < 0.005 ? "Ingen er mere øvede at spille op med, så målet er mere på samme niveau."
      : aim[2] < 0.005 ? "Ingen er mindre øvede at spille ned med, så målet er mere på samme niveau."
      : "Dem, spilleren kan spille op og ned med, overlapper spillerens bånd en del, så målet er lidt mere på samme niveau.";
    const alone = spared[s.p.name] ? ` · ${spared[s.p.name]}× uden modspiller` : "";
    const body = me == null ? `<p class="ov-line">Har intet niveau i fanen Spillere, så niveau-mixet kan ikke regnes ud.</p>`
      : section("Grupper", s.mix && s.mix[3] ? `${s.mix[3]} ${s.mix[3] === 1 ? "træning" : "træninger"}` : "", s.mix, aim, "ingen gemte grupper endnu") +
        section("Kampe til træning", s.mmix && s.mmix[3] ? `${s.mmix[3]} ${s.mmix[3] === 1 ? "kamp" : "kampe"}` : "", s.mmix, aim, "ingen gemte kampe endnu", alone) +
        (function () {                                       // the Kampe tab: real matches, by the ideal match level
          const f = fixHist[s.p.name] || { mix: [0, 0, 0, 0], reserves: 0 };
          const res = f.reserves ? ` · ${f.reserves}× reserve` : "";
          return section("Kampe", f.mix[3] ? `${f.mix[3]} ${f.mix[3] === 1 ? "kamp" : "kampe"}` : "", f.mix, isBand(s.p) ? fixtureAim(s.p) : null, "ingen gemte kampe endnu", res);
        })() +
        (why ? `<p class="ov-line">${why}</p>` : "");
    return `<div class="ov-p"><div class="ov-head"><button type="button" class="ov-name" data-hist="${esc(s.p.name)}" title="Se historik for ${esc(s.p.name)}"><strong>${esc(s.p.name)}</strong></button> ${band}<span class="ov-seen">${seen}</span></div>` +
      body + (s.top.length ? `<p class="ov-line">Oftest med: ${esc(s.top.join(", "))}</p>` : "") +
      `<button type="button" class="clearbtn ov-histbtn" data-hist="${esc(s.p.name)}">Se historik ›</button></div>`;
  }).join("");
  box.innerHTML = `<p class="grp-hint grp-explain">Bygger på ${keys.length} gemte ${keys.length === 1 ? "træning" : "træninger"}. ` +
    `For hver spiller: med hvem de har været i grupper og kampe (de seneste 12 træninger), og målet for dem.</p>
    <details class="ov-how"><summary>Sådan regnes det</summary>
      <p><b>Niveau</b> er spillerens Fra. Har to spillere samme Fra, tæller den med det smalleste bånd (lavest Til) som lidt mere øvet. Spillere kommer kun i gruppe eller kamp sammen, hvis deres bånd overlapper (bånd, der kun rører hinanden, er ikke nok).</p>
      <p><b>↑ Spiller op</b> betyder med mere øvede spillere, <b>= samme niveau</b> med spillere på omtrent samme niveau, og <b>↓ spiller ned</b> med mindre øvede spillere.</p>
      <p><b>Grupper:</b> hver medspiller i gruppen tæller som op, samme eller ned. <b>Kampe til træning:</b> hver af de andre spillere i kampen (begge hold) tæller som op, samme eller ned, så en kamp med mest mere øvede spillere er en kamp, hvor spilleren spiller op.</p>
