        <button type="button" class="favbtn" data-i="${i}" aria-pressed="${isFav(d)}"

/* ===================== Copy the link of a drill (for the session sheet) ===================== */
/* Copies the link both as plain text and as a named link (pasting into a Sheets cell can then
   give the drill's name as a link). Falls back to the browser's clipboard API if needed. */
function copyRich(url, name) {
  const html = '<a href="' + esc(url) + '">' + esc(name) + '</a>';
  let wrote = false;
  const onCopy = function (e) {
    e.clipboardData.setData("text/plain", url);
    e.clipboardData.setData("text/html", html);
    e.preventDefault();
    wrote = true;
  };
  document.addEventListener("copy", onCopy);
  const ta = document.createElement("textarea");
  ta.value = url;
  ta.setAttribute("readonly", "");
  ta.style.cssText = "position:fixed;left:-9999px;top:0;opacity:0";
  document.body.appendChild(ta);
  ta.select();
  ta.setSelectionRange(0, ta.value.length);            // iPhone needs this
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (err) { ok = false; }
  document.removeEventListener("copy", onCopy);
  ta.remove();
  if (ok && wrote) return Promise.resolve(true);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(url).then(() => true, () => false);
  }
  return Promise.resolve(ok);
}

let TOAST_TIMER = null;
function showToast(msg, url) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  if (url) {                                           // copying was blocked: show the link so it can be copied by hand
    const inp = document.createElement("input");
    inp.readOnly = true;
    inp.value = url;
    inp.setAttribute("aria-label", "Link til øvelsen");
    inp.addEventListener("focus", () => inp.select());
    t.appendChild(inp);
    setTimeout(() => inp.focus(), 0);
  }
  t.classList.remove("view-hidden");
  clearTimeout(TOAST_TIMER);
  TOAST_TIMER = setTimeout(() => t.classList.add("view-hidden"), url ? 12000 : 2500);
}

function hideToast() {
  clearTimeout(TOAST_TIMER);
  document.getElementById("toast").classList.add("view-hidden");
}

/* "Kopieret ✓" on the button for a moment, plus a message at the bottom */
function markCopied(btn, msg) {
  const lbl = btn.querySelector(".lbl");
  if (lbl) { lbl.textContent = "Kopieret ✓"; setTimeout(() => { lbl.textContent = "Kopiér link"; }, 1600); }
  showToast(msg);
}

function copyDrillLink(d, btn) {
  const url = safeUrl(isFckLink(exerciseLink(d)) ? appDrillLink(d) : exerciseLink(d));
  if (!url) { showToast("Øvelsen har intet ID at lave et link af."); return; }
  copyRich(url, d["Navn"]).then(function (ok) {
    if (!ok) { showToast("Kunne ikke kopiere automatisk. Markér og kopiér linket:", url); return; }
    markCopied(btn, "Link kopieret: " + d["Navn"]);
  });
}

/* Star on a card or in the viewer: save or remove a favourite */
document.addEventListener("click", function (e) {
  const b = e.target.closest(".favbtn");
  if (!b) return;
  const d = b.id === "v-fav" ? V.drill : LIB_LIST[+b.dataset.i];
  if (!d) return;
  const on = toggleFav(d);
  setFavButton(b, on, d["Navn"]);
  showToast(on ? "Gemt som favorit: " + d["Navn"] : "Fjernet fra favoritter: " + d["Navn"]);
  if (!LIB) return;
  if (FAV_ONLY) { renderLibrary(); return; }                          // the list of favourites changed
  const i = LIB_LIST.indexOf(d);                                     // keep the card and the viewer in step
  const card = i === -1 ? null : document.querySelector('#drill-grid .favbtn[data-i="' + i + '"]');
  if (card && card !== b) setFavButton(card, on, d["Navn"]);
  renderLibStatus(LIB_LIST.length, LIB_QUERY || FAV_ONLY || LIB_FILTERS.some(f => SEL[f.col].size));
});

/* ===================== Full-screen drill viewer (swipe between pages) ===================== */
const V = { n: 0, idx: 0, opener: null, drill: null, session: -1 };
const reduceMotion = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const INERT_IDS = ["nav-bar", "sessions", "library"];

/* Drill pages: related elements are grouped on one scrolling page, so there is little swiping.
   1. Øvelsen: diagram, practical facts and all the red tags (the first thing you need on the pitch)
   2. Sådan gør du: video, description, field
   3. Fokus og variation: focus points, variations, competition
   4. Mere: all tags, notes and the link. Columns not listed here (extra columns in the sheet) end up here too. */
const LIB_GROUPS = [
  { title: "Sådan gør du",         cols: ["Video", "Beskrivelse", "Materialer", "Felt"] },
  { title: "Fokus og variation",   cols: ["Læringsmål", "Fokuspunkter", "Variationer", "Konkurrence"] },
  { title: "Mere",                 cols: ["Noter", "Link"], takesRest: true, tags: true }
];

/* Practical facts as grey chips: age, players, duration, field size */
function factChips(d) {
  const bane = cleanVal(d["Banestørrelse"]);
  const facts = [].concat(
    rawVals(d, "Aldersgruppe"),
    [
      rangeText(d["Antal spillere min"], d["Antal spillere max"], "spillere"),
      rangeText(d["Varighed min"], d["Varighed max"], "min"),
      bane ? "Bane: " + bane : ""
    ].filter(Boolean));
  const chips = facts.map(t => `<span class="dchip">${esc(t)}</span>`);
  const kamp = cleanVal(d["Kampnærhed"]), lv = (kamp.match(/^[1-5]/) || [""])[0];
  if (lv) chips.push(`<span class="dchip kamp" title="Kampnærhed: ${esc(kamp)}">Kampnærhed ${lv}/5</span>`);
  return chips.length ? `<div class="dchips">${chips.join("")}</div>` : "";
}

/* First page: diagram on top, then the facts, then the main focus tags */
/* Shown instead of the diagram when a drill has no picture (or its picture can't be loaded).
   A faded, generic pitch – clearly labelled, so nobody takes it for the drill itself. */
const PITCH_SVG = '<svg viewBox="0 0 300 200" preserveAspectRatio="xMidYMid meet" aria-hidden="true" fill="none" stroke="#d2d2d2" stroke-width="2">' +
  '<rect x="10" y="10" width="280" height="180" rx="2"/><line x1="150" y1="10" x2="150" y2="190"/><circle cx="150" cy="100" r="26"/>' +
  '<rect x="10" y="55" width="40" height="90"/><rect x="250" y="55" width="40" height="90"/>' +
  '<rect x="10" y="80" width="14" height="40"/><rect x="276" y="80" width="14" height="40"/></svg>';

function diagramPlaceholder(d) {
  const hasVideo = !!(d && cleanVal(d["Video"]));
  return `<div class="ph-diagram" role="img" aria-label="Pladsholder: der er intet billede af denne øvelse">${PITCH_SVG}` +
    `<div class="ph-label"><strong>Pladsholder</strong>Der er intet billede af denne øvelse. Tegningen viser ikke øvelsen.` +
    (hasVideo ? "<br>Se videoen under »Sådan gør du«." : "") + `</div></div>`;
}

/* Shown where the video would be, when a drill has no video. Same look as the picture placeholder. */
const PLAY_SVG = '<svg viewBox="0 0 48 48" aria-hidden="true">' +
  '<circle cx="24" cy="24" r="21" fill="none" stroke="#c9c9c9" stroke-width="3"/><path d="M19 14 L35 24 L19 34 Z" fill="#c9c9c9"/></svg>';

function videoPlaceholder(d) {
  const hasPicture = !!(d && cleanVal(d["Diagram"]));
  return `<div class="ph-diagram ph-video" role="img" aria-label="Pladsholder: der er ingen video af denne øvelse">${PLAY_SVG}` +
    `<div class="ph-label"><strong>Pladsholder</strong>Der er ingen video af denne øvelse.` +
    (hasPicture ? "<br>Se tegningen under »Øvelsen«." : "") + `</div></div>`;
}

/* An image that can't be loaded is swapped for the placeholder */
function brokenDiagram(img) {
  const slide = img.closest(".g-slide");       // one picture of several: only that one goes
  if (slide && slide.parentNode.querySelectorAll(".g-slide").length > 1) {
    const g = slide.parentNode;
    slide.remove();
    galleryStep(g, 0);
    return;
  }
  const box = img.closest(".v-diagram");
  if (box) box.innerHTML = diagramPlaceholder(V.drill);
}

function firstPage(d) {
  const diagramDef = libSections().find(x => x.col === "Diagram");
  const diagram = diagramDef ? libBody(diagramDef, d) : "";

  // all red tags: category and every focus tag
  const red = splitVals(d, "Format").map(v => `<span class="dchip cat">${esc(v)}</span>`)
    .concat(focusTags(d).map(v => `<span class="dchip focus">${esc(v)}</span>`));

  return `<div class="v-diagram">${diagram || diagramPlaceholder(d)}</div>` +
         factChips(d) +
         (red.length ? `<div class="dchips">${red.join("")}</div>` : "");
}

/* Last page: every tag of the drill, grouped */
function tagsSection(d) {
  const row = (label, cls, vals) => vals.length
    ? `<div class="tag-row"><div class="tag-label">${esc(label)}</div><div class="dchips">${vals.map(v => `<span class="dchip ${cls}">${esc(v)}</span>`).join("")}</div></div>`
    : "";
  const html = row("Tema", "sub", splitVals(d, "Temaer")) +
               row("Undertema", "sub", splitVals(d, "Undertemaer")) +
               row("Fokus", "focus", focusTags(d)) +
               row("Format", "cat", splitVals(d, "Format")) +
               row("Kampnærhed", "sub", rawVals(d, "Kampnærhed")) +
               row("Kilde", "sub", splitVals(d, "Kilde"));
  return html ? `<section class="v-sec"><h3>Tags</h3>${html}</section>` : "";
}

function drillPages(d) {
  const grouped = new Set([].concat.apply([], LIB_GROUPS.map(g => g.cols)).concat(["Diagram"]));
  const pages = [];

  const first = firstPage(d);
  if (first) pages.push({ title: "Øvelsen", html: first });

  LIB_GROUPS.forEach(function (g) {
    let defs = g.cols.map(col => libSections().find(x => x.col === col)).filter(Boolean);
    if (g.takesRest) defs = defs.concat(libSections().filter(x => !grouped.has(x.col)));

    let html = (g.tags ? tagsSection(d) : "") + defs.map(function (def) {
      const body = libBody(def, d) || (def.col === "Video" ? videoPlaceholder(d) : "");
      return body ? `<section class="v-sec"><h3>${esc(def.title)}</h3>${body}</section>` : "";
    }).join("");

    if (html) pages.push({ title: g.title, html: html });
  });
  return pages;
}

function openDrill(i) {
  const d = LIB_LIST[i];
  if (!d) return;
  openViewer(d["Navn"], drillPages(d), document.getElementById("dheader-" + i), null, d);
}

/* ---- training sessions in the same viewer ---- */
/* The exercise ID in a link: from both the old and the new DBU address, and from a Pasbygger link (?d=ID) */
function exerciseIdFromUrl(u) {
  const m = String(u || "").match(/[?&](?:exerciseId|id)=(\d+)/i);
  if (m) return m[1];
  const p = String(u || "").match(/[?&]d=([^&#]+)/);
  try { return p ? decodeURIComponent(p[1]) : ""; } catch (e) { return ""; }
}

/* The drill behind a station: first by the ID in its link, then by its name */
function findDrillFor(item) {
  if (!LIB || !item) return null;
  const id = exerciseIdFromUrl(item.url);
  if (id) {
    const d = LIB.drills.find(x => cleanVal(x["ID"]) === id);
    if (d) return d;
  }
  const key = tagKey(item.text || "");
  return key ? (LIB.drills.find(x => tagKey(x["Navn"]) === key) || null) : null;
}

/* Fetches one drill that a session station uses. No login needed: the server only hands out drills
   that are used in the session plan, never the whole library. */
const SESSION_DRILLS = {};      // id -> drill
const SESSION_PENDING = {};    // id -> callbacks waiting for the answer
function loadSessionDrills(ids, cb) {
  ids = ids.filter((id, i) => id && ids.indexOf(id) === i && !SESSION_DRILLS[id] && !SESSION_PENDING[id]);
  if (!ids.length) return;
  ids.forEach(id => { SESSION_PENDING[id] = []; });
  const finish = function (res) {
    ids.forEach(function (id) {
      const cbs = SESSION_PENDING[id] || [];
      delete SESSION_PENDING[id];
      const d = res && res.drills.find(x => cleanVal(x["ID"]) === id);
      if (d) SESSION_DRILLS[id] = applyLang(d);
      cbs.forEach(f => f(d || null));
    });
  };
  api("getSessionDrills", [ids]).then(function (res) {
      if (res && !LIB) {                                  // the same tidy-up of tags as in the library
        setAliases(res.aliases);
        res.drills.forEach(d => { SESSION_DRILLS[cleanVal(d["ID"])] = applyLang(d); });
        buildCanon(Object.values(SESSION_DRILLS));
        MINI = { sections: sectionsFor(res.headers) };
      }
      finish(res);
    }, function () { finish(null); });
}

/* Opens one drill; if it is already fetched it is instant, otherwise it waits for the fetch */
function fetchSessionDrill(drillId, cb) {
  if (SESSION_DRILLS[drillId]) { cb(SESSION_DRILLS[drillId]); return; }
  showToast("Åbner øvelsen…");
  const done = function (d) { hideToast(); cb(d); };
  if (SESSION_PENDING[drillId]) SESSION_PENDING[drillId].push(done);
  else { loadSessionDrills([drillId]); SESSION_PENDING[drillId].push(done); }
}

/* Fetch a session's drills in the background (one call), so the tap is instant */
function prefetchSession(s) {
  if (LIB || !s) return;
  loadSessionDrills(SESSION_ITEMS.map(it => s[it[1]] && s[it[1]].drillId).filter(Boolean));
}

/* Tap on a station: open the swipeable drill; "Tilbage" returns to the session */
function openSessionItem(index, key) {
  const item = SESSIONS[index] && SESSIONS[index][key];
  if (!item) return;
  const open = function (d) {
    if (d) openViewer(d["Navn"], drillPages(d), V.opener, function () { openSession(index); }, d);
    else if (safeUrl(item.url)) window.open(safeUrl(item.url), "_blank", "noopener");
  };
  const fromLibrary = LIB ? findDrillFor(item) : null;       // logged in: the library is already loaded
  if (fromLibrary) open(fromLibrary);
  else if (item.drillId) fetchSessionDrill(item.drillId, open);
  else open(null);
}

/* The parts of a training, in order: label shown in the app + key (the same keys as STATION_KEYS in Code.gs) */
const SESSION_ITEMS = [
  ["Fælles opstart", "startup"], ["Station 1", "station1"], ["Station 2", "station2"],
  ["Station 3", "station3"], ["Station 4", "station4"], ["Fælles afslutning", "finish"]
];

function sessionPages(s, index) {
  const items = SESSION_ITEMS
    .map(it => ({ label: it[0], key: it[1], v: s[it[1]] }))
    .filter(it => it.v && (it.v.text || safeUrl(it.v.url)));

  // A station that belongs to a drill in the library opens that drill (swipeable).
  // Other links open in a new tab, and a row without a link is plain text.
  const rows = items.map(function (it) {
    const url = safeUrl(it.v.url);
    const isDrill = !!it.v.drillId || !!findDrillFor(it.v);
    const coachTxt = (it.v.coaches && it.v.coaches.length) ? ` <span class="v-coach">(${it.v.coaches.map(esc).join(", ")})</span>` : "";
    const text = `<span class="v-plan-text"><small class="v-lab">${esc(it.label)}${coachTxt}</small>${it.v.text ? `<strong class="v-name">${esc(it.v.text)}</strong>` : ""}</span>`;
    if (isDrill) {
      return `<button type="button" class="v-planrow" onclick="openSessionItem(${index}, '${it.key}')">${text}<span class="chevron go" aria-hidden="true"></span></button>`;
    }
    return url
      ? `<a class="v-planrow" href="${esc(url)}" target="_blank" rel="noopener">${text}<span class="v-go" aria-hidden="true">↗</span></a>`
      : `<div class="v-planrow plain">${text}</div>`;
  }).join("");

  let html = sessionChips(s);
  if (s.notes && s.notes.length) {      // notes first, directly under the session name
    html += `<section class="v-sec v-notes"><h3>Noter</h3>` +
      s.notes.map(p => libLink(p.url, p.text) || `<span>${escLines(p.text)}</span>`).join(" ") + `</section>`;
  }
  html += items.length ? `<div class="v-plan">${rows}</div>` : "<p>Intet planlagt.</p>";
  return [{ title: s.focus || danishDate(s.iso, s.date), html: html }];
}

function openSession(index) {
  const s = SESSIONS[index];
  if (!s) return;
  prefetchSession(s);
  openViewer(danishDate(s.iso, s.date), sessionPages(s, index), document.getElementById("sheader-" + index));
  V.session = index;
  const short = shortDate(s.iso);
  if (short) {                    // the long date becomes a small rounded badge; the full date stays for screen readers
    document.getElementById("v-title").innerHTML =
      `<span class="v-datebadge" aria-hidden="true">${esc(short)}</span><span class="v-sr">${esc(danishDate(s.iso, s.date))}</span>`;
  }
  document.getElementById("v-share").classList.toggle("view-hidden", !s.iso);   // a link needs a date
}

/* ---- Link to one training: <app address>?s=2026-10-19 ---- */
function sessionLink(s) {
  if (!s || !s.iso) return "";
  return location.origin + location.pathname + "?s=" + encodeURIComponent(s.iso);
}

function copySessionLink(btn) {
  const s = SESSIONS[V.session];
  const url = sessionLink(s);
  if (!url) { showToast("Linket er ikke klar endnu. Prøv igen om lidt."); return; }
  copyRich(url, "Træning " + danishDate(s.iso, s.date)).then(function (ok) {
    if (!ok) { showToast("Kunne ikke kopiere automatisk. Markér og kopiér linket:", url); return; }
    markCopied(btn, "Link kopieret til træningen " + danishDate(s.iso, s.date));
  });
}

/* Opened through a training link: show that training straight away */
/* FCK's drill bank has no address for a single drill (a drill opens as a pop-up on its front page).
   So "Kopiér link" on an FCK drill gives a Pasbygger link instead, which opens the drill here. */
function isFckLink(u) {
  try { return new URL(u).hostname === "fck.better-coaching.dk"; } catch (e) { return false; }
}

/* <app address>?d=FCK-1677: opens that drill in the app (after the coach code) */
function appDrillLink(d) {
  const id = cleanVal(d && d["ID"]);
  if (!id) return "";
  return location.origin + location.pathname + "?d=" + encodeURIComponent(id);
}

/* Opened through a drill link (?d=...): ask for the code if needed, then show that drill */
function openDrillFromUrl() {
  const want = new URLSearchParams(location.search).get("d");
  if (!want) return;
  requireLogin(function () {
    loadLibrary(function () {
      const d = LIB && LIB.drills.find(x => cleanVal(x["ID"]) === want);
      if (d) openViewer(d["Navn"], drillPages(d), null, null, d);
      else showToast("Øvelsen findes ikke (længere) i øvelsesbanken.");
    });
  });
}

function openSessionFromUrl() {
  const want = new URLSearchParams(location.search).get("s");
  const i = want ? SESSIONS.findIndex(x => x.iso === want) : -1;
  if (i !== -1) openSession(i);
}

/* ---- Usage statistics (tab "Statistik" in the sheet). Nothing that identifies a person or a phone is sent:
   the phone only says whether it is the first time it opens the app today. ---- */
function track() {
  const args = Array.prototype.slice.call(arguments);
  try { api("track", args).catch(function () { /* statistics are not important enough to bother anyone */ }); } catch (e) { /* ignore */ }
}

function trackOpen() {
  let first = true;
  try {
    first = localStorage.getItem("oevSeenDay") !== todayIso();
    localStorage.setItem("oevSeenDay", todayIso());
  } catch (e) { /* no storage: counted as a new phone */ }
  track("open", first);
}

function openViewer(title, pages, opener, onBack, drill) {
  if (drill) track("drill", cleanVal(drill["ID"]), cleanVal(drill["Navn"]));
  V.opener = opener;
  V.drill = drill || null;        // set for drills: shows the copy-link button
  document.getElementById("v-copy").classList.toggle("view-hidden", !V.drill || !isAuthed());
  const fav = document.getElementById("v-fav");
  fav.classList.toggle("view-hidden", !V.drill);
  document.getElementById("v-lang").innerHTML = langSwitch(V.drill, "");
  if (V.drill) setFavButton(fav, isFav(V.drill), V.drill["Navn"]);
  V.session = -1;                 // openSession sets it afterwards, which shows the share button
  document.getElementById("v-share").classList.add("view-hidden");
  V.onBack = onBack || null;      // set when a drill was opened from a session: Tilbage goes back to it
  V.n = pages.length;

  document.getElementById("v-title").textContent = title;
  document.getElementById("v-pages").innerHTML = pages.map((p, k) =>
    `<section class="v-page" id="vp-${k}" aria-label="${esc(p.title)}"><div class="v-inner"><h2>${esc(p.title)}</h2>${p.html}</div></section>`).join("");
  document.getElementById("v-tabs").innerHTML = pages.map((p, k) =>
    `<button type="button" class="v-tab" role="tab" data-i="${k}">${esc(p.title)}</button>`).join("");
  document.getElementById("v-dots").innerHTML = pages.map((p, k) =>
    `<button type="button" class="dot" data-i="${k}" aria-label="Side ${k + 1}: ${esc(p.title)}"></button>`).join("");

  const single = pages.length < 2;                        // one page: no tabs, dots or arrows
  document.getElementById("v-tabs").classList.toggle("view-hidden", single);
  document.getElementById("v-bottom").classList.toggle("view-hidden", single);

  INERT_IDS.forEach(id => document.getElementById(id).setAttribute("inert", ""));
  document.body.classList.add("noscroll");
  document.getElementById("viewer").classList.remove("view-hidden");
  document.getElementById("v-pages").scrollLeft = 0;
  V.idx = -1;
  updateViewer(0);
  document.getElementById("v-back").focus();
}

function goBack() {
  if (V.onBack) { const f = V.onBack; V.onBack = null; f(); } else closeDrill();
}

function closeDrill() {
  V.onBack = null;
  document.getElementById("viewer").classList.add("view-hidden");
  document.getElementById("v-pages").innerHTML = "";      // also stops any playing video
  INERT_IDS.forEach(id => document.getElementById(id).removeAttribute("inert"));
  document.body.classList.remove("noscroll");
  if (PENDING_SESSIONS) {                                 // a newer plan arrived while the training was open
    PENDING_SESSIONS = false;
    renderSessions(LATEST);
    V.opener = null;                                      // the old card is gone
  }
  if (V.opener) V.opener.focus();
}

function updateViewer(idx) {
  idx = Math.max(0, Math.min(V.n - 1, idx));
  if (idx === V.idx) return;
  V.idx = idx;
  document.querySelectorAll("#v-tabs .v-tab").forEach(function (t, k) {
    t.setAttribute("aria-selected", k === idx);
    if (k === idx) t.scrollIntoView({ inline: "center", block: "nearest" });
  });
  document.querySelectorAll("#v-dots .dot").forEach((t, k) => t.setAttribute("aria-current", k === idx));
  document.getElementById("v-prev").disabled = idx === 0;
  document.getElementById("v-next").disabled = idx === V.n - 1;
}

function goPage(i) {
  i = Math.max(0, Math.min(V.n - 1, i));
  const el = document.getElementById("v-pages");
  el.scrollTo({ left: i * el.clientWidth, behavior: reduceMotion() ? "auto" : "smooth" });
  updateViewer(i);
}

(function () {
  const pagesEl = document.getElementById("v-pages");
  let ticking = false;
  pagesEl.addEventListener("scroll", function () {      // swiping: work out which page we are on
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function () {
      ticking = false;
      if (pagesEl.clientWidth) updateViewer(Math.round(pagesEl.scrollLeft / pagesEl.clientWidth));
    });
  });
  document.getElementById("v-tabs").addEventListener("click", e => {
    const t = e.target.closest(".v-tab"); if (t) goPage(+t.dataset.i);
  });
  document.getElementById("v-dots").addEventListener("click", e => {
    const t = e.target.closest(".dot"); if (t) goPage(+t.dataset.i);
  });
  document.getElementById("v-prev").addEventListener("click", () => goPage(V.idx - 1));
  document.getElementById("v-next").addEventListener("click", () => goPage(V.idx + 1));
  document.getElementById("v-back").addEventListener("click", goBack);
  document.addEventListener("keydown", function (e) {
    if (!document.getElementById("login").classList.contains("view-hidden")) return;
    if (document.getElementById("viewer").classList.contains("view-hidden")) return;
    if (e.key === "Escape") goBack();
    else if (e.key === "ArrowRight") goPage(V.idx + 1);
    else if (e.key === "ArrowLeft") goPage(V.idx - 1);
  });
})();
</script>
