<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pasbygger</title>
  <meta name="theme-color" content="#AD152F">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Pasbygger">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <style>
    /* One place to change the red everywhere */
    :root {
      --red: #AD152F;
      --red-tint: #F7E8EB;     /* very light version of the red, used behind link buttons */
    }

    /* Width and height include padding and border, so nothing sticks out of its box */
    *, *::before, *::after { box-sizing: border-box; }

    /* One keyboard-focus style for every button, link and field */
    :focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }

    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 20px;
      /* keep clear of the notch and the home bar when opened from the home screen */
      padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right))
               max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
    }

    #sessions {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .card {
      background: #ffffff;
      border-top: 6px solid var(--red);
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .theme {
      color: var(--red);
    }

    /* ---------- Loading screen ---------- */
    .loading {
      position: fixed;
      inset: 0;                    /* covers the whole visible area */
      z-index: 10;
      overflow: hidden;            /* clips at the screen edge */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #666;
    }

    .spinner {
      --size: 120px;               /* change this one value to resize everything */

      position: relative;
      width: var(--size);
      height: var(--size);
      border-radius: 50%;
      border: calc(var(--size) * 0.03) solid #111;   /* black outer ring */
      background: #ffffff;
      animation: spin 1.2s linear infinite;
    }

    .spinner::before {
      content: "";
      position: absolute;
      inset: calc(var(--size) * 0.04);               /* white gap between ring and stripes */
      border-radius: 50%;
      background: linear-gradient(90deg,
        #ffffff 0 25%,
        var(--red) 25% 75%,
        #ffffff 75% 100%)
        center / calc(var(--size) * 0.21) 100% repeat-x;
    }

    .loading span {
      transition: opacity 0.2s;
    }

    .loading.done span {
      opacity: 0;                  /* the loading text fades out first */
    }

    .loading.done .spinner {
      scale: var(--grow, 12);      /* set by the script to fit the screen */
      opacity: 0;
      transition: scale 0.45s ease-in, opacity 0.2s ease-in 0.25s;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ---------- Next session + past sessions ---------- */
    .card.next {
      box-shadow: 0 0 0 2px var(--red), 0 4px 14px rgba(0,0,0,0.15);
    }

    .tag {
      display: inline-block;
      margin-bottom: 8px;
      padding: 3px 10px;
      background: var(--red);
      color: #ffffff;
      font-size: 13px;
      font-weight: bold;
      border-radius: 99px;
    }

    .card.past {
      opacity: 0.75;
    }

    .past-group {
      grid-column: 1 / -1;
    }

    .past-group > summary {
      cursor: pointer;
      padding: 12px 16px;
      background: #ffffff;
      color: var(--red);
      font-weight: bold;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .past-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    /* ---------- Card header with fold chevron ---------- */
    .header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
    }

    .header:focus-visible {
      outline-offset: 4px;
      border-radius: 8px;
    }

    .header-text {
      min-width: 0;                /* lets long themes wrap instead of pushing the chevron out */
    }

    .header-text h3 {
      margin: 6px 0 0;
    }

    .chevron {
      flex: none;
      position: relative;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--red-tint);
      transition: transform 0.2s, background 0.15s;
    }

    .chevron::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 8px;
      height: 8px;
      border-right: 2px solid var(--red);
      border-bottom: 2px solid var(--red);
      transform: translate(-50%, -70%) rotate(45deg);   /* points down */
    }

    .chevron.open {
      transform: rotate(180deg);                         /* points up */
    }

    .header:hover .chevron {
      background: var(--red);
    }

    .header:hover .chevron::before {
      border-color: #ffffff;
    }

    .notes a {
      margin: 4px 6px 4px 0;       /* space between separate note links */
    }

    /* ---------- Navigation and drill library ---------- */
    .view-hidden { display: none !important; }

    .nav { display: flex; gap: 8px; margin-bottom: 18px; }
    .navbtn {
      padding: 10px 18px; border: 0; border-radius: 99px;
      background: #ffffff; color: #333; font: inherit; font-weight: bold;
      box-shadow: 0 1px 4px rgba(0,0,0,0.12); cursor: pointer;
    }
    .navbtn[aria-current="page"] { background: var(--red); color: #ffffff; }

    #lib-search {
      width: 100%; max-width: 480px;
      padding: 11px 14px; border: 1px solid #d6d6d6; border-radius: 10px;
      font: inherit; background: #ffffff;
    }
    .fgroup { margin-top: 14px; }
    .fgroup-label { margin-bottom: 6px; color: #666; font-size: 13px; font-weight: bold; }
    .tagbtn {
      margin: 0 6px 6px 0; padding: 6px 12px; border: 1px solid #d6d6d6; border-radius: 99px;
      background: #ffffff; color: #222; font: inherit; font-size: 14px; cursor: pointer;
    }
    .tagbtn .n { margin-left: 4px; color: #888; font-size: 12px; }
    .tagbtn[aria-pressed="true"] { background: var(--red); border-color: var(--red); color: #ffffff; }
    .tagbtn[aria-pressed="true"] .n { color: #ffffff; }
    .tagbtn:disabled { opacity: 0.4; cursor: default; }

    .lib-loading { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 48px 0; color: #666; }
    .lib-loading .spinner { --size: 64px; }
    .lib-status { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 14px 0; color: #555; }
    .clearbtn {
      padding: 4px 10px; border: 1px solid var(--red); border-radius: 99px;
      background: none; color: var(--red); font: inherit; font-size: 14px; cursor: pointer;
    }

    #drill-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px; align-items: start;
    }
    .grid-more { grid-column: 1 / -1; justify-self: center; }
    .dchips { margin-top: 8px; }
    .dchip {
      display: inline-block; margin: 0 6px 6px 0; padding: 2px 10px; border-radius: 99px;
      background: #f0f0f0; font-size: 13px;
    }
    .dchip.cat { background: var(--red-tint); color: var(--red); font-weight: bold; }
    .dsec { margin-bottom: 18px; }
    .dsec h4 { margin: 0 0 6px; color: var(--red); font-size: 15px; }
    .dsec p, .dsec ul { margin: 0; }
    .dsec ul { padding-left: 20px; }
    .media { display: block; width: 100%; border-radius: 8px; }
    iframe.media { aspect-ratio: 16 / 9; border: 0; }
    img.media { max-height: 520px; object-fit: contain; background: #ffffff; }

    .dfocus { margin: 4px 0 0; color: #555; font-size: 14px; }
    .filter-panel { margin-top: 14px; }
    .filter-panel > summary {
      display: inline-block; padding: 8px 14px; border-radius: 99px; background: #ffffff;
      box-shadow: 0 1px 4px rgba(0,0,0,0.12); color: var(--red); font-weight: bold; cursor: pointer;
    }

    /* ---------- Full-screen drill viewer ---------- */
    body.noscroll { overflow: hidden; }
    .chevron.go::before { transform: translate(-70%, -50%) rotate(-45deg); }   /* points right */

    .viewer {
      position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column;
      background: #f4f4f4;
    }
    .v-top {
      display: flex; align-items: center; gap: 12px; padding: 10px 14px;
      padding-top: calc(10px + env(safe-area-inset-top, 0px));
      background: #ffffff; border-bottom: 3px solid var(--red);
    }
    .v-back {
      flex: none; padding: 9px 14px; border: 0; border-radius: 99px;
      background: var(--red-tint); color: var(--red); font: inherit; font-weight: bold; cursor: pointer;
    }
    .v-datebadge {
      display: inline-block; padding: 3px 14px; border-radius: 10px;
      background: var(--red-tint); color: var(--red); font-size: 18px; font-weight: 800; line-height: 1.3;
    }
    .v-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .v-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: bold; }
    .v-tabs {
      display: flex; gap: 6px; overflow-x: auto; padding: 8px 14px; background: #ffffff; scrollbar-width: none;
    }
    .v-tabs::-webkit-scrollbar, .v-pages::-webkit-scrollbar { display: none; }
    .v-tab {
      flex: none; padding: 6px 12px; border: 1px solid #d6d6d6; border-radius: 99px;
      background: #ffffff; font: inherit; font-size: 14px; white-space: nowrap; cursor: pointer;
    }
    .v-tab[aria-selected="true"] { background: var(--red); border-color: var(--red); color: #ffffff; }

    .v-pages {
      flex: 1; min-height: 0; display: flex; overflow-x: auto; overflow-y: hidden;
      scroll-snap-type: x mandatory; overscroll-behavior-x: contain; scrollbar-width: none;
    }
    .v-page {
      position: relative; flex: 0 0 100%; overflow-y: auto;
      scroll-snap-align: start; scroll-snap-stop: always; padding: 16px;
    }
    .v-inner {
      max-width: 760px; margin: 0 auto; padding: 18px; background: #ffffff;
      border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .v-inner h2 { margin: 0 0 12px; color: var(--red); font-size: 22px; }
    .v-inner h3 { margin: 0 0 8px; color: var(--red); font-size: 18px; }
    .v-inner p, .v-inner li, .v-inner span { font-size: 17px; line-height: 1.5; }
    .v-inner p { margin: 0 0 10px; }
    .v-inner li { margin: 8px 0; }
    .v-inner ul { margin: 0; padding-left: 22px; }
    .v-focus { font-size: 19px !important; font-weight: bold; margin-bottom: 14px !important; }
    .v-inner a {
      display: inline-block; margin: 4px 6px 4px 0; padding: 10px 16px; background: var(--red-tint);
      color: var(--red); font-weight: bold; text-decoration: none; border-radius: 8px;
      border-left: 4px solid var(--red);
    }
    .v-inner a::after { content: " ↗"; }
    .v-inner img.media { max-height: 65vh; }
    .dchip.sub { background: #ffffff; border: 1px solid #d6d6d6; }
    .dchip.focus { background: #ffffff; border: 1px solid var(--red); color: var(--red); }
    .dchip.more { background: #ffffff; border: 1px solid #d6d6d6; color: #555555; }
    .dchip[hidden] { display: none; }
    .dchip.kamp { background: #e6eef8; color: #1f4e8c; }
    button.dchip.more { font: inherit; font-size: 13px; line-height: inherit; cursor: pointer; }
    button.dchip.more:hover { border-color: var(--red); color: var(--red); }

    .v-bottom {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px)); background: #ffffff; border-top: 1px solid #ddd;
    }
    .v-nav {
      flex: none; width: 46px; height: 46px; border: 0; border-radius: 50%;
      background: var(--red); color: #ffffff; font-size: 24px; line-height: 1; cursor: pointer;
    }
    .v-nav:disabled { opacity: 0.3; cursor: default; }
    .v-dots { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
    .dot { width: 12px; height: 12px; padding: 0; border: 0; border-radius: 50%; background: #cccccc; cursor: pointer; }
    .dot[aria-current="true"] { background: var(--red); transform: scale(1.35); }

    .loading.done { pointer-events: none; }
    .build { margin: 28px 0 0; color: #999999; font-size: 12px; }

    .v-sec + .v-sec { margin-top: 22px; padding-top: 18px; border-top: 1px solid #eeeeee; }
    .dchips + .v-sec { margin-top: 18px; }

    /* ---------- Rows of a training (one per station) ---------- */
    .v-plan { display: flex; flex-direction: column; gap: 8px; min-width: 0; margin-top: 4px; }
    .v-planrow {
      display: flex; align-items: center; justify-content: space-between; gap: 14px;
      width: 100%; max-width: 100%; padding: 12px 14px; border: 1px solid #e3e3e3; border-radius: 10px;
      background: #fafafa; color: inherit; font: inherit; text-align: left; cursor: pointer;
    }
    .v-planrow:hover { border-color: var(--red); }
    .v-planrow .v-lab { display: block; color: #555555; font-size: 14px; font-weight: 600; letter-spacing: .02em; }
    .v-planrow .v-coach { color: var(--red); font-size: inherit; font-weight: inherit; letter-spacing: inherit; }
    .v-planrow .v-name { display: block; margin-top: 2px; font-size: 19px; line-height: 1.25; font-weight: 700; }
    .v-plan-text { min-width: 0; overflow-wrap: anywhere; }
    .v-inner .v-plan + .v-sec { margin-top: 22px; }
    .v-inner .v-notes { margin: 0 0 18px; }

    .v-inner a.v-planrow {
      display: flex; margin: 0; padding: 12px 14px; background: #fafafa; color: inherit;
      border: 1px solid #e3e3e3; border-radius: 10px; font-weight: normal; text-decoration: none;
    }
    .v-inner a.v-planrow::after { content: none; }
    .v-inner a.v-planrow:hover, .v-inner a.v-planrow:focus-visible { border-color: var(--red); background: var(--red-tint); }
    .v-planrow.plain { cursor: default; }

    /* bigger arrows on the rows, so it is clear that they can be tapped */
    .v-planrow .chevron { width: 40px; height: 40px; }
    .v-planrow .chevron::before { width: 11px; height: 11px; border-right-width: 3px; border-bottom-width: 3px; }
    .v-planrow:hover .chevron { background: var(--red); }
    .v-planrow:hover .chevron::before { border-color: #ffffff; }
    .v-planrow .v-go {
      flex: none; display: inline-flex; align-items: center; justify-content: center;
      width: 40px; height: 40px; border-radius: 50%; background: var(--red-tint);
      color: var(--red); font-size: 22px; font-weight: bold; line-height: 1;
    }

    .fsub { margin: 6px 0 10px; }
    .fsub-label { display: block; margin-bottom: 6px; color: #888888; font-size: 12px; font-weight: bold; }
    .fsearch {
      display: block; width: 100%; max-width: 320px; margin: 0 0 8px; padding: 8px 12px;
      border: 1px solid #d6d6d6; border-radius: 10px; font: inherit; font-size: 14px; background: #ffffff;
    }
    .fnone { color: #888888; font-size: 14px; }
    .moretoggle {
      margin: 2px 0 0; padding: 4px 0; border: 0; background: none; color: var(--red);
      font: inherit; font-size: 14px; font-weight: bold; cursor: pointer;
    }

    .v-findbtn {
      display: block; width: 100%; max-width: 100%; margin: 14px 0 0; padding: 12px 14px; border: 1px solid var(--red);
      border-radius: 10px; background: #ffffff; color: var(--red); font: inherit; font-weight: bold;
      text-align: left; cursor: pointer;
    }
    .v-findbtn:hover, .v-findbtn:focus-visible { background: var(--red-tint); }
    .v-findbtn + .v-sec { margin-top: 22px; }

    .var-list { list-style: none; padding-left: 0 !important; }
    .var-list li { display: flex; align-items: flex-start; gap: 10px; }
    .sign {
      flex: none; display: inline-flex; align-items: center; justify-content: center;
      width: 24px; height: 24px; margin-top: 2px; border-radius: 50%; font-weight: bold; line-height: 1;
    }
    .sign.plus { background: #e3f2e5; color: #1b5e20; }
    .sign.minus { background: #fdebd8; color: #8a4b00; }
    .sign.pm { background: #eeeeee; color: #444444; }
    .sign.neutral { background: #e6eef8; color: #1f4e8c; }   /* a variation that is neither easier nor harder */
    .var-list li.var-head { display: block; margin-top: 8px; font-weight: bold; }
    .link-note { margin: 2px 0 0 !important; color: #777777; font-size: 14px !important; }

    .lib-note {
      margin: 12px 0 0; padding: 10px 12px; border-left: 4px solid var(--red); border-radius: 8px;
      background: #ffffff; color: #444444; font-size: 14px;
    }
    .lib-note:empty { display: none; }

    .card-actions { display: flex; align-items: center; gap: 10px; margin-top: 10px; padding-top: 10px; border-top: 1px solid #eeeeee;
      container: cardact / inline-size; }
    /* With the flag switch there is not always room for "Kopiér link" on one line: then only the link icon */
    @container cardact (max-width: 305px) {
      .card-actions:has(.langbtn) .copybtn .lbl { display: none; }
      .card-actions:has(.langbtn) .copybtn { padding: 7px 10px; }
    }
    .src-badge {
      margin-left: auto; padding: 3px 8px; border: 1px solid #d6d6d6; border-radius: 6px;
      color: #666666; font-size: 12px; font-weight: bold; letter-spacing: 0.04em;
    }
    .copybtn {
      display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border: 1px solid #d6d6d6;
      border-radius: 99px; background: #ffffff; color: var(--red); font: inherit; font-size: 14px;
      font-weight: bold; white-space: nowrap; cursor: pointer;
    }
    .copybtn:hover { background: var(--red-tint); border-color: var(--red); }
    #v-copy, #v-share { flex: none; margin-left: auto; }
    /* Danish/English switch on translated drills */
    .langbtn {
      flex: none; display: inline-flex; align-items: center; gap: 2px; padding: 4px 6px; border: 1px solid #d6d6d6;
      border-radius: 99px; background: #ffffff; cursor: pointer;
    }
    .langbtn .flag { display: inline-flex; padding: 2px; border-radius: 4px; opacity: 0.35; }
    .langbtn .flag.on { opacity: 1; box-shadow: 0 0 0 2px var(--red); }
    .langbtn svg { display: block; border-radius: 2px; }
    @media (max-width: 480px) {                  /* room for the title when the flags are in the top bar */
      .v-top:has(#v-lang .langbtn) #v-copy .lbl { display: none; }
      .v-top:has(#v-lang .langbtn) #v-copy { padding: 7px 9px; }
    }

    /* Favourite star (on the card, in the viewer) and the "Favoritter" switch above the list */
    .favbtn {
      flex: none; display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px;
      padding: 0; border: 1px solid #d6d6d6; border-radius: 50%; background: #ffffff; color: #999999; cursor: pointer;
    }
    .favbtn:hover { border-color: var(--red); color: var(--red); }
    .favbtn[aria-pressed="true"] { border-color: #e0a800; background: #fff6d6; color: #c98a00; }
    .favbtn[aria-pressed="true"] svg { fill: currentColor; }
    .favfilter {
      display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border: 1px solid #d6d6d6;
      border-radius: 99px; background: #ffffff; color: #555555; font: inherit; font-size: 14px; cursor: pointer;
    }
    .favfilter[aria-pressed="true"] { border-color: #e0a800; background: #fff6d6; color: #8a5d00; font-weight: bold; }
    .favfilter[aria-pressed="true"] svg { fill: currentColor; }
    .toast {
      position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
      z-index: 40; width: max-content; max-width: calc(100% - 32px); padding: 12px 16px;
      border-radius: 12px; background: #222222; color: #ffffff; font-size: 15px; box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }
    .toast input {
      display: block; width: 100%; margin-top: 8px; padding: 8px 10px;
      border: 0; border-radius: 8px; font: inherit; font-size: 14px;
    }

    .v-diagram { margin-bottom: 14px; }
    /* Placeholder when a drill has no picture: a faded, generic pitch with a clear label */
    .ph-diagram {
      position: relative; display: flex; align-items: center; justify-content: center; aspect-ratio: 3 / 2;
      max-height: 60vh; border: 2px dashed #c9c9c9; border-radius: 8px; background: #f7f7f7; overflow: hidden;
    }
    .ph-diagram svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .ph-diagram.ph-video { aspect-ratio: 16 / 9; flex-direction: column; gap: 10px; }
    .ph-diagram.ph-video svg { position: static; width: 56px; height: 56px; }
    .ph-label {
      position: relative; max-width: 80%; padding: 10px 14px; border-radius: 10px; background: rgba(255,255,255,0.92);
      box-shadow: 0 1px 4px rgba(0,0,0,0.12); color: #555555; font-size: 14px; text-align: center;
    }
    .ph-label strong { display: block; margin-bottom: 2px; color: #333333; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; }
    .v-diagram img.media { width: 100%; max-height: 60vh; }
    /* Several pictures (FA sessions): one at a time, with arrows and the picture's own text */
    .g-slide { display: none; margin: 0; }
    .g-slide.on, .g-single { display: block; }
    .g-slide figcaption, .g-single figcaption { margin-top: 8px; color: #444444; font-size: 14px; line-height: 1.45; }
    .g-nav { display: flex; align-items: center; justify-content: center; gap: 18px; margin-top: 8px; }
    .g-btn {
      width: 40px; height: 40px; border: 0; border-radius: 50%; background: var(--red-tint); color: var(--red);
      font: inherit; font-size: 24px; line-height: 1; cursor: pointer;
    }

<script>
/* Runs before the main script. If the main script breaks (for example after an edit),
   or the app has not started after 25 seconds, the spinner is replaced by a message. */
(function () {
  function show(msg) {
    if (window.APP_STARTED) return;
    var box = document.getElementById("sessions");
    if (box) box.innerHTML = '<p style="grid-column:1/-1">' + msg + '</p>';
  }
  window.addEventListener("error", function (e) {
    show("Appen kunne ikke starte. Fejl: " + String(e.message || "ukendt").replace(/[<>&]/g, ""));
  });
  setTimeout(function () { show("Appen svarer ikke. Tjek forbindelsen og genindlæs siden."); }, 25000);
})();

<script>
window.APP_STARTED = false;

/* Shows any JavaScript error in the small grey line at the bottom of the page (for testing) */
window.addEventListener("error", function (e) {
  const el = document.getElementById("build");
  if (el) el.textContent += " · Fejl: " + e.message;
});

/* The chain-link icon used on every "Kopiér link" button */
const LINK_ICON = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>';
const STAR_ICON = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.8l2.85 5.78 6.38.93-4.62 4.5 1.09 6.35L12 17.36l-5.7 3 1.09-6.35-4.62-4.5 6.38-.93z"/></svg>';
const FLAG_DK = '<svg viewBox="0 0 37 28" width="22" height="16" aria-hidden="true"><rect width="37" height="28" fill="#c8102e"/><rect x="12" width="4" height="28" fill="#fff"/><rect y="12" width="37" height="4" fill="#fff"/></svg>';
const FLAG_NO = '<svg viewBox="0 0 22 16" width="22" height="16" aria-hidden="true"><rect width="22" height="16" fill="#ba0c2f"/><rect x="6" width="4" height="16" fill="#fff"/><rect y="6" width="22" height="4" fill="#fff"/><rect x="7" width="2" height="16" fill="#00205b"/><rect y="7" width="22" height="2" fill="#00205b"/></svg>';
const FLAG_GB = '<svg viewBox="0 0 60 30" width="22" height="16" aria-hidden="true"><path d="M0 0h60v30H0z" fill="#012169"/><path d="M0 0l60 30M60 0L0 30" stroke="#fff" stroke-width="6"/><path d="M0 0l60 30M60 0L0 30" stroke="#c8102e" stroke-width="2"/><path d="M30 0v30M0 15h60" stroke="#fff" stroke-width="10"/><path d="M30 0v30M0 15h60" stroke="#c8102e" stroke-width="6"/></svg>';

/* ===================== Drills in two languages =====================
   A drill with columns like "Beskrivelse (DA)" has a Danish translation next to the original text: English
   (FA) or Norwegian (NFF). LANG decides which one is shown: the original ("en") unless the user picks Danish
   ("da") with the flag switch on such a drill (that changes it for all of them at once).
   The original is kept in d.__en, so switching back and forth never loses anything. */
const LANG_COLS = ["Navn", "Beskrivelse", "Læringsmål", "Fokuspunkter", "Variationer", "Noter", "Materialer", "Konkurrence", "Felt",
  "Billedtekster"];
const DA = c => c + " (DA)";
let LANG = "en";
try { if (localStorage.getItem("oevLang") === "da") LANG = "da"; } catch (e) { /* default: the original English */ }

const hasDa = d => !!d && LANG_COLS.some(c => cleanVal(d[DA(c)]));

function applyLang(d) {
  if (!hasDa(d)) return d;
  if (!d.__en) { d.__en = {}; LANG_COLS.forEach(c => { d.__en[c] = d[c] || ""; }); }
  LANG_COLS.forEach(c => { d[c] = LANG === "da" && cleanVal(d[DA(c)]) ? d[DA(c)] : d.__en[c]; });
  d.__text = null;                           // the search text is made again (it covers both languages)
  return d;
}

/* The original language of a translated drill: Norwegian for the NFF exercises, otherwise English */
const isNorwegian = d => cleanVal(d["Kilde"]) === "NFF" || /^NFF-/.test(String(d["ID"] || ""));

function langSwitch(d, id) {
  if (!hasDa(d)) return "";
  const no = isNorwegian(d);
  const label = LANG === "da" ? (no ? "Vis på norsk (originalsprog)" : "Vis på engelsk (originalsprog)") : "Vis på dansk (oversat)";
  return `<button type="button" class="langbtn"${id ? ` id="${id}"` : ""} aria-label="${label}" title="${label}">` +
    `<span class="flag${LANG === "da" ? " on" : ""}">${FLAG_DK}</span><span class="flag${LANG === "en" ? " on" : ""}">${no ? FLAG_NO : FLAG_GB}</span></button>`;
}

function setLang(l) {
  LANG = l;
  try { localStorage.setItem("oevLang", l); } catch (e) { /* not remembered */ }
  if (LIB) LIB.drills.forEach(applyLang);
  Object.keys(SESSION_DRILLS).forEach(k => applyLang(SESSION_DRILLS[k]));
  if (!document.getElementById("viewer").classList.contains("view-hidden") && V.drill && hasDa(V.drill)) {
    const page = V.idx;                       // the open drill is drawn again on the same page
    openViewer(V.drill["Navn"], drillPages(V.drill), V.opener, V.onBack, V.drill);
    goPage(page);
  }
  if (LIB) {
    const y = window.scrollY;
    renderLibrary();
    window.scrollTo(0, y);
  }
  showToast(l === "da" ? "Oversatte øvelser vises på dansk." : "Oversatte øvelser vises på originalsproget (engelsk/norsk).");
}

document.addEventListener("click", function (e) {
  if (!e.target.closest(".langbtn")) return;
  setLang(LANG === "da" ? "en" : "da");
});

/* ===================== Favourites =====================
   Kept on this phone only (localStorage), so each coach has their own. A drill is known by its ID,
   or by its name when it has no ID, so a favourite survives the library being updated. */
const FAV_KEY = "oevFavs";
const FAVS = new Set();
let FAV_ONLY = false;           // the "Favoritter" switch above the list
try { (JSON.parse(localStorage.getItem(FAV_KEY) || "[]") || []).forEach(k => FAVS.add(String(k))); }
catch (e) { /* storage not available: favourites last until the page is reloaded */ }

function favKey(d) {
  const id = cleanVal(d && d["ID"]);
  return id ? "id:" + id : "navn:" + tagKey((d && d["Navn"]) || "");
}
const isFav = d => FAVS.has(favKey(d));

function toggleFav(d) {
  const k = favKey(d);
  if (FAVS.has(k)) FAVS.delete(k); else FAVS.add(k);
  try { localStorage.setItem(FAV_KEY, JSON.stringify(Array.from(FAVS))); } catch (e) { /* not saved */ }
  return FAVS.has(k);
}

function setFavButton(btn, on, name) {
  btn.setAttribute("aria-pressed", on ? "true" : "false");
  btn.setAttribute("aria-label", (on ? "Fjern fra favoritter: " : "Gem som favorit: ") + (name || ""));
  btn.title = on ? "Fjern fra favoritter" : "Gem som favorit";
}

document.querySelectorAll("#v-share, #v-copy").forEach(b => b.insertAdjacentHTML("afterbegin", LINK_ICON));
document.getElementById("v-fav").innerHTML = STAR_ICON;

/* ===================== Connection to the Google Sheet ===================== */
/* The address of the Apps Script web app (Deploy → Manage deployments → Web app URL, ends in /exec) */
const API_URL = "https://script.google.com/macros/s/AKfycby9CvNLV4fDCcGOLwGCbsKxQ6XJmC3j3q8ElGVHbQa3EGpHn5Bh-JmOnzWcjTzA37C8/exec";

/* Calls a function in Code.gs, e.g. api("login", [code]). Gives back what the function returns.
   The body is sent as plain text, which Google accepts from another website without extra checks. */
function api(action, args) {
  const ctrl = window.AbortController ? new AbortController() : null;
  const timer = ctrl && setTimeout(function () { ctrl.abort(); }, 30000);   // give up after 30 seconds
  return fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ action: action, args: args || [] }),
    signal: ctrl ? ctrl.signal : undefined
  })
    .finally(function () { clearTimeout(timer); })
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(function (res) {
      if (res && res.error) throw new Error(res.error);
      return res ? res.result : null;
    });
}

/* ---- Start: show the last saved plan at once, then fetch the newest one ---- */
const SESSIONS_KEY = "oevSessions";            // the plan is saved on the phone, so the app also opens offline
let LATEST = null;                             // the newest plan we have
let STARTED = false, SHOWN = false, PENDING_SESSIONS = false;

function viewerOpen() {
  return !document.getElementById("viewer").classList.contains("view-hidden");
}

function gotSessions(sessions) {
  window.APP_STARTED = true;
  LATEST = sessions;
  if (!STARTED) { STARTED = true; expandSpinner(firstRender); return; }
  if (!SHOWN) return;                          // the first render is about to show LATEST anyway
  if (viewerOpen()) { PENDING_SESSIONS = true; return; }   // don't change the list under an open training
  renderSessions(LATEST);
}

function firstRender() {
  SHOWN = true;
  try {
    renderSessions(LATEST);
    openSessionFromUrl();
    openDrillFromUrl();
    trackOpen();
    if (isAuthed()) loadLibrary(null, true);   // only when already logged in: loads the drills in the background
  } catch (err) {
    clearLoading();
    document.getElementById("sessions").innerHTML =
      '<p style="grid-column:1/-1">Kunne ikke vise træningerne: ' + esc(err.message) + '</p>';
  }
}

(function start() {
  if (API_URL.indexOf("PASTE_") === 0) {
    clearLoading();
    document.getElementById("sessions").innerHTML =
      '<p style="grid-column:1/-1">Appen mangler adressen til Google Sheet-scriptet (API_URL i index.html).</p>';
    return;
  }
  let saved = null;
  try { saved = localStorage.getItem(SESSIONS_KEY); } catch (e) { /* storage not available */ }
  if (saved) {
    try { gotSessions(JSON.parse(saved)); } catch (e) { saved = null; }
  }
  api("getSessions").then(function (sessions) {
    const text = JSON.stringify(sessions);
    try { localStorage.setItem(SESSIONS_KEY, text); } catch (e) { /* storage full or blocked */ }
    if (text !== saved) gotSessions(sessions);
  }, function () {
    window.APP_STARTED = true;
    if (saved) { showToast("Ingen forbindelse – viser den senest hentede plan."); return; }
    clearLoading();
    document.getElementById("sessions").innerHTML =
      '<p style="grid-column:1/-1">Kunne ikke hente træningspas. Prøv igen om lidt.</p>';
  });
})();

/* Offline support and "Add to Home Screen" */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () { /* the app works without it */ });
  });
}

/* Make sure the loading screen can never stay on top of the page */
function clearLoading() {
  document.querySelectorAll(".loading").forEach(function (el) { el.remove(); });
}

/* The spinner is never expanded before it has been drawn and seen for a moment. Without this, a plan
   saved on the phone made the app expand it while the page was still starting up, so the first thing
   drawn was the expansion itself: a blank screen, then the ball growing. */
const SPINNER_MIN_MS = 400;

function expandSpinner(done) {
  const box = document.querySelector(".loading");
  if (!box) { done(); return; }
  requestAnimationFrame(function () {                 // the spinner is about to be drawn ...
    requestAnimationFrame(function () {               // ... and now it has been
      const shownFor = performance.now() - (SPINNER_DRAWN_AT == null ? performance.now() : SPINNER_DRAWN_AT);
      setTimeout(function () { growSpinner(box, done); }, Math.max(0, SPINNER_MIN_MS - shownFor));
    });
  });
}

/* When the spinner was first drawn (so the 0.4 s also counts the time spent waiting for the plan) */
let SPINNER_DRAWN_AT = null;
requestAnimationFrame(function () { requestAnimationFrame(function () { SPINNER_DRAWN_AT = performance.now(); }); });

function growSpinner(box, done) {
  const spinner = box.querySelector(".spinner");
  const diagonal = Math.hypot(window.innerWidth, window.innerHeight);
  box.style.setProperty("--grow", (diagonal / spinner.offsetWidth).toFixed(1));

  box.classList.add("done");
  setTimeout(done, 450);       /* matches the 0.45s in the CSS */
}

/* Makes sheet text safe to put into the page: < > & and quotes can no longer break a card */
function esc(text) {
  return String(text == null ? "" : text).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

/* Escaped text where line breaks in the cell are kept as line breaks */
function escLines(text) {
  return esc(text).replace(/\r?\n/g, "<br>");
}

/* Only normal web and e-mail links are allowed as button links */
function safeUrl(url) {
  return /^(https?:\/\/|mailto:)/i.test(String(url || "").trim()) ? String(url).trim() : "";
}

function todayIso() {
  const d = new Date();
  const pad = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
}

const DAYS = ["søndag", "mandag", "tirsdag", "onsdag", "torsdag", "fredag", "lørdag"];
const MONTHS = ["januar", "februar", "marts", "april", "maj", "juni",
                "juli", "august", "september", "oktober", "november", "december"];

function danishDate(iso, fallback) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || "");
  if (!m) return fallback || "";            // no real date: show the sheet text instead
  const d = new Date(+m[1], +m[2] - 1, +m[3]);
  const weekday = DAYS[d.getDay()];
  return weekday.charAt(0).toUpperCase() + weekday.slice(1) +
         " den " + d.getDate() + ". " + MONTHS[d.getMonth()] + " " + d.getFullYear();
}

/* "Ons 21. okt 2026" – the short date on the training cards */
function cardDate(iso, fallback) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || "");
  if (!m) return fallback || "";            // no real date: show the sheet text instead
  const d = new Date(+m[1], +m[2] - 1, +m[3]);
  const day = DAYS[d.getDay()].slice(0, 3);
  return day.charAt(0).toUpperCase() + day.slice(1) + " " + d.getDate() + ". " + MONTHS[d.getMonth()].slice(0, 3) + " " + d.getFullYear();
}

/* "19 okt" – day number and the first three letters of the month */
function shortDate(iso) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || "");
  return m ? (+m[3]) + " " + MONTHS[+m[2] - 1].slice(0, 3) : "";
}

let SESSIONS = [];

/* Tema (red) and Undertema (outlined) as tags; a cell may hold several values separated by ; */
function sessionChips(s) {
  const split = v => String(v || "").split(/[;\n]/).map(cleanVal).filter(Boolean);
  const chips = split(s.theme).map(t => `<span class="dchip cat">${esc(t)}</span>`)
    .concat(split(s.subtheme).map(t => `<span class="dchip sub">${esc(t)}</span>`));
  return chips.length ? `<div class="dchips">${chips.join("")}</div>` : "";
}

function cardHtml(session, index, kind) {
  const date = danishDate(session.iso, session.date);
  return `
    <div class="card ${kind}">
      <div class="header" id="sheader-${index}" role="button" tabindex="0"
           aria-label="Åbn træning ${esc(date)}"
           onclick="openSession(${index})"
           onkeydown="if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); openSession(${index}); }">
        <div class="header-text">
          ${kind === "next" ? '<span class="tag">Næste træning</span>' : ""}
          <div>${esc(cardDate(session.iso, session.date))}</div>
          ${session.focus ? '<h3 class="theme">' + esc(session.focus) + '</h3>' : ""}
          ${sessionChips(session)}
        </div>
        <span class="chevron go" aria-hidden="true"></span>
      </div>
    </div>
  `;
}

function renderSessions(sessions) {

  SESSIONS = sessions;
  clearLoading();

  const today = todayIso();
  const upcoming = [];
  const past = [];

  sessions.forEach((session, index) => {
    // A session with no date is treated as upcoming, so nothing disappears by mistake
    if (session.iso && session.iso < today) past.push({ session, index });
    else upcoming.push({ session, index });
  });

  past.reverse();   // most recent past session first

  let html = "";

  // The tag goes to the first upcoming session that has a real date
  const nextPos = upcoming.findIndex(item => item.session.iso);

  upcoming.forEach((item, i) => {
    html += cardHtml(item.session, item.index, i === nextPos ? "next" : "upcoming");
  });

  if (upcoming.length === 0) {
    html += '<p style="grid-column:1/-1">Ingen kommende træninger er planlagt.</p>';
  }

  if (past.length > 0) {
    html += `
      <details class="past-group" ${upcoming.length === 0 ? "open" : ""}>
        <summary>Tidligere træninger (${past.length})</summary>
        <div class="past-grid">
          ${past.map(item => cardHtml(item.session, item.index, "past")).join("")}
        </div>
      </details>
    `;
  }

  document.getElementById("sessions").innerHTML = html;
  if (nextPos !== -1) setTimeout(function () { prefetchSession(upcoming[nextPos].session); }, 300);  // next training: drills ready before anyone taps
}

/* ===================== Drill library ===================== */
/* Which columns become filters (within a group: either/or; between groups: and).
   Values in a cell are separated by semicolons, e.g. "U10; U12". */
const LIB_FILTERS = [
  { col: "Kilde",        label: "Kilde" },                         // DBU / FCK / Egne
  { col: "Temaer",       label: "Tema" },
  { col: "Undertemaer",  label: "Undertema", parent: "Temaer" },   // only shows the subthemes of the chosen theme
  { col: "Fokus",        label: "Fokus", byCount: true, limit: 12, grouped: true }, // under group headings from the "Tags" tab;
                                                                            // without groups: most used first, "Vis alle" for the rest
  { col: "Format",       label: "Format", grouped: true },
  { col: "Kampnærhed",   label: "Kampnærhed" },                    // 1-5: from repetition to the real game
  { col: "Aldersgruppe", label: "Aldersgruppe" }
];
/* Columns whose values are cleaned up: quotes removed, "?" and capitals ignored when comparing */
const TAG_COLS = ["Kilde", "Format", "Fokus", "Temaer", "Undertemaer"];
/* Sections inside an opened drill, in this order.
   Columns not mentioned anywhere are added automatically as text sections at the end. */
const LIB_SECTIONS = [
  { col: "Læringsmål",   title: "Læringsmål",        type: "list"  },
  { col: "Video",        title: "Video",             type: "video" },
  { col: "Beskrivelse",  title: "Beskrivelse",       type: "text"  },
  { col: "Diagram",      title: "Diagram",           type: "image" },
  { col: "Felt",         title: "Felt",              type: "text"  },
  { col: "Fokuspunkter", title: "Fokuspunkter",      type: "focuspoints" },
  { col: "Variationer",  title: "Variationer",       type: "variations"  },
  { col: "Konkurrence",  title: "Konkurrence",       type: "list"  },
  { col: "Noter",        title: "Noter",             type: "notes" },
  { col: "Link",         title: "Læs mere",          type: "link"  }
];
/* Columns used elsewhere on the card, or never shown */
const LIB_RESERVED = ["ID", "Navn", "Billedtekster", "Fokus", "Sessioner", "Publiceret", "Banestørrelse", "Kategori", "Kilde", "Format", "Kampnærhed",
  "Antal spillere min", "Antal spillere max", "Varighed min", "Varighed max"];
/* The link in "Mere" is built from the drill's ID */
const DBU_EXERCISE_URL = "https://web.dbu.dk/fodboldapp?page=Exercise&exerciseId=";
function exerciseLink(d) {
  const id = cleanVal(d["ID"]);
  return /^\d+$/.test(id) ? DBU_EXERCISE_URL + id : d["Link"];   // no numeric ID: use the Link cell
}

/* Note shown under a link, by website */
const LINK_NOTES = { "mit.dbu.dk": "Kræver login hos DBU", "fck.better-coaching.dk": "Kræver login hos FCK",
                     "learn.englandfootball.com": "På engelsk. Her finder du også sessionen som PDF." };

/* "6–12 spillere", "Min. 6 spillere", "Op til 12 spillere" */
function rangeText(a, b, unit) {
  a = cleanVal(a); b = cleanVal(b);
  if (a && b) return a === b ? `${a} ${unit}` : `${a}–${b} ${unit}`;
  if (a) return `Min. ${a} ${unit}`;
  if (b) return `Op til ${b} ${unit}`;
  return "";
}

let LIB_PANEL_INIT = false;
let LIB_LIST = [];
let LIB = null;                 // { drills, headers, sections, total, tree }
let LIB_QUERY = "";
let PRESET = null;              // focus text sent over from a training session
const SEL = {};                 // selected values per filter column
const GROUP_OPEN = {};          // "Vis alle" state per filter column
const GROUP_QUERY = {};         // search text inside a filter group
const CANON = {};               // per column: tag key -> the spelling we show
const ALIASES = {};             // per column: tag key -> the name it is renamed to (tab "Omdøb")
LIB_FILTERS.forEach(f => { SEL[f.col] = new Set(); });

/* Stores the renames from the "Omdøb" tab */
function setAliases(list) {
  Object.keys(ALIASES).forEach(k => delete ALIASES[k]);
  (list || []).forEach(function (a) {
    if (!ALIASES[a.col]) ALIASES[a.col] = new Map();
    ALIASES[a.col].set(tagKey(a.from), a.to);
  });
}

/* ===================== Login for the "Øvelser" tab (valid for 30 minutes) ===================== */
const AUTH = { token: "", until: 0 };
let AUTH_TIMER = null;
const isAuthed = () => !!AUTH.token && Date.now() < AUTH.until;

/* The login is kept in localStorage, so it survives closing the app (sessionStorage is wiped by phones
   when the app is closed or put to sleep). It still ends after 30 minutes. */
function saveAuth() {
  try {
    if (AUTH.token) localStorage.setItem("oevAuth", JSON.stringify(AUTH));
    else localStorage.removeItem("oevAuth");
    sessionStorage.removeItem("oevAuth");     // from older versions of the app
  } catch (e) { /* storage not available: the login then lasts until the page is reloaded */ }
}

function scheduleExpiry() {
  clearTimeout(AUTH_TIMER);
  if (AUTH.token) AUTH_TIMER = setTimeout(expire, Math.max(0, AUTH.until - Date.now()) + 50);
}

/* Remove the login and every drill from the page */
function wipeLibrary() {
  clearTimeout(AUTH_TIMER);
  AUTH.token = ""; AUTH.until = 0;
  saveAuth();
  LIB = null; LIB_LIST = []; LIB_LOADING = false;
  ["drill-grid", "lib-filters", "lib-status"].forEach(id => { document.getElementById(id).innerHTML = ""; });
  setLibNote("");
}

/* 30 minutes are over: drills are removed, and the Øvelser tab asks for the code again */
function expire() {
  wipeLibrary();
  if (!document.getElementById("library").classList.contains("view-hidden")) {
    requireLogin(function () { loadLibrary(); }, function () { showView("sessions"); });
  }
}

(function restoreAuth() {                     // opening the app again within the 30 minutes keeps the login
  try {
    const a = JSON.parse(localStorage.getItem("oevAuth") || sessionStorage.getItem("oevAuth") || "null");
    if (a && a.token && Date.now() < a.until) { AUTH.token = a.token; AUTH.until = a.until; scheduleExpiry(); }
    else localStorage.removeItem("oevAuth");   // expired: tidy up
  } catch (e) { /* ignore */ }
})();

document.addEventListener("visibilitychange", function () {   // phones pause timers while the page is in the background
  if (document.visibilityState === "visible" && AUTH.token && !isAuthed()) expire();
});

const LOGIN_LAYERS = ["nav-bar", "sessions", "library", "viewer"];
let LOGIN_CB = null, LOGIN_PREV = [];

/* Runs onOk straight away if logged in; otherwise asks for the code first */
function requireLogin(onOk, onCancel) {
  if (AUTH.token && !isAuthed()) wipeLibrary();
  if (isAuthed()) { onOk(); return; }
  LOGIN_CB = { ok: onOk, cancel: onCancel || null };
  LOGIN_PREV = LOGIN_LAYERS.map(id => document.getElementById(id).hasAttribute("inert"));
  LOGIN_LAYERS.forEach(id => document.getElementById(id).setAttribute("inert", ""));
  document.getElementById("login-err").textContent = "";
  document.getElementById("login-pw").value = "";
  document.getElementById("login").classList.remove("view-hidden");
  document.getElementById("login-pw").focus();
}

function closeLogin() {
  LOGIN_LAYERS.forEach(function (id, i) { if (!LOGIN_PREV[i]) document.getElementById(id).removeAttribute("inert"); });
  document.getElementById("login").classList.add("view-hidden");
}

document.getElementById("login-form").addEventListener("submit", function (e) {
  e.preventDefault();
  const pw = document.getElementById("login-pw").value;
  if (!pw.trim()) return;
  const go = document.getElementById("login-go"), err = document.getElementById("login-err");
  go.disabled = true; go.textContent = "Tjekker…"; err.textContent = "";
  const done = function () { go.disabled = false; go.textContent = "Åbn"; };
  api("login", [pw]).then(function (res) {
      done();
      if (!res || !res.ok) {
        err.textContent =
          res && res.locked ? "For mange forkerte forsøg. Prøv igen om 10 minutter." :
          res && res.setup  ? "Koden er ikke sat op endnu. Kontakt den, der står for appen." :
                              "Forkert kode. Prøv igen.";
        document.getElementById("login-pw").select();
        return;
      }
      AUTH.token = res.token;
      AUTH.until = Date.now() + res.seconds * 1000;
      saveAuth(); scheduleExpiry();
      const cb = LOGIN_CB; LOGIN_CB = null;
      closeLogin();
      if (cb && cb.ok) cb.ok();
    }, function () {
      done();
      err.textContent = "Kunne ikke kontrollere koden. Prøv igen om lidt.";
    });
});

function cancelLogin() {
  const cb = LOGIN_CB; LOGIN_CB = null;
  closeLogin();
  if (cb && cb.cancel) cb.cancel();
}
document.getElementById("login-cancel").addEventListener("click", cancelLogin);
document.getElementById("login-form").addEventListener("keydown", function (e) {
  if (e.key === "Escape") { e.stopPropagation(); cancelLogin(); }
});

function showView(name) {
  const lib = name === "library";
  if (lib && !isAuthed()) { requireLogin(function () { showView("library"); }); return; }
  document.getElementById("sessions").classList.toggle("view-hidden", lib);
  document.getElementById("library").classList.toggle("view-hidden", !lib);
  document.getElementById("nav-sessions").setAttribute("aria-current", lib ? "false" : "page");
  document.getElementById("nav-library").setAttribute("aria-current", lib ? "page" : "false");
  if (lib && !LIB) loadLibrary();
}

/* Cleans a cell value. Invisible and "blank-looking" characters are removed, and a value
   without a single letter or digit (for example "-", "•" or "·") counts as empty. */
function cleanVal(v) {
  const t = String(v == null ? "" : v)
    .replace(/[\p{Cc}\p{Cf}\p{Z}ㅤᅟᅠ⠀͏]/gu, " ")
    .trim();
  return /[\p{L}\p{N}]/u.test(t) ? t : "";
}

/* Values of a cell, split on semicolons (as written in the sheet) */
function rawVals(d, col) {
  return String(d[col] || "").split(/[;\n]+/).map(cleanVal).filter(Boolean);
}
const stripQuotes = v => String(v).replace(/["“”„‟«»]/g, "").replace(/\s+/g, " ").trim();
/* Key used to recognise the same tag written slightly differently */
const tagKey = v => stripQuotes(v).toLowerCase().replace(/['’‘`]/g, "").replace(/[?!.:,]+/g, " ").replace(/\s+/g, " ").trim();

/* A tag after the renames from the "Omdøb" tab have been applied */
function aliasOf(col, v) {
  const m = ALIASES[col] && ALIASES[col].get(tagKey(v));
  return m || v;
}

/* Values of a cell with spelling variants merged into one tag */
function splitVals(d, col) {
  const vals = rawVals(d, col);
  if (TAG_COLS.indexOf(col) === -1 || !CANON[col]) return vals;
  const out = [];
  vals.forEach(function (v) {
    const r = aliasOf(col, v);
    const c = CANON[col].get(tagKey(r)) || stripQuotes(r);
    if (c && out.indexOf(c) === -1) out.push(c);
  });
  return out;
}

function buildCanon(drills) {
  TAG_COLS.forEach(function (col) {
    const tally = new Map();                  // key -> Map(variant -> count)
    drills.forEach(d => rawVals(d, col).forEach(function (v) {
      const r = aliasOf(col, v), variant = stripQuotes(r), k = tagKey(r);
      if (!k) return;
      if (!tally.has(k)) tally.set(k, new Map());
      tally.get(k).set(variant, (tally.get(k).get(variant) || 0) + 1);
    }));
    CANON[col] = new Map();
    tally.forEach(function (variants, k) {    // the most used spelling wins
      const best = Array.from(variants.entries()).sort((x, y) =>
        y[1] - x[1] || (/^\p{Lu}/u.test(y[0]) ? 1 : 0) - (/^\p{Lu}/u.test(x[0]) ? 1 : 0) || y[0].length - x[0].length)[0][0];
      CANON[col].set(k, best);
    });
  });
}

/* "U11 - U13" becomes U11, U12, U13, so the filter works on single ages */
function ageVals(d) {
  const out = [];
  rawVals(d, "Aldersgruppe").forEach(function (v) {
    const m = v.match(/U\s*(\d{1,2})\s*[-–—]\s*U?\s*(\d{1,2})/i);
    if (m) {
      let lo = +m[1], hi = +m[2];
      if (lo > hi) { const t = lo; lo = hi; hi = t; }
      for (let i = lo; i <= hi; i++) out.push("U" + i);
    } else {
      const one = v.match(/^U\s*(\d{1,2})$/i);
      out.push(one ? "U" + one[1] : v);
    }
  });
  return Array.from(new Set(out));
}

const filterVals = (d, col) => d.__f[col] || [];

/* Focus tags for a drill, most used first (by how often they occur in "Sessioner") */
function focusTags(d) {
  const tags = splitVals(d, "Fokus");
  if (tags.length < 2 || !CANON.Fokus) return tags;
  const freq = new Map();
  rawVals(d, "Sessioner").forEach(function (v) {
    const c = CANON.Fokus.get(tagKey(aliasOf("Fokus", v)));
    if (c) freq.set(c, (freq.get(c) || 0) + 1);
  });
  return tags.map((t, i) => ({ t: t, i: i, f: freq.get(t) || 0 }))
    .sort((a, b) => b.f - a.f || a.i - b.i).map(x => x.t);
}

/* Sections of an opened drill: the ones listed above plus every extra column in the sheet (as text) */
function sectionsFor(headers) {
  const known = new Set([].concat(
    LIB_SECTIONS.map(x => x.col), LIB_FILTERS.map(x => x.col), LIB_RESERVED));
  const extra = headers.filter(h => h && !known.has(h) && !/ \(DA\)$/.test(h)).map(h => ({ col: h, title: h, type: "text" }));
  return LIB_SECTIONS.concat(extra);
}
let MINI = { sections: LIB_SECTIONS };            // used when a single drill is opened without the library
const libSections = () => (LIB || MINI).sections;

let LIB_LOADING = false;
const LIB_WAIT = [];            // things to do when the library has loaded (or failed to load)
function libDone() { LIB_LOADING = false; LIB_WAIT.splice(0).forEach(f => f()); }

/* Spinning ball in the Øvelser tab while the drills are on their way */
function showLibLoading() {
  document.getElementById("lib-filters").innerHTML = "";
  document.getElementById("lib-status").innerHTML = "";
  document.getElementById("drill-grid").innerHTML =
    '<div class="lib-loading" role="status"><div class="spinner" aria-hidden="true"></div><span>Indlæser øvelser…</span></div>';
}

/* The last library the server sent is kept on this phone (key LIB_SAVE_KEY), so the Øvelser tab
   can show it at once after login, while the app asks the server in the background whether anything
   has changed. It is only shown with a valid login. */
const LIB_SAVE_KEY = "oevLib";

function readSavedLibrary() {
  try {
    const s = JSON.parse(localStorage.getItem(LIB_SAVE_KEY) || "null");
    return s && s.version && s.res && Array.isArray(s.res.drills) ? s : null;
  } catch (e) { return null; }
}

function saveLibrary(res) {
  try { localStorage.setItem(LIB_SAVE_KEY, JSON.stringify({ version: res.version, res: res })); }
  catch (e) { try { localStorage.removeItem(LIB_SAVE_KEY); } catch (e2) { /* storage not available */ } }
}

/* Turns the server's answer into LIB and shows it (filters and search the coach has chosen stay) */
function useLibrary(res) {
  const drills = res.drills;              // the server already shows each drill only once
  drills.forEach(applyLang);
  setAliases(res.aliases);

  buildCanon(drills);
  drills.forEach(function (d) {
    d.__f = {};
    LIB_FILTERS.forEach(f => { d.__f[f.col] = f.col === "Aldersgruppe" ? ageVals(d) : splitVals(d, f.col); });
  });

  const total = {}, tree = {};
  LIB_FILTERS.forEach(function (f) {
    total[f.col] = new Map();
    drills.forEach(d => d.__f[f.col].forEach(v => total[f.col].set(v, (total[f.col].get(v) || 0) + 1)));
    if (f.parent) {
      tree[f.col] = new Map();
      drills.forEach(d => d.__f[f.parent].forEach(function (p) {
        if (!tree[f.col].has(p)) tree[f.col].set(p, new Set());
        d.__f[f.col].forEach(c => tree[f.col].get(p).add(c));
      }));
    }
  });

  LIB = { drills: drills, headers: res.headers, sections: sectionsFor(res.headers), total: total, tree: tree,
          groups: tagGroups(res.groups), version: res.version || "" };
  if (PRESET != null) applyPreset(); else renderLibrary();
}

function loadLibrary(cb, silent) {
  if (cb) LIB_WAIT.push(cb);
  if (LIB_LOADING) return;
  LIB_LOADING = true;
  let version = LIB ? LIB.version : "";
  if (!LIB) {
    const saved = readSavedLibrary();
    if (saved) {                                       // show the saved copy now; waiting callers can go on
      useLibrary(saved.res);
      version = saved.version;
      LIB_WAIT.splice(0).forEach(f => f());
    } else showLibLoading();
  }

  function gotLibrary(res) {
    if (!res.unchanged) {                              // something changed (or nothing was saved): show the new one
      saveLibrary(res);
      useLibrary(res);
    }
    libDone();
  }

  function failedLibrary(err) {
    if (/LOGIN/.test(String(err && err.message))) {      // the login is no longer valid on the server
      const waiting = LIB_WAIT.splice(0);
      wipeLibrary();
      if (silent && !waiting.length) return;
      requireLogin(function () { loadLibrary(function () { waiting.forEach(f => f()); }); },
                   function () { if (!document.getElementById("library").classList.contains("view-hidden")) showView("sessions"); });
      return;
    }
    if (!LIB) document.getElementById("drill-grid").innerHTML =       // a saved copy stays on screen
      "<p>Kunne ikke hente øvelser. Prøv igen om lidt.</p>";
    libDone();
  }

  api("getDrills", [AUTH.token, version]).then(gotLibrary, failedLibrary);
}

/* Does a drill match the search and the selected tags (ignoring one filter group, for counting)? */
function libMatches(d, skipCol) {
  if (FAV_ONLY && !isFav(d)) return false;
  if (LIB_QUERY) {
    if (d.__text == null)                     // the drill's text for the search, made once per drill
      d.__text = Object.keys(d).filter(k => k.indexOf("__") !== 0 && k !== "Sessioner").map(k => d[k])
        .concat(d.__en ? Object.values(d.__en) : []).join(" ").toLowerCase();
    if (!d.__text.includes(LIB_QUERY)) return false;
  }
  return LIB_FILTERS.every(function (f) {
    return f.col === skipCol || SEL[f.col].size === 0 || filterVals(d, f.col).some(v => SEL[f.col].has(v));
  });
}

const byAlpha = (a, b) => a.localeCompare(b, "da", { numeric: true });

function chipHtml(f, v) {
  const on = SEL[f.col].has(v);
  const n = LIB.drills.filter(d => libMatches(d, f.col) && filterVals(d, f.col).includes(v)).length;
  return `<button type="button" class="tagbtn" aria-pressed="${on}" ${(!on && n === 0) ? "disabled" : ""}
            data-col="${esc(f.col)}" data-val="${esc(v)}">${esc(v)}<span class="n">${n}</span></button>`;
}

/* Groups from the "Tags" tab, per column: { order: [group names], of: tag key -> group, rank: tag key -> position } */
function tagGroups(list) {
  const out = {};
  (list || []).forEach(function (g, i) {
    const G = out[g.col] = out[g.col] || { order: [], of: new Map(), rank: new Map() };
    const k = tagKey(aliasOf(g.col, g.tag));
    if (G.order.indexOf(g.group) === -1) G.order.push(g.group);
    if (!G.of.has(k)) { G.of.set(k, g.group); G.rank.set(k, i); }
  });
  return out;
}

/* A format like "5v3" or "2+1v3" is a number of players. Such a format goes under "Antal spillere" even when
   the "Tags" tab doesn't list it yet (e.g. after an import), sorted by how many players it takes. */
const PLAYER_FORMAT = /^\d+(\+\d+)*v\d+(\+\d+)*$/i;
const PLAYERS_GROUP = "Antal spillere";
function byPlayers(a, b) {
  const total = v => v.split(/[v+]/i).reduce((n, x) => n + (+x || 0), 0);
  return total(a) - total(b) || (a.indexOf("+") !== -1) - (b.indexOf("+") !== -1) || byAlpha(a, b);
}

/* The buttons of one filter group */
function groupBodyHtml(f) {
  const mk = v => chipHtml(f, v);

  const G = f.grouped && LIB.groups && LIB.groups[f.col];
  if (G) {                                    // tags under their group headings; tags without a group under "Andet"
    const byGroup = new Map(G.order.map(g => [g, []]));
    const rest = [];
    LIB.total[f.col].forEach(function (n, v) {
      const g = G.of.get(tagKey(v)) || (f.col === "Format" && PLAYER_FORMAT.test(v) ? PLAYERS_GROUP : "");
      if (g && !byGroup.has(g)) byGroup.set(g, []);
      (g ? byGroup.get(g) : rest).push(v);
    });
    const rank = v => { const r = G.rank.get(tagKey(v)); return r == null ? 1e9 : r; };
    // a group whose tags all give 0 drills with the other choices (and none chosen) is left out
    const fits = vals => vals.some(v => SEL[f.col].has(v) ||
      LIB.drills.some(d => libMatches(d, f.col) && filterVals(d, f.col).includes(v)));
    const blocks = [];
    byGroup.forEach(function (vals, g) {
      if (!vals.length || !fits(vals)) return;
      blocks.push([g, vals.sort(f.col === "Format" && g === PLAYERS_GROUP ? byPlayers : (a, b) => rank(a) - rank(b))]);
    });
    if (rest.length && fits(rest)) blocks.push(["Andet", rest.sort(byAlpha)]);
    return blocks.map(b => `<div class="fsub"><span class="fsub-label">${esc(b[0])}</span>${b[1].map(mk).join("")}</div>`).join("")
      || '<span class="fnone">Ingen match</span>';
  }

  if (f.parent) {                             // subthemes, grouped under their theme
    const tree = LIB.tree[f.col], sel = SEL[f.parent];
    const fitsAny = p => Array.from(tree.get(p)).some(v => SEL[f.col].has(v) ||   // hide themes with no matching drills
      LIB.drills.some(d => libMatches(d, f.col) && filterVals(d, f.col).includes(v)));
    return Array.from(tree.keys()).filter(p => (!sel.size || sel.has(p)) && fitsAny(p)).sort(byAlpha).map(p =>
      `<div class="fsub"><span class="fsub-label">${esc(p)}</span>${Array.from(tree.get(p)).sort(byAlpha).map(mk).join("")}</div>`
    ).join("");
  }

  const tot = LIB.total[f.col];
  let values = Array.from(tot.keys());
  values.sort(f.byCount ? (a, b) => tot.get(b) - tot.get(a) || byAlpha(a, b) : byAlpha);

  if (f.limit && values.length > f.limit && !GROUP_OPEN[f.col]) {
    const top = values.slice(0, f.limit);
    SEL[f.col].forEach(v => { if (top.indexOf(v) === -1) top.push(v); });   // selected ones always stay visible
    values = top;
  } else if (GROUP_QUERY[f.col]) {
    const q = tagKey(GROUP_QUERY[f.col]);
    values = values.filter(v => tagKey(v).includes(q));
  }
  return values.map(mk).join("") || '<span class="fnone">Ingen match</span>';
}

function renderLibrary() {
  document.getElementById("lib-filters").innerHTML = LIB_FILTERS.map(function (f) {
    const total = LIB.total[f.col].size;
    if (!total) return "";
    const more = !(f.grouped && LIB.groups && LIB.groups[f.col]) && f.limit && total > f.limit;
    const open = !!GROUP_OPEN[f.col];
    return `<div class="fgroup"><div class="fgroup-label">${esc(f.label)}</div>` +
      (more && open ? `<input type="search" class="fsearch" data-col="${esc(f.col)}" value="${esc(GROUP_QUERY[f.col] || "")}"
                        placeholder="Søg i ${esc(f.label.toLowerCase())}" aria-label="Søg i ${esc(f.label.toLowerCase())}">` : "") +
      `<div class="fbody" data-col="${esc(f.col)}">${groupBodyHtml(f)}</div>` +
      (more ? `<button type="button" class="moretoggle" data-col="${esc(f.col)}">${open ? "Vis færre" : "Vis alle (" + total + ")"}</button>` : "") +
      "</div>";
  }).join("");

  const list = LIB.drills.filter(d => libMatches(d, null));
  LIB_LIST = list;
  const anyFilter = LIB_QUERY || FAV_ONLY || LIB_FILTERS.some(f => SEL[f.col].size);

  const nSel = LIB_FILTERS.reduce((n, f) => n + SEL[f.col].size, 0);
  document.getElementById("lib-panel-sum").textContent = nSel ? `Filtre (${nSel} valgt)` : "Filtre";
  if (!LIB_PANEL_INIT) {                      // filters start open on wide screens, closed on phones
    LIB_PANEL_INIT = true;
    document.getElementById("lib-panel").open = window.innerWidth > 700;
  }

  renderLibStatus(list.length, anyFilter);

  const nFav = LIB.drills.filter(isFav).length;
  CARDS_SHOWN = 0;
  document.getElementById("drill-grid").innerHTML = list.length
    ? ""
    : FAV_ONLY && !nFav
      ? "<p>Du har ingen favoritter endnu. Tryk på stjernen på en øvelse for at gemme den her.</p>"
      : "<p>Ingen øvelser matcher. Fjern et filter eller prøv en anden søgning.</p>";
  if (list.length) showMoreCards();
}

/* The cards are drawn 40 at a time: drawing all of them at once takes seconds on a phone.
   More are added when the button at the bottom comes near the screen (or is tapped). */
const CARD_PAGE = 40;
let CARDS_SHOWN = 0;
const MORE_OBSERVER = "IntersectionObserver" in window
  ? new IntersectionObserver(function (entries) {
      if (entries.some(e => e.isIntersecting)) showMoreCards();
    }, { rootMargin: "800px 0px" })
  : null;

function showMoreCards() {
  const grid = document.getElementById("drill-grid");
  const old = grid.querySelector(".grid-more");
  if (old) { if (MORE_OBSERVER) MORE_OBSERVER.unobserve(old); old.remove(); }
  const start = CARDS_SHOWN;
  const next = LIB_LIST.slice(start, start + (MORE_OBSERVER ? CARD_PAGE : LIB_LIST.length));
  grid.insertAdjacentHTML("beforeend", next.map((d, k) => drillCard(d, start + k)).join(""));
  CARDS_SHOWN = start + next.length;
  const left = LIB_LIST.length - CARDS_SHOWN;
  if (left > 0) {
    grid.insertAdjacentHTML("beforeend",
      `<button type="button" class="clearbtn grid-more">Vis flere øvelser (${left} tilbage)</button>`);
    if (MORE_OBSERVER) MORE_OBSERVER.observe(grid.querySelector(".grid-more"));
  }
}

document.getElementById("drill-grid").addEventListener("click", function (e) {
  if (e.target.closest(".grid-more")) showMoreCards();
});

/* Count, the "Favoritter" switch and "Ryd filtre" above the list */
function renderLibStatus(n, anyFilter) {
  const nFav = LIB.drills.filter(isFav).length;
  document.getElementById("lib-status").innerHTML =
    `<span>${n} ${n === 1 ? "øvelse" : "øvelser"}</span>` +
    `<button type="button" class="favfilter" id="lib-favs" aria-pressed="${FAV_ONLY}">${STAR_ICON}Favoritter (${nFav})</button>` +
    (anyFilter ? '<button type="button" class="clearbtn" id="lib-clear">Ryd filtre</button>' : "");
}

/* If a theme is dropped, subthemes that no longer belong to the chosen themes are dropped too */
function pruneChildren(parentCol) {
  LIB_FILTERS.filter(f => f.parent === parentCol).forEach(function (f) {
    if (!SEL[parentCol].size) return;
    const allowed = new Set();
    SEL[parentCol].forEach(p => (LIB.tree[f.col].get(p) || []).forEach(c => allowed.add(c)));
    Array.from(SEL[f.col]).forEach(v => { if (!allowed.has(v)) SEL[f.col].delete(v); });
  });
}

document.getElementById("lib-filters").addEventListener("click", function (e) {
  const more = e.target.closest(".moretoggle");
  if (more) { GROUP_OPEN[more.dataset.col] = !GROUP_OPEN[more.dataset.col]; renderLibrary(); return; }
  const b = e.target.closest(".tagbtn");
  if (!b || b.disabled) return;
  setLibNote("");
  const set = SEL[b.dataset.col];
  if (set.has(b.dataset.val)) set.delete(b.dataset.val); else set.add(b.dataset.val);
  pruneChildren(b.dataset.col);
  renderLibrary();
});

document.getElementById("lib-filters").addEventListener("input", function (e) {   // search inside a group
  const inp = e.target.closest(".fsearch");
  if (!inp || !LIB) return;
  GROUP_QUERY[inp.dataset.col] = inp.value;
  const f = LIB_FILTERS.find(x => x.col === inp.dataset.col);

document.getElementById("lib-status").addEventListener("click", function (e) {

  if (!e.target.closest("#lib-clear")) return;

  LIB_QUERY = "";
  clearTimeout(SEARCH_TIMER);
  document.getElementById("lib-search").value = "";
  setLibNote("");
  renderLibrary();
});

let SEARCH_TIMER = null;
document.getElementById("lib-search").addEventListener("input", function (e) {   // waits for a short pause in the typing
  clearTimeout(SEARCH_TIMER);
  const q = e.target.value.toLowerCase().trim();
  SEARCH_TIMER = setTimeout(function () {
    if (q === LIB_QUERY) return;
    LIB_QUERY = q;
    if (LIB) renderLibrary();
  }, 200);
});

/* From a training session: open the library filtered on the session's theme, subtheme and focus */
function findDrillsForFocus(index) {
  const s = SESSIONS[index];
  if (!s) return;
  PRESET = { tema: s.theme || "", undertema: s.subtheme || "", fokus: s.focus || "",
             label: danishDate(s.iso, s.date) };
  closeDrill();
  showView("library");
  if (LIB) applyPreset();
}

/* Tags in the library that match the text of a session cell (renames and spelling variants are handled) */
function matchTags(col, text) {
  const out = [];
  rawVals({ t: text }, "t").forEach(function (v) {
    const c = CANON[col] && CANON[col].get(tagKey(aliasOf(col, v)));
    if (c && LIB.total[col].has(c) && out.indexOf(c) === -1) out.push(c);
  });
  return out;
}

/* Last resort for the focus: tags that share a longer word with the session's focus text */
function similarFokus(text) {
  const skip = ["fokus", "øvelse", "øvelser", "træning", "træningen"];   // too general to match on
  const words = tagKey(text).split(" ").filter(w => w.length >= 5 && skip.indexOf(w) === -1);
  if (!words.length) return [];
  return Array.from(LIB.total.Fokus.keys()).filter(tag => words.some(w => tagKey(tag).includes(w)));
}

function setLibNote(text) {
  document.getElementById("lib-note").textContent = text || "";
}

function applyPreset() {
  const p = PRESET;
  PRESET = null;
  LIB_QUERY = "";
  clearTimeout(SEARCH_TIMER);
  document.getElementById("lib-search").value = "";
  LIB_FILTERS.forEach(f => { GROUP_QUERY[f.col] = ""; });

  const tema = matchTags("Temaer", p.tema);
  const under = matchTags("Undertemaer", p.undertema);
  const underFokus = matchTags("Fokus", p.undertema);       // the plan's Undertema can be a Fokus tag on the drills
  let fokus = matchTags("Fokus", p.fokus), similar = false;
  if (!fokus.length) { fokus = similarFokus(p.fokus); similar = fokus.length > 0; }
  const both = fokus.concat(underFokus.filter(v => fokus.indexOf(v) === -1));

  // Try the most specific combination first; loosen it step by step until there are drills to show
  const tries = [[tema, under, both], [tema, under, underFokus], [tema, under, []], [tema, [], []], [[], [], both]];
  let used = null;
  for (let i = 0; i < tries.length && !used; i++) {
    const t = tries[i];
    if (!t[0].length && !t[1].length && !t[2].length) continue;
    LIB_FILTERS.forEach(f => SEL[f.col].clear());
    t[0].forEach(v => SEL.Temaer.add(v));
    t[1].forEach(v => SEL.Undertemaer.add(v));
    t[2].forEach(v => SEL.Fokus.add(v));
    if (LIB.drills.some(d => libMatches(d, null))) used = t;
  }
  if (!used) LIB_FILTERS.forEach(f => SEL[f.col].clear());

  const parts = [];
  if (used && used[0].length) parts.push("Tema: " + used[0].join(", "));
  if (used && used[1].length) parts.push("Undertema: " + used[1].join(", "));
  if (used && used[2].length) parts.push((similar ? "Lignende fokus: " : "Fokus: ") + used[2].join(", "));
  let note = parts.length
    ? "Øvelser til træningen " + p.label + " – " + parts.join(" · ")
    : "Træningen har ingen tags der matcher øvelserne, så alle øvelser vises.";
  if (used && fokus.length && !used[2].length) {
    note += " (fokus «" + p.fokus + "» er udeladt, fordi ingen øvelser matcher det sammen med resten)";
  }
  setLibNote(note);

  LIB_PANEL_INIT = true;
  document.getElementById("lib-panel").open = true;
  renderLibrary();
  window.scrollTo(0, 0);
}

/* ---- drill card ---- */
function driveId(u) {
  const m = String(u).match(/\/d\/([\w-]{15,})/) || String(u).match(/[?&]id=([\w-]{15,})/);
  return m ? m[1] : "";
}

function libMedia(type, raw) {
  const u = safeUrl(raw);
  if (!u) return "";
  if (type === "image") {
    const id = driveId(u);
    const src = id ? "https://drive.google.com/thumbnail?id=" + id + "&sz=w1400" : u;
    return `<img class="media" src="${esc(src)}" alt="Diagram" loading="lazy" onerror="brokenDiagram(this)">`;
  }
  let m;
  if ((m = u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{11})/)))
    return `<iframe class="media" src="https://www.youtube-nocookie.com/embed/${m[1]}" allowfullscreen loading="lazy" title="Video"></iframe>`;
  if ((m = u.match(/vimeo\.com\/(\d+)/)))
    return `<iframe class="media" src="https://player.vimeo.com/video/${m[1]}" allowfullscreen loading="lazy" title="Video"></iframe>`;
  if (driveId(u))
    return `<iframe class="media" src="https://drive.google.com/file/d/${driveId(u)}/preview" allowfullscreen loading="lazy" title="Video"></iframe>`;
  if (/\.(mp4|webm)(\?|$)/i.test(u)) return `<video class="media" src="${esc(u)}" controls></video>`;
  return `<a href="${esc(u)}" target="_blank" rel="noopener">Åbn video</a>`;
}

/* The Diagram cell can hold several pictures, one link per line (FA sessions). They are shown one at a time
   with arrows, like on the FA site, each with its line from "Billedtekster". The arrows are buttons, so a swipe
   on the picture still turns the viewer's page. */
function diagramHtml(raw, d) {
  const urls = String(raw || "").split(/\s*\n\s*/).map(safeUrl).filter(Boolean);
  if (!urls.length) return "";
  const caps = String((d && d["Billedtekster"]) || "").split("\n");
  const cap = i => cleanVal(caps[i]) ? `<figcaption>${esc(caps[i].trim())}</figcaption>` : "";
  if (urls.length === 1) return cap(0) ? `<figure class="g-single">${libMedia("image", urls[0])}${cap(0)}</figure>` : libMedia("image", urls[0]);
  return `<div class="gallery">` +
    urls.map((u, i) => `<figure class="g-slide${i ? "" : " on"}">${libMedia("image", u)}${cap(i)}</figure>`).join("") +
    `<div class="g-nav"><button type="button" class="g-btn g-prev" aria-label="Forrige billede">‹</button>` +
    `<span class="g-count">1 / ${urls.length}</span>` +
    `<button type="button" class="g-btn g-next" aria-label="Næste billede">›</button></div></div>`;
}

/* The Video cell can hold several videos, one link per line (an FA session in parts): shown one after another */
function videoHtml(raw) {
  const urls = String(raw || "").split(/\s*\n\s*/).filter(Boolean);
  if (urls.length < 2) return libMedia("video", urls[0] || "");
  return urls.map((u, i) => `<div class="video-part"><div class="video-part-label">Del ${i + 1} af ${urls.length}</div>` +
    libMedia("video", u) + `</div>`).join("");
}

function galleryStep(g, step) {
  const slides = Array.from(g.querySelectorAll(".g-slide"));
  if (!slides.length) return;
  const i = (Math.max(0, slides.findIndex(s => s.classList.contains("on"))) + step + slides.length) % slides.length;
  slides.forEach((s, j) => s.classList.toggle("on", j === i));
  g.querySelector(".g-count").textContent = (i + 1) + " / " + slides.length;
  g.querySelector(".g-nav").hidden = slides.length < 2;
}

document.addEventListener("click", function (e) {
  const b = e.target.closest(".g-btn");
  if (b) galleryStep(b.closest(".gallery"), b.classList.contains("g-next") ? 1 : -1);
});

function libLink(url, text) {
  const u = safeUrl(url);
  return u ? `<a href="${esc(u)}" target="_blank" rel="noopener">${escLines(text || u)}</a>` : "";
}

function libBody(def, d) {
  const val = def.type === "link" ? exerciseLink(d) : d[def.col];
  if (!val) return "";
  if (def.type === "focuspoints") {           // "Boldholder: text" -> role in bold
    const lines = String(val).split(/\n+/).map(x => x.trim()).filter(Boolean);
    return "<ul>" + lines.map(function (l) {
      const m = l.match(/^([^:]{1,30}):\s*(.*)$/);
      return m ? `<li><strong>${esc(m[1])}:</strong> ${esc(m[2])}</li>` : `<li>${esc(l)}</li>`;
    }).join("") + "</ul>";
  }
  if (def.type === "variations") {
    /* A line gets a plus/minus badge when it starts with + or - (Sheets sometimes turns "+" into "=+";
       that is understood too), or when it comes under a heading "Progression" or "Regression".
       A short line ending in ":" is a small heading; if it says harder/easier (also in Norwegian),
       the lines under it get plus/minus. Every other line gets the neutral badge. */
    const lines = String(val).split(/\n+/).map(x => x.trim()).filter(Boolean);
    const items = [];
    let mode = "";
    lines.forEach(function (l) {
      l = l.replace(/^['=]+\s*(?=[-–−+])/, "");               // "=+ text" or "'+ text" -> "+ text"
      const h = l.match(/^(pro\w*ion\w*|regre\w*)\s*:?\s*(.*)$/i);
      if (h && !/\s/.test(h[1])) {                             // a heading, maybe with text after it
        mode = /^pro/i.test(h[1]) ? "plus" : "minus";
        if (!h[2]) return;
        l = h[2];
      }
      const m = l.match(/^(\+\/[-–−]|[-–−]\/\+|\+|[-–−])\s*(.*)$/);
      if (m) {
        const cls = m[1].length > 1 ? "pm" : m[1] === "+" ? "plus" : "minus";
        items.push([cls, m[2] || l]);
      } else if (/:$/.test(l) && l.length <= 160) {            // small heading
        mode = /sværere|svær|vanskelig|udfordrend|utfordrend|krævende|krevende|progres/i.test(l) ? "plus"
             : /lettere|nemmere|enklere|regres/i.test(l) ? "minus" : "";
        items.push(["head", l]);
      } else items.push([mode || "neutral", l]);
    });
    const SIGN = { plus: "+", minus: "−", pm: "±", neutral: "•" };
    return '<ul class="var-list">' + items.map(it => it[0] === "head"
      ? `<li class="var-head">${esc(it[1])}</li>`
      : `<li><span class="sign ${it[0]}">${SIGN[it[0]]}</span><span>${esc(it[1])}</span></li>`).join("") + "</ul>";
  }
  if (def.type === "list") {
    const items = String(val).split(/[;\n]+/).map(x => x.replace(/^[-•*]\s*/, "").trim()).filter(Boolean);
    return items.length > 1 ? "<ul>" + items.map(i => `<li>${esc(i)}</li>`).join("") + "</ul>" : `<p>${esc(items[0] || "")}</p>`;
  }
  if (def.type === "image") return diagramHtml(val, d);
  if (def.type === "video") return videoHtml(val);
  if (def.type === "link") {
    const label = (val === d["Link"] && d["__linktext"] && d["__linktext"] !== val) ? d["__linktext"] : "Åbn link til øvelsen hos DBU";
    let note = "";
    try { note = LINK_NOTES[new URL(val).hostname] || ""; } catch (e) { note = ""; }
    if (isFckLink(val)) {                     // FCK has no page per drill: the link opens their drill bank
      return libLink(val, "Find øvelsen i FCK's øvelsesbank") +
        `<p class="link-note">Linket åbner forsiden af øvelsesbanken. Søg efter »${esc(cleanVal(d["Navn"]))}«. ${esc(note)}</p>`;
    }
    return libLink(val, label) + (note ? `<p class="link-note">${esc(note)}</p>` : "");
  }
  if (def.type === "notes") {
    return (d["__noter"] || []).map(p => libLink(p.url, p.text) || `<span>${escLines(p.text)}</span>`).join(" ");
  }
  return `<p>${escLines(val)}</p>`;
}

/* Tags: a red row (category, focus) above a grey row (age, facts, themes).
   On the card (full = false) only the first 3 focus tags are shown, followed by "+n". */
function drillChips(d, full) {
  const chip = (cls, t) => `<span class="dchip ${cls}">${esc(t)}</span>`;
  const bane = cleanVal(d["Banestørrelse"]);

  const fokus = focusTags(d);
  const shown = full ? fokus.length : Math.min(fokus.length, 3);   // on the card: 3 focus tags, the rest behind "+n"
  const hidden = fokus.length - shown;

  const red = [].concat(
    splitVals(d, "Format").map(v => chip("cat", v)),
    fokus.slice(0, shown).map(v => chip("focus", v)));
  if (hidden) {
    red.push(`<button type="button" class="dchip more" aria-label="Vis ${hidden} flere tags"
                onclick="event.stopPropagation(); showMoreChips(this)" onkeydown="event.stopPropagation()">+${hidden}</button>`);
    fokus.slice(shown).forEach(v => red.push(chip("focus", v).replace("<span ", "<span hidden ")));
  }

  const grey = [].concat(
    rawVals(d, "Aldersgruppe").map(v => chip("", v)),
    [
      rangeText(d["Antal spillere min"], d["Antal spillere max"], "spillere"),
      rangeText(d["Varighed min"], d["Varighed max"], "min"),
      bane ? "Bane: " + bane : ""
    ].filter(Boolean).map(t => chip("", t)));
  const kamp = cleanVal(d["Kampnærhed"]), lv = (kamp.match(/^[1-5]/) || [""])[0];
  if (lv) grey.push(`<span class="dchip kamp" title="Kampnærhed: ${esc(kamp)}">Kampnærhed ${lv}/5</span>`);

  if (full) {
    splitVals(d, "Temaer").concat(splitVals(d, "Undertemaer"))
      .forEach(v => grey.push(chip("sub", v)));
  }
  return (red.length  ? `<div class="dchips">${red.join("")}</div>`  : "") +
         (grey.length ? `<div class="dchips">${grey.join("")}</div>` : "");
}

/* "+n" on a card: show the hidden tags (without opening the drill) */
function showMoreChips(btn) {
  btn.parentElement.querySelectorAll(".dchip[hidden]").forEach(el => { el.hidden = false; });
  btn.remove();
}

/* The drill's source (Kilde), e.g. "DBU" or "FCK", in the card's bottom right corner */
function sourceBadge(d) {
  const src = cleanVal(String(d["Kilde"] || "").split(/[;,]/)[0]).toUpperCase();
  return src ? '<span class="src-badge" title="Kilde: ' + esc(src) + '">' + esc(src) + '</span>' : "";
}

/* Card in the list: tap to open the full-screen drill */
function drillCard(d, i) {
  return `
    <div class="card">
      <div class="header" id="dheader-${i}" role="button" tabindex="0"
           aria-label="Åbn ${esc(d["Navn"])}"
           onclick="openDrill(${i})"
           onkeydown="if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); openDrill(${i}); }">
