<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Træningsparat</title>
  <meta name="theme-color" content="#AD152F">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Træningsparat">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <style>
    /* One place to change the red everywhere */
    :root {
      --red: #AD152F;
      --red-tint: #F7E8EB;     /* very light version of the red, used behind link buttons */
    }

    /* Width and height include padding and border, so nothing sticks out of its box */
    *, *::before, *::after { box-sizing: border-box; }

    /* One keyboard-focus style for every button, link and field */
    :focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }

    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 20px;
      /* keep clear of the notch and the home bar when opened from the home screen */
      padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right))
               max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
    }

    #sessions {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .card {
      background: #ffffff;
      border-top: 6px solid var(--red);
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .theme {
      color: var(--red);
    }

    /* ---------- Loading screen ---------- */
    .loading {
      position: fixed;
      inset: 0;                    /* covers the whole visible area */
      z-index: 10;
      overflow: hidden;            /* clips at the screen edge */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #666;
    }

    .spinner {
      --size: 120px;               /* change this one value to resize everything */

      position: relative;
      width: var(--size);
      height: var(--size);
      border-radius: 50%;
      border: calc(var(--size) * 0.03) solid #111;   /* black outer ring */
      background: #ffffff;
      animation: spin 1.2s linear infinite;
    }

    .spinner::before {
      content: "";
      position: absolute;
      inset: calc(var(--size) * 0.04);               /* white gap between ring and stripes */
      border-radius: 50%;
      background: linear-gradient(90deg,
        #ffffff 0 25%,
        var(--red) 25% 75%,
        #ffffff 75% 100%)
        center / calc(var(--size) * 0.21) 100% repeat-x;
    }

    .loading span {
      transition: opacity 0.2s;
    }

    .loading.done span {
      opacity: 0;                  /* the loading text fades out first */
    }

    .loading.done .spinner {
      scale: var(--grow, 12);      /* set by the script to fit the screen */
      opacity: 0;
      transition: scale 0.45s ease-in, opacity 0.2s ease-in 0.25s;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ---------- Next session + past sessions ---------- */
    .card.next {
      box-shadow: 0 0 0 2px var(--red), 0 4px 14px rgba(0,0,0,0.15);
    }

    .tag {
      display: inline-block;
      margin-bottom: 8px;
      padding: 3px 10px;
      background: var(--red);
      color: #ffffff;
      font-size: 13px;
      font-weight: bold;
      border-radius: 99px;
    }

    .card.past {
      opacity: 0.75;
    }

    .past-group {
      grid-column: 1 / -1;
    }

    .past-group > summary {
      cursor: pointer;
      padding: 12px 16px;
      background: #ffffff;
      color: var(--red);
      font-weight: bold;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .past-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    /* ---------- Card header with fold chevron ---------- */
    .header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
    }

    .header:focus-visible {
      outline-offset: 4px;
      border-radius: 8px;
    }

    .header-text {
      min-width: 0;                /* lets long themes wrap instead of pushing the chevron out */
    }

    .header-text h3 {
      margin: 6px 0 0;
    }

    .chevron {
      flex: none;
      position: relative;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--red-tint);
      transition: transform 0.2s, background 0.15s;
    }

    .chevron::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 8px;
      height: 8px;
      border-right: 2px solid var(--red);
      border-bottom: 2px solid var(--red);
      transform: translate(-50%, -70%) rotate(45deg);   /* points down */
    }

    .chevron.open {
      transform: rotate(180deg);                         /* points up */
    }

    .header:hover .chevron {
      background: var(--red);
    }

    .header:hover .chevron::before {
      border-color: #ffffff;
    }

    .notes a {
      margin: 4px 6px 4px 0;       /* space between separate note links */
    }

    /* ---------- Navigation and drill library ---------- */
    .view-hidden { display: none !important; }

    .nav { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
    .navbtn {
      padding: 10px 18px; border: 0; border-radius: 99px;
      background: #ffffff; color: #333; font: inherit; font-weight: bold;
      box-shadow: 0 1px 4px rgba(0,0,0,0.12); cursor: pointer;
    }
    .navbtn[aria-current="page"] { background: var(--red); color: #ffffff; }
    .navbtn .beta, h2 .beta { font-size: 0.75em; font-weight: normal; }
    .beta-note { margin: -2px 0 12px; }
    @media (max-width: 520px) {            /* phones: smaller tabs, wrapping onto a second row when needed */
      .nav { gap: 6px; }
      .navbtn { padding: 9px 12px; }
    }

    #lib-search {
      width: 100%; max-width: 480px;
      padding: 11px 14px; border: 1px solid #d6d6d6; border-radius: 10px;
      font: inherit; background: #ffffff;
    }
    .fgroup { margin-top: 14px; }
    .fgroup-label { margin-bottom: 6px; color: #666; font-size: 13px; font-weight: bold; }
    .tagbtn {
      margin: 0 6px 6px 0; padding: 6px 12px; border: 1px solid #d6d6d6; border-radius: 99px;
      background: #ffffff; color: #222; font: inherit; font-size: 14px; cursor: pointer;
    }
    .tagbtn .n { margin-left: 4px; color: #888; font-size: 12px; }
    .tagbtn[aria-pressed="true"] { background: var(--red); border-color: var(--red); color: #ffffff; }
    .tagbtn[aria-pressed="true"] .n { color: #ffffff; }
    .tagbtn:disabled { opacity: 0.4; cursor: default; }

    .lib-loading { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 48px 0; color: #666; }
    .lib-loading .spinner { --size: 64px; }
    .lib-status { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 14px 0; color: #555; }
    .clearbtn {
      padding: 4px 10px; border: 1px solid var(--red); border-radius: 99px;
      background: none; color: var(--red); font: inherit; font-size: 14px; cursor: pointer;
    }

    #drill-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px; align-items: start;
    }
    .grid-more { grid-column: 1 / -1; justify-self: center; }
    .dchips { margin-top: 8px; }
    .dchip {
      display: inline-block; margin: 0 6px 6px 0; padding: 2px 10px; border-radius: 99px;
      background: #f0f0f0; font-size: 13px;
    }
    .dchip.cat { background: var(--red-tint); color: var(--red); font-weight: bold; }
    .dsec { margin-bottom: 18px; }
    .dsec h4 { margin: 0 0 6px; color: var(--red); font-size: 15px; }
    .dsec p, .dsec ul { margin: 0; }
    .dsec ul { padding-left: 20px; }
    .media { display: block; width: 100%; border-radius: 8px; }
    iframe.media { aspect-ratio: 16 / 9; border: 0; }
    img.media { max-height: 520px; object-fit: contain; background: #ffffff; }

    .dfocus { margin: 4px 0 0; color: #555; font-size: 14px; }
    .filter-panel { margin-top: 14px; }
    .filter-panel > summary {
      display: inline-block; padding: 8px 14px; border-radius: 99px; background: #ffffff;
      box-shadow: 0 1px 4px rgba(0,0,0,0.12); color: var(--red); font-weight: bold; cursor: pointer;
    }

    /* ---------- Full-screen drill viewer ---------- */
    body.noscroll { overflow: hidden; }
    .chevron.go::before { transform: translate(-70%, -50%) rotate(-45deg); }   /* points right */

    .viewer {
      position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column;
      background: #f4f4f4;
    }
    .v-top {
      display: flex; align-items: center; gap: 12px; padding: 10px 14px;
      padding-top: calc(10px + env(safe-area-inset-top, 0px));
      background: #ffffff; border-bottom: 3px solid var(--red);
    }
    .v-back {
      flex: none; padding: 9px 14px; border: 0; border-radius: 99px;
      background: var(--red-tint); color: var(--red); font: inherit; font-weight: bold; cursor: pointer;
    }
    .v-datebadge {
      display: inline-block; padding: 3px 14px; border-radius: 10px;
      background: var(--red-tint); color: var(--red); font-size: 18px; font-weight: 800; line-height: 1.3;
    }
    .v-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .v-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: bold; }
    .v-tabs {
      display: flex; gap: 6px; overflow-x: auto; padding: 8px 14px; background: #ffffff; scrollbar-width: none;
    }
    .v-tabs::-webkit-scrollbar, .v-pages::-webkit-scrollbar { display: none; }
    .v-tab {
      flex: none; padding: 6px 12px; border: 1px solid #d6d6d6; border-radius: 99px;
      background: #ffffff; font: inherit; font-size: 14px; white-space: nowrap; cursor: pointer;
    }
    .v-tab[aria-selected="true"] { background: var(--red); border-color: var(--red); color: #ffffff; }

    .v-pages {
      flex: 1; min-height: 0; display: flex; overflow-x: auto; overflow-y: hidden;
      scroll-snap-type: x mandatory; overscroll-behavior-x: contain; scrollbar-width: none;
    }
    .v-page {
      position: relative; flex: 0 0 100%; overflow-y: auto;
      scroll-snap-align: start; scroll-snap-stop: always; padding: 16px;
    }
    .v-inner {
      max-width: 760px; margin: 0 auto; padding: 18px; background: #ffffff;
      border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .v-inner h2 { margin: 0 0 12px; color: var(--red); font-size: 22px; }
    .v-inner h3 { margin: 0 0 8px; color: var(--red); font-size: 18px; }
    .v-inner p, .v-inner li, .v-inner span { font-size: 17px; line-height: 1.5; }
    .v-inner p { margin: 0 0 10px; }
    .v-inner li { margin: 8px 0; }
    .v-inner ul { margin: 0; padding-left: 22px; }
    .v-focus { font-size: 19px !important; font-weight: bold; margin-bottom: 14px !important; }
    .v-inner a {
      display: inline-block; margin: 4px 6px 4px 0; padding: 10px 16px; background: var(--red-tint);
      color: var(--red); font-weight: bold; text-decoration: none; border-radius: 8px;
      border-left: 4px solid var(--red);
    }
    .v-inner a::after { content: " ↗"; }
    .v-inner img.media { max-height: 65vh; }
    .dchip.sub { background: #ffffff; border: 1px solid #d6d6d6; }
    .dchip.focus { background: #ffffff; border: 1px solid var(--red); color: var(--red); }
    .dchip.more { background: #ffffff; border: 1px solid #d6d6d6; color: #555555; }
    .dchip[hidden] { display: none; }
    .dchip.kamp { background: #e6eef8; color: #1f4e8c; }
    button.dchip.more { font: inherit; font-size: 13px; line-height: inherit; cursor: pointer; }
    button.dchip.more:hover { border-color: var(--red); color: var(--red); }

    .v-bottom {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px)); background: #ffffff; border-top: 1px solid #ddd;
    }
    .v-nav {
      flex: none; width: 46px; height: 46px; border: 0; border-radius: 50%;
      background: var(--red); color: #ffffff; font-size: 24px; line-height: 1; cursor: pointer;
    }
    .v-nav:disabled { opacity: 0.3; cursor: default; }
    .v-dots { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
    .dot { width: 12px; height: 12px; padding: 0; border: 0; border-radius: 50%; background: #cccccc; cursor: pointer; }
    .dot[aria-current="true"] { background: var(--red); transform: scale(1.35); }

    .loading.done { pointer-events: none; }
    .build { margin: 28px 0 0; color: #999999; font-size: 12px; }
    .plan-bar { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; color: #666666; font-size: 14px; }
    .plan-bar .clearbtn:disabled { opacity: 0.5; cursor: default; }
    .server-note { grid-column: 1 / -1; margin: 0; padding: 10px 12px; border-radius: 10px; background: #fff4e5; color: #6b3a00; font-size: 14px; line-height: 1.4; }
    .server-note a { color: inherit; font-weight: bold; }
    @media (prefers-color-scheme: dark) { .server-note { background: #3a2a10; color: #ffd9a0; } }

    .v-sec + .v-sec { margin-top: 22px; padding-top: 18px; border-top: 1px solid #eeeeee; }
    .dchips + .v-sec { margin-top: 18px; }

    /* ---------- Rows of a training (one per station) ---------- */
    .v-plan { display: flex; flex-direction: column; gap: 8px; min-width: 0; margin-top: 4px; }
    .v-planrow {
      display: flex; align-items: center; justify-content: space-between; gap: 14px;
      width: 100%; max-width: 100%; padding: 12px 14px; border: 1px solid #e3e3e3; border-radius: 10px;
      background: #fafafa; color: inherit; font: inherit; text-align: left; cursor: pointer;
    }
    .v-planrow:hover { border-color: var(--red); }
    .v-planrow .v-lab { display: block; color: #555555; font-size: 14px; font-weight: 600; letter-spacing: .02em; }
    .v-planrow .v-coach { color: var(--red); font-size: inherit; font-weight: inherit; letter-spacing: inherit; }
    .v-planrow .v-name { display: block; margin-top: 2px; font-size: 19px; line-height: 1.25; font-weight: 700; }
    .v-plan-text { min-width: 0; overflow-wrap: anywhere; }
    .v-inner .v-plan + .v-sec { margin-top: 22px; }
    .v-inner .v-notes { margin: 0 0 18px; }

    .v-inner a.v-planrow {
      display: flex; margin: 0; padding: 12px 14px; background: #fafafa; color: inherit;
      border: 1px solid #e3e3e3; border-radius: 10px; font-weight: normal; text-decoration: none;
    }
    .v-inner a.v-planrow::after { content: none; }
    .v-inner a.v-planrow:hover, .v-inner a.v-planrow:focus-visible { border-color: var(--red); background: var(--red-tint); }
    .v-planrow.plain { cursor: default; }

    /* bigger arrows on the rows, so it is clear that they can be tapped */
    .v-planrow .chevron { width: 40px; height: 40px; }
    .v-planrow .chevron::before { width: 11px; height: 11px; border-right-width: 3px; border-bottom-width: 3px; }
    .v-planrow:hover .chevron { background: var(--red); }
    .v-planrow:hover .chevron::before { border-color: #ffffff; }
    .v-planrow .v-go {
      flex: none; display: inline-flex; align-items: center; justify-content: center;
      width: 40px; height: 40px; border-radius: 50%; background: var(--red-tint);
      color: var(--red); font-size: 22px; font-weight: bold; line-height: 1;
    }

    .fsub { margin: 6px 0 10px; }
    .fsub-label { display: block; margin-bottom: 6px; color: #888888; font-size: 12px; font-weight: bold; }
    .fsearch {
      display: block; width: 100%; max-width: 320px; margin: 0 0 8px; padding: 8px 12px;
      border: 1px solid #d6d6d6; border-radius: 10px; font: inherit; font-size: 14px; background: #ffffff;
    }
    .fnone { color: #888888; font-size: 14px; }
    .moretoggle {
      margin: 2px 0 0; padding: 4px 0; border: 0; background: none; color: var(--red);
      font: inherit; font-size: 14px; font-weight: bold; cursor: pointer;
    }

    .v-findbtn {
      display: block; width: 100%; max-width: 100%; margin: 14px 0 0; padding: 12px 14px; border: 1px solid var(--red);
      border-radius: 10px; background: #ffffff; color: var(--red); font: inherit; font-weight: bold;
      text-align: left; cursor: pointer;
    }
    .v-findbtn:hover, .v-findbtn:focus-visible { background: var(--red-tint); }
    .plan-new { grid-column: 1 / -1; margin: 0 0 4px; text-align: center; }
    .plan-edit { display: flex; gap: 10px; flex-wrap: wrap; }
    .plan-edit .v-findbtn { flex: 1 1 140px; width: auto; text-align: center; }
    .planner label { display: block; margin: 12px 0 0; font-weight: bold; font-size: 14px; }
    .planner input, .planner textarea {
      display: block; box-sizing: border-box; width: 100%; margin-top: 4px; padding: 10px 12px; border: 1px solid #cccccc;
      border-radius: 10px; background: #ffffff; font: inherit; font-weight: normal;
    }
    .planner fieldset { margin: 16px 0 0; padding: 4px 12px 12px; border: 1px solid #dddddd; border-radius: 12px; }
    .planner fieldset input { margin-top: 8px; }
    .planner legend { padding: 0 6px; color: var(--red); font-weight: bold; }
    .planner-msg { min-height: 1.3em; margin: 12px 0 0; font-size: 14px; }
    .planner-msg.bad { color: #b00020; }
    .planner-actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 0 8px; }
    .planner-del { color: #b00020; }
    .v-findbtn + .v-sec { margin-top: 22px; }

    .var-list { list-style: none; padding-left: 0 !important; }
    .var-list li { display: flex; align-items: flex-start; gap: 10px; }
    .sign {
      flex: none; display: inline-flex; align-items: center; justify-content: center;
      width: 24px; height: 24px; margin-top: 2px; border-radius: 50%; font-weight: bold; line-height: 1;
    }
    .sign.plus { background: #e3f2e5; color: #1b5e20; }
    .sign.minus { background: #fdebd8; color: #8a4b00; }
    .sign.pm { background: #eeeeee; color: #444444; }
    .sign.neutral { background: #e6eef8; color: #1f4e8c; }   /* a variation that is neither easier nor harder */
    .var-list li.var-head { display: block; margin-top: 8px; font-weight: bold; }
    .link-note { margin: 2px 0 0 !important; color: #777777; font-size: 14px !important; }

    .lib-note {
      margin: 12px 0 0; padding: 10px 12px; border-left: 4px solid var(--red); border-radius: 8px;
      background: #ffffff; color: #444444; font-size: 14px;
    }
    .lib-note:empty { display: none; }
    /* "Henter nyeste øvelser …": shown when the server is slow, above the drills */
    .lib-sync {
      display: flex; align-items: center; gap: 10px; margin: 10px 0 0; padding: 8px 12px; border-radius: 8px;
      background: #fff8d6; color: #5a4a00; font-size: 14px;
    }
    .lib-sync:empty { display: none; }
    .lib-sync .spinner { width: 18px; height: 18px; border-width: 3px; flex: none; }

    .card-actions { display: flex; align-items: center; gap: 10px; margin-top: 10px; padding-top: 10px; border-top: 1px solid #eeeeee;
      container: cardact / inline-size; }
    /* With the flag switch there is not always room for "Kopiér link" on one line: then only the link icon */
    @container cardact (max-width: 305px) {
      .card-actions:has(.langbtn) .copybtn .lbl { display: none; }
      .card-actions:has(.langbtn) .copybtn { padding: 7px 10px; }
    }
    .src-badge {
      margin-left: auto; padding: 3px 8px; border: 1px solid #d6d6d6; border-radius: 6px;
      color: #666666; font-size: 12px; font-weight: bold; letter-spacing: 0.04em;
    }
    .copybtn {
      display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border: 1px solid #d6d6d6;
      border-radius: 99px; background: #ffffff; color: var(--red); font: inherit; font-size: 14px;
      font-weight: bold; white-space: nowrap; cursor: pointer;
    }
    .copybtn:hover { background: var(--red-tint); border-color: var(--red); }
    #v-copy, #v-share { flex: none; margin-left: auto; }
    /* Danish/English switch on translated drills */
    .langbtn {
      flex: none; display: inline-flex; align-items: center; gap: 2px; padding: 4px 6px; border: 1px solid #d6d6d6;
      border-radius: 99px; background: #ffffff; cursor: pointer;
    }
    .langbtn .flag { display: inline-flex; padding: 2px; border-radius: 4px; opacity: 0.35; }
    .langbtn .flag.on { opacity: 1; box-shadow: 0 0 0 2px var(--red); }
    .langbtn svg { display: block; border-radius: 2px; }
    @media (max-width: 480px) {                  /* room for the title when the flags are in the top bar */
      .v-top:has(#v-lang .langbtn) #v-copy .lbl { display: none; }
      .v-top:has(#v-lang .langbtn) #v-copy { padding: 7px 9px; }
    }

    /* Favourite star (on the card, in the viewer) and the "Favoritter" switch above the list */
    .favbtn {
      flex: none; display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px;
      padding: 0; border: 1px solid #d6d6d6; border-radius: 50%; background: #ffffff; color: #999999; cursor: pointer;
    }
    .favbtn:hover { border-color: var(--red); color: var(--red); }
    .favbtn[aria-pressed="true"] { border-color: #e0a800; background: #fff6d6; color: #c98a00; }
    .favbtn[aria-pressed="true"] svg { fill: currentColor; }
    .favfilter {
      display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border: 1px solid #d6d6d6;
      border-radius: 99px; background: #ffffff; color: #555555; font: inherit; font-size: 14px; cursor: pointer;
    }
    .favfilter[aria-pressed="true"] { border-color: #e0a800; background: #fff6d6; color: #8a5d00; font-weight: bold; }
    .favfilter[aria-pressed="true"] svg { fill: currentColor; }
    .toast {
      position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
      z-index: 40; width: max-content; max-width: calc(100% - 32px); padding: 12px 16px;
      border-radius: 12px; background: #222222; color: #ffffff; font-size: 15px; box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }
    .toast input {
      display: block; width: 100%; margin-top: 8px; padding: 8px 10px;
      border: 0; border-radius: 8px; font: inherit; font-size: 14px;
    }

    .v-diagram { margin-bottom: 14px; }
    /* Placeholder when a drill has no picture: a faded, generic pitch with a clear label */
    .ph-diagram {
      position: relative; display: flex; align-items: center; justify-content: center; aspect-ratio: 3 / 2;
      max-height: 60vh; border: 2px dashed #c9c9c9; border-radius: 8px; background: #f7f7f7; overflow: hidden;
    }
    .ph-diagram svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .ph-diagram.ph-video { aspect-ratio: 16 / 9; flex-direction: column; gap: 10px; }
    .ph-diagram.ph-video svg { position: static; width: 56px; height: 56px; }
    .ph-label {
      position: relative; max-width: 80%; padding: 10px 14px; border-radius: 10px; background: rgba(255,255,255,0.92);
      box-shadow: 0 1px 4px rgba(0,0,0,0.12); color: #555555; font-size: 14px; text-align: center;
    }
    .ph-label strong { display: block; margin-bottom: 2px; color: #333333; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; }
    .v-diagram img.media { width: 100%; max-height: 60vh; }
    /* Several pictures (FA sessions): one at a time, with arrows and the picture's own text */
    .g-slide { display: none; margin: 0; }
    .g-slide.on, .g-single { display: block; }
    .g-slide figcaption, .g-single figcaption { margin-top: 8px; color: #444444; font-size: 14px; line-height: 1.45; }
    .g-nav { display: flex; align-items: center; justify-content: center; gap: 18px; margin-top: 8px; }
    .g-btn {
      width: 40px; height: 40px; border: 0; border-radius: 50%; background: var(--red-tint); color: var(--red);
      font: inherit; font-size: 24px; line-height: 1; cursor: pointer;
    }
    .g-count { min-width: 52px; color: #555555; font-size: 14px; text-align: center; }
    .video-part + .video-part { margin-top: 14px; }
    .video-part-label { margin-bottom: 6px; color: #555555; font-size: 13px; font-weight: 600; }
    .v-inner .dchips { margin-top: 0; }
    .v-diagram + .dchips, .dchips + .dchips { margin-top: 6px; }
    .tag-row + .tag-row { margin-top: 12px; }
    .tag-label { margin-bottom: 4px; color: #777777; font-size: 13px; font-weight: bold; }
    .v-sec .dchips { margin-top: 0; }

    /* ---------- Training groups (only with the groups code) ---------- */
    .grp-sec { margin: 0 0 18px; padding: 14px; border: 1px solid #e3e3e3; border-radius: 12px; background: #fafafa; }
    .grp-sec > summary { cursor: pointer; font-weight: bold; color: var(--red); }
    .grp-sec[open] > summary { margin-bottom: 10px; }
    .grp-who { display: grid; grid-template-columns: 1fr; gap: 2px; }   /* one column: easy to run down when calling names */
    .grp-who label { display: flex; align-items: center; gap: 10px; min-height: 40px; font-size: 19px; cursor: pointer; }
    .grp-who input { width: 24px; height: 24px; flex: none; accent-color: var(--red); }
    .grp-band { color: #777777; font-size: 15px; white-space: nowrap; }
    .grp-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-top: 10px; }
    .grp-mode { display: inline-flex; border: 1px solid var(--red); border-radius: 99px; overflow: hidden; }
    .grp-mode button {
      padding: 7px 10px; border: 0; background: #ffffff; color: var(--red);
      font: inherit; font-size: 14px; white-space: nowrap; cursor: pointer;
    }
    @media (max-width: 359px) { .grp-mode { flex-wrap: wrap; border-radius: 14px; } }   /* the smallest phones: two rows */
    .grp-mode button[aria-pressed="true"] { background: var(--red); color: #ffffff; font-weight: bold; }
    .grp-step { display: inline-flex; align-items: center; gap: 6px; }
    .grp-step button {
      width: 36px; height: 36px; border: 1px solid var(--red); border-radius: 50%;
      background: #ffffff; color: var(--red); font: inherit; font-size: 20px; line-height: 1; cursor: pointer;
    }
    .grp-step output { min-width: 2ch; font-size: 20px; font-weight: bold; text-align: center; }
    .grp-hint { color: #555555; font-size: 14px; }
    .grp-slide { display: block; margin-top: 14px; }
    .grp-slide > span:first-child { display: block; font-size: 14px; font-weight: bold; }
    .grp-slide > .grp-hint { display: block; }
    .grp-slide input { width: 100%; max-width: 360px; accent-color: var(--red); }
    .grp-ends { display: flex; justify-content: space-between; max-width: 360px; color: #777777; font-size: 12px; }
    .grp-msg { margin: 0 0 12px; color: #555555; font-size: 14px; }
    .grp-msg.bad { color: #b00020; font-weight: bold; }
    /* inside a training the viewer's text size (17px) would win: these keep the group screen's own sizes */
    .grp .grp-hint { font-size: 14px; line-height: 1.4; }
    .grp .grp-explain { font-size: 13px; line-height: 1.45; color: #666666; }
    .grp .grp-band { font-size: 15px; }
    .grp .grp-ends span { font-size: 12px; }
    .grp .grp-slide > span:first-child { font-size: 14px; }
    .grp .grp-msg, .grp .grp-warn, .grp .grp-mixline { font-size: 14px; }
    .grp .grp-legend { font-size: 13px; }
    .grp .grp-head small { font-size: 13px; }
    .grp .grp-none, .grp .grp-ask { font-size: 15px; }
    .grp .grp-who label > span { font-size: 19px; }
    .grp-label { flex-basis: 100%; }
    .grp-ask { margin-top: 10px; padding: 10px 12px; border: 1px solid #e3b7c0; border-radius: 10px; background: #fff7f8; font-size: 15px; }
    .grp-ask .grp-row { margin-top: 8px; }
    .grp-none { margin: 0 0 14px; padding: 10px 14px; border-radius: 10px; background: var(--red-tint); color: #333333; }
    .grp-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
    .grp-card { padding: 12px; border: 1px solid #e3e3e3; border-top: 4px solid var(--red); border-radius: 10px; background: #ffffff; }
    .grp-card.bad { border-color: #b00020; background: #fff5f6; }
    .grp-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 10px; margin-bottom: 8px; }
    .grp-head small { color: #555555; font-size: 13px; }
    .grp-players { display: flex; flex-wrap: wrap; gap: 6px; }
    .grp-p {
      display: inline-flex; align-items: baseline; gap: 6px; padding: 8px 13px; border: 1px solid #d6d6d6;
      border-radius: 99px; background: #ffffff; color: inherit; font: inherit; font-size: 19px; cursor: pointer;
    }
    .grp-p.moved { border-color: var(--red); background: var(--red-tint); }
    .grp-p[aria-pressed="true"] { border-color: var(--red); background: var(--red); color: #ffffff; }
    .grp-p[aria-pressed="true"] .grp-band { color: #ffffff; }
    .grp-here { margin-top: 8px; }
    .grp-warn { margin: 8px 0 0; color: #b00020; font-size: 14px; }
    .grp-save { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-top: 16px; }
    .grp-legend { margin: 10px 0 0; color: #777777; font-size: 13px; }
    /* Spilleroversigt */
    .ov-list { display: grid; gap: 10px; }
    .ov-p { padding: 10px 12px; border: 1px solid #e3e3e3; border-radius: 10px; background: #ffffff; }
    .ov-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; }
    .grp .ov-head strong { font-size: 18px; }
    .grp .ov-seen { margin-left: auto; color: #555555; font-size: 14px; }
    .grp .ov-name { padding: 0; border: 0; background: none; color: inherit; font: inherit; cursor: pointer; text-decoration: underline; text-decoration-color: #cccccc; text-underline-offset: 3px; }
    .grp .ov-histbtn { margin-top: 8px; }
    .hist-list { display: grid; gap: 8px; margin-top: 12px; }
    .hist-e { padding: 10px 12px; border: 1px solid #e3e3e3; border-radius: 10px; background: #ffffff; }
    .hist-e.hist-res { background: #f7f5f2; }
    .hist-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
    .grp .hist-k { margin-left: auto; color: #555555; font-size: 13px; }
    .grp .hist-e p { margin: 4px 0 0; font-size: 15px; }
    .grp .hist-c { color: var(--red); font-weight: bold; }
    .grp .hist-mix, .grp .hist-set { color: #555555; font-size: 14px; }
    .ov-bar { display: flex; height: 10px; margin: 8px 0 4px; overflow: hidden; border-radius: 99px; background: #f0f0f0; }
    .ov-sec { margin-top: 10px; }
    .ov-sechead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 8px; font-size: 15px; font-weight: bold; }
    .ov-sechead .ov-title { white-space: nowrap; }
    .grp .ov-sechead small { color: #555555; font-size: 13px; font-weight: normal; }
    .ov-bars { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 4px 8px; margin: 5px 0 3px; }
    .ov-bars .ov-bar { margin: 0; height: 12px; }
    .ov-bars .ov-aim { height: 6px; }
    .grp .ov-p .ov-lab { min-width: 3.6em; color: #333333; font-size: 13px; }
    .grp .ov-p .ov-val { color: #333333; font-size: 13px; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .grp .ov-p .ov-goal { color: #666666; }
    .grp .ov-up, .grp .ov-eq, .grp .ov-dn { font-style: normal; font-weight: bold; }
    .grp .ov-up { color: #AD152F; }
    .grp .ov-eq { color: #c4788a; }
    .grp .ov-dn { color: #8a8a8a; }
    .grp .ov-key i { margin-right: -2px; }
    .grp .lvl-toggle { margin: 0 0 12px; }
    .fix-game { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 12px 0; border-top: 1px solid #e6e1da; }
    .fix-game .fix-ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; width: 100%; }
    .grp .fix-game input, .grp .fix-sname, .grp .fix-sets select, .grp .fix-game select { padding: 8px 10px; border: 1px solid #cccccc; border-radius: 10px; font: inherit; font-size: 16px; background: #ffffff; }
    .grp .fix-game .fix-gname { flex: 1 1 10em; min-width: 0; font-weight: bold; }
    .grp .fix-sname { flex: 1 1 12em; min-width: 0; font-weight: bold; }
    .grp .fix-sets select { flex: 1 1 12em; min-width: 0; }
    .fix-av { overflow-x: auto; margin: 8px 0; }
    .fix-av table { border-collapse: collapse; font-size: 15px; }
    .fix-av th, .fix-av td { padding: 3px 4px; text-align: center; border-bottom: 1px solid #eee9e2; }
    .fix-av table { width: 100%; }
    .fix-av tbody th, .fix-av tfoot th { width: 100%; text-align: left; font-weight: normal; padding-right: 8px; overflow-wrap: anywhere; }
    .fix-av tfoot td, .fix-av tfoot th { color: #555555; font-size: 14px; border-bottom: 0; }
    .grp .fix-tog { width: 40px; height: 34px; border: 1px solid #cccccc; border-radius: 8px; background: #ffffff; color: #ffffff; font: inherit; font-weight: bold; cursor: pointer; }
    .grp .fix-tog[aria-pressed="true"] { background: var(--red); border-color: var(--red); }
    .grp .fix-tog.fix-fast { background: #fbe3e7; border: 2px solid var(--red); }
    .grp .fix-keeper { margin-left: 3px; }
    .grp .fix-nokeeper { color: var(--red); font-weight: bold; }
    .grp .fix-x { color: var(--red); font-size: 12px; font-weight: bold; }
    .fix-legend { display: grid; gap: 8px; margin: 8px 0 4px; padding: 0; list-style: none; }
    .fix-legend li { display: flex; align-items: flex-start; gap: 10px; }
    .fix-legend .fix-num { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--red); color: #ffffff; font-weight: bold; text-align: center; line-height: 28px; }
    .fix-legend b { display: block; overflow-wrap: anywhere; }
    .grp .fix-legend small { display: block; color: #555555; font-size: 14px; }
    .fix-legend .clearbtn { margin-top: 4px; }
    .fix-av abbr { text-decoration: none; font-weight: bold; color: var(--red); }
    .grp .fix-out { border-color: var(--red); }
    .grp .fix-warn { color: var(--red); font-weight: bold; margin-left: 2px; }
    .ov-bars .ov-aim .ov-less { background: #b3b3b3; }
    .ov-bars .ov-empty { background: repeating-linear-gradient(45deg, #ececec 0 6px, #f7f7f7 6px 12px); }
    .grp .ov-how { margin: 0 0 12px; color: #555555; font-size: 14px; }
    .grp .ov-how summary { cursor: pointer; color: var(--red); font-weight: bold; }
    .grp .ov-how p { margin: 6px 0 0; }
    .grp .ov-key + .ov-key { margin-top: -6px; }
    .ov-more { background: #AD152F; }
    .ov-same { background: #e0a6b1; }
    .ov-less { background: #d6d6d6; }
    .grp .ov-line { margin: 2px 0 0; color: #555555; font-size: 14px; }
    .grp .ov-key { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; margin: 0 0 10px; color: #555555; font-size: 13px; }
    .grp .ov-key span { display: inline-block; width: 12px; height: 12px; margin-left: 6px; border-radius: 3px; }
    .grp .ov-key span:first-child { margin-left: 0; }

    /* "Kampe til træning" */
    .grp-arrow { margin-right: 4px; color: var(--red); font-weight: bold; }
    .grp-mode.grp-wrap { flex-wrap: wrap; gap: 6px; border: 0; border-radius: 0; overflow: visible; }
    .grp-mode.grp-wrap button { border: 1px solid var(--red); border-radius: 99px; }
    .grp-sizes { margin-top: 8px; }
    .grp-sizerow { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 4px 0; }
    .grp .grp-sizerow output { flex: 1; min-width: 0; font-size: 14px; font-weight: normal; text-align: center; }
    .grp-sizerow .grp-step { flex: 1; min-width: 0; max-width: 17em; }
    .grp .grp-off { color: #b00020; font-weight: bold; }
    .grp-sizerow > span:first-child { white-space: nowrap; }
    .grp-matchtools { margin-top: 10px; gap: 6px 8px; }
    .grp-matchtools .grp-here { margin-top: 0; }
    .grp-matches { margin-top: 22px; }
    .grp-matches h3 { margin: 0 0 4px; }
    .grp-matches .grp-card { margin-top: 12px; }
    .grp-pairs { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 6px 6px; align-items: center; }
    .grp-pairs .grp-p { width: 100%; justify-content: space-between; text-align: left; }
    .grp-pairs.grp-three { grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) auto minmax(0, 1fr); gap: 6px 3px; }
    .grp .grp-three .grp-teamhead small { display: block; margin-left: 0; }
    .grp .grp-three .grp-p { padding-left: 7px; padding-right: 6px; font-size: 13px; gap: 3px; flex-wrap: nowrap; }
    .grp .grp-three .grp-pname { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .grp .grp-three .grp-band { font-size: 11px; flex: none; }
    .grp-teamsrow { justify-content: space-between; }
    .grp-pname { min-width: 0; overflow-wrap: anywhere; }
    .grp .grp-none-p { color: #888888; font-size: 13px; font-style: italic; text-align: center; }
    .grp-teams { display: grid; grid-template-columns: 1fr; gap: 6px; }
    @media (min-width: 640px) { .grp-teams { grid-template-columns: 1fr auto 1fr; align-items: start; } }
    .grp-team { padding: 8px; border: 1px solid #eeeeee; border-radius: 8px; background: #fcfcfc; }
    .grp-teamhead { margin-bottom: 6px; font-weight: bold; }
    .grp .grp-teamhead small { margin-left: 6px; color: #555555; font-size: 13px; font-weight: normal; }
    .grp .grp-vs { align-self: center; color: #777777; font-size: 13px; text-align: center; }
    .grp-mixline { margin: 12px 0 0; color: #555555; font-size: 14px; }
    /* the Grupper tab (groups without a training) */
    .grp-page { padding: 18px; border-radius: 12px; background: #ffffff; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .grp-page h2 { margin: 0 0 6px; color: var(--red); font-size: 22px; }
    .grp-date { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 0 0 14px; }
    .grp-date input { padding: 8px 10px; border: 1px solid #cccccc; border-radius: 10px; font: inherit; font-size: 16px; }

    /* ---------- Login box ---------- */
    .login {
      position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center;
      padding: 16px; background: rgba(0,0,0,0.55);
    }
    .login-box {
      width: 100%; max-width: 360px; padding: 22px; border-radius: 14px;
      background: #ffffff; box-shadow: 0 8px 28px rgba(0,0,0,0.35);
    }
    .login-box h2 { margin: 0 0 6px; color: var(--red); font-size: 22px; }
    .login-box p { margin: 0 0 12px; }
    .login-box input, .login-box select {
      display: block; width: 100%; padding: 12px 14px; border: 1px solid #cccccc;
      border-radius: 10px; font: inherit; font-size: 18px;
    }
    .login-err { min-height: 1.3em; margin: 8px 0 0 !important; color: #b00020; font-size: 14px; }
    .login-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px; }
    .login-go {
      padding: 10px 20px; border: 0; border-radius: 99px; background: var(--red); color: #ffffff;
      font: inherit; font-weight: bold; cursor: pointer;
    }
    .login-go:disabled { opacity: 0.6; cursor: default; }
    .login-actions .clearbtn { padding: 10px 16px; }
  </style>
</head>

<body>

<nav class="nav" id="nav-bar" aria-label="Visning">
  <button type="button" class="navbtn" id="nav-sessions" aria-current="page" onclick="showView('sessions')">Træninger</button>
  <button type="button" class="navbtn" id="nav-library" aria-current="false" onclick="showView('library')">Øvelser</button>
  <button type="button" class="navbtn" id="nav-groups" aria-current="false" onclick="showView('groups')">Grupper</button>
  <button type="button" class="navbtn" id="nav-fixtures" aria-current="false" onclick="showView('fixtures')">Kampe <small class="beta">(beta)</small></button>
  <button type="button" class="navbtn" id="nav-overview" aria-current="false" onclick="showView('overview')">Spilleroversigt</button>
</nav>

<div id="sessions">
  <div class="loading" role="status">
    <div class="spinner" aria-hidden="true"></div>
    <span>Indlæser Træningsparat…</span>
  </div>
</div>

<div id="groups" class="view-hidden">
  <div class="grp-page">
    <h2>Grupper</h2>
    <label class="grp-date"><span class="grp-hint">Grupper uden en træning – dato</span><input type="date" id="grp-date"></label>
    <div id="grp-tab" class="grp"></div>
  </div>
</div>

<div id="fixtures" class="view-hidden">
  <div class="grp-page">
    <h2>Kampe <small class="beta">(beta)</small></h2>
    <p class="grp-hint beta-note">Fanen er under udvikling: den kan ændre sig, og udtagelserne bør tjekkes, før de bruges.</p>
    <div id="fix" class="grp"><p>Henter spillere …</p></div>
  </div>
</div>

<div id="overview" class="view-hidden">
  <div class="grp-page">
    <h2>Spilleroversigt</h2>
    <div id="ov" class="grp"><p>Henter spillere …</p></div>
  </div>
</div>

<div id="library" class="view-hidden">
  <input type="search" id="lib-search" placeholder="Søg i øvelser" aria-label="Søg i øvelser">
  <details class="filter-panel" id="lib-panel">
    <summary id="lib-panel-sum">Filtre</summary>
    <div id="lib-filters"></div>
  </details>
  <div class="lib-note" id="lib-note"></div>
  <div class="lib-status" id="lib-status" aria-live="polite"></div>
  <div class="lib-sync" id="lib-sync" role="status" aria-live="polite"></div>
  <div id="drill-grid"><div class="lib-loading"><div class="spinner" aria-hidden="true"></div><span>Indlæser øvelser…</span></div></div>
</div>

<div id="login" class="login view-hidden" role="dialog" aria-modal="true" aria-labelledby="login-title">
  <form class="login-box" id="login-form" autocomplete="off" novalidate>
    <h2 id="login-title">Indtast kode</h2>
    <input type="password" id="login-pw" name="kode" aria-label="Kode" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    <p class="login-err" id="login-err" role="alert"></p>
    <div class="login-actions">
      <button type="button" class="clearbtn" id="login-cancel">Annuller</button>
      <button type="submit" class="login-go" id="login-go">Åbn</button>
    </div>
  </form>
</div>

<div class="toast view-hidden" id="toast" role="status" aria-live="polite"></div>

<p class="build" id="build">App-version 28. nov. 2026 (8)</p>

<div id="viewer" class="viewer view-hidden" role="dialog" aria-modal="true" aria-labelledby="v-title">
  <div class="v-top">

/* The chain-link icon used on every "Kopiér link" button */

/* ===================== Drills in two languages =====================
   A drill with columns like "Beskrivelse (DA)" has a Danish translation next to the original text: English
   (FA) or Norwegian (NFF). LANG decides which one is shown: the original ("en") unless the user picks Danish
   ("da") with the flag switch on such a drill (that changes it for all of them at once).
   The original is kept in d.__en, so switching back and forth never loses anything. */
const LANG_COLS = ["Navn", "Beskrivelse", "Læringsmål", "Fokuspunkter", "Variationer", "Noter", "Materialer", "Konkurrence", "Felt",
  "Billedtekster"];
const DA = c => c + " (DA)";
let LANG = "en";
try { if (localStorage.getItem("oevLang") === "da") LANG = "da"; } catch (e) { /* default: the original English */ }

const hasDa = d => !!d && (!!d.__da || LANG_COLS.some(c => cleanVal(d[DA(c)])));   // __da: the server says it has a translation

function applyLang(d) {
  if (!hasDa(d)) return d;
  if (!d.__en) { d.__en = {}; LANG_COLS.forEach(c => { d.__en[c] = d[c] || ""; }); }
  LANG_COLS.forEach(c => { d[c] = LANG === "da" && cleanVal(d[DA(c)]) ? d[DA(c)] : d.__en[c]; });
  d.__text = null;                           // the search text is made again (it covers both languages)
  return d;
}

/* The original language of a translated drill: Norwegian for the NFF exercises, otherwise English */
const isNorwegian = d => cleanVal(d["Kilde"]) === "NFF" || /^NFF-/.test(String(d["ID"] || ""));

function langSwitch(d, id) {
  if (!hasDa(d)) return "";
  const no = isNorwegian(d);
  const label = LANG === "da" ? (no ? "Vis på norsk (originalsprog)" : "Vis på engelsk (originalsprog)") : "Vis på dansk (oversat)";
  return `<button type="button" class="langbtn"${id ? ` id="${id}"` : ""} aria-label="${label}" title="${label}">` +
    `<span class="flag${LANG === "da" ? " on" : ""}">${FLAG_DK}</span><span class="flag${LANG === "en" ? " on" : ""}">${no ? FLAG_NO : FLAG_GB}</span></button>`;
}

function setLang(l) {
  LANG = l;
  try { localStorage.setItem("oevLang", l); } catch (e) { /* not remembered */ }
  if (LIB) LIB.drills.forEach(applyLang);
  Object.keys(SESSION_DRILLS).forEach(k => applyLang(SESSION_DRILLS[k]));

    const y = window.scrollY;

}

/* ===================== Favourites =====================

function favKey(d) {

}

function toggleFav(d) {

/* ===================== Connection to the Google Sheet ===================== */
/* The address of the Apps Script web app (Deploy → Manage deployments → Web app URL, ends in /exec) */
const API_URL = "https://script.google.com/macros/s/AKfycby9CvNLV4fDCcGOLwGCbsKxQ6XJmC3j3q8ElGVHbQa3EGpHn5Bh-JmOnzWcjTzA37C8/exec";

/* The server files this app was made for: each reports its version (CODE_VERSION in Code.gs with the plan,
   GRUPPER_VERSION in Grupper.gs with the players). An older deployed copy gives "Serveren er ikke opdateret" with
   what to copy, for coaches (logged in) only. Raise these together with the numbers in the .gs files. */
const SERVER_NEEDS = { code: 5, grupper: 5 };

function serverNoteHtml() {

    `fra GitHub ind i Apps Script (erstat hele filen), og vælg Deploy → Manage deployments → Edit → New version.`;

/* ===================== The database: Supabase (instead of the sheet, for Grupper, Kampe and Spilleroversigt) =====
   With an address and key below (Supabase → Project Settings → API: the Project URL and the anon / publishable key),
   the players, groups, signups, matches and sets of matches are read from and saved in the database
   (supabase/schema.sql), and coaches log in with their own e-mail and a code sent to it instead of the shared code.
   The training plan, the drill library and the statistics then come from the database too, so the sheet and Apps
   Script are not used at all. Each team's plan has a public link (<app>?hold=<code>) for players and parents; a
   logged-in coach sees their own team's plan. Empty: everything comes from the sheet, as before.
   To try it on one phone first: open the app with ?database=ja (back to the sheet: ?database=nej); "on" switches it on
   for everyone. (For tests: localStorage "oevSupabase" = { url, key } uses another project.) */
const SUPABASE = { url: "https://hfagotulnrjvqwrwweez.supabase.co", key: "sb_publishable_Bu5d8e3JqJV4OyvHmbLtHA_TjXh4fDI",
                   plan: "d8a11024", login: "password", on: true };
// plan: the code of the team whose plan is shown to visitors without a link. login: "password" (e-mail and a password the
// holdleder gives each coach; no e-mails are sent) or "code" (a code sent by e-mail; needs an e-mail sender in Supabase)
const supaLoginKind = () => (supaConf() || {}).login === "code" ? "code" : "password";
const SUPA_SESSION_KEY = "oevSupaSession";       // { refresh, exp (when the access token runs out), team, teams }
const SUPA_LOGIN_DAYS = 14;                       // a personal login lasts 14 days after it was last used
const SUPA_TRY_KEY = "oevDatabase";             // "ja": this phone uses the database (?database=ja), "nej": the sheet
(function databaseFromAddress() {
  try {
    const want = new URLSearchParams(location.search).get("database");
    if (want === "ja" || want === "nej") localStorage.setItem(SUPA_TRY_KEY, want);
  } catch (e) { /* ignore */ }
})();
function supaConf() {
  try { const o = JSON.parse(localStorage.getItem("oevSupabase") || "null"); if (o && o.url && o.key) return o; } catch (e) { /* ignore */ }
  let mine = null;
  try { mine = localStorage.getItem(SUPA_TRY_KEY); } catch (e) { /* ignore */ }
  const on = mine === "ja" || (SUPABASE.on && mine !== "nej");
  return on && SUPABASE.url && SUPABASE.key ? SUPABASE : null;
}
const useSupabase = () => !!supaConf();
function supaSession() {
  try { return JSON.parse(localStorage.getItem(SUPA_SESSION_KEY) || "null"); } catch (e) { return null; }
}
function storeSupaSession(s) {
  try { if (s) localStorage.setItem(SUPA_SESSION_KEY, JSON.stringify(s)); else localStorage.removeItem(SUPA_SESSION_KEY); } catch (e) { /* ignore */ }
}
const supaTeam = () => (supaSession() || {}).team || "";

/* A call to Supabase (auth or a database function). An answer that the login is no good gives "LOGIN", as the sheet
   server does, so the app asks to log in again. */
function supaFetch(path, body, token) {
  const c = supaConf();
  const ctrl = window.AbortController ? new AbortController() : null;
  const timer = ctrl && setTimeout(function () { ctrl.abort(); }, 30000);
  return fetch(c.url.replace(/\/+$/, "") + path, {
    method: "POST",
    headers: { "Content-Type": "application/json", apikey: c.key, Authorization: "Bearer " + (token || c.key) },
    body: JSON.stringify(body || {}),
    signal: ctrl ? ctrl.signal : undefined
  })
    .finally(function () { clearTimeout(timer); })
    .then(function (r) {
      return r.text().then(function (text) {
        let res = null;
        try { res = text ? JSON.parse(text) : null; } catch (e) { /* not JSON */ }
        if (r.ok) return res;
        const msg = String(res && (res.message || res.msg || res.error_description || res.error) || "HTTP " + r.status);
        if (r.status === 401 || /^LOGIN$|JWT/.test(msg)) throw serverError("LOGIN");
        if (/row-level security/.test(msg)) throw serverError("Du har ikke adgang til at gemme dette på holdet.");
        throw serverError(msg);
      });
    });
}
function authToken() { try { return AUTH.token; } catch (e) { return ""; } }   // (before the login code has loaded: none)
const supaRpc = (name, params) => supaFetch("/rest/v1/rpc/" + name, params, authToken());

/* Whose plan: a team link opened (?hold=<code>, remembered), else the logged-in coach's own team, else the code
   remembered from a link opened earlier, else SUPABASE.plan */
const PLAN_CODE_KEY = "oevPlanCode";
function planArgs() {
  let code = "";
  try { code = new URLSearchParams(location.search).get("hold") || ""; } catch (e) { /* ignore */ }
  if (code) { try { localStorage.setItem(PLAN_CODE_KEY, code); } catch (e) { /* ignore */ } return { code: code, team: null }; }
  if (authToken() && supaTeam()) return { code: "", team: supaTeam() };
  try { code = localStorage.getItem(PLAN_CODE_KEY) || ""; } catch (e) { /* ignore */ }
  return { code: code || (supaConf() || {}).plan || "", team: null };
}
let PLAN_CODE = "", PLAN_TEAM = "";                  // the shown plan's code (for links) and team (whose coaches may edit it)
function gotPlan(res) {
  if (res && res.code) PLAN_CODE = res.code;
  if (res && res.team) PLAN_TEAM = res.team;
  return res;
}

/* Logged in (access token, refresh token): the login is renewed whenever the app is used */
function gotSupaSession(res) {
  storeSupaSession(Object.assign(supaSession() || {}, { refresh: res.refresh_token, exp: Date.now() + (res.expires_in || 3600) * 1000 }));
  AUTH.token = res.access_token;
  AUTH.span = SUPA_LOGIN_DAYS * 864e5;
  AUTH.until = Date.now() + AUTH.span;
  saveAuth(); scheduleExpiry();
}
/* The access token lasts an hour: a fresh one first when it is (nearly) out. Without a connection the call goes on
   with the old one (it then fails as having no connection, and the save waits on the phone). */
let SUPA_REFRESHING = null;
function supaRefreshIfNeeded() {
  const s = supaSession();
  if (!s || !s.refresh || !AUTH.token || Date.now() < s.exp - 60000) return Promise.resolve();
  if (!SUPA_REFRESHING) SUPA_REFRESHING = supaFetch("/auth/v1/token?grant_type=refresh_token", { refresh_token: s.refresh })
    .then(gotSupaSession)
    .finally(function () { SUPA_REFRESHING = null; });
  return SUPA_REFRESHING.catch(function (err) {
    if (!err.server) return;                               // no connection: carry on
    AUTH.token = ""; AUTH.until = 0; saveAuth();             // the login was withdrawn: log in again
    throw serverError("LOGIN");
  });
}

/* The sheet server's functions for Grupper, Kampe and Spilleroversigt, done by the database instead (the same
   arguments and answers; the token is the login's). team: the team a save waiting on the phone was made for. */
const SUPA_TEAM_ACTIONS = ["getGroupData", "saveGroups", "saveSignups", "saveMatches", "saveFixtureSet", "saveTraining", "deleteTraining"];
const SUPA_ACTIONS = {
  getPlan:          version => supaRpc("get_plan", Object.assign({ have: version || "" }, planArgs())).then(gotPlan),
  getSessions:      () => supaRpc("get_plan", planArgs()).then(gotPlan).then(res => res.sessions),
  getSessionDrills: ids => supaRpc("get_session_drills", Object.assign({ ids: ids }, planArgs())),
  getDrills:        (token, version) => supaRpc("get_drills", { have: version || "" }),
  getDrillsDa:      (token, version) => supaRpc("get_drills_da", { have: version || "" }),
  saveTraining:     (token, training) => supaRpc("save_training", { team: supaTeam(), training: training }),
  deleteTraining:   (token, id) => supaRpc("delete_training", { team: supaTeam(), training_id: id }),
  track:            (event, a, b) => supaRpc("track", { event: String(event), a: a == null ? "" : String(a), b: b == null ? "" : String(b) }),
  getGroupData:   (token, version) => supaRpc("get_group_data", { team: supaTeam(), have: version || "" }),
  saveGroups:     (token, key, groups, team) => supaRpc("save_groups", { team: team || supaTeam(), key: key, groups: groups }),
  saveSignups:    (token, key, names, team) => supaRpc("save_signups", { team: team || supaTeam(), key: key, names: names }),
  saveMatches:    (token, key, matches, team) => supaRpc("save_matches", { team: team || supaTeam(), key: key, matches: matches }),
  saveFixtureSet: (token, id, set, team) => supaRpc("save_fixture_set", { team: team || supaTeam(), set_id: id, fixture_set: set })
};

/* Calls the server: the database for what it does (above), otherwise Code.gs. */
function api(action, args) {
  if (!useSupabase()) return sheetApi(action, args);
  const before = authToken();
  return (before ? supaRefreshIfNeeded() : Promise.resolve()).then(function () {
    const a = (args || []).map(x => before && x === before ? AUTH.token : x);   // the renewed login in place of the old
    if (SUPA_ACTIONS[action]) {
      if (SUPA_TEAM_ACTIONS.indexOf(action) !== -1 && !supaTeam()) throw serverError("LOGIN");
      return SUPA_ACTIONS[action].apply(null, a);
    }
    return sheetApi(action, a);
  });
}

/* Calls a function in Code.gs, e.g. sheetApi("login", [code]). Gives back what the function returns.
   The body is sent as plain text, which Google accepts from another website without extra checks. */
function sheetApi(action, args) {
  const ctrl = window.AbortController ? new AbortController() : null;
  const timer = ctrl && setTimeout(function () { ctrl.abort(); }, 30000);   // give up after 30 seconds
  return fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ action: action, args: args || [] }),
    signal: ctrl ? ctrl.signal : undefined
  })
    .finally(function () { clearTimeout(timer); })
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.text();
    })
    .then(function (text) {
      let res;
      try { res = JSON.parse(text); } catch (e) {       // not an answer from Code.gs: Google's error page (a script error, a
        throw serverError(pageText(text) || "Serveren sendte et ugyldigt svar.");   // deployment that needs sign-in, …)
      }
      if (res && res.error) throw serverError(res.error);
      return res ? res.result : null;
    });
}
/* An error that came from the server (not a missing connection): err.server = true */
function serverError(message) {
  const err = new Error(String(message));
  err.server = true;
  return err;
}
/* The readable text of an HTML page (Google's error page says e.g. "SyntaxError: … (line 1, file "Grupper")") */
function pageText(html) {
  let t = "";
  try {
    const doc = new DOMParser().parseFromString(String(html), "text/html");
    doc.querySelectorAll("script, style").forEach(el => el.remove());
    const parts = [], walk = doc.createTreeWalker(doc.body || doc, NodeFilter.SHOW_TEXT);   // text pieces, with spaces
    while (walk.nextNode()) parts.push(walk.currentNode.nodeValue);                            // between the blocks
    t = parts.join(" ");
  } catch (e) { t = String(html).replace(/<[^>]*>/g, " "); }
  t = t.replace(/\s+/g, " ").trim().replace(/^Error\s+/, "");
  return t.length > 220 ? t.slice(0, 220) + " …" : t;
}
/* For messages: "Ingen forbindelse" when the phone couldn't reach the server, otherwise the server's own error */
function failText(err) {
  return err && err.server && !/^LOGIN$/.test(err.message) ? "Fejl på serveren: " + err.message : "Ingen forbindelse";
}

/* ---- Start: show the last saved plan at once, then fetch the newest one ----
   The server keeps the plan ready and only answers "unchanged" when the phone has the newest version. The plan
   is fetched again when the app is brought back after more than a minute, and with the "Opdater" button. */
const SESSIONS_KEY = "oevSessions";            // the plan is saved on the phone, so the app also opens offline
const PLAN_VERSION_KEY = "oevSessionsVersion";
let PLAN_AT = 0, PLAN_FETCH = null, PLAN_FAILED = false, PLAN_ERROR = null;
let LATEST = null;                             // the newest plan we have
let STARTED = false, SHOWN = false, PENDING_SESSIONS = false;

function viewerOpen() {
  return !document.getElementById("viewer").classList.contains("view-hidden");
}

function gotSessions(sessions) {
  window.APP_STARTED = true;
  LATEST = sessions;
  if (!STARTED) { STARTED = true; expandSpinner(firstRender); return; }
  if (!SHOWN) return;                          // the first render is about to show LATEST anyway
  if (viewerOpen()) { PENDING_SESSIONS = true; return; }   // don't change the list under an open training
  renderSessions(LATEST);
}

function firstRender() {
  SHOWN = true;
  try {
    renderSessions(LATEST);
    openSessionFromUrl();
    openDrillFromUrl();
    trackOpen();
    if (isAuthed()) loadLibrary(null, true);   // only when already logged in: loads the drills in the background
  } catch (err) {
    clearLoading();
    document.getElementById("sessions").innerHTML =
      '<p style="grid-column:1/-1">Kunne ikke vise træningerne: ' + esc(err.message) + '</p>';
  }
}

(function start() {
  if (API_URL.indexOf("PASTE_") === 0) {
    clearLoading();
    document.getElementById("sessions").innerHTML =
      '<p style="grid-column:1/-1">Appen mangler adressen til Google Sheet-scriptet (API_URL i index.html).</p>';
    return;
  }
  let saved = null;
  try { saved = localStorage.getItem(SESSIONS_KEY); } catch (e) { /* storage not available */ }
  if (saved) {
    try { gotSessions(JSON.parse(saved)); } catch (e) { saved = null; }
  }
  fetchPlan().catch(function (err) {
    window.APP_STARTED = true;
    if (saved) { showToast(failText(err) + " – viser den senest hentede plan."); return; }
    clearLoading();
    document.getElementById("sessions").innerHTML =
      '<p style="grid-column:1/-1">Kunne ikke hente træningspas. ' + (err && err.server ? esc(failText(err)) : "Prøv igen om lidt.") + '</p>';
  });
})();

/* Asks the server for the newest plan ("unchanged" if the phone has it); several callers share one request */
function fetchPlan() {
  if (PLAN_FETCH) return PLAN_FETCH;
  let version = "";
  try { version = LATEST ? localStorage.getItem(PLAN_VERSION_KEY) || "" : ""; } catch (e) { /* no storage */ }
  PLAN_FETCH = api("getPlan", [version]).catch(function (err) {
    if (/Unknown action/.test(String(err && err.message))) {             // a server from before getPlan
      return api("getSessions").then(sessions => ({ sessions: sessions, version: "" }));
    }
    throw err;
  }).then(function (res) {
    PLAN_FETCH = null; PLAN_AT = Date.now(); PLAN_FAILED = false; PLAN_ERROR = null;
    if (SERVER_HAS.code !== (res.server || 0)) { SERVER_HAS.code = res.server || 0; setTimeout(showServerNote); }
    if (!res.unchanged) {
      const text = JSON.stringify(res.sessions);
      let old = null;
      try {
        old = localStorage.getItem(SESSIONS_KEY);
        localStorage.setItem(SESSIONS_KEY, text);
        localStorage.setItem(PLAN_VERSION_KEY, res.version || "");
      } catch (e) { /* storage full or blocked */ }
      if (text !== old || !LATEST) gotSessions(res.sessions);
    }
    updatePlanBar();
  }, function (err) {
    PLAN_FETCH = null; PLAN_FAILED = true; PLAN_ERROR = err;
    updatePlanBar();
    throw err;
  });
  updatePlanBar();
  return PLAN_FETCH;
}

/* "Opdateret kl. 14:03 · Opdater" under the trainings */
function updatePlanBar() {
  const time = document.getElementById("plan-time"), btn = document.getElementById("plan-refresh");
  updateServerNote();
  if (!time || !btn) return;
  const at = PLAN_AT ? new Date(PLAN_AT) : null;
  const clock = at ? ("0" + at.getHours()).slice(-2) + ":" + ("0" + at.getMinutes()).slice(-2) : "";
  time.textContent = PLAN_FETCH ? "Henter nyeste plan …"
    : PLAN_FAILED ? failText(PLAN_ERROR) + (clock ? " – viser planen fra kl. " + clock : " – viser den gemte plan")
    : clock ? "Opdateret kl. " + clock : "Viser den gemte plan";
  btn.disabled = !!PLAN_FETCH;
}

/* Make sure the loading screen can never stay on top of the page */
function clearLoading() {
  document.querySelectorAll(".loading").forEach(function (el) { el.remove(); });

/* The spinner is never expanded before it has been drawn and seen for a moment. Without this, a plan
   saved on the phone made the app expand it while the page was still starting up, so the first thing
   drawn was the expansion itself: a blank screen, then the ball growing. */
const SPINNER_MIN_MS = 400;

function expandSpinner(done) {
  const box = document.querySelector(".loading");
  if (!box) { done(); return; }
  requestAnimationFrame(function () {                 // the spinner is about to be drawn ...
    requestAnimationFrame(function () {               // ... and now it has been
      const shownFor = performance.now() - (SPINNER_DRAWN_AT == null ? performance.now() : SPINNER_DRAWN_AT);
      setTimeout(function () { growSpinner(box, done); }, Math.max(0, SPINNER_MIN_MS - shownFor));
    });
  });
}

/* When the spinner was first drawn (so the 0.4 s also counts the time spent waiting for the plan) */
let SPINNER_DRAWN_AT = null;
requestAnimationFrame(function () { requestAnimationFrame(function () { SPINNER_DRAWN_AT = performance.now(); }); });

function growSpinner(box, done) {
  const spinner = box.querySelector(".spinner");
  const diagonal = Math.hypot(window.innerWidth, window.innerHeight);
  box.style.setProperty("--grow", (diagonal / spinner.offsetWidth).toFixed(1));

  box.classList.add("done");
  setTimeout(done, 450);       /* matches the 0.45s in the CSS */
}

/* Makes sheet text safe to put into the page: < > & and quotes can no longer break a card */
function esc(text) {
  return String(text == null ? "" : text).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

/* Escaped text where line breaks in the cell are kept as line breaks */
function escLines(text) {
  return esc(text).replace(/\r?\n/g, "<br>");
}

/* Only normal web and e-mail links are allowed as button links */
function safeUrl(url) {
  return /^(https?:\/\/|mailto:)/i.test(String(url || "").trim()) ? String(url).trim() : "";
}

function todayIso() {
  const d = new Date();
  const pad = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
}

const DAYS = ["søndag", "mandag", "tirsdag", "onsdag", "torsdag", "fredag", "lørdag"];
const MONTHS = ["januar", "februar", "marts", "april", "maj", "juni",
                "juli", "august", "september", "oktober", "november", "december"];

function danishDate(iso, fallback) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || "");
  if (!m) return fallback || "";            // no real date: show the sheet text instead
  const d = new Date(+m[1], +m[2] - 1, +m[3]);
  const weekday = DAYS[d.getDay()];
  return weekday.charAt(0).toUpperCase() + weekday.slice(1) +
         " den " + d.getDate() + ". " + MONTHS[d.getMonth()] + " " + d.getFullYear();
}

/* "Ons 21. okt 2026" – the short date on the training cards */
function cardDate(iso, fallback) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || "");
  if (!m) return fallback || "";            // no real date: show the sheet text instead
  const d = new Date(+m[1], +m[2] - 1, +m[3]);
  const day = DAYS[d.getDay()].slice(0, 3);
  return day.charAt(0).toUpperCase() + day.slice(1) + " " + d.getDate() + ". " + MONTHS[d.getMonth()].slice(0, 3) + " " + d.getFullYear();
}

/* "19 okt" – day number and the first three letters of the month */
function shortDate(iso) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || "");
  return m ? (+m[3]) + " " + MONTHS[+m[2] - 1].slice(0, 3) : "";
}

let SESSIONS = [];

/* Tema (red) and Undertema (outlined) as tags; a cell may hold several values separated by ; */
function sessionChips(s) {
  const split = v => String(v || "").split(/[;\n]/).map(cleanVal).filter(Boolean);
  const chips = split(s.theme).map(t => `<span class="dchip cat">${esc(t)}</span>`)
    .concat(split(s.subtheme).map(t => `<span class="dchip sub">${esc(t)}</span>`));
  return chips.length ? `<div class="dchips">${chips.join("")}</div>` : "";
}

function cardHtml(session, index, kind) {
  const date = danishDate(session.iso, session.date);
  return `
    <div class="card ${kind}">
      <div class="header" id="sheader-${index}" role="button" tabindex="0"
           aria-label="Åbn træning ${esc(date)}"
           onclick="openSession(${index})"
           onkeydown="if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); openSession(${index}); }">
        <div class="header-text">
          ${kind === "next" ? '<span class="tag">Næste træning</span>' : ""}
          <div>${esc(cardDate(session.iso, session.date))}</div>
          ${session.focus ? '<h3 class="theme">' + esc(session.focus) + '</h3>' : ""}
          ${sessionChips(session)}
        </div>
        <span class="chevron go" aria-hidden="true"></span>
      </div>
    </div>
  `;
}

function renderSessions(sessions) {

  SESSIONS = sessions;
  clearLoading();

  const today = todayIso();
  const upcoming = [];
  const past = [];

  sessions.forEach((session, index) => {
    // A session with no date is treated as upcoming, so nothing disappears by mistake
    if (session.iso && session.iso < today) past.push({ session, index });
    else upcoming.push({ session, index });
  });

  past.reverse();   // most recent past session first

  let html = canPlan() ? `<button type="button" class="v-findbtn plan-new" onclick="openPlanner(-1)">+ Ny træning</button>` : "";

  // The tag goes to the first upcoming session that has a real date
  const nextPos = upcoming.findIndex(item => item.session.iso);

  upcoming.forEach((item, i) => {
    html += cardHtml(item.session, item.index, i === nextPos ? "next" : "upcoming");
  });

  if (upcoming.length === 0) {
    html += '<p style="grid-column:1/-1">Ingen kommende træninger er planlagt.</p>';
  }

  if (past.length > 0) {
    html += `
      <details class="past-group" ${upcoming.length === 0 ? "open" : ""}>
        <summary>Tidligere træninger (${past.length})</summary>
        <div class="past-grid">
          ${past.map(item => cardHtml(item.session, item.index, "past")).join("")}
        </div>
      </details>
    `;
  }

  html += `<div class="plan-bar"><span id="plan-time" role="status"></span><button type="button" class="clearbtn" id="plan-refresh">Opdater</button></div><p id="server-note" class="server-note" role="status" hidden></p>`;
  const pastOpen = document.querySelector("#sessions .past-group[open]");   // keep "Tidligere træninger" open when the plan is updated
  document.getElementById("sessions").innerHTML = html;
  if (pastOpen && document.querySelector("#sessions .past-group")) document.querySelector("#sessions .past-group").open = true;
  updatePlanBar();
  if (nextPos !== -1) setTimeout(function () { prefetchSession(upcoming[nextPos].session); }, 300);  // next training: drills ready before anyone taps
}
