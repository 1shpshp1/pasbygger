      <p><b>Kampe</b> (fanen Kampe): kampens niveau sammenlignes med spillerens ideelle kampniveau, Fra plus en tredjedel af båndet. Et helt niveau over er at spille op, et helt niveau under at spille ned, og op til et halvt niveau fra er samme niveau. Målet er det, spilleren kan få blandt niveau 1–4 inden for sit bånd (plus et halvt niveau).</p>
      <p><b>Samme niveau</b> er den del af spillerens bånd, som den anden spillers bånd dækker: dækker B 80 % af A's bånd, tæller B 80 % som samme niveau for A, og resten som op eller ned efter Fra. Jo mere to bånd overlapper, jo oftere kommer spillerne i gruppe sammen.</p>
      <p><b>Målet</b> er ↑ 25 · = 50 · ↓ 25 %. De mest øvede kan ikke spille op (og de mindst øvede ikke ned), så den del går til samme niveau: ↑ 0 · = 75 · ↓ 25 % for den mest øvede, ↑ 25 · = 75 · ↓ 0 % for den mindst øvede.</p>
      <p><b>Fremmøde</b> tæller kun træninger, hvor grupperne er gemt (også grupper lavet uden en træning).</p>
    </details>
    <div class="grp-row" style="margin:0 0 12px"><span class="grp-hint">Sortér</span>
      <div class="grp-mode" role="group" aria-label="Sortér">
        <button type="button" data-sort="name" aria-pressed="${OV_SORT === "name"}">Navn</button>
        <button type="button" data-sort="times" aria-pressed="${OV_SORT === "times"}">Fremmøde</button>
      </div></div>
    ${levelsToggleHtml()}
    <p class="ov-key"><span class="ov-more"></span><i class="ov-up">↑</i> spiller op <span class="ov-same"></span><i class="ov-eq">=</i> samme niveau <span class="ov-less"></span><i class="ov-dn">↓</i> spiller ned</p>
    <p class="ov-key">Faktisk: det, spilleren har haft (de seneste 12 træninger) · Mål: det, grupperne og kampene sigter efter</p>
    <div class="ov-list">${rows || "<p>Fanen Spillere er tom.</p>"}</div>`;
}

/* Shows the screen from the players we have at once, then quietly takes the newest copy: it replaces
   what is shown only while nothing has been ticked, made or moved yet */
function loadGroupData() {
  const want = GRP;
  readStoredGroups().then(function (c) {                // at once from the copy we have (memory or the phone)
    if (GRP === want && c && !GRP.data) useGroupData(c.data);
  });
  fetchGroupData().then(function (c) {
    if (GRP !== want || GRP.data === c.data) return;   // closed, or nothing new
    if (!GRP.touched) useGroupData(c.data);
  }, function (err) {
    if (GRP !== want) return;
    const box = want.box;
    if (GRP.data) return;               // players already on the screen: keep working (saving asks for the code if needed)
    if (/LOGIN/.test(String(err && err.message))) {
      box.innerHTML = "<p>Login er udløbet.</p>";
      requireLogin(function () { if (canGroup()) want.reopen(); });
    } else box.innerHTML = `<p>Kunne ikke hente spillerne: ${esc(String(err && err.message || err))}</p>`;
  });
}

/* Someone is working in Grupper and the login has under 10 minutes left: ask the server for the players
   (usually just "unchanged"), which renews the login, so it doesn't run out in the middle of a training */
function renewWhileWorking() {
  if (isAuthed() && AUTH.until - Date.now() < 10 * 60 * 1000) fetchGroupData().catch(function () { /* saving asks for the code */ });
}

function useGroupData(data) {
  Object.assign(GRP, { data: data, byName: {}, present: new Set(), groups: null, saved: "", fromSignups: "",
                       matches: null, matchesSaved: "", matchesDirty: false });
  data.players.forEach(function (p) {
    GRP.byName[p.name] = { name: p.name, lo: p.lo == null ? -Infinity : p.lo, hi: p.hi == null ? Infinity : p.hi };
  });
  const mine = data.history[GRP.key];
  if (mine) {                                           // already saved for this training: show those groups
    GRP.groups = mine.groups.map(g => g.map(grpPlayer));
    GRP.groups.forEach(g => g.forEach(p => GRP.present.add(p.name)));
    GRP.saved = mine.saved;
    const sm = (data.matches || {})[GRP.key];
    if (sm && sm.matches.every(m => m.every(t => t.every(n => GRP.present.has(n))))) {   // the saved matches, if they fit the groups
      GRP.matches = sm.matches.map(teams => ({ groups: [], teams: teams.map(t => t.map(grpPlayer)) }));
      GRP.matchesFor = groupsSignature();
      GRP.matchesSaved = sm.saved;
    }
  } else {
    const su = (data.signups || {})[GRP.key];
    if (su) {                                           // no groups yet, but the signups were saved: start from those
      su.names.forEach(name => { if (GRP.byName[name]) GRP.present.add(name); });
      GRP.fromSignups = su.saved || "på telefonen";   // (empty while the save is waiting for a connection)
    } else data.players.forEach(p => GRP.present.add(p.name));
  }
  renderGroups();
}

/* "Gem tilmeldte": the ticks saved for this training (only a starting point; groups saved later take over) */
function signupStatus() {
  const su = (GRP.data.signups || {})[GRP.key];
  if (!su) return "";
  const same = su.names.filter(n => GRP.byName[n]).length === GRP.present.size && su.names.every(n => !GRP.byName[n] || GRP.present.has(n));
  if (!same) return "Ændret siden de tilmeldte blev gemt";
  return waiting("signups", GRP.key) ? "Tilmeldte " + queuedText().charAt(0).toLowerCase() + queuedText().slice(1) : "Tilmeldte gemt " + su.saved;
}

/* A player by name; a name that is no longer in the tab "Spillere" fits anywhere */
const grpPlayer = name => GRP.byName[name] || (GRP.byName[name] = { name: name, lo: -Infinity, hi: Infinity });

/* Earlier trainings' groups, newest first */
function earlierGroups() {
  const h = GRP.data.history;
  return Object.keys(h).filter(k => k < GRP.key).sort().reverse().map(k => ({ key: k, groups: h[k].groups }));
}

function presentPlayers() {
  return GRP.data.players.filter(p => GRP.present.has(p.name)).map(p => grpPlayer(p.name));
}

/* Number of groups for n players with the chosen setting */
function groupCount(n) {
  const k = GRP.mode === "count" ? GRP.count : Math.round(n / GRP.size);
  return Math.max(1, Math.min(k, Math.max(1, n)));
}

function sizeText(n, k) {
  if (!n) return "";
  const a = Math.floor(n / k), b = Math.ceil(n / k);
  return `${k} ${k === 1 ? "gruppe" : "grupper"} á ${a === b ? a : a + "–" + b} spillere`;
}

/* Who was in which group last time ({ name: group number }), for the marks and the slider text */
function lastGroupOf(prev) {
  const of = {};
  if (prev) prev.groups.forEach((g, gi) => g.forEach(name => { of[name] = gi; }));
  return of;
}

function changeText(prev, players, k) {
  if (!prev) return "Ingen gemte grupper før denne træning – spillerne blandes tilfældigt inden for niveauerne.";
  if (GRP.change >= 100) return "Bland mest muligt (flest nye makkere).";
  const of = lastGroupOf(prev);
  const m = players.filter(p => of[p.name] != null && of[p.name] < k).length;
  const t = Math.round(GRP.change / 100 * m);
  return `Ca. ${t} af ${m} spillere skifter gruppe (sidst: ${esc(keyLabel(prev.key))}).`;
}

/* The groups on the screen now: "Lav nye grupper" avoids their pairs too, so pressing it again gives a new mix */
function shownGroups() {
  return GRP.groups && GRP.groups.some(g => g.length > 1) ? [GRP.groups.map(g => g.map(p => p.name))] : [];
}

/* Each player's skill for the 25/50/25 ambition: Fra (1 is the best level); none without a level */
function grpSkill() {
  const skill = {};
  GRP.data.players.forEach(p => { if (nivOf(p) != null) skill[p.name] = isBand(p) ? p : nivOf(p); });   // the band, compared by overlap
  return skill;
}

/* The mix the present players have had (the saved trainings + the groups on the screen), on average */
function mixLine(players) {
  if ((noSlider() && !groupsByMix()) || !GRP.groups) return "";
  const skill = grpSkill();
  const now = GRP.groups.map(g => g.map(p => p.name));
  const mix = skillMix([now].concat(earlierGroups().map(e => e.groups)), skill);
  const sum = [0, 0, 0], goal = [0, 0, 0]; let n = 0;
  const levels = players.map(p => skill[p.name] == null ? NaN : skill[p.name]);
  players.forEach(function (p, i) {
    const m = mix[p.name];
    if (!m || !m[3]) return;
    const a = playerAim(levels[i], levels.filter((o, j) => j !== i));
    for (let r = 0; r < 3; r++) { sum[r] += m[r] / m[3]; goal[r] += a[r]; }
    n++;
  });
  if (!n) return "";
  const pct = r => Math.round(100 * sum[r] / n) + " %", g = r => Math.round(100 * goal[r] / n);
  return `Niveau-mix over tid (gennemsnit, med disse grupper): ${pct(0)} med mere øvede · ${pct(1)} samme niveau · ${pct(2)} med mindre øvede. ` +
    `Målet er ${g(0)} / ${g(1)} / ${g(2)} (25 / 50 / 25, men de mest og mindst øvede spiller mere på eget niveau).`;
}

/* "Socialt mix" (25-50-25 groups): how much the groups avoid putting the same players together again. The slider's
   0–100 % gives the weight 16 × (x/100)² of a pairing from the last training (older ones count less, pairHistory):
   most of the effect comes early, so the square spreads it over the slider. With the coaches' real bands: of the
   teammates from last time about 37 % are together again at 0 %, 30 % at 25 %, 24 % at 50 % and 23 % at 100 %
   (about 25 % by chance with four groups), and more overlap still means more often together. */
const socialWeight = () => 16 * Math.pow((GRP.social == null ? 25 : GRP.social) / 100, 2);
/* Of each present player's teammates last time (who are here now): how many are their teammates again, on average */
function socialRepeat() {
  const last = earlierGroups()[0];
  if (!last || !GRP.groups) return null;
  const here = new Set(presentPlayers().map(p => p.name));
  let sum = 0, n = 0;
  GRP.groups.forEach(g => g.forEach(function (p) {
    const was = (last.groups.find(x => x.indexOf(p.name) !== -1) || []).filter(b => b !== p.name && here.has(b));
    if (!was.length) return;
    sum += was.filter(b => g.some(q => q.name === b)).length / was.length; n++;
  }));
  return n ? sum / n : null;
}
function socialText() {
  const r = socialRepeat();
  return (r == null ? "Jo højere, jo mere undgår grupperne, at de samme spillere er sammen igen. "
                    : `Med disse grupper er ${Math.round(100 * r)} % af makkerne fra sidste træning sammen igen (ved ren tilfældighed ca. ${Math.round(100 / Math.max(1, (GRP.groups || []).length))} %). `) +
    "Niveauet går stadig forud: spillere, hvis bånd overlapper meget, kommer oftest sammen.";
}

/* "Niveaublanding" (25-50-25 groups): how much the groups' average levels should be alike, so the groups aren't a top,
   a middle and a bottom group. 0 %: only each player's own 25-50-25 counts. The weight is 3200 × (x/100)², 200 at
   25 %. With the coaches' real bands (12 trainings, 18 players, 4 groups): the group averages differ by 1.9 levels
   (Fra) at 0 %, 1.15 at 25 % and 0.8 at 50 % or more; the span inside a group grows from 1.1 to 1.6 and 1.8 levels;
   3 of the 4 most experienced are in one group at 9, 2 and 0 of 12 trainings. The bands must still overlap, but how
   much they overlap then matters less for how often two are together. */
const levelMixWeight = () => 3200 * Math.pow((GRP.even == null ? 25 : GRP.even) / 100, 2);
/* The difference between the highest and the lowest group average (Fra), or null */
function levelMixSpread() {
  if (!GRP.groups || GRP.groups.length < 2) return null;
  const means = GRP.groups.map(g => g.map(p => p.lo).filter(Number.isFinite)).filter(f => f.length).map(f => f.reduce((x, y) => x + y, 0) / f.length);
  return means.length < 2 ? null : Math.max(...means) - Math.min(...means);
}
function levelMixText() {
  const d = levelMixSpread();
  return (d == null ? "" : `Gruppernes gennemsnit (Fra) ligger nu ${d.toFixed(1).replace(".", ",")} niveau fra hinanden. `) +
    "Jo højere, jo mere ens bliver grupperne, så der ikke er en tydelig top-, mellem- og bundgruppe. Til gengæld bliver spændet i hver gruppe større, og hvor meget båndene overlapper, betyder mindre. Båndene skal stadig overlappe.";
}

function makeNewGroups() {
  const players = presentPlayers();
  if (!players.length) { GRP.msg = "Sæt flueben ved de spillere, der er med."; GRP.bad = true; renderGroups(); return; }
  if (groupsByMix()) {                  // 25-50-25: as the matches, from the saved groups (teammates one by one)
    const rand = seededRandom(hashText(GRP.key + "|" + GRP.nonce++));
    const known = players.map(nivOf).filter(v => v != null);
    const mean = known.length ? known.reduce((x, y) => x + y, 0) / known.length : 0;
    const lv = p => nivOf(p) == null ? mean : nivOf(p);
    const mix = skillMix(earlierGroups().map(e => e.groups), grpSkill());
    const k = Math.max(1, Math.min(groupCount(players.length), players.length));
    const social = { pairs: pairHistory(earlierGroups().map(e => e.groups)), weight: socialWeight(), even: levelMixWeight() };
    GRP.groups = mixPools(players, Array.from(poolSizes(players.length, k, 1)), nivOf, lv, mix, rand, social).pools
      .map(g => g.sort((x, y) => x.name.localeCompare(y.name, "da")));
    GRP.sel = null; GRP.dirty = true;
    const red = GRP.groups.filter(g => g.some((x, i) => g.slice(i + 1).some(y => !grpMeet(x, y)))).length;
    GRP.bad = red > 0;
    GRP.msg = red ? "Båndene overlapper ikke i de røde grupper: der er for få spillere, der passer sammen. Prøv et andet antal grupper." : earlierGroups().length ? "" : "Der er endnu ingen gemte grupper fra tidligere træninger, så grupperne blander efter 25-50-25 inden for denne ene træning. Husk \u201cGem grupper\u201d, så fordelingen kan rettes op over tid.";
    renderGroups();
    return;
  }
  if (byMax()) {                        // Niveau: sorted by Niveau, group 1 the most experienced
    GRP.groups = sortedGroups(players, groupCount(players.length), nivOf,
                              hashText(GRP.key + "|" + GRP.nonce++))
      .map(g => g.sort((x, y) => x.name.localeCompare(y.name, "da")));
    GRP.sel = null; GRP.dirty = true;
    const red = GRP.groups.filter(g => g.some((a, i) => g.slice(i + 1).some(b => !grpMeet(a, b)))).length;
    GRP.bad = red > 0;
    GRP.msg = red ? `Niveauet spænder mere end ${nivText(GRP.maxDiff)} i de røde grupper. Vælg flere grupper eller en større forskel.` : "";
    renderGroups();
    return;
  }
  // Kaos: nothing from earlier trainings counts. Lige hold: only the earlier pairs (so the teams vary).
  const earlier = byChaos() ? [] : earlierGroups(), free = freeRule();
  const res = makeGroups({
    players: players.map(searchBand), k: groupCount(players.length), prev: !free && earlier.length ? earlier[0].groups : null,
    history: byChaos() ? {} : pairHistory(shownGroups().concat(earlier.map(e => e.groups))), stay: free ? {} : stayRuns(earlier.map(e => e.groups)),
    change: free ? 1 : GRP.change / 100,
    seed: hashText(GRP.key + "|" + GRP.nonce++),
    skill: free ? null : grpSkill(), mix: free ? null : skillMix(earlier.map(e => e.groups), grpSkill()),
    strength: byEven() ? Object.fromEntries(Object.entries(grpSkill()).map(e => [e[0], levelNum(e[1])])) : null
  });
  GRP.groups = res.groups.map(g => g.map(p => grpPlayer(p.name))); GRP.sel = null; GRP.dirty = true;
  GRP.bad = res.conflicts > 0;
  GRP.msg = res.conflicts
    ? "Niveauerne kan ikke deles sådan uden brud – prøv et andet antal grupper (de røde grupper bryder reglen)."
    : res.target != null ? `${res.moved} ${res.moved === 1 ? "spiller" : "spillere"} skiftede gruppe siden sidst.`
    : byEven() ? evenText() : "";
  renderGroups();
}

/* "Lige hold": a group's average level (Fra; players without a level left out), and the gap between the groups */
function groupAverage(g) {                       // (shown: the average Fra)
  const v = g.map(p => p.lo).filter(Number.isFinite);
  return v.length ? v.reduce((x, y) => x + y, 0) / v.length : null;
}
function evenText() {
  const av = GRP.groups.map(groupAverage).filter(a => a != null);
  if (av.length < 2) return "";
  const gap = Math.max.apply(null, av) - Math.min.apply(null, av);
  return gap < 0.005 ? "Holdene har præcis samme gennemsnitlige niveau."
    : `Forskel mellem holdenes gennemsnitlige niveau: ${gap.toFixed(2).replace(".", ",")}.`;
}

/* ---- "Kampe til træning": the matches at the end of a training ----
   Two ways (Del kampene efter): "Niveau" – the more experienced groups play each other, and so do the less
   experienced (makeMatches); "25-50-25" – players are placed so that over time each plays about 25 % harder,
   50 % own level and 25 % easier matches (makeMixMatches, from the saved matches). Either way each match is
   split into two equally strong teams player for player. The matches are made from the groups on the screen
   and disappear if those groups change; "Gem kampe" saves them (tab Kampe), which 25-50-25 builds on. */
const groupsSignature = () => JSON.stringify((GRP.groups || []).map(g => g.map(p => p.name)));
const fraOf = nivOf;                                     // (the level used for the matches: Niveau)

const byMix = () => GRP.matchMode === "mix";

/* Earlier saved matches (before this training), newest first */
function earlierMatches() {
  const m = GRP.data.matches || {};
  return Object.keys(m).filter(k => k < GRP.key).sort().reverse().map(k => m[k].matches);
}
const levelOfName = name => { const p = GRP.byName[name], v = nivOf(p); return isBand(p) ? p : v == null ? NaN : v; };

/* "Del kampene efter": Bånd, Niveau, Kaos, Lige hold, 25-50-25.
   "Antal puljer" 2–4: the players are first split into pools (splitPools, by "Del puljerne efter", even sizes or
   chosen), and each pool is then divided into its own matches (its own number) by "Del kampene efter". */
const MATCH_MODES = [["mix", "25-50-25"], ["band", "Bånd"], ["max", "Niveau"], ["chaos", "Kaos"], ["even", "Lige hold"], ["groups", "Grupperne"]];
const POOL_MODES = MATCH_MODES.filter(m => m[0] !== "groups");   // (the pools are split by a rule, not by the groups)
/* "Grupperne": each training group plays its own match – the group split into two (or three) teams player for player */
const byGroupsAsMatches = () => matchMode() === "groups";
const matchMode = () => GRP.matchMode === "tiers" || GRP.matchMode === "level" ? "max" : GRP.matchMode;
const strictMeet = (a, b) => bandsMeet(strictBand(a), strictBand(b));
const playersInGroups = () => (GRP.groups || []).reduce((n, g) => n + g.length, 0);
const sumOf = a => a.reduce((x, y) => x + y, 0);

/* The number of pools (each at least 2 players) */
const poolCount = () => Math.max(1, Math.min(GRP.matchPools || 1, 4, Math.floor(playersInGroups() / 2) || 1));
/* "Puljestørrelse: Vælg selv": players per pool, kept while the number of pools stays the same; starts even */
function chosenPoolSizes() {
  const k = poolCount();
  if (!Array.isArray(GRP.poolSizes) || GRP.poolSizes.length !== k) GRP.poolSizes = Array.from(poolSizes(playersInGroups(), k));
  return GRP.poolSizes;
}
const poolCustom = () => poolCount() > 1 && GRP.poolSizeMode === "custom";
const poolsOff = () => poolCustom() ? playersInGroups() - sumOf(chosenPoolSizes()) : 0;
/* Players in each pool */
const poolTargets = () => poolCount() === 1 ? [playersInGroups()] : poolCustom() ? chosenPoolSizes().slice() : Array.from(poolSizes(playersInGroups(), poolCount()));
/* "Hold pr. kamp" in pool i: 2, or 3 (for "vinderen bliver på") */
const teamsIn = i => (GRP.matchTeams || [])[i] === 3 ? 3 : 2;
/* Matches in each pool: with one pool the chosen number (or half the groups); otherwise each pool's own, at most
   one per 2 (or 3) players */
const subCounts = () => poolCount() === 1 ? [Math.max(1, Math.min(matchCount(GRP.groups, GRP.matchCount || undefined), Math.floor(playersInGroups() / teamsIn(0)) || 1))]
  : poolTargets().map((t, i) => Math.max(1, Math.min(GRP.matchSub[i] || 2, Math.floor(t / teamsIn(i)) || 1)));
const totalMatches = () => sumOf(subCounts());

/* "Størrelse: Vælg selv": players per match, kept while the pools and numbers of matches stay the same; starts even */
function chosenSizes() {
  const counts = subCounts(), targets = poolTargets(), key = JSON.stringify([counts, targets, counts.map((c, i) => teamsIn(i))]);
  if (!Array.isArray(GRP.matchSizes) || GRP.matchSizesFor !== key) {
    GRP.matchSizes = [].concat(...counts.map((c, i) => Array.from(poolSizes(targets[i], c, teamsIn(i)))));
    GRP.matchSizesFor = key;
  }
  return GRP.matchSizes;
}
/* With chosen match sizes: players still to place (+) or too many (−) in each pool */
function sizeOffs() {
  if (GRP.sizeMode !== "custom") return poolTargets().map(() => 0);
  const sizes = chosenSizes();
  let at = 0;
  return subCounts().map((c, i) => { const n = sumOf(sizes.slice(at, at + c)); at += c; return poolTargets()[i] - n; });
}
const sizesOff = () => poolsOff() || sizeOffs().some(Boolean);

function makeMatchesNow() {
  const seed = hashText(GRP.key + "|kampe|" + (GRP.matchNonce = (GRP.matchNonce || 0) + 1));
  const count = GRP.matchCount || undefined;            // 0: half the groups
  const custom = GRP.sizeMode === "custom" ? chosenSizes() : null;
  const players = GRP.groups.flat(), home = new Map();
  GRP.groups.forEach((g, i) => g.forEach(p => home.set(p, i + 1)));
  const spares = spareCounts(earlierMatches());            // "ingen modspiller" in turn
  const mode = matchMode(), opts = { level: fraOf, meet: strictMeet, home: home, spares: spares };
  const mixOf = () => matchMix(earlierMatches(), levelOfName);
  if (mode === "groups") {                               // each group its own match (a group of one plays in none)
    const known = players.map(fraOf).filter(v => v != null);
    const mean = known.length ? known.reduce((x, y) => x + y, 0) / known.length : 0;
    const lv = p => fraOf(p) == null ? mean : fraOf(p);
    GRP.matches = Array.from(poolsToMatches(GRP.groups.filter(g => g.length >= 2).map(g => g.slice()), lv, home, seededRandom(seed), known, teamsIn(0), spares));
  } else if (poolCount() > 1) {                          // pools first, then matches within each
    const counts = subCounts();
    const pools = splitPools(players, poolTargets(), GRP.poolMode, seed, Object.assign({ keepOrder: true, mix: GRP.poolMode === "mix" ? mixOf() : {} }, opts));
    let at = 0;
    GRP.matches = [].concat(...pools.map(function (ps, i) {
      const c = Math.max(1, Math.min(counts[i], Math.floor(ps.length / 2))), sz = custom ? custom.slice(at, at + counts[i]) : null;
      at += counts[i];
      if (ps.length < 2) return [];
      const s = sz && sz.length === c ? sz : Array.from(poolSizes(ps.length, c, teamsIn(i)));
      const ms = Array.from(mode === "mix" ? makeMixMatches([ps], fraOf, mixOf(), seed + 1 + i, s.length, s, teamsIn(i), spares)
                                           : makePoolMatches(ps, s, mode, seed + 1 + i, Object.assign({ keepOrder: true, teams: teamsIn(i) }, opts)));
      ms.forEach(m => { m.pool = i + 1; });
      return ms;
    }));
  } else {
    const m = subCounts()[0], t = teamsIn(0);
    const sizes = (custom && custom.length === m && !sizesOff() && custom.slice()) || Array.from(poolSizes(players.length, m, t));
    GRP.matches = Array.from(mode === "mix" ? makeMixMatches(GRP.groups, fraOf, mixOf(), seed, m, custom ? sizes : null, t, spares)
                                            : makePoolMatches(players, sizes, mode, seed, Object.assign({ keepOrder: !!custom, teams: t }, opts)));
  }
  GRP.matchesFor = groupsSignature();
  GRP.matchSel = null;
  GRP.matchesDirty = true;
  renderGroups();
}

/* Moving players by hand: a match whose players changed loses its "gruppe 1 og 2" label (it shows its level) */
function matchChanged(...mis) { mis.forEach(mi => { if (GRP.matches[mi]) GRP.matches[mi].groups = []; }); GRP.matchesDirty = true; }

/* "Flyt hertil": the selected player to team ti of match mi (without swapping) */
function matchMove(mi, ti) {
  const [m1, t1, p1] = GRP.matchSel.split(":").map(Number);
  const p = GRP.matches[m1].teams[t1].splice(p1, 1)[0];
  GRP.matches[mi].teams[ti].push(p);
  GRP.matchSel = null;
  matchChanged(m1, mi);
  GRP.matches = GRP.matches.filter(m => m.teams.some(t => t.length));   // a match left without players goes
  renderGroups();
}

/* "Del holdene igen": one match's players into two equally strong teams again, player for player
   (in Kaos: drawn at random again) */
function rebalanceMatch(mi) {
  const m = GRP.matches[mi], players = [].concat(...m.teams), t = m.teams.length;
  if (matchMode() === "chaos") {
    const rand = seededRandom(hashText(GRP.key + "|igen|" + (GRP.matchNonce = (GRP.matchNonce || 0) + 1)));
    m.teams = chaosTeams(players.map(p => ({ p: p, r: rand() })).sort((x, y) => x.r - y.r).map(o => o.p), t);
    GRP.matchesDirty = true; GRP.matchSel = null;
    renderGroups();
    return;
  }
  const known = players.map(fraOf).filter(v => v != null);
  const mean = known.length ? known.reduce((x, y) => x + y, 0) / known.length : 0;
  const lv = p => fraOf(p) == null ? mean : fraOf(p);
  const home = new Map();
  GRP.groups.forEach((g, i) => g.forEach(p => home.set(p, i + 1)));
  const allKnown = GRP.groups.flat().map(fraOf).filter(v => v != null);
  const [again] = poolsToMatches([players], lv, home, seededRandom(hashText(GRP.key + "|igen|" + (GRP.matchNonce = (GRP.matchNonce || 0) + 1))), allKnown, t, spareCounts(earlierMatches()));
  if (again) { m.teams = again.teams; GRP.matchesDirty = true; }
  GRP.matchSel = null;
  renderGroups();
}

/* 25-50-25: is this match harder (0), at the player's level (1) or easier (2) for them? */
function catInMatch(p, m) {
  if (nivOf(p) == null) return 1;
  const lvl = q => isBand(q) ? q : nivOf(q);                // compared by band overlap where there is one
  const others = [].concat(...m.teams).filter(q => q !== p && nivOf(q) != null).map(lvl);
  return others.length ? shareCategory(matchShare(lvl(p), others)) : 1;
}

/* 25-50-25 builds on the matches saved at earlier trainings: how many there are */
function mixHistoryText() {
  const n = earlierMatches().length;
  return n ? `Bygger på kampe gemt ved ${n} tidligere ${n === 1 ? "træning" : "træninger"} (kampe fra i dag tæller først fra næste træning).`
    : "Der er endnu ingen gemte kampe fra tidligere træninger, så kampene blander efter 25-50-25 inden for denne ene træning.";
}

/* A stepper row: label, − value + (data-<attr>="i:-1" / "i:1") */
const stepRow = (label, attr, i, value, what) => `<div class="grp-sizerow"><span>${label}</span><span class="grp-step">
      <button type="button" data-${attr}="${i}:-1" aria-label="Færre ${what} (${label})">−</button>
      <output>${value}</output>
      <button type="button" data-${attr}="${i}:1" aria-label="Flere ${what} (${label})">+</button></span></div>`;
const offText = (off, where) => off > 0 ? `Fordel ${off} ${off === 1 ? "spiller" : "spillere"} mere${where}.`
  : `Der er ${-off} ${off === -1 ? "plads" : "pladser"} for meget${where}.`;

/* "Puljestørrelse: Vælg selv" */
function poolSizesHtml() {
  const off = poolsOff();
  return `<div class="grp-sizes">${chosenPoolSizes().map((x, i) => stepRow(`Pulje ${i + 1}`, "psz", i, `${x} spillere`, "spillere")).join("")}
    <p class="grp-hint${off ? " grp-off" : ""}" role="status">${off ? offText(off, "") : `Alle ${playersInGroups()} spillere er fordelt.`}</p></div>`;
}
/* The number of matches in each pool */
function poolCountsHtml() {
  const t = poolTargets();
  return `<div class="grp-sizes">${subCounts().map((c, i) => stepRow(`Pulje ${i + 1}`, "msub", i, `${c} ${c === 1 ? "kamp" : "kampe"} · ${t[i]} spillere`, "kampe")).join("")}</div>`;
}

/* 7 players in 3 teams: "3v2v2" */
const teamSplitText = (x, t) => Array.from({ length: t }, (_, i) => Math.floor(x / t) + (i < x % t ? 1 : 0)).join("v");
/* "Hold pr. kamp": 2 or 3 teams in each match (per pool) */
function teamsHtml() {
  const chips = i => `<div class="grp-mode" role="group" aria-label="Hold pr. kamp${poolCount() > 1 ? " i pulje " + (i + 1) : ""}">
      ${[2, 3].map(t => `<button type="button" data-mteams="${i}:${t}" aria-pressed="${teamsIn(i) === t}">${t} hold</button>`).join("")}</div>`;
  return poolCount() === 1 ? `<div class="grp-row"><span class="grp-hint grp-label">Hold pr. kamp</span>${chips(0)}</div>`
    : `<p class="grp-hint grp-label" style="margin:12px 0 0">Hold pr. kamp</p>` +
      Array.from({ length: poolCount() }, (_, i) => `<div class="grp-row grp-teamsrow"><span>Pulje ${i + 1}</span>${chips(i)}</div>`).join("");
}

function sizesHtml() {
  const sizes = chosenSizes(), offs = sizeOffs(), counts = subCounts(), k = poolCount();
  const poolOf = i => { let at = 0; for (let p = 0; p < counts.length; p++) { at += counts[p]; if (i < at) return p; } return counts.length - 1; };
  const rows = sizes.map((x, i) => stepRow(`Kamp ${i + 1}${k > 1 ? " · pulje " + (poolOf(i) + 1) : ""}`, "msz", i,
    `${x} spillere (${teamSplitText(x, teamsIn(poolOf(i)))})`, "spillere")).join("");
  const bad = offs.map((o, p) => o ? offText(o, k > 1 ? " i pulje " + (p + 1) : "") : "").filter(Boolean);
  return `<div class="grp-sizes">${rows}
    <p class="grp-hint${bad.length ? " grp-off" : ""}" role="status">${bad.length ? bad.join(" ") : `Alle ${playersInGroups()} spillere er fordelt.`}</p></div>`;
}

function matchesHtml() {
  if (!GRP.groups || GRP.groups.filter(g => g.length).length < 1) return "";
  if (GRP.matches && GRP.matchesFor !== groupsSignature()) { GRP.matches = null; GRP.matchesDirty = false; }   // the groups have changed since
  const ms = GRP.matches || [];
  const matchAvg = m => groupAverage([].concat(...m.teams));
  const byLevelMode = matchMode() === "max" && !ms.some(m => m.pool);
  const avgLabel = i => matchAvg(ms[i]) == null || !showLevels() ? "" : "gns. niveau " + matchAvg(ms[i]).toFixed(2).replace(".", ",");
  const kind = i => byGroupsAsMatches() && ms[i].groups.length ? groupList(ms[i].groups) + (avgLabel(i) ? " · " + avgLabel(i) : "")
    : ms[i].pool ? "pulje " + ms[i].pool + (avgLabel(i) ? " · " + avgLabel(i) : "")
    : !byLevelMode || !ms[i].groups.length ? avgLabel(i)
    : ms.length < 2 || !showLevels() ? "" : i === 0 ? "mere øvede" : i === ms.length - 1 ? "mindre øvede" : "mellem";
  const avgText = team => { const a = groupAverage(team); return a == null || !showLevels() ? "" : "gns. niveau " + a.toFixed(2).replace(".", ","); };
  // each match as rows of opposite numbers: team A's player i faces team B's player i
  const arrow = (p, mi) => {
    if (!byMix() || !showLevels()) return "";
    const c = catInMatch(p, ms[mi]);
    return c === 0 ? `<span class="grp-arrow" title="En sværere kamp end eget niveau">↑</span>`
         : c === 2 ? `<span class="grp-arrow" title="En lettere kamp end eget niveau">↓</span>` : "";
  };
  const chip = (p, mi, ti, pi) => p ? `<button type="button" class="grp-p" data-mp="${mi}:${ti}:${pi}" aria-pressed="${GRP.matchSel === mi + ":" + ti + ":" + pi}">` +
    `<span class="grp-pname">${arrow(p, mi)}${esc(p.name)}</span>${showLevels() ? ` <span class="grp-band">${bandText(p.lo, p.hi)}</span>` : ""}</button>` : `<span class="grp-none-p">ingen modspiller</span>`;
  const groupList = g => g.length === 1 ? "gruppe " + g[0] : "gruppe " + g.slice(0, -1).join(", ") + " og " + g[g.length - 1];
  const first = ms.map((m, mi) => ms.slice(0, mi).reduce((n, x) => n + x.teams.length, 0));   // the letter of each match's team A
  const letter = (mi, ti) => String.fromCharCode(65 + first[mi] + ti);
  const cards = ms.map(function (m, mi) {
    const t = m.teams.length, rows = Math.max(...m.teams.map(x => x.length));
    const head = ti => `<div class="grp-teamhead">Hold ${letter(mi, ti)}<small>${[m.teams[ti].length + " spillere", avgText(m.teams[ti])].filter(Boolean).join(" · ")}</small></div>`;
    const vs = `<span class="grp-vs" aria-hidden="true">–</span>`;
    let grid = m.teams.map((x, ti) => head(ti)).join(`<span></span>`);
    for (let i = 0; i < rows; i++) grid += m.teams.map((x, ti) => chip(x[i], mi, ti, i)).join(vs);
    const from = !byLevelMode || !m.groups.length ? "" : groupList(m.groups);
    const sel = GRP.matchSel ? GRP.matchSel.split(":").map(Number) : null;
    const who = sel ? ms[sel[0]].teams[sel[1]][sel[2]] : null;
    const moves = who ? m.teams.map((x, ti) => ti).filter(ti => !(sel[0] === mi && sel[1] === ti)).map(ti =>
      `<button type="button" class="clearbtn grp-here" data-mto="${mi}:${ti}">Flyt ${esc(who.name)} til Hold ${letter(mi, ti)}</button>`).join(" ") : "";
    return `<div class="grp-card"><div class="grp-head"><strong>Kamp ${mi + 1}</strong><small>${[kind(mi), from, t === 3 ? "3 hold · vinderen bliver på" : ""].filter(Boolean).join(" · ")}</small></div>
      <div class="grp-pairs${t === 3 ? " grp-three" : ""}">${grid}</div>
      <div class="grp-row grp-matchtools">${moves}<button type="button" class="clearbtn" data-mrebal="${mi}">Del holdene igen</button></div></div>`;
  }).join("");
  const status = GRP.matchesDirty ? "Ikke gemt" : waiting("matches", GRP.key) ? queuedText()
    : GRP.matchesSaved ? "Kampe gemt " + esc(GRP.matchesSaved) : "";
  const byGroups = byGroupsAsMatches();
  return `<section class="grp-sec grp-matches"><h3>Kampe til træning</h3>
    ${byGroups ? "" : `<div class="grp-row" style="margin-top:0">
      <span class="grp-hint grp-label">Antal puljer</span>
      <div class="grp-mode" role="group" aria-label="Antal puljer">
        ${[1, 2, 3, 4].map(c => `<button type="button" data-mpools="${c}" aria-pressed="${poolCount() === c}">${c}</button>`).join("")}
      </div>
    </div>`}
    ${poolCount() > 1 && !byGroups ? `<p class="grp-hint grp-explain">Spillerne deles først i ${poolCount()} puljer, og hver pulje deles derefter i sine egne kampe.</p>
    <div class="grp-row">
      <span class="grp-hint grp-label">Del puljerne efter</span>
      <div class="grp-mode grp-wrap" role="group" aria-label="Del puljerne efter">
        ${POOL_MODES.map(m => `<button type="button" data-pmode="${m[0]}" aria-pressed="${GRP.poolMode === m[0]}">${m[1]}</button>`).join("")}
      </div>
    </div>
    <div class="grp-row">
      <span class="grp-hint grp-label">Puljestørrelse</span>
      <div class="grp-mode" role="group" aria-label="Puljestørrelse">
        <button type="button" data-psize="even" aria-pressed="${!poolCustom()}">Lige store</button>
        <button type="button" data-psize="custom" aria-pressed="${poolCustom()}">Vælg selv</button>
      </div>
    </div>
    ${poolCustom() ? poolSizesHtml() : ""}
    <p class="grp-hint grp-explain">${{
      max: "Spillerne stilles op efter deres Fra, så pulje 1 er de mest øvede.",
      band: "Spillere i samme pulje skal have bånd, der overlapper.",
      even: "Puljerne får så ens gennemsnitligt niveau som muligt.",
      chaos: "Puljerne trækkes helt tilfældigt.",
      mix: "Over tid kommer hver spiller ca. 25 % i en sværere pulje, 50 % på eget niveau og 25 % i en lettere. " + mixHistoryText()
    }[GRP.poolMode] || ""}</p>` : ""}
    <div class="grp-row">
      <span class="grp-hint grp-label">${poolCount() > 1 && !byGroups ? "Del hver pulje i kampe efter" : "Del kampene efter"}</span>
      <div class="grp-mode grp-wrap" role="group" aria-label="Del kampene efter">
        ${MATCH_MODES.map(m =>
          `<button type="button" data-mmode="${m[0]}" aria-pressed="${matchMode() === m[0]}">${m[1]}</button>`).join("")}
      </div>
    </div>
    ${byGroups ? "" : poolCount() > 1 ? `<p class="grp-hint grp-label" style="margin:12px 0 0">Antal kampe</p>${poolCountsHtml()}` : `<div class="grp-row">
      <span class="grp-hint grp-label">Antal kampe</span>
      <div class="grp-mode" role="group" aria-label="Antal kampe">
        ${[1, 2, 3, 4].map(c => `<button type="button" data-mcount="${c}" aria-pressed="${(GRP.matchCount || matchCount(GRP.groups)) === c}">${c}</button>`).join("")}
      </div>
    </div>`}
    ${byGroups ? `<div class="grp-row"><span class="grp-hint grp-label">Hold pr. kamp</span><div class="grp-mode" role="group" aria-label="Hold pr. kamp">
      ${[2, 3].map(t => `<button type="button" data-mteams="0:${t}" aria-pressed="${teamsIn(0) === t}">${t} hold</button>`).join("")}</div></div>` : teamsHtml()}
    ${byGroups ? "" : `<div class="grp-row">
      <span class="grp-hint grp-label">Størrelse</span>
      <div class="grp-mode" role="group" aria-label="Størrelse">
        <button type="button" data-msize="even" aria-pressed="${GRP.sizeMode !== "custom"}">Lige store</button>
        <button type="button" data-msize="custom" aria-pressed="${GRP.sizeMode === "custom"}">Vælg selv</button>
      </div>
    </div>
    ${GRP.sizeMode === "custom" ? sizesHtml() : ""}`}
    <p class="grp-hint grp-explain">${{
      groups: "Hver gruppe spiller kamp for sig: gruppen deles i to hold (eller tre), så der bliver én kamp pr. gruppe.",
      mix: "Over tid spiller hver spiller ca. 25 % af kampene i en sværere kamp, 50 % på eget niveau og 25 % i en lettere kamp. De mest øvede kan ikke få sværere kampe (og de mindst øvede ikke lettere), så de spiller mere på eget niveau i stedet. Kampene kan derfor have forskelligt niveau. Spillere kommer kun i kamp sammen, hvis deres bånd overlapper. Det bygger på de gemte kampe, så husk at trykke \u201cGem kampe\u201d.",
      max: "Spillerne stilles op efter deres Fra, så kamp 1 er de mest øvede.",
      band: "Spillere i samme kamp skal have bånd, der overlapper (som for grupperne).",
      even: "Kampene får så ens gennemsnitligt niveau som muligt.",
      chaos: "Helt tilfældigt: både kampe og hold trækkes uden hensyn til niveau. Godt til kortspil, quiz og andre sociale aktiviteter."
    }[matchMode()]}${matchMode() === "mix" ? " " + mixHistoryText() : ""}${matchMode() === "chaos" ? "" : " I hver kamp får hver spiller en modspiller på samme niveau (eller så tæt på som muligt) på det andet hold, og derefter gøres holdene så lige som muligt."}</p>
    <div class="grp-row"><button type="button" class="login-go" data-act="matches"${sizesOff() && !byGroups ? " disabled" : ""}>${ms.length ? "Lav nye kampe" : "Lav kampe"}</button></div>
    ${cards}
    ${ms.length ? `<p class="grp-legend">${matchMode() === "chaos" ? "Holdene er trukket helt tilfældigt." : "Spillerne på samme linje er hinandens modspillere."}${ms.some(m => m.teams.length === 3) ? " Med 3 hold spiller to hold, og vinderen bliver på banen mod det tredje." : ""}${byMix() && showLevels() ? " ↑ = en sværere kamp end eget niveau, ↓ = en lettere." : ""}${matchMode() !== "chaos" && ms.some(m => m.teams.some(x => x.length !== m.teams[0].length))
      ? " Når et hold har én spiller færre, får det lidt mere øvede spillere, så holdene samlet er lige stærke." : ""} Tryk på en spiller og derefter på en anden spiller for at bytte dem (også mellem kampene), eller på \u201cFlyt … til Hold …\u201d.</p>
      <div class="grp-save"><button type="button" class="login-go" data-act="savematches"${GRP.matchesDirty ? "" : " disabled"}>Gem kampe</button>
        <span class="grp-hint" role="status">${status}</span></div>` : ""}
  </section>`;
}

/* Tap a player in a match: select; tap one on another team (this match or another): swap them.
   ("Antal kampe": until a number is chosen, half the groups, rounded up – see matchCount) */
function matchTap(code) {
  const sel = GRP.matchSel;
  if (sel === code) { GRP.matchSel = null; renderGroups(); return; }
  const [m1, t1, p1] = (sel || "").split(":").map(Number), [m2, t2, p2] = code.split(":").map(Number);
  if (sel && !(m1 === m2 && t1 === t2)) {              // another team (in this match or another): swap
    const a = GRP.matches[m1].teams[t1], b = GRP.matches[m2].teams[t2], x = a[p1];
    a[p1] = b[p2]; b[p2] = x;
    GRP.matchSel = null;
    if (m1 === m2) GRP.matchesDirty = true; else matchChanged(m1, m2);
  } else GRP.matchSel = code;
  renderGroups();
}

function renderGroups() {
  const box = GRP && GRP.box;
  if (!box || !box.isConnected || !GRP.data) return;
  const all = GRP.data.players;
  const players = presentPlayers();
  const n = players.length, k = groupCount(n);
  const prev = earlierGroups()[0] || null;
  const was = lastGroupOf(prev);

  // alphabetical, whatever the order in the tab Spillere (data-who stays the player's place in the list from the sheet)
  const order = all.map((p, i) => i).sort((a, b) => all[a].name.localeCompare(all[b].name, "da"));
  const who = order.map(i => `<label><input type="checkbox" data-who="${i}"${GRP.present.has(all[i].name) ? " checked" : ""}>` +
    `<span>${esc(all[i].name)}</span>${showLevels() && all[i].lo != null ? ` <span class="grp-band">${bandText(all[i].lo, all[i].hi)}</span>` : ""}</label>`).join("");

  const none = GRP.groups ? "" : /\sfri$/.test(GRP.key)
    ? "Der er ikke lavet grupper til denne dato endnu."
    : "Der er ikke lavet grupper til denne træning endnu.";
  const start = GRP.fromSignups
    ? `Flueben er sat ved de ${n} tilmeldte (gemt ${esc(GRP.fromSignups)}). Ret dem, hvis nogen mangler eller er kommet til, og tryk på "Lav grupper".`
    : `Sæt flueben ved dem, der er med, og tryk på "Lav grupper".`;
  let html = levelsToggleHtml() + (none ? `<p class="grp-none" role="status">${none} ${start}</p>` : "") +
    `<details class="grp-sec"${GRP.groups ? "" : " open"}><summary>Hvem er med? ${n} af ${all.length}</summary>
      ${all.length ? `<div class="grp-who">${who}</div>
      <div class="grp-row"><button type="button" class="clearbtn" data-act="all">Alle</button><button type="button" class="clearbtn" data-act="none">Ingen</button>
        <button type="button" class="clearbtn" data-act="signups">Gem tilmeldte</button>
        <span class="grp-hint" role="status">${esc(signupStatus())}</span></div>`
      : `<p>Fanen "Spillere" er tom. Skriv spillerne ind (Navn, Fra, Til) og åbn Grupper igen.</p>`}
    </details>
    <section class="grp-sec">
      <div class="grp-row" style="margin-top:0">
        <span class="grp-hint grp-label">Del efter</span>
        <div class="grp-mode" role="group" aria-label="Del efter">
          <button type="button" data-rule="mix" aria-pressed="${groupsByMix()}">25-50-25</button>
          <button type="button" data-rule="band" aria-pressed="${GRP.rule === "band"}">Bånd</button>
          <button type="button" data-rule="max" aria-pressed="${byMax()}">Niveau</button>
          <button type="button" data-rule="chaos" aria-pressed="${byChaos()}">Kaos</button>
        </div>
      </div>
      ${byMax() ? `<div class="grp-row">
        <span class="grp-hint">Forskel i en gruppe højst</span>
        <div class="grp-mode" role="group" aria-label="Forskel i en gruppe højst">
          ${[0, 0.5, 1, 1.5, 2].map(d => `<button type="button" data-diff="${d}" aria-pressed="${GRP.maxDiff === d}">${nivText(d)}</button>`).join("")}
        </div>
      </div>` : ""}
      <div class="grp-row">
        <div class="grp-mode" role="group" aria-label="Gruppestørrelse">
          <button type="button" data-mode="count" aria-pressed="${GRP.mode === "count"}">Antal grupper</button>
          <button type="button" data-mode="size" aria-pressed="${GRP.mode === "size"}">Spillere pr. gruppe</button>
        </div>
        <span class="grp-step">
          <button type="button" data-act="minus" aria-label="Færre">−</button>
          <output aria-live="polite">${GRP.mode === "count" ? GRP.count : GRP.size}</output>
          <button type="button" data-act="plus" aria-label="Flere">+</button>
        </span>
        <span class="grp-hint">${sizeText(n, k)}</span>
      </div>
      ${byChaos() ? `<p class="grp-hint grp-explain grp-slide">Kaos: spillerne fordeles helt tilfældigt. Niveau og tidligere grupper tæller ikke med.</p>`
      : byMax() ? `<p class="grp-hint grp-explain grp-slide">Niveau: spillerne sorteres efter deres Fra (ved samme Fra kommer det smalleste bånd først), så gruppe 1 er de mest øvede. Spillere med samme niveau blandes, når du trykker igen. En gruppe bliver rød, hvis den spænder mere end den valgte forskel.</p>`
      : groupsByMix() ? `<p class="grp-hint grp-explain grp-slide">25-50-25: over tid er hver spiller ca. 25 % af tiden i en gruppe med mere øvede (spiller op), 50 % med spillere på samme niveau og 25 % med mindre øvede (spiller ned). De mest øvede kan ikke spille op (og de mindst øvede ikke ned), så de er mere på samme niveau. Spillere kommer kun i gruppe sammen, hvis deres bånd overlapper (bånd, der kun rører hinanden, er ikke nok). Jo mere to spilleres bånd overlapper, jo oftere kommer de i gruppe sammen. Det bygger på de gemte grupper (${earlierGroups().length} ${earlierGroups().length === 1 ? "træning" : "træninger"}), så husk \u201cGem grupper\u201d.</p>
      <label class="grp-slide"><span>Socialt mix: ${GRP.social} %</span>
        <input type="range" min="0" max="100" step="5" value="${GRP.social}" data-act="social" aria-label="Socialt mix">
        <span class="grp-ends" aria-hidden="true"><span>Samme makkere ok</span><span>Nye makkere</span></span>
        <span class="grp-hint grp-explain">${socialText()}</span>
      </label>
      <label class="grp-slide"><span>Niveaublanding: ${GRP.even} %</span>
        <input type="range" min="0" max="100" step="5" value="${GRP.even}" data-act="even" aria-label="Niveaublanding">
        <span class="grp-ends" aria-hidden="true"><span>Niveaugrupper</span><span>Blandede grupper</span></span>
        <span class="grp-hint grp-explain">${levelMixText()}</span>
      </label>`
      : `<label class="grp-slide"><span>Ændring fra sidst: ${GRP.change >= 100 ? "bland mest muligt" : GRP.change + " %"}</span>
        <input type="range" min="0" max="100" step="5" value="${GRP.change}" data-act="change">
        <span class="grp-ends" aria-hidden="true"><span>Behold</span><span>Bland</span></span>
        <span class="grp-hint grp-explain">${changeText(prev, players, k)}</span>
      </label>`}
      <div class="grp-row"><button type="button" class="login-go" data-act="make">${GRP.groups ? "Lav nye grupper" : "Lav grupper"}</button></div>
      ${GRP.askMake ? `<div class="grp-ask" role="alert">⚠ Nye grupper erstatter dem, der vises nu${GRP.dirty ? " – og de er ikke gemt" :
        GRP.saved ? ". De gemte grupper ændres først, når du trykker \u201cGem grupper\u201d" : ""}.
        <div class="grp-row"><button type="button" class="login-go" data-act="make-yes">Ja, lav nye</button>
        <button type="button" class="clearbtn" data-act="make-no">Behold</button></div></div>` : ""}
    </section>`;

  if (GRP.msg) html += `<p class="grp-msg${GRP.bad ? " bad" : ""}" role="status">${esc(GRP.msg)}</p>`;
  if (serverNoteHtml()) html = `<p class="server-note" role="status" style="margin-bottom:12px">${serverNoteHtml()}</p>` + html;

  if (GRP.groups) {
    html += `<div class="grp-list">` + GRP.groups.map(function (g, gi) {
      const clash = [];
      const note = a => showLevels() ? ` (${ruleNote(a)})` : "";
      g.forEach((a, i) => g.slice(i + 1).forEach(b => { if (!grpMeet(a, b)) clash.push(`${a.name}${note(a)} og ${b.name}${note(b)}`); }));
      const levelTxt = clash.length ? "niveau passer ikke" : showLevels() ? groupLevelText(g) : "";
      const selHere = GRP.sel && g.indexOf(GRP.sel) !== -1;
      const chips = g.map(function (p) {
        const moved = !noSlider() && prev && was[p.name] != null && was[p.name] !== gi;
        return `<button type="button" class="grp-p${moved ? " moved" : ""}" data-p="${esc(p.name)}" aria-pressed="${GRP.sel === p}"` +
          `${moved ? ` title="Ny gruppe siden sidst"` : ""}>${esc(p.name)}${showLevels() ? ` <span class="grp-band">${bandText(p.lo, p.hi)}</span>` : ""}</button>`;
      }).join("");
      return `<div class="grp-card${clash.length ? " bad" : ""}">
        <div class="grp-head"><strong>Gruppe ${gi + 1}</strong><small>${g.length} ${g.length === 1 ? "spiller" : "spillere"}${levelTxt ? " · " + levelTxt : ""}</small></div>
        <div class="grp-players">${chips || '<span class="grp-hint">Ingen spillere</span>'}</div>
        ${GRP.sel && !selHere ? `<button type="button" class="clearbtn grp-here" data-to="${gi}">Flyt ${esc(GRP.sel.name)} hertil</button>` : ""}
        ${clash.length ? `<p class="grp-warn">⚠ ${byMax() ? "For stor forskel i niveau" : groupsByMix() ? "Båndene overlapper ikke" : "Niveauerne mødes ikke"}: ${esc(clash.slice(0, 2).join("; "))}${clash.length > 2 ? " …" : ""}</p>` : ""}
      </div>`;
    }).join("") + `</div>
      <p class="grp-legend">${prev && !noSlider() ? "Rød kant = ny gruppe siden sidst. " : ""}Tryk på en spiller for at flytte dem eller bytte med en anden.</p>
      ${mixLine(players) ? `<p class="grp-mixline">${mixLine(players)}</p>` : ""}
      <div class="grp-save"><button type="button" class="login-go" data-act="save"${GRP.dirty ? "" : " disabled"}>Gem grupper</button>
        <span class="grp-hint" role="status">${GRP.dirty ? "Ikke gemt" : waiting("groups", GRP.key) ? queuedText()
          : GRP.saved ? "Gemt " + esc(GRP.saved) : ""}</span></div>` +
      matchesHtml();
  }
  box.innerHTML = html;
}

/* A player ticked on after the groups were made goes into the smallest group their level fits */
function addToGroups(p) {
  if (groupsByMix()) { addByMix(p); return; }
  let best = -1;
  GRP.groups.forEach(function (g, gi) {
    const fits = g.every(q => grpMeet(p, q));
    const score = (fits ? 0 : 1000) + g.length;
    if (best === -1 || score < best.score) best = { gi: gi, score: score };
  });
  if (best !== -1) GRP.groups[best.gi].push(p);
}

/* 25-50-25: a player ticked on after the groups were made goes where it suits best, without making the sizes uneven:
   only the smallest groups (one more if none of them fits the bands); among those, the group whose bands all overlap
   the player's, then the least cost: the player's own aim and the others' (with what they have had), the social mix
   (together lately) and the overlap pull – as when the groups are made (mixPools). */
function addByMix(p) {
  const lvl = q => isBand(q) ? q : nivOf(q) == null ? NaN : nivOf(q);
  const present = GRP.groups.flat().concat([p]);
  const had = skillMix(earlierGroups().map(e => e.groups), grpSkill());
  const pairs = pairHistory(earlierGroups().map(e => e.groups)), socialW = socialWeight();
  const aimOf = q => playerAim(lvl(q), present.filter(o => o !== q && bandsFit(q, o)).map(lvl));
  const mixCost = (q, mates) => {                          // how far q's mix (earlier + with these mates) is from q's aim
    if (!hasLevel(lvl(q))) return 0;
    const others = mates.filter(o => o !== q && hasLevel(lvl(o)));
    if (!others.length) return 0;
    const w = [0, 0, 0];
    others.forEach(o => { const x = levelWeights(lvl(q), lvl(o)); for (let r = 0; r < 3; r++) w[r] += x[r] / others.length; });
    const h = had[q.name] || [0, 0, 0, 0], aim = aimOf(q);
    let c = 0;
    for (let r = 0; r < 3; r++) { const d = (h[r] + w[r]) / (h[3] + 1) - aim[r]; c += 1000 * d * d; }
    return c;
  };
  const smallest = Math.min(...GRP.groups.map(g => g.length));
  let best = null;
  GRP.groups.forEach(function (g, gi) {
    const fits = g.every(q => bandsFit(p, q));
    const with_ = g.concat([p]);
    let c = (fits ? 0 : 1e6) + (g.length - smallest) * 1e5;   // the bands first, then the sizes
    c += mixCost(p, with_) + g.reduce((x, q) => x + mixCost(q, with_) - mixCost(q, g), 0);
    g.forEach(q => {
      c += socialW * (pairs[pairKey(p.name, q.name)] || 0);
      if (isBand(p) && isBand(q)) c -= OVERLAP_PULL * (bandWeights(p, q)[1] + bandWeights(q, p)[1]) / 2;
    });
    if (!best || c < best.c) best = { gi: gi, c: c };
  });
  if (best) GRP.groups[best.gi].push(p);
}

function grpInput(e) {
  if (!GRP || e.currentTarget !== GRP.box) return;              // a box from an earlier opening
  GRP.touched = true;                                           // a newer copy of the players won't replace the screen now
  renewWhileWorking();
  const t = e.target;
  if (t.dataset.act === "social") {
    GRP.social = +t.value; saveGrpSettings();
    const label = t.closest(".grp-slide");                     // update the text only: re-drawing would stop the drag
    label.firstElementChild.textContent = "Socialt mix: " + GRP.social + " %";
    return;
  }
  if (t.dataset.act === "even") {
    GRP.even = +t.value; saveGrpSettings();
    t.closest(".grp-slide").firstElementChild.textContent = "Niveaublanding: " + GRP.even + " %";
    return;
  }
  if (t.dataset.act === "change") {
    GRP.change = +t.value; saveGrpSettings();
    const label = t.closest(".grp-slide");                     // update the texts only: re-drawing would stop the drag
    const players = presentPlayers();
    label.firstElementChild.textContent = "Ændring fra sidst: " + (GRP.change >= 100 ? "bland mest muligt" : GRP.change + " %");
    label.lastElementChild.innerHTML = changeText(earlierGroups()[0] || null, players, groupCount(players.length));
    return;
  }
  if (t.dataset.who != null) {
    const p = grpPlayer(GRP.data.players[+t.dataset.who].name);
    if (t.checked) { GRP.present.add(p.name); if (GRP.groups) addToGroups(p); }
    else {
      GRP.present.delete(p.name);
      if (GRP.groups) GRP.groups = GRP.groups.map(g => g.filter(q => q !== p));
      if (GRP.sel === p) GRP.sel = null;
    }
    if (GRP.groups) GRP.dirty = true;
    renderGroups();
    const box = GRP.box.querySelector("details");
    if (box) box.open = true;                                  // keep the list open while ticking
  }
}

function grpClick(e) {
  if (!GRP || e.currentTarget !== GRP.box) return;
  const b = e.target.closest("button");
  if (!b) return;
  GRP.touched = true;
  renewWhileWorking();
  GRP.askMake = false;                // the "replace the groups?" question goes away whatever is pressed next
  const act = b.dataset.act;
  if (act === "all" || act === "none") {
    GRP.present = new Set(act === "all" ? GRP.data.players.map(p => p.name) : []);
    if (GRP.groups) {
      GRP.groups = GRP.groups.map(g => g.filter(p => GRP.present.has(p.name)));
      presentPlayers().forEach(p => { if (!GRP.groups.some(g => g.indexOf(p) !== -1)) addToGroups(p); });
      GRP.dirty = true;
    }
    GRP.sel = null;
    renderGroups();
    GRP.box.querySelector("details").open = true;
  } else if (b.dataset.rule) {                                 // a new rule: the cards' warnings follow at once
    GRP.rule = b.dataset.rule; GRP.msg = ""; GRP.bad = false; saveGrpSettings(); renderGroups();
  } else if (b.dataset.diff != null) {
    GRP.maxDiff = +b.dataset.diff; GRP.msg = ""; GRP.bad = false; saveGrpSettings(); renderGroups();
  } else if (b.dataset.mode) {
    GRP.mode = b.dataset.mode; saveGrpSettings(); renderGroups();
  } else if (act === "minus" || act === "plus") {
    const d = act === "plus" ? 1 : -1;
    if (GRP.mode === "count") GRP.count = Math.max(1, Math.min(20, GRP.count + d));
    else GRP.size = Math.max(2, Math.min(30, GRP.size + d));
    saveGrpSettings(); renderGroups();
  } else if (act === "make" && GRP.groups && GRP.groups.some(g => g.length)) {
    GRP.askMake = true;                                         // groups on the screen: ask before replacing them
    renderGroups();
    GRP.box.querySelector('[data-act="make-yes"]').focus();
  } else if (act === "make" || act === "make-yes") {
    makeNewGroups();
  } else if (act === "make-no") {
    renderGroups();
  } else if (act === "save") {
    saveGroupsNow(b);
  } else if (act === "signups") {
    saveSignupsNow(b);
  } else if (b.dataset.mpools != null) {
    GRP.matchPools = +b.dataset.mpools; GRP.poolSizes = null; saveGrpSettings(); renderGroups();
  } else if (b.dataset.pmode) {
    GRP.poolMode = b.dataset.pmode; saveGrpSettings(); renderGroups();
  } else if (b.dataset.psize) {
    GRP.poolSizeMode = b.dataset.psize; GRP.poolSizes = null; saveGrpSettings(); renderGroups();
  } else if (b.dataset.psz) {
    const [i, d] = b.dataset.psz.split(":").map(Number), sizes = chosenPoolSizes();
    sizes[i] = Math.max(2, sizes[i] + d);
    renderGroups();
  } else if (b.dataset.mteams) {
    const [i, t] = b.dataset.mteams.split(":").map(Number);
    GRP.matchTeams = (GRP.matchTeams || [2, 2, 2, 2]).slice();
    GRP.matchTeams[i] = t;
    saveGrpSettings(); renderGroups();
  } else if (b.dataset.msub) {
    const [i, d] = b.dataset.msub.split(":").map(Number);
    GRP.matchSub = GRP.matchSub.slice();
    GRP.matchSub[i] = Math.max(1, Math.min(4, subCounts()[i] + d));
    saveGrpSettings(); renderGroups();
  } else if (b.dataset.mcount != null) {
    GRP.matchCount = +b.dataset.mcount; GRP.matchSizes = null; saveGrpSettings(); renderGroups();
  } else if (b.dataset.msize) {
    GRP.sizeMode = b.dataset.msize; GRP.matchSizes = null; renderGroups();
  } else if (b.dataset.msz) {
    const [i, d] = b.dataset.msz.split(":").map(Number), sizes = chosenSizes();
    sizes[i] = Math.max(2, sizes[i] + d);
    renderGroups();
  } else if (b.dataset.mto) {
    const [mi, ti] = b.dataset.mto.split(":").map(Number);
    matchMove(mi, ti);
  } else if (b.dataset.mrebal != null) {
    rebalanceMatch(+b.dataset.mrebal);
  } else if (b.dataset.mmode) {
    GRP.matchMode = b.dataset.mmode; saveGrpSettings(); renderGroups();
  } else if (act === "savematches") {
    saveMatchesNow(b);
  } else if (act === "matches") {
    makeMatchesNow();
  } else if (b.dataset.mp != null) {
    matchTap(b.dataset.mp);
  } else if (b.dataset.p != null) {                            // tap a player: select, or swap with the selected one
    const p = GRP.byName[b.dataset.p];
    const gOf = q => GRP.groups.findIndex(g => g.indexOf(q) !== -1);
    if (GRP.sel === p) GRP.sel = null;
    else if (GRP.sel && gOf(GRP.sel) !== gOf(p)) {
      const ga = GRP.groups[gOf(GRP.sel)], gb = GRP.groups[gOf(p)];
      ga[ga.indexOf(GRP.sel)] = p; gb[gb.indexOf(p)] = GRP.sel;
      GRP.sel = null; GRP.dirty = true; GRP.msg = "";
    } else GRP.sel = p;
    renderGroups();
  } else if (b.dataset.to != null) {                           // "Flyt hertil"
    const from = GRP.groups.find(g => g.indexOf(GRP.sel) !== -1);
    from.splice(from.indexOf(GRP.sel), 1);
    GRP.groups[+b.dataset.to].push(GRP.sel);
    GRP.sel = null; GRP.dirty = true; GRP.msg = "";
    renderGroups();
  }
}

/* ---- Saving with poor reception ----
   Every save ("Gem grupper", "Gem tilmeldte", "Gem kampe") is kept on the phone at once (localStorage
   "oevGrpQueue"), so the screen is ready again straight away, and sent to the sheet in the background (a call to
   Google takes a few seconds). Without a connection it stays as "Gemt på telefonen" and is sent as soon as possible: when the phone
   comes back online, when the app is opened or brought back, after a login, and every 30 seconds while one is
   waiting. Only the newest save per training and kind is kept. Until it is sent, the phone's copy of the groups
   already holds it, so reopening Grupper shows it and the next groups build on it. */
const QUEUE_KEY = "oevGrpQueue";
const SAVE_ACTIONS = { groups: "saveGroups", signups: "saveSignups", matches: "saveMatches", fixtures: "saveFixtureSet" };
let QUEUE_SENDING = false, QUEUE_TOLD = false;

function readQueue() {
  try { const q = JSON.parse(localStorage.getItem(QUEUE_KEY) || "[]"); return Array.isArray(q) ? q : []; } catch (e) { return []; }
}
function writeQueue(q) {
  try { if (q.length) localStorage.setItem(QUEUE_KEY, JSON.stringify(q)); else localStorage.removeItem(QUEUE_KEY); } catch (e) { /* storage full or blocked */ }
}
const waiting = (kind, key) => readQueue().some(x => x.kind === kind && x.key === key);
/* The status of a save that is on the phone and not yet in the sheet */
const queuedText = () => navigator.onLine && isAuthed() ? "Gemt på telefonen · sendes til arket …" : "Gemt på telefonen · sendes, når der er forbindelse";

/* Did the call fail for lack of a connection (try again later), rather than an answer from the server? */
function noConnection(err) {
  const m = String((err && err.message) || err);
  if (err && err.server) return false;                  // the server answered (with an error)
  return !navigator.onLine || (err && (err.name === "AbortError" || err.name === "TypeError")) ||
         /failed to fetch|networkerror|load failed|network|abort|timed? ?out|HTTP 5\d\d/i.test(m);
}

/* What is waiting, put into a copy of the players and groups (after a fresh copy has come from the server) */
function applyQueue(data) {
  readQueue().filter(x => !x.team || x.team === supaTeam()).forEach(x => putSaved(data, x.kind, x.key, x.names, ""));
  return data;
}
/* One training's saved groups, matches or signups into the phone's copy; an empty list removes them (as on the server) */
function putSaved(data, kind, key, names, saved) {
  if (kind === "fixtures") {                               // the Kampe tab: a set { name, games: [{ name, date, level, size, avail, players }] }
    data.fixtures = data.fixtures || {};
    if (!names || !(names.games || []).length) delete data.fixtures[key];
    else data.fixtures[key] = { saved: saved, name: names.name || "", games: names.games.map(g => ({ name: g.name, date: g.date, level: g.level, size: g.size, avail: g.avail.slice(), players: g.players.slice(), locked: (g.locked || []).slice() })) };
    return;
  }
  const field = kind === "groups" ? "history" : kind === "matches" ? "matches" : "signups";
  data[field] = data[field] || {};
  if (!names || !names.length) { delete data[field][key]; return; }
  data[field][key] = kind === "groups" ? { saved: saved, groups: names } : kind === "matches" ? { saved: saved, matches: names } : { saved: saved, names: names };
}

function keepForLater(want, kind, names) {
  const q = readQueue().filter(x => !(x.kind === kind && x.key === want.key));
  q.push({ kind: kind, key: want.key, names: names, at: Date.now(), team: useSupabase() ? supaTeam() : undefined });
  writeQueue(q);
  applyQueue(want.data);
  if (kind === "groups") { want.groups = names.map(g => g.map(grpPlayer)); want.saved = ""; want.dirty = false; }
  if (kind === "matches") { want.matchesSaved = ""; want.matchesDirty = false; }
  want.msg = ""; want.bad = false;
  if (GRP_CACHE && GRP_CACHE.data === want.data) storeGroups();
  if (GRP === want) renderGroups();
}

/* Sends what is waiting, one at a time; stops at the first save that can't get through yet */
function sendQueue() {
  const q = readQueue();
  if (QUEUE_SENDING || !q.length || !navigator.onLine) return;
  if (!isAuthed()) {
    if (!QUEUE_TOLD) { QUEUE_TOLD = true; showToast("Grupper venter på at blive gemt. Log ind med koden, så sendes de."); }
    return;
  }
  QUEUE_SENDING = true;
  const x = q[0];
  libCall(SAVE_ACTIONS[x.kind], [AUTH.token, x.key, x.names].concat(x.team ? [x.team] : [])).then(function (res) {
    writeQueue(readQueue().filter(y => !(y.kind === x.kind && y.key === x.key && y.at === x.at)));
    if (GRP_CACHE) {
      const d = GRP_CACHE.data;
      putSaved(d, x.kind, x.key, x.names, res.saved);
      storeGroups();
    }
    if (GRP && GRP.key === x.key && x.kind === "groups" && !GRP.dirty) GRP.saved = res.saved;
    if (GRP && GRP.key === x.key && x.kind === "matches" && !GRP.matchesDirty) GRP.matchesSaved = res.saved;
    if (x.kind === "fixtures" && FIX && FIX.id === x.key && !FIX.dirty) FIX.saved = res.saved;
    if (FIX) renderFixtures();
    if (GRP && GRP.data) renderGroups();
    QUEUE_SENDING = false;
    sendQueue();                                         // the next one, if any
  }, function (err) {
    QUEUE_SENDING = false;
    if (/LOGIN/.test(String(err && err.message))) {     // the login ran out on the server: ask for the code, then send
      AUTH.token = ""; AUTH.until = 0; saveAuth(); QUEUE_TOLD = false;
      if (GRP && GRP.box && GRP.box.isConnected) requireLogin(sendQueue, function () { if (GRP && GRP.data) renderGroups(); });
      else sendQueue();
      if (GRP && GRP.data) renderGroups();
      return;
    }
    if (noConnection(err)) { if (GRP && GRP.data) renderGroups(); if (FIX) renderFixtures(); return; }   // tried again later
    writeQueue(readQueue().filter(y => y !== x && !(y.kind === x.kind && y.key === x.key && y.at === x.at)));   // the server said no: drop it
    const what = { groups: "grupperne", signups: "de tilmeldte", matches: "kampene", fixtures: "udtagelsen" }[x.kind];
    const text = "Kunne ikke gemme " + what + ": " + String(err && err.message || err);
    if (x.kind === "fixtures") {
      if (FIX && FIX.id === x.key) { FIX.dirty = true; FIX.msg = text; FIX.bad = true; renderFixtures(); } else showToast(text);
    } else if (GRP && GRP.key === x.key && GRP.data) {           // on the screen: back to "Ikke gemt", so it can be saved again
      if (x.kind === "groups") GRP.dirty = true;
      if (x.kind === "matches") GRP.matchesDirty = true;
      GRP.msg = text; GRP.bad = true;
      renderGroups();
    } else showToast(text);
    sendQueue();
  });
}
window.addEventListener("online", sendQueue);
document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") sendQueue(); });
setInterval(function () { if (readQueue().length) sendQueue(); }, 30000);

/* "Gem …": on the phone at once, then sent in the background (see above). Without a connection, no login is needed
   now; with one, the code is asked for first if the login has run out. */
function saveNow(kind, names) {
  const want = GRP;
  if (navigator.onLine && !isAuthed()) { askCodeThenSave(want, kind); return; }
  keepForLater(want, kind, names);
  sendQueue();
}
function saveGroupsNow() {
  const names = GRP.groups.filter(g => g.length).map(g => g.map(p => p.name));
  const twin = /^\d{4}-\d{2}-\d{2}$/.test(GRP.key) && (GRP.data.history || {})[GRP.key + " fri"] ? GRP.key + " fri" : null;
  if (twin) askTwin(twin, function () { saveNow("groups", names); });
  else saveNow("groups", names);
}

/* Groups saved in the Grupper tab for the same date as this training ("uden træning"): saving here as well would count
   the day twice (attendance, the mix, the social mix). Ask whether to remove them (and any matches saved with them). */
function askTwin(twin, save) {
  if (document.querySelector(".leave-ask")) return;
  const want = GRP;
  const box = document.createElement("div");
  box.className = "login leave-ask";
  box.setAttribute("role", "dialog"); box.setAttribute("aria-modal", "true"); box.setAttribute("aria-labelledby", "twin-title");
  box.innerHTML = `<div class="login-box"><h2 id="twin-title">Grupper fra samme dag</h2>
    <p>Der er også gemt grupper i fanen Grupper for ${esc(keyLabel(twin).replace(/ \(uden træning\)$/, ""))} (uden træning). Gemmer du også her, tæller dagen to gange i statistikken.</p>
    <div class="login-actions" style="flex-wrap:wrap">
      <button type="button" class="clearbtn" data-twin="keep">Behold begge</button>
      <button type="button" class="login-go" data-twin="drop">Slet dem fra fanen og gem</button></div></div>`;
  document.body.appendChild(box);
  box.addEventListener("keydown", function (e) { if (e.key === "Escape") { e.stopPropagation(); box.remove(); } });
  box.addEventListener("click", function (e) {
    const b = e.target.closest("[data-twin]");
    if (!b) return;
    box.remove();
    if (GRP !== want) return;
    if (b.dataset.twin === "drop") {
      queueRemove(want.data, "groups", twin);
      if ((want.data.matches || {})[twin]) queueRemove(want.data, "matches", twin);
    }
    save();
  });
  box.querySelector('[data-twin="drop"]').focus();
}
/* Removes one training's saved groups or matches: on the phone at once, on the server through the queue */
function queueRemove(data, kind, key) {
  const q = readQueue().filter(x => !(x.kind === kind && x.key === key));
  q.push({ kind: kind, key: key, names: [], at: Date.now(), team: useSupabase() ? supaTeam() : undefined });
  writeQueue(q);
  putSaved(data, kind, key, [], "");
  if (GRP_CACHE && GRP_CACHE.data === data) storeGroups();
}

/* The login has run out: the groups stay on the screen, the code is asked for, and then they are saved */
function askCodeThenSave(want, kind) {
  if (AUTH.token && !isAuthed()) { AUTH.token = ""; AUTH.until = 0; saveAuth(); }   // the old login is no use to the server
  requireLogin(function () {
    if (GRP !== want) return;
    if (kind === "signups") saveSignupsNow(GRP.box.querySelector('[data-act="signups"]'));
    else if (kind === "matches") saveMatchesNow(GRP.box.querySelector('[data-act="savematches"]'));
    else saveGroupsNow(GRP.box.querySelector('[data-act="save"]'));
  }, function () {
    if (GRP !== want) return;
    GRP.msg = "Ikke gemt endnu: log ind med koden, og tryk på \u201c" +
      ({ signups: "Gem tilmeldte", matches: "Gem kampe" }[kind] || "Gem grupper") + "\u201d igen.";
    GRP.bad = true;
    renderGroups();
  });
}

/* Saves the ticks as this training's signups (in the tab "Tilmeldte"), so any phone can start from them */
function saveSignupsNow() { saveNow("signups", GRP.data.players.filter(p => GRP.present.has(p.name)).map(p => p.name)); }

/* Saves the matches on the screen (tab Kampe): 25-50-25 builds on the saved matches */
function saveMatchesNow() { saveNow("matches", GRP.matches.map(m => m.teams.map(t => t.map(p => p.name)))); }

/* ===================== Kampe: sets of real matches, who can play, who plays =====================
   The Kampe tab works on a "kampsæt": matches that belong together, e.g. a weekend. Each match has a name, a date, a
   level 1–4 and a number of players. "Hvem er til rådighed?" is a table: tap a player's box under a match when they
   can play it. "Lav udtagelse" puts players on the matches by 25-50-25 (draftFixtureSet): only on matches they can play
   and at most half a level outside their band, as many matches as needed but everyone one before anyone two, and
   those who can play but get none are the set's reserves (in turn over the season). Players can be swapped, moved or
   added by hand. "Gem kampsæt" saves the matches, who can play and who plays (tab Kampsæt); a match can be moved to
   another set. */
const FIX_GAME_KEY = "oevFixGame";                         // the last match set up, as the start for a new one
function fixDefaultGame(n) {
  let g = null;
  try { g = JSON.parse(localStorage.getItem(FIX_GAME_KEY) || "null"); } catch (e) { /* not remembered */ }
  return { name: "Kamp " + n, date: todayIso(), level: g && g.level >= 1 && g.level <= 4 ? g.level : 2, size: g && g.size >= 1 ? g.size : 10, avail: new Set(), players: [], locked: new Set() };
}
function rememberFixGame(g) {
  try { localStorage.setItem(FIX_GAME_KEY, JSON.stringify({ level: g.level, size: g.size })); } catch (e) { /* not remembered */ }
}

/* The saved sets, each { saved, name, games: [{ name, date, level, size, avail: [], players: [] }] } (a one-date draft
   from the app of 20 Nov 2026 still in the phone's copy: shown as a set, as the server does) */
function fixtureSets(data) {
  const out = {};
  Object.keys(data.fixtures || {}).forEach(function (id) {
    const f = data.fixtures[id];
    if (f.games && f.games.length && !Array.isArray(f.games[0].avail)) {
      const date = id.replace(/^d-/, "");
      out[/^d-/.test(id) ? id : "d-" + id] = { saved: f.saved, name: "Kampe " + date, games: f.games.map((g, i) => ({
        name: "Kamp " + (i + 1), date: date, level: g.level, size: Math.max(g.players.length, 1), avail: g.players.concat(f.reserves || []), players: g.players.slice(), locked: [] })) };
    } else out[id] = f;
  });
  return out;
}
const setFirstDate = s => (s.games.map(g => g.date).filter(Boolean).sort()[0] || "");
/* Newest first (by the first match's date) */
function setsInOrder(data) {
  const sets = fixtureSets(data);
  return Object.keys(sets).map(id => [id, sets[id]]).sort((a, b) => setFirstDate(b[1]).localeCompare(setFirstDate(a[1])) || b[0].localeCompare(a[0]));
}
const setDates = s => { const d = [...new Set(s.games.map(g => g.date).filter(Boolean))].sort(); return d.map(x => shortDate(x)).join(" og "); };

function openFixtures() {
  readStoredGroups().then(function (c) { if (c) startFixtures(); });
  fetchGroupData().then(function () { startFixtures(); }, function (err) {
    if (GRP_CACHE) return;                                  // the phone's copy is shown
    if (/LOGIN/.test(String(err && err.message))) requireLogin(function () { showView("fixtures"); });
    else document.getElementById("fix").innerHTML = `<p>Kunne ikke hente spillerne: ${esc(String(err && err.message || err))}</p>`;
  });
}

/* The set on the screen: the one already open (kept while being worked on), else the newest, else a new one */
function startFixtures(id) {
  if (!GRP_CACHE) return;
  const data = GRP_CACHE.data;
  if (id === undefined && FIX) {
    if (FIX.data !== data && !FIX.touched) return loadSet(FIX.id, data);
    FIX.data = data; renderFixtures(); return;
  }
  const order = setsInOrder(data);
  if (id === undefined || id === null) id = order.length ? order[0][0] : null;
  if (id) loadSet(id, data); else newSet(data);
}
function loadSet(id, data) {
  const s = fixtureSets(data)[id];
  if (!s) return newSet(data);
  FIX = { id: id, data: data, name: s.name, saved: s.saved, sel: null, dirty: false, touched: false, msg: "", bad: false, nonce: 0,
          games: s.games.map(g => ({ name: g.name, date: g.date, level: g.level, size: g.size, avail: new Set(g.avail), players: g.players.slice(), locked: new Set(g.locked || []) })) };
  renderFixtures();
}
function newSet(data) {
  FIX = { id: "k" + Date.now().toString(36), data: data, name: "Kampsæt " + shortDate(todayIso()), saved: "", sel: null,
          dirty: true, touched: false, msg: "", bad: false, nonce: 0, games: [fixDefaultGame(1)] };
  renderFixtures();
}

const fixAll = () => { const by = {}; FIX.data.players.forEach(p => { by[p.name] = p; }); return by; };
const fixAvailAny = () => { const s = new Set(); FIX.games.forEach(g => g.avail.forEach(n => s.add(n))); return s; };
const fixReserves = () => { const plays = new Set([].concat(...FIX.games.map(g => g.players))); return [...fixAvailAny()].filter(n => !plays.has(n)).sort((a, b) => a.localeCompare(b, "da")); };
const fixHasDraft = () => FIX.games.some(g => g.players.length);

function makeDraft() {
  const by = fixAll(), names = [...fixAvailAny()];
  if (!names.length) { FIX.msg = "Sæt spillerne til rådighed for kampene først (tabellen ovenfor)."; FIX.bad = true; renderFixtures(); return; }
  const players = names.map(n => by[n] || { name: n });
  const earlier = setsInOrder(FIX.data).filter(([id, s]) => id !== FIX.id && setFirstDate(s) <= (setFirstDate(FIX) || "9999")).map(e => e[1]);
  const r = draftFixtureSet(players, FIX.games.map(g => ({ level: g.level, size: g.size, avail: [...g.avail], locked: [...g.locked] })),
                            fixtureHistory(earlier, n => by[n] || null), hashText(FIX.id + "|udtag|" + (++FIX.nonce)));
  FIX.games.forEach((g, gi) => { g.players = r.games[gi].map(p => p.name); });
  FIX.dirty = true; FIX.sel = null; FIX.bad = false;
  const out = FIX.games.reduce((x, g) => x + g.players.filter(n => !fixtureFits(by[n] || {}, g.level)).length, 0);
  const short = FIX.games.filter(g => g.players.length < g.size).map(g => `${g.name} mangler ${g.size - g.players.length}`);
  FIX.msg = [short.length ? short.join(", ") + ": der er ikke flere til rådighed, der kan spille den." : "",
    out ? `${out} ${out === 1 ? "plads er" : "pladser er"} fyldt med en spiller mere end et halvt niveau uden for sit bånd (markeret med !).` : ""].filter(Boolean).join(" ");
  renderFixtures();
}

/* Puts a set in the phone's queue (saved at once on the phone, sent in the background) */
function queueSet(id, payload, data) {
  const q = readQueue().filter(x => !(x.kind === "fixtures" && x.key === id));
  q.push({ kind: "fixtures", key: id, names: payload, at: Date.now() });
  writeQueue(q);
  putSaved(data, "fixtures", id, payload, "");
  if (GRP_CACHE && GRP_CACHE.data === data) storeGroups();
}
const fixPayload = () => ({ name: FIX.name, games: FIX.games.map(g => ({ name: g.name, date: g.date, level: g.level, size: g.size, avail: [...g.avail], players: g.players.slice(), locked: [...g.locked] })) });
function saveFixSet() {
  if (navigator.onLine && !isAuthed()) { requireLogin(saveFixSet); return; }
  queueSet(FIX.id, fixPayload(), FIX.data);
  FIX.dirty = false; FIX.saved = ""; FIX.msg = ""; FIX.bad = false;
  renderFixtures();
  sendQueue();
}
/* Moves match gi to another set (to: its id, or "__new"): both sets are saved */
function moveGame(gi, to) {
  if (navigator.onLine && !isAuthed()) { requireLogin(function () { moveGame(gi, to); }); return; }
  const g = FIX.games.splice(gi, 1)[0], plain = { name: g.name, date: g.date, level: g.level, size: g.size, avail: [...g.avail], players: g.players.slice(), locked: [...g.locked] };
  const sets = fixtureSets(FIX.data), id = to === "__new" ? "k" + Date.now().toString(36) : to;
  const target = to === "__new" ? { name: g.name, games: [] } : { name: sets[to].name, games: sets[to].games.map(x => Object.assign({}, x)) };
  target.games.push(plain);
  queueSet(id, { name: target.name, games: target.games }, FIX.data);
  queueSet(FIX.id, fixPayload(), FIX.data);
  FIX.dirty = false; FIX.sel = null;
  FIX.msg = `${g.name} er flyttet til ${target.name}.`; FIX.bad = false;
  if (!FIX.games.length) { FIX = null; startFixtures(id); } else renderFixtures();
  sendQueue();
}
