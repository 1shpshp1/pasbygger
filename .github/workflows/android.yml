# Builds the Android app (folder app/) from index.html. Run it by hand under Actions → "Android-app" → Run workflow,
# or it runs by itself when the app changes on main. The result is under the run's "Artifacts":
#  - traeningsparat-test.apk: install it directly on an Android phone to try it (allow "unknown apps" when asked)
#  - traeningsparat-release.aab: for Google Play, only when the upload key is saved as secrets (see app/README.md)
name: Android-app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [index.html, icons/**, manifest.webmanifest, app/**]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run copy && npx cap sync android
      - name: Test app (APK)
        run: cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: traeningsparat-test.apk, path: app/android/app/build/outputs/apk/debug/app-debug.apk }
      - name: Google Play (AAB, signed with the upload key)
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 -d > android/upload.jks
          cd android && ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$PWD/upload.jks \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
      - uses: actions/upload-artifact@v4
        if: hashFiles('app/android/app/build/outputs/bundle/release/*.aab') != ''
        with: { name: traeningsparat-release.aab, path: app/android/app/build/outputs/bundle/release/app-release.aab }
